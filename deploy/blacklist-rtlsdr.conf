# Install to /etc/modprobe.d/blacklist-rtlsdr.conf
#
# Keeps the kernel's DVB-T television drivers off the RTL-SDR dongle.
#
# The RTL2832U chip is sold as a TV tuner, so dvb_usb_rtl28xxu claims the
# dongle on every USB enumeration: it registers a DVB adapter AND an IR
# remote receiver, then polls that remote every 200ms -- all while readsb
# needs exclusive access to the same device through libusb/usbfs. The two
# drivers fight over the bus, it throws EPROTO (error -71), and the dongle
# drops off and re-enumerates.
#
# Diagnosed on this receiver: 56 dongle disconnects in a 90-minute session,
# against exactly one for the touch panel sharing the same USB controller.
# The log signature is a repeating cycle of:
#   dvb_usb_v2: found a 'Realtek RTL2832U reference design' in warm state
#   DVB: registering adapter 0 frontend 0 (Realtek RTL2832 (DVB-T))...
#   dvb_usb_v2: schedule remote query interval to 200 msecs
#   ...then, seconds later, readsb forcing it off:
#   dvb_usb_v2: '...' successfully deinitialized and disconnected
#
# This is standard practice for any RTL-SDR / ADS-B install, not a
# workaround specific to this project. To undo: delete the file and reboot.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2832_sdr
blacklist dvb_usb_v2

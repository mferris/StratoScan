# Install to /etc/lighttpd/conf-enabled/83-stratoscan-public.conf
#
# The public tunnel's second line (security review 2026-11-03, SR-01).
# funnel-gateway.py marks everything it passes on with X-FR-Public, and drops
# any copy a client sent, so the marker means the request came from the
# public internet. The gateway already refuses what follows; this refuses it
# again here, where lighttpd routes, so a mistake in the gateway alone can
# no longer reach any of it:
#   /setup, /wake, /tts, /photo        the backends only the house uses
#   /data/notable-people, /data/power  the owner's own screens' data
#   /tar1090/data, chunks, globe_history  readsb's files, except the three
#                                      the public page reads, by exact name
#                                      (the gateway rounds and strips them)
# Matched case-blind, which refuses more than lighttpd would route; the
# three allowed files are matched exactly, end-anchored. Requests without
# the marker, from the radar itself and the LAN, are not touched.
# tests/test_funnel_gateway_decode_once.py keeps this in step with the
# gateway's own lists.
server.modules += ( "mod_access" )
$REQUEST_HEADER["X-FR-Public"] != "" {
  $HTTP["url"] =~ "(?i)^/(setup|wake|tts|photo)|^/data/(notable-people|power)" {
    url.access-deny = ( "" )
  }
  $HTTP["url"] =~ "(?i)^/tar1090/(data|chunks|globe_history)(/|$)" {
    $HTTP["url"] !~ "^/tar1090/data/(aircraft|receiver|status)\.json$" {
      url.access-deny = ( "" )
    }
  }
}

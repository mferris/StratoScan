# Install to /etc/systemd/system/lighttpd.service.d/stratoscan-tls.conf:
# lighttpd's https listener (85-stratoscan-tls.conf) needs the certificate
# stratoscan-tls-cert.service makes on a unit's first boot.
#
# Debian's After=network-online.target is not undone here (#93): a drop-in
# can add dependencies but never remove one, and systemd skips an empty
# After= without a word. install-setup-server.sh gives lighttpd a unit of its
# own, Debian's without that target; this drop-in applies to it as before.
# So installing this file by hand on a radar set up before #93 changes
# nothing; re-run the installer, which writes that unit too. An update
# cannot: it installs no systemd units.
[Unit]
Wants=stratoscan-tls-cert.service
After=stratoscan-tls-cert.service

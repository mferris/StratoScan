# Routes /wake to the local display-wake service (see
# flightradar-wake.service), keeping the browser's fetch same-origin.
server.modules += ( "mod_proxy" )

server.modules += ( "mod_access" )

$HTTP["url"] =~ "^/wake" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8084 ) ) )
  # Only the radar itself may wake its screen: the kiosk and ota-auto call
  # this from the device. Another browser on the network showing the radar
  # page used to wake the kiosk's display on every alert *it* raised, and
  # anyone on the WiFi could. (The public Funnel gateway already refuses it.)
  $HTTP["remoteip"] != "127.0.0.1" {
    url.access-deny = ( "" )
  }
}

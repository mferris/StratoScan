# Install to /etc/lighttpd/conf-enabled/84-stratoscan-hosts.conf
#
# The radar answers only to the names it is reached by (security review
# 2026-10-26): its address, localhost, its .local (Bonjour) name, its
# tailnet name (*.ts.net, MagicDNS's short name too), or a name a home
# router hands out (a bare name, or one under home.arpa, internal, lan,
# home or localdomain). Nobody outside the house can have a name under any
# of those point at the radar. Not fritz.box, though FRITZ!Box routers hand
# out names under it: .box is a public top-level domain, and fritz.box a
# registered name in it, so a name under it can be had from outside
# (2026-10-26). Those homes reach the radar by its address or .local name.
# Without this, a page on some other website, opened by a browser at home,
# could reach the radar under a name of its own and read what the radar
# shows only at home.
#
# Anything else is redirected to the setup page on the setup hotspot,
# never served. On the hotspot every name leads here
# (stratoscan-captive-dns.conf), and a phone checking for a sign-in page
# under a name of its own still gets the redirect 99-stratoscan-captive.conf
# gives it; on the LAN the redirect is to an address no other site's page
# can read. The public page never arrives under a name: funnel-gateway.py
# asks for 127.0.0.1. The stores check the same names (RADAR_HOST_RE in
# sighting-store.py and approach-store.py); tests/test_lan_hosts.py keeps
# the three alike.
$HTTP["host"] !~ "(?i)^(|[0-9]{1,3}(\.[0-9]{1,3}){3}|\[[0-9a-f:.]+\]|[a-z0-9-]+|([a-z0-9-]+\.)+(local|localhost|ts\.net|home\.arpa|internal|lan|home|localdomain))\.?(:[0-9]{1,5})?$" {
  url.redirect = ( "" => "http://10.42.0.1/setup" )
  url.redirect-code = 302
}

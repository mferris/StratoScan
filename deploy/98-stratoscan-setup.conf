# Routes /setup to the local setup web server.
#
# NOTE: /setup is listed in funnel-gateway.py's LOCAL_ONLY_PATHS, so it is
# refused for anything arriving through the public Tailscale Funnel. That
# matters: this endpoint accepts a WiFi password and a Tailscale auth key.
# See tests/test_funnel_gateway_paths.py, which pins the traversal and
# percent-encoding spellings that previously bypassed that filter.
server.modules += ( "mod_proxy" )

$HTTP["url"] =~ "^/setup" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8086 ) ) )
}

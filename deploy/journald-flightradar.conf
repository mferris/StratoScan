# Install to /etc/systemd/journald.conf.d/flightradar.conf
#
# Keep logs across reboots.
#
# The default on this image is Storage=auto, which means "persist only if
# /var/log/journal already exists". That directory did exist here and the
# journal was STILL running out of /run, so every reboot threw away the
# evidence -- and the failure being investigated was one that gets fixed by
# rebooting. Diagnosing an intermittent fault with no history is guesswork,
# which is exactly how a fortnight of "it dropped off again" goes unexplained.
#
# Storage=persistent is explicit: journald creates /var/log/journal itself
# and does not depend on an earlier step having done it. The caps keep this
# from ever being the thing that fills an SD card.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=1month

# Radome: SSH by key only. Installed to /etc/ssh/sshd_config.d/ by
# install-setup-server.sh.
#
# sshd uses the FIRST value it reads for each setting, and this file sorts
# before Raspberry Pi OS's 50-cloud-init.conf (which turns passwords on).
#
# Why: with password logins on, anyone on the owner's WiFi who guesses the
# login password gets a shell -- and on a unit set up for administration,
# that account usually has passwordless sudo. Keys cannot be guessed. The
# factory image's own account has no password at all, so this changes
# nothing for a gifted unit except closing the door properly.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no

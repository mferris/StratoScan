# Drop-in for readsb.service (installed to /etc/systemd/system/readsb.service.d/).
# The radios are picked by name before every start (deploy/radio-select.py):
# readsb's own /etc/default/readsb says `--device 0`, and the environment file
# written here overrides it with the 1090 radio's real index, and adds the
# 978 decoder's feed when there is a 978 radio. Read after the unit's own
# EnvironmentFile, so these win; absent (no radio found), readsb runs as before.
[Unit]
After=stratoscan-radio.service
Wants=stratoscan-radio.service

[Service]
ExecStartPre=+/usr/bin/python3 /opt/stratoscan/radio-select.py
EnvironmentFile=-/run/stratoscan-radio/readsb.env

# Installed to /etc/sysctl.d/ by install-setup-server.sh.
#
# The kernel's default is to sit forever on a panic (kernel.panic=0) -- the
# hardware watchdog catches a hard hang, but a panic keeps the watchdog fed on
# some paths, and an oops can leave the system half-alive. On a unit in
# someone else's house "reboot in 10 seconds and carry on" beats "frozen until
# somebody power-cycles it", every time.
kernel.panic = 10
kernel.panic_on_oops = 1

# SD-card wear. Measured on RDU (2026-09-28): the log and the kiosk browser
# rewrite the same few pages many times a minute, and the kernel's default
# writes dirty pages back after 30 s, so each small change costs a full page
# write plus a filesystem journal commit. Holding dirty pages for 2 minutes
# lets repeated changes to the same page coalesce into one write. The cost is
# at most 2 minutes of unsynced changes on a sudden power cut; the stores
# already flush only every 10 minutes, and journald and the stores fsync what
# they must.
vm.dirty_expire_centisecs = 12000
vm.dirty_writeback_centisecs = 3000

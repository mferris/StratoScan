# Install to /etc/lighttpd/conf-enabled/92-stratoscan-managed-writes.conf
# (install-setup-server.sh, on every unit since 2026-10-26; before that only
# with MANAGED=1, hence the name).
#
# Security review 2026-10-04, item 6: the shared stores (sightings,
# approaches, the network comparison) take writes from every viewer of the
# page by design, so two screens of the same radar agree. A write is
# accepted only from a private address -- the unit itself, its LAN, its
# setup hotspot or the tailnet -- never from anything routed in from
# elsewhere. (The public tunnel's gateway refuses every write already; this
# covers the LAN side.)
#
# On every unit since 2026-10-26: a radar at home can be reachable from
# outside as easily as one on a shared network. IPv6 link-local (fe80::/10)
# and unique-local (fc00::/7) addresses count as the LAN too; neither is
# routed in from the internet.
$HTTP["request-method"] =~ "^(POST|PUT|DELETE|PATCH)$" {
    $HTTP["url"] =~ "^/(sightings|approaches|network)" {
        $HTTP["remoteip"] !~ "^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|::1$|fd7a:115c:a1e0:|fe[89ab][0-9a-f]:|f[cd][0-9a-f]{2}:)" {
            url.access-deny = ( "" )
        }
    }
}

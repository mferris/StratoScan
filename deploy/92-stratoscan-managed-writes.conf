# Install to /etc/lighttpd/conf-enabled/92-stratoscan-managed-writes.conf
# (install-setup-server.sh, only with MANAGED=1).
#
# Security review 2026-10-04, item 6: the shared stores (sightings,
# approaches, the network comparison) take writes from every viewer of the
# page by design, so two screens of the same radar agree. On a managed unit
# that may sit on a shared network, a write is accepted only from a private
# address -- the unit itself, its LAN, its setup hotspot or the tailnet --
# never from anything routed in from elsewhere. (The public tunnel's
# gateway refuses every write already; this covers the LAN side.)
$HTTP["request-method"] =~ "^(POST|PUT|DELETE|PATCH)$" {
    $HTTP["url"] =~ "^/(sightings|approaches|network)" {
        $HTTP["remoteip"] !~ "^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|::1$|fd7a:115c:a1e0:)" {
            url.access-deny = ( "" )
        }
    }
}

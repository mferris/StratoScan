# StratoScan: the speakers start at 70%, not WirePlumber's 40% (2026-10-17).
#
# At 40% the owner found the alerts and spoken announcements much too quiet,
# against the speakers' own test played at full scale, and asked for 70%.
# This is only where a new output starts: WirePlumber keeps whatever volume
# the unit's output was last set to (by `wpctl set-volume` or a slider), so
# it never overrides an owner's choice. The radar's own alert volume
# (Settings > Alerts > Volume, up to 300%) applies on top.
#
# The setting is linear: 0.343 is 0.7 cubed, which wpctl and the usual volume
# sliders show as 70% (WirePlumber's default, 0.064, is 0.4 cubed).
# Installed to /etc/wireplumber/wireplumber.conf.d/ by install-setup-server.sh.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.343
}

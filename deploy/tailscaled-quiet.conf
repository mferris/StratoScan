# Install to /etc/systemd/system/tailscaled.service.d/stratoscan-quiet.conf
#
# tailscaled logs every relay (DERP) connection opening and closing, every
# new contact with a peer and every path change under "magicsock:", all at
# the same priority as its real messages: 317-622 lines a day on RDU, about
# 60 KB of SD card writes each (#78, 2026-10-23). This drops those lines only;
# everything else tailscaled says still reaches the journal. Its own log
# upload, `tailscale status` and `tailscale netcheck` still show the paths.
# LogFilterPatterns= needs systemd 253 or later and works for system units
# (Pi OS has 257); it takes effect when tailscaled next starts.
#
# Also dropped (added 2026-10-23): two kinds of line that come with Funnel's
# stray packets. Funnel's ingress servers hand public-page connections to the
# node's peer API, and packets arriving after a connection has closed are
# logged as "Drop: ... no rules matched" (kept: a tailnet device probing the
# radar would show there), each with a "netstack: decrementing
# connsInFlightByClient" line and, when they come fast, "[RATELIMIT]" notices.
# About 140 lines a day on RDU, none of them saying anything.
[Service]
LogFilterPatterns=~^magicsock:
LogFilterPatterns=~^netstack: decrementing connsInFlightByClient
LogFilterPatterns=~^\[RATELIMIT\]

# Install to /etc/NetworkManager/dnsmasq-shared.d/flightradar-captive.conf
#
# Applies ONLY to NetworkManager's shared (hotspot) connections, so it can
# never affect normal DNS on the owner's home network.
#
# Resolves every hostname to the device while a phone is joined to the setup
# hotspot. This is what lets the phone's captive-portal probe reach us at all:
# without it the probe resolves normally, fails to connect, and the phone
# concludes the network is broken rather than that it needs sign-in.
address=/#/10.42.0.1

# Tell the client this network has a portal (RFC 8910), which newer OSes use
# in preference to guessing from probe responses.
dhcp-option=114,http://10.42.0.1/setup

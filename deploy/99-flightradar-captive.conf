# Captive-portal responses for the FlightRadar setup hotspot.
#
# THE PROBLEM THIS SOLVES: a phone joined to an access point with no internet
# does not simply use it. iOS and Android probe for connectivity, decide the
# network is useless, and quietly send traffic out over cellular instead --
# so typing http://10.42.0.1/setup reaches the internet and fails, while the
# phone shows itself connected to the hotspot the whole time. Observed
# first-hand on this device: the page served correctly on 10.42.0.1 and the
# phone still could not load it.
#
# Answering those probes with a redirect instead of the expected success
# response is what tells the OS "this network needs sign-in", which makes it
# keep traffic on the WiFi and pop the setup page up automatically -- the
# same mechanism hotel and airport WiFi uses.
#
# Paired with a DNS wildcard in dnsmasq-shared.d so every hostname resolves
# to the device while on the hotspot; without that, the probe never reaches
# us to be answered.
#
# These paths are only ever requested by OS connectivity checks, so matching
# them on the LAN side too is harmless -- nothing else asks this server for
# /generate_204.
$HTTP["url"] =~ "^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|connecttest\.txt|ncsi\.txt|redirect|success\.txt|canonical\.html|nmcheck\.gnome\.org)" {
  url.redirect = ( "" => "http://10.42.0.1/setup" )
  url.redirect-code = 302
}

# Install to /etc/lighttpd/conf-enabled/87-stratoscan-uploads.conf
#
# Temporary files in RAM, not on the SD card.
#
# lighttpd spills request and response bodies too large to hold in memory to
# temporary files in server.upload-dirs, which Debian sets to
# /var/cache/lighttpd/uploads, on the card: ~190 MB/day on RDU (2026-10-14),
# for files that live a fraction of a second.
# /run/lighttpd is tmpfs, made at each boot by Debian's own tmpfiles entry,
# owned by www-data like the old folder. ":=" replaces lighttpd.conf's value.
server.upload-dirs := ( "/run/lighttpd" )

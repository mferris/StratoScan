# Install to /etc/lighttpd/conf-enabled/86-flightradar-nocache.conf
#
# Make the kiosk always revalidate index.html.
#
# Chromium's HTTP disk cache lives in ~/.cache/chromium and survives a
# restart of the kiosk service, so "deploy index.html, then restart the
# kiosk" -- the documented procedure -- relaunches the browser but can still
# paint the PREVIOUS build from cache. That failure is silent and looks
# exactly like a bug in the change you just shipped: the file on disk is
# right, curl returns the new bytes, and the screen disagrees. It cost a long
# debugging detour once; without this it would cost one every time.
#
# no-cache does not mean "do not store" -- it means "revalidate before use".
# lighttpd already sends an ETag, so the normal case stays a 304 with an
# empty body. The page is the only thing that changes between deploys, so
# nothing else needs this.
$HTTP["url"] =~ "^/(index\.html)?$" {
    setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}

# Routes /tts to the local text-to-speech service (flightradar-tts.service),
# keeping the page's fetch same-origin. funnel-gateway.py refuses /tts on the
# public tunnel: synthesis is CPU-heavy and only the house needs it.
server.modules += ( "mod_proxy" )

$HTTP["url"] =~ "^/tts" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8089 ) ) )
}

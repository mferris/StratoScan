# Install to /etc/lighttpd/conf-enabled/95-flightradar-network.conf
#
# Same-origin path for the network comparison service. The page is served
# from http://localhost, so without this a fetch to the upstream API would
# be cross-origin -- and every viewer would hit that community-run service
# directly instead of sharing this device's single cached answer.
$HTTP["url"] =~ "^/network" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8087 )) )
}

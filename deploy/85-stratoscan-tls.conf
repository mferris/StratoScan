# Install to /etc/lighttpd/conf-enabled/85-stratoscan-tls.conf
#
# https on the LAN and the setup hotspot, with this radar's own certificate
# (deploy/tls-cert.sh), for the app's setup flow: the setup link names the
# certificate and the app accepts only it (security review 2026-10-04,
# item 9). Everything the http listener serves is served here too; the
# public tunnel still reaches the gateway on 8085 and is unaffected.
server.modules += ( "mod_openssl" )
$SERVER["socket"] == ":443" {
    ssl.engine  = "enable"
    ssl.pemfile = "/etc/stratoscan/tls/unit.pem"
}

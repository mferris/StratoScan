# Install to /etc/lighttpd/conf-enabled/94-stratoscan-core.conf
#
# The core feed (roadmap 1.8): /api/aircraft, the one labelled aircraft list
# the kiosk, the public page and the apps read. Read-only; the public gateway
# (funnel-gateway.py) refuses anything but GET/HEAD to it.
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8088 )) )
}

# Install to /etc/lighttpd/conf-enabled/86-stratoscan-nocache.conf
#
# ORDER (2026-11-15): on a radar already in use, this file goes in only
# after the radar is running a release whose public gateway
# (funnel-gateway.py) drops the web server's policy headers. The gateway
# fetches the page from this same lighttpd, and one from before that
# release relays the Content-Security-Policy below to public callers,
# beside its own on a 200 and alone on a 304, where a browser stores it
# over the strict one. The gateway arrives by an update and this file only
# by hand or a fresh install, so the update comes first and this file
# second, never the other way round. A fresh install or image has both.
# tests/test_funnel_gateway_upstream_policy.py.
#
# Make the kiosk always revalidate index.html.
#
# Chromium's HTTP disk cache lives in ~/.cache/chromium and survives a
# restart of the kiosk service, so "deploy index.html, then restart the
# kiosk" -- the documented procedure -- relaunches the browser but can still
# paint the PREVIOUS build from cache. That failure is silent and looks
# exactly like a bug in the change you just shipped: the file on disk is
# right, curl returns the new bytes, and the screen disagrees. It cost a long
# debugging detour once; without this it would cost one every time.
#
# no-cache does not mean "do not store" -- it means "revalidate before use".
# lighttpd already sends an ETag, so the normal case stays a 304 with an
# empty body. The page is the only thing that changes between deploys, so
# nothing else needs this.
#
# The same answer carries the page's framing and script headers on the radar
# itself and the LAN, both listeners (SR-26, SR-27, 2026-11-15); until now
# only the public page had any (funnel-gateway.py). No other site's page may
# put the radar's page in a frame; no plugins, no <base>; and scripts and
# workers only from the radar itself, so markup that names a script
# elsewhere, or anything passed to eval, does not run.
#
# 'unsafe-inline' stays for scripts here, which the public page's policy
# never has: there the gateway names the page's one inline block by the hash
# of its bytes, worked out from the page it is serving. lighttpd can't work
# a hash out, and one written here would go stale at the page's next update
# (an update replaces the page, never this file), and the round display
# would then load a page whose script the browser refuses. So this policy
# refuses nothing the public one allows: every directive here is in
# CSP_DIRECTIVES, as strict or stricter there, and the same page runs under
# that one enforced. It sets no default-src and no connect-src, so what the
# kiosk fetches (the unit's own API on 127.0.0.1:8090 among it) is untouched.
# tests/test_lan_page_headers.py keeps the two in step.
#
# In the one list with Cache-Control, on purpose: lighttpd keeps only the
# last setenv.add-response-header that matches a request, so a second block
# for the same paths would drop one of the two.
$HTTP["url"] =~ "^/(index\.html)?$" {
    setenv.add-response-header = (
        "Cache-Control" => "no-cache",
        "X-Frame-Options" => "DENY",
        "X-Content-Type-Options" => "nosniff",
        "Content-Security-Policy" => "script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    )
}

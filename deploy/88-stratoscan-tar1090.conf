# Install to /etc/lighttpd/conf-enabled/88-stratoscan-tar1090.conf
#
# tar1090, the map history at /tar1090/, is upstream's page, and it is
# served on the same address as this radar's own page and /setup. So its
# page is held to what a radar needs of it (security review 2026-10-26).
#
# Its settings that name a server for it to load from -- ships
# (aiscatcher_server), drones (droneJson) and map tiles (customTiles) --
# can be given in the link, and nothing on a radar uses them: a request for
# /tar1090/ that names one is refused. tar1090 reads a name in any case and
# after undoing %-escapes, so the match ignores case and a name with a
# %-escape in it is refused too (none of tar1090's own has one).
#
# And its page may fetch only from the radar and the services tar1090 uses
# for photos (planespotters), vector maps (OpenFreeMap), weather
# (RainViewer) and US special-use airspace (ArcGIS); its map tiles are
# images, which this does not limit. Left out on purpose: the route lookup,
# which tar1090 makes to a third party over plain http on the radar's
# address (the radar's own page has routes), and GitHub's raw files, where
# anyone can put anything (two optional overlays, off unless asked for).
#
# set-response-header, not add-: 88-tar1090.conf sets add-response-header
# on paths under /tar1090/ (binCraft's Content-Encoding among them), and a
# second add- here would replace those for every path both match.
$HTTP["url"] =~ "^/tar1090(/|$)" {
  $HTTP["querystring"] =~ "(?i)(^|&)(aiscatcher_server|dronejson|customtiles)(=|&|$)|(^|&)[^=&]*%" {
    url.access-deny = ( "" )
  }
  setenv.set-response-header = ( "Content-Security-Policy" => "connect-src 'self' https://api.planespotters.net https://tiles.openfreemap.org https://api.rainviewer.com https://opendata.arcgis.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" )
}

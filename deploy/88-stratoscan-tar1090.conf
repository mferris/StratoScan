# Install to /etc/lighttpd/conf-enabled/88-stratoscan-tar1090.conf
#
# ORDER (2026-11-15): on a radar already in use, this file goes in only
# after the radar is running a release whose public gateway
# (funnel-gateway.py) drops the web server's policy headers. The gateway
# fetches the page from this same lighttpd, and one from before that
# release relays the Content-Security-Policy below to public callers,
# beside its own on a 200 and alone on a 304, where a browser stores it
# over the strict one. The gateway arrives by an update and this file only
# by hand or a fresh install, so the update comes first and this file
# second, never the other way round. A fresh install or image has both.
# tests/test_funnel_gateway_upstream_policy.py.
#
# tar1090, the map history at /tar1090/, is upstream's page, and it is
# served on the same address as this radar's own page and /setup. So its
# page is held to what a radar needs of it (security review 2026-10-26).
#
# Its settings that name a server for it to load from -- ships
# (aiscatcher_server), drones (droneJson) and map tiles (customTiles) --
# can be given in the link, and nothing on a radar uses them: a request for
# /tar1090/ that names one is refused. tar1090 reads a name in any case and
# after undoing %-escapes, so the match ignores case and a name with a
# %-escape in it is refused too (none of tar1090's own has one).
#
# And its page may fetch only from the radar and the services tar1090 uses
# for photos (planespotters), vector maps (OpenFreeMap), weather
# (RainViewer) and US special-use airspace (ArcGIS); its map tiles are
# images, which this does not limit. Left out on purpose: the route lookup,
# which tar1090 makes to a third party over plain http on the radar's
# address (the radar's own page has routes), and GitHub's raw files, where
# anyone can put anything (two optional overlays, off unless asked for).
#
# Its scripts are not limited yet, only watched (SR-26, 2026-11-15): the
# second header is a fuller policy in report-only, which a browser checks
# and notes in its console and never acts on. It is the public gateway's
# policy for tar1090 (TAR1090_CSP) with the fetch list above, plus what
# tar1090 uses at home and not publicly: WebAssembly, for its zstd decoder,
# and images from any host. tar1090 is upstream's and changes under us, so the
# policy is enforced only once a session on a radar has shown it refuses
# nothing; until then a script from another host still runs here.
#
# set-response-header, not add-: 88-tar1090.conf sets add-response-header
# on paths under /tar1090/ (binCraft's Content-Encoding among them), and a
# second add- here would replace those for every path both match.
$HTTP["url"] =~ "^/tar1090(/|$)" {
  $HTTP["querystring"] =~ "(?i)(^|&)(aiscatcher_server|dronejson|customtiles)(=|&|$)|(^|&)[^=&]*%" {
    url.access-deny = ( "" )
  }
  setenv.set-response-header = (
    "Content-Security-Policy" => "connect-src 'self' https://api.planespotters.net https://tiles.openfreemap.org https://api.rainviewer.com https://opendata.arcgis.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'",
    "Content-Security-Policy-Report-Only" => "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; connect-src 'self' https://api.planespotters.net https://tiles.openfreemap.org https://api.rainviewer.com https://opendata.arcgis.com; media-src 'self'; manifest-src 'self'; form-action 'self'"
  )
}

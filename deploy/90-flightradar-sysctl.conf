# Installed to /etc/sysctl.d/ by install-setup-server.sh.
#
# The kernel's default is to sit forever on a panic (kernel.panic=0) -- the
# hardware watchdog catches a hard hang, but a panic keeps the watchdog fed on
# some paths, and an oops can leave the system half-alive. On a unit in
# someone else's house "reboot in 10 seconds and carry on" beats "frozen until
# somebody power-cycles it", every time.
kernel.panic = 10
kernel.panic_on_oops = 1

# Install to /etc/lighttpd/conf-enabled/82-stratoscan-pathinfo.conf
#
# A file is served only under its own name (security review 2026-11-03,
# SR-01). lighttpd's static handler otherwise serves a file for any path
# that starts with its name and a slash: /tar1090/data/receiver.json/x was
# receiver.json. Nothing on a radar asks for a file that way, and it let a
# path that names one file be served as another, which is how the public
# gateway's checks were got round. Now anything after a file's name is 404.
# Global: no file on the radar needs it.
static-file.disable-pathinfo = "enable"

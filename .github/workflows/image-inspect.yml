name: Inspect base image

# Manual: reports how the pinned Raspberry Pi OS image does its first boot.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned 2026-10-13: a tag can move
      - name: Inspect
        run: sudo sh image/inspect.sh

name = "flightradar-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The relay's permanent address (2026-09-30): a custom domain, so it no longer
# depends on the Worker's name or the account's workers.dev subdomain.
# Cloudflare creates the DNS record and certificate on deploy. The old
# workers.dev address stays on (workers_dev) until every unit and app has
# moved over, since units in service only know that one.
routes = [ { pattern = "relay.stratoscan.io", custom_domain = true } ]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "flightradar-relay"
# Created once per maintainer account; see relay/README.md. Not a secret: a
# D1 id is useless without the account's own credentials.
database_id = "bc652644-4181-433c-b177-ea59c2473d64"

# Push (roadmap 2.1). Not secret: they identify the key, and are useless
# without it. A fork uses its own team's values.
[vars]
APNS_KEY_ID = "XXXXXXXXXX"
APNS_TEAM_ID = "XXXXXXXXXX"
APNS_TOPIC = "com.NelsonIndustries.radome"

# Secrets are never stored here. Set them with:
#   npx wrangler secret put FLEET_TOKEN
#   npx wrangler secret put APNS_KEY < AuthKey_<KEY ID>.p8    (the APNs auth key)

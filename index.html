// see the README's Data sources section) but no key/account. Considered
// and rejected two other free lightning sources first: Blitzortung.org's
// community feed, whose documented endpoint no longer works when tested
// live, and NOAA nowCOAST's own lightning layer, discontinued in their
// 2023 platform migration -- this is the one that actually works.
const LIGHTNING_TILE_URL = 'https://realearth.ssec.wisc.edu/tiles/GOESEastGLMFEDRadC/{z}/{x}/{y}.png';
const LIGHTNING_REFRESH_MS = 2 * 60 * 1000;

function applyLightningVisibility() {
  if (!map || !map.getLayer('lightning')) return;
  map.setLayoutProperty('lightning', 'visibility', alertSettings.lightning ? 'visible' : 'none');
}

// The tile URL always points at RealEarth's "latest" alias for this
// product (no explicit timestamp), so the underlying PNGs change over time
// at the exact same URL -- a plain query-string cache-buster forces
// MapLibre (and the browser) to actually refetch instead of reusing a
// stale cached tile indefinitely, same problem RainViewer's storms layer
// avoids by baking a real timestamp into its own tile path instead.
function refreshLightning() {
  if (!map) return;
  const url = `${LIGHTNING_TILE_URL}?t=${Date.now()}`;
  if (map.getSource('lightning')) {
    map.getSource('lightning').setTiles([url]);
  } else {
    map.addSource('lightning', { type: 'raster', tiles: [url], tileSize: 256, maxzoom: 7 });
    map.addLayer({
      id: 'lightning',
      type: 'raster',
      source: 'lightning',
      paint: { 'raster-opacity': 0.85 },
    });
    applyLightningVisibility(); // new layer defaults to visible -- match the real (likely off) setting immediately
  }
}

// ---- Lightning-proximity alert -------------------------------------------
// Distinct from the lightning overlay above (a visual density layer) --
// this actively checks whether there's been recent lightning within
// LIGHTNING_ALERT_RADIUS_NM of the receiver and raises an alert if so.
// Reuses RealEarth's "probe" API (a point-value query, not a tile fetch)
// against glmgroupdensity (a 60-minute rolling density product -- chosen
// specifically because, unlike GOESEastGLMFEDRadC shown on the map, it's
// one of the two RealEarth products that actually supports point probing).
//
// A single probe at home's exact coordinates only really tells you about
// the one small grid-cell-sized patch of sky right overhead -- to cover a
// real radius, this probes two concentric rings of points around home
// (reusing destinationPoint(), the same geodesic helper the extended
// runway lines use) plus the center point, and treats "any probe
// non-zero" as "lightning nearby". This is a real approximation, not
// exhaustive coverage -- storm cells are normally much wider than the gaps
// between probe points, but a narrow cell could in principle pass between
// them undetected. Hysteresis (separate enter/clear radii, same idea as
// ALERT_RADIUS_NM/ALERT_CLEAR_RADIUS_NM above) avoids flapping the alert
// on/off as a storm's exact reported density wobbles near the threshold.
const LIGHTNING_PROBE_PRODUCT = 'glmgroupdensity';
const LIGHTNING_ALERT_RADIUS_NM = 15;        // ~17 statute miles -- entry threshold
const LIGHTNING_ALERT_CLEAR_RADIUS_NM = 20;  // wider exit threshold
const LIGHTNING_ALERT_CHECK_MS = 2 * 60 * 1000; // matches the overlay's own refresh cadence -- no point checking more often than the underlying data updates
const LIGHTNING_PROBE_RING_POINTS = 8;

let lightningAlerted = false; // survives across checks, not per-plane -- there's no single "object" a storm alert is about

async function probeLightningValue(lat, lon) {
  try {
    const res = await fetch(`https://realearth.ssec.wisc.edu/api/probe?products=${LIGHTNING_PROBE_PRODUCT}&lat=${lat}&lon=${lon}`);
    if (!res.ok) return null;
    const html = await res.text();
    const m = html.match(/Data value:\s*<b>([^<]+)<\/b>/);
    if (!m) return null;
    const val = parseFloat(m[1]);
    return Number.isFinite(val) ? val : null;
  } catch (e) {
    return null; // offline or RealEarth unavailable -- this check just tries again next cycle
  }
}

async function checkLightningNearby() {
  if (!home || !alertSettings.lightningAlert) return;
  const radius = lightningAlerted ? LIGHTNING_ALERT_CLEAR_RADIUS_NM : LIGHTNING_ALERT_RADIUS_NM;
  const points = [[home.lat, home.lon]];
  for (const r of [radius / 2, radius]) {
    for (let i = 0; i < LIGHTNING_PROBE_RING_POINTS; i++) {
      const bearing = i * 360 / LIGHTNING_PROBE_RING_POINTS;
      const [lon, lat] = destinationPoint(home.lat, home.lon, bearing, r);
      points.push([lat, lon]);
    }
  }

  const values = await Promise.all(points.map(([lat, lon]) => probeLightningValue(lat.toFixed(4), lon.toFixed(4))));
  const nearby = values.some(v => v !== null && v > 0);

  if (nearby && !lightningAlerted) {
    lightningAlerted = true;
    playLightningAlertSound();
    showToast(`⚡ LIGHTNING WITHIN ${LIGHTNING_ALERT_RADIUS_NM}NM`, 8000);
  } else if (!nearby && lightningAlerted) {
    lightningAlerted = false; // free to re-alert once it's genuinely cleared past the wider radius
  }
}

// A slower, more insistent three-note pattern -- distinct from every other
// alert sound in the app (nearby-aircraft, emergency squawk, RDU phase),
// since this is the one alert that isn't about a specific aircraft at all.
function playLightningAlertSound() {
  playTones([[600, 0, 0.18, 0.28], [600, 0.25, 0.18, 0.28], [600, 0.5, 0.24, 0.3]]);
}

// ---- On-screen keyboard --------------------------------------------------
// The device has to be fully set up from its own screen: a recipient may
// have no phone, and someone who has forgotten the admin password has no
// other way in at all. That makes a touch keyboard a hard requirement, not
// a convenience.
const KBD_ROWS = {
  lower: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
  upper: ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'],
  num:   ['1234567890', '-_.:/@#&+', '!?$%*()='],
};
let kbdState = { mode: 'lower', value: '', onDone: null, secret: false };

function openKeyboard(label, initial, { secret = false, mode = 'lower' } = {}) {
  return new Promise((resolve) => {
    // Open on the layout the field actually needs: coordinates are digits and
    // a minus, and making someone hunt for the 123 key first is the kind of
    // friction that makes an on-screen keyboard feel unusable.
    kbdState = { mode, value: initial || '', onDone: resolve, secret };
    document.getElementById('kbdLabel').textContent = label;
    document.getElementById('kbd').classList.add('show');
    drawKeyboard();
  });
}

function closeKeyboard(value) {
  document.getElementById('kbd').classList.remove('show');
  const done = kbdState.onDone;
  kbdState.onDone = null;
  if (done) done(value);
}

function drawKeyboard() {
  const val = kbdState.secret ? '•'.repeat(kbdState.value.length) : kbdState.value;
  document.getElementById('kbdValue').textContent = val;
  const keys = document.getElementById('kbdKeys');
  keys.textContent = '';
  const newRow = () => {
    const r = document.createElement('div');
    r.className = 'kbd-row';
    keys.appendChild(r);
    return r;
  };
  const add = (row, text, cls, action) => {
    const d = document.createElement('div');
    d.textContent = text;
    if (cls) d.className = cls;
    d.dataset.action = action || '';
    row.appendChild(d);
  };
  // One container per letter row, so the layout is what it looks like rather
  // than whatever flex-wrap happens to produce at this width.
  KBD_ROWS[kbdState.mode].forEach(row => {
    const r = newRow();
    [...row].forEach(ch => add(r, ch));
  });
  const fn = newRow();
  add(fn, kbdState.mode === 'num' ? 'abc' : '123', 'wide', 'mode');
  add(fn, kbdState.mode === 'upper' ? 'abc' : 'ABC', 'wide', 'case');
  add(fn, 'space', 'wide', 'space');
  add(fn, '\u232B', 'wide', 'back');
  const fn2 = newRow();
  add(fn2, 'Cancel', 'wide', 'cancel');
  add(fn2, 'Done', 'wide go', 'done');
}

document.getElementById('kbd').addEventListener('pointerup', (e) => {
  e.stopPropagation();
  const k = e.target.closest('.kbd-row div');
  if (!k) return;
  const a = k.dataset.action;
  if (a === 'done') return closeKeyboard(kbdState.value);
  if (a === 'cancel') return closeKeyboard(null);
  if (a === 'back') kbdState.value = kbdState.value.slice(0, -1);
  else if (a === 'space') kbdState.value += ' ';
  else if (a === 'mode') kbdState.mode = kbdState.mode === 'num' ? 'lower' : 'num';
  else if (a === 'case') kbdState.mode = kbdState.mode === 'upper' ? 'lower' : 'upper';
  else if (!a && k.textContent.length === 1) kbdState.value += k.textContent;
  drawKeyboard();
});

// ---- First-run onboarding overlay ---------------------------------------
// Reads a loopback-only endpoint (127.0.0.1:8090) that is deliberately NOT
// proxied by lighttpd, so the claim code it carries is readable by software
// running on the device -- this page -- and by nothing on the network.
// Fails silently when the setup service is absent, so a hand-built unit that
// never had one behaves exactly as before.
const ONBOARD_URL = 'http://127.0.0.1:8090/onboard';
const ONBOARD_POLL_MS = 5000;

async function refreshOnboarding() {
  const el = document.getElementById('onboard');
  if (!el) return;
  let d = null;
  try {
    const res = await fetch(ONBOARD_URL, { cache: 'no-store' });
    if (res.ok) d = await res.json();
  } catch (e) {
    // no setup service on this unit -- nothing to show, ever
  }
  if (!d || d.claimed) { el.classList.remove('show'); return; }
  // Never reappear on top of someone who is actively using the setup screens.
  if (settingsPanelEl.classList.contains('show')) { el.classList.remove('show'); return; }

  const hs = d.hotspot || {};
  const addr = (d.addresses || [])[0];
  const steps = [];
  // Branch on whether the AP is actually UP, not merely on whether it has a
  // name: if the radar is already on a network, sending someone to look for
  // "FlightRadar-Setup" sends them hunting for a network that isn't there.
  if (hs.active && hs.ssid) {
    steps.push(`On your phone, join the WiFi network <b>${esc(hs.ssid)}</b>` +
               (hs.psk ? ` using password <b>${esc(hs.psk)}</b>` : ''));
    steps.push('Open <b>http://192.168.4.1/setup</b> in your browser');
  } else if (addr) {
    steps.push(`On a device on the same network, open <b>http://${esc(addr)}/setup</b>`);
  } else {
    steps.push('Connect this radar to a network, or wait for it to start its own');
  }
  steps.push('Enter the code below when asked');

  document.getElementById('onboardInner').innerHTML =
    `<h2>SET UP THIS RADAR</h2>` +
    `<ol><li>${steps.join('</li><li>')}</li></ol>` +
    (d.claimCode ? `<div class="code">${esc(d.claimCode)}</div>` : '') +
    `<div class="ob-btn" id="obSetupHere">Or set it up on this screen &#8250;</div>` +
    `<div class="foot">This screen disappears once a password is set.</div>`;
  el.classList.add('show');
}

// The overlay sits above the gear, so it carries its own way through to the
// on-screen setup. Without this a brand-new device -- the one case where the
// on-screen route matters most -- could only be set up from a phone.
document.getElementById('onboard').addEventListener('pointerup', (e) => {
  e.stopPropagation();
  if (!e.target.closest('#obSetupHere')) return;
  document.getElementById('onboard').classList.remove('show');
  settingsSection = 'device';
  deviceView = null;
  deviceMsg = '';
  showSettingsPanel();
  settingsSection = 'device';        // showSettingsPanel resets it to the menu
  renderSettingsPanel();
  loadDeviceStatus().then(renderSettingsPanel);
});

// ---- Night dimming ------------------------------------------------------
// Darkens the whole display between sunset and sunrise at the RECEIVER's own
// coordinates, so it tracks the seasons on its own instead of needing hours
// typed in twice a year (sunset here swings from ~17:00 in December to
// ~20:30 in June). Pixels only -- this Pi exposes no backlight control, so
// the backlight stays lit; the real power-off is the separate screensaver
// service (deploy/flightradar-screensaver.service).
const NIGHT_DIM_CHECK_MS = 60 * 1000;
const NIGHT_WAKE_MS = 60 * 1000;   // how long an alert holds the screen bright
let nightWakeUntil = 0;

// Sunrise/sunset from lat/lon using the standard low-precision solar
// position algorithm (Astronomical Almanac / NOAA). Good to about a minute,
// which is far tighter than "is it dark out" needs. Returns null when the
// sun neither rises nor sets that day (polar latitudes) so callers can fall
// back rather than trusting a NaN.
function sunTimesFor(date, lat, lon) {
  const rad = Math.PI / 180, dayMs = 86400000;
  const jdate = date.valueOf() / dayMs - 0.5 + 2440588;
  const n = Math.round(jdate - 2451545 - 0.0009 + lon / 360);
  const jNoon = 2451545 + 0.0009 - lon / 360 + n;
  const M = rad * (357.5291 + 0.98560028 * (jNoon - 2451545));
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const jTransit = jNoon + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const dec = Math.asin(Math.sin(rad * 23.4397) * Math.sin(L));
  // -0.833deg: the sun's apparent radius plus atmospheric refraction, i.e.
  // the standard definition of sunrise/sunset (upper limb at the horizon)
  const cosH = (Math.sin(rad * -0.833) - Math.sin(rad * lat) * Math.sin(dec)) /
               (Math.cos(rad * lat) * Math.cos(dec));
  if (cosH > 1 || cosH < -1) return null; // polar day or night
  const H = Math.acos(cosH) / (2 * Math.PI);
  const jSet = 2451545 + 0.0009 + (H - lon / 360) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const jRise = jTransit - (jSet - jTransit);
  const toDate = (j) => new Date((j + 0.5 - 2440588) * dayMs);
  return { sunrise: toDate(jRise), sunset: toDate(jSet) };
}

// True when the sun is down at the receiver right now. Checks against
// yesterday's sunset too -- after midnight, "today's" sunset is still in the
// future, so a naive now>sunset test reads as daytime at 2am.
function isNightAtReceiver(now = new Date()) {
  if (!home) return false;
  const t = sunTimesFor(now, home.lat, home.lon);
  if (!t) return false;
  if (now < t.sunrise) {
    const y = sunTimesFor(new Date(now.valueOf() - 86400000), home.lat, home.lon);
    return !y || now >= y.sunset;
  }
  return now >= t.sunset;
}

function applyNightDim() {
  const el = document.getElementById('nightDim');
  if (!el) return;
  const wake = Date.now() < nightWakeUntil;
  el.classList.toggle('on', !!alertSettings.nightDim && isNightAtReceiver() && !wake);
}

// Called when an alert fires. Undims for NIGHT_WAKE_MS, and asks the Pi to
// power the panel back on if the screensaver has blanked it (see
// deploy/wake-listener.py). The fetch is best-effort: on a laptop, or with
// the service absent, it just fails quietly and the undim still happens.
function wakeScreenForAlert() {
  if (!alertSettings.alertWake) return;
  nightWakeUntil = Date.now() + NIGHT_WAKE_MS;
  applyNightDim();
  fetch('/wake', { method: 'POST' }).catch(() => {});
}

// ---- Nearby-aircraft alert ---------------------------------------------
// Automatically pops the detail panel (see showDetailPanel) for any plane
// that comes within ALERT_RADIUS_NM of the receiver -- on by default,
// toggled via the settings panel (see #gearBtn/showSettingsPanel below).
const ALERT_RADIUS_NM = 1.738;      // 2 statute miles -- entry threshold
const ALERT_CLEAR_RADIUS_NM = 2.0;  // slightly wider exit threshold, so a
                                     // plane sitting right at the boundary
                                     // can't flap the alert on noisy range

// ---- Alert settings -------------------------------------------------
// One place for every alert/sound toggle -- started as a single nearby-alert
// on/off (the empty-tap gesture below used to flip just that), but once
// emergency squawks, the RDU phase chime, and ATC audio all became separate
// concerns, a single blind toggle stopped making sense. localStorage, not
// the shared server-side stores used elsewhere (sightings, approach track)
// -- this is a personal display preference for whoever's looking at this
// particular screen, not data that should be the same for every viewer.
const ALERT_SETTINGS_KEY = 'flightradar_alert_settings_v1';
const DEFAULT_ALERT_SETTINGS = { nearby: true, emergency: true, rduPhase: true, atc: false, storms: true, heatmap: false, lightning: false, lightningAlert: true, nightDim: true, alertWake: true };
let alertSettings = { ...DEFAULT_ALERT_SETTINGS };
try {
  const saved = JSON.parse(localStorage.getItem(ALERT_SETTINGS_KEY));
  if (saved && typeof saved === 'object') alertSettings = { ...DEFAULT_ALERT_SETTINGS, ...saved };
} catch (e) {
  // corrupt/unavailable storage -- defaults stand
}
// Force-correct a stored 'atc: true' on the kiosk itself -- this is exactly
// the value that got left behind by testing the feature directly on the
// physical hardware before ensureAtcAudio's own IS_KIOSK guard existed.
// Belt-and-suspenders alongside that guard: this setting should never even
// read as "on" here, not just silently refuse to act on it.
if (IS_KIOSK && alertSettings.atc) {
  alertSettings.atc = false;
  saveAlertSettings();
}

// One-time repair for the nearby alert. It defaults on, but until the
// drag-to-scroll fix a scroll gesture toggled whatever row sat under your
// finger -- and "Nearby aircraft alert" is the FIRST row in the panel, so it
// is the one that got silently switched off on any device used before that
// fix. Restores it once per device, leaving every other choice untouched;
// after that the toggle behaves normally and can be turned off for good.
const NEARBY_REPAIR_KEY = 'flightradar_nearby_repair_v1';
try {
  if (!localStorage.getItem(NEARBY_REPAIR_KEY)) {
    if (!alertSettings.nearby) {
      alertSettings.nearby = true;
      saveAlertSettings();
    }
    localStorage.setItem(NEARBY_REPAIR_KEY, '1');
  }
} catch (e) {
  // storage unavailable -- the default (on) already stands
}

function saveAlertSettings() {
  try { localStorage.setItem(ALERT_SETTINGS_KEY, JSON.stringify(alertSettings)); } catch (e) {}
}

// ---- Color theme ------------------------------------------------------
// Three options -- see the [data-theme] blocks in <style> for what each one
// actually changes. "classic" (the original look) is the default; applying
// a theme just sets the attribute MapLibre/CSS custom properties key off of
// and re-reads the canvas-side color copies (COLORS, see refreshCanvasColors
// above), since canvas drawing can't read CSS at draw time the way DOM
// elements can.
const THEME_KEY = 'flightradar_theme_v1';
// swatchBg/swatchAccent are only for the small preview dot in the settings
// panel -- a deliberate, small duplication of each theme's --bg/--sweep
// value from the [data-theme] CSS blocks (can't read another theme's CSS
// custom properties while a different one is active, so there's no way to
// derive these live from the stylesheet itself).
const THEMES = [
  { key: 'classic', label: 'Classic', sub: 'The original look — dark background, warm accent colors', swatchBg: '#0a0d0f', swatchAccent: '#4fd6c8' },
  { key: 'daylight', label: 'Daylight', sub: 'Light background, black text — for a bright room', swatchBg: '#eaf3f1', swatchAccent: '#0f7a6c' },
  { key: 'highcontrast', label: 'High Contrast', sub: 'Built for low-vision/colorblind readability — true black background, colorblind-safe accents (Okabe–Ito palette)', swatchBg: '#000000', swatchAccent: '#ffd400' },
];
let uiTheme = 'classic';
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (THEMES.some((t) => t.key === savedTheme)) uiTheme = savedTheme;
} catch (e) {
  // corrupt/unavailable storage -- default theme stands
}

function applyTheme(theme) {
  uiTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  refreshCanvasColors();
  recolorLabels(); // no-op if the map isn't up yet (e.g. this initial call at script load) -- map.on('load', recolorLabels) covers that case once it is
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}
applyTheme(uiTheme); // set before the first frame renders, not just on a later settings-panel interaction

// A short two-note chime synthesized with the Web Audio API rather than a
// bundled audio file -- nothing to source, license, or ship as a binary
// asset, and the tone is trivially tunable right here. Browsers block audio
// until a user gesture on the page, so the context is resumed opportunistically
// on the very first tap (well before any real alert is likely to fire) --
// on the kiosk itself, which may never get an incidental tap, Chromium is
// instead launched with --autoplay-policy=no-user-gesture-required (see
// deploy/flightradar-kiosk.service) so it isn't blocked there at all.
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
stage.addEventListener('pointerdown', () => { getAudioCtx().resume().catch(() => {}); }, { once: true });

// Shared tone-sequence player -- each note is [freq, startOffset, dur, peakGain].
// Factored out of what used to be playAlertSound's own body so the emergency
// and RDU-phase sounds below can each get a distinct, recognizable shape
// (note count/pitch/gain) without duplicating the oscillator boilerplate.
function playTones(notes) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    for (const [freq, startOffset, dur, peakGain] of notes) {
      const start = now + startOffset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peakGain, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    }
  } catch (e) {
    // Web Audio unavailable or still blocked -- the visual alert still shows regardless
  }
}

// Two-note ascending chime -- unchanged from before the playTones refactor.
function playAlertSound() {
  playTones([[880, 0, 0.14, 0.25], [1175, 0.15, 0.18, 0.25]]);
}

// Four fast alternating beeps, higher gain and more insistent than the
// nearby-aircraft chime -- deliberately reads as more urgent, since this
// fires for actual emergency squawks (7500/7600/7700), not routine traffic.
function playEmergencySound() {
  playTones([
    [1300, 0, 0.1, 0.3], [900, 0.14, 0.1, 0.3],
    [1300, 0.28, 0.1, 0.3], [900, 0.42, 0.1, 0.3],
  ]);
}

// A single short, quiet note -- deliberately the least intrusive of the
// three, since this fires for every RDU landing/takeoff and that's frequent
// enough that anything louder or busier would get old fast. Landing pitches
// down, takeoff pitches up, so the two are distinguishable by ear without
// looking at the screen.
function playRduPhaseSound(phase) {
  playTones(phase === 'landing' ? [[720, 0, 0.16, 0.14]] : [[1040, 0, 0.16, 0.14]]);
}

// Called once per poll (real GPS-derived range, not the eased per-frame
// value) for each tracked aircraft -- mirrors updateApproachTracking's same
// reasoning for why this belongs on the poll, not the render loop.
function checkNearbyAlert(pl, range) {
  if (!pl) return;
  if (range <= ALERT_RADIUS_NM) {
    if (!pl.alerted) {
      pl.alerted = true;
      // The count is a standing record of real proximity events -- kept
      // regardless of whether the interactive popup/sound happen to be
      // toggled on right now, which is a separate, purely presentational
      // concern (see the settings panel below).
      recordSightingOnce(pl.hex, 'nearby');
      if (alertSettings.nearby) {
        wakeScreenForAlert();
        showDetailPanel(pl, true);
        playAlertSound();
      }
    }
  } else if (range > ALERT_CLEAR_RADIUS_NM) {
    pl.alerted = false; // free to re-alert if it later comes back around
  }
}

// ---- Emergency squawk alert ---------------------------------------------
// 7500 (hijack), 7600 (radio/comm failure), 7700 (general emergency) are the
// three ICAO-standard codes a pilot squawks to signal a real emergency to
// ATC. Toggleable like everything else in the settings panel, but
// deliberately defaults on and (unlike the other two toggleable alerts)
// pl.emergencyAlerted is only set once this actually fires -- so if it's
// off while a plane is mid-squawk and gets turned back on, it still alerts
// for that ongoing emergency rather than staying silent because the
// transition already "happened" while muted.
const EMERGENCY_SQUAWKS = {
  '7500': 'HIJACK — SQUAWK 7500',
  '7600': 'RADIO FAILURE — SQUAWK 7600',
  '7700': 'EMERGENCY — SQUAWK 7700',
};

// Called once per poll, same cadence as checkNearbyAlert. Gated on
// pl.emergencyAlerted (reset once the squawk clears) so this fires once per
// emergency, not once per second while it's still squawking.
function checkEmergencySquawk(pl) {
  if (!pl) return;
  const label = pl.squawk != null ? EMERGENCY_SQUAWKS[String(pl.squawk)] : null;
  if (label) {
    if (!pl.emergencyAlerted && alertSettings.emergency) {
      pl.emergencyAlerted = true;
      wakeScreenForAlert();
      playEmergencySound();
      showDetailPanel(pl, true, label);
    }
  } else {
    pl.emergencyAlerted = false;
  }
}

// ---- Live RDU ATC audio ---------------------------------------------------
// LiveATC.net's Terms of Use (https://www.liveatc.net/legal/) require
// consulting them before linking directly to a stream (3.15), and separately
// bar making their service "directly available" through another dedicated
// application "for profit or not" (3.4) -- so this deliberately does NOT
// hotlink or embed their raw audio in an <audio> element. Instead it opens
// their own KRDU tower player (the same page anyone gets from liveatc.net
// itself) in a normal browser tab -- completely ordinary use of their site
// through an interactive browser, same as bookmarking it yourself, and it
// still gives them the page view/ad impression their FAQ note about funding
// through advertising depends on.
//
// Confirmed on the real kiosk hardware: window.open() there opened LiveATC's
// page in a way that covered the screen with no touch-reachable way back to
// the radar -- recovered only by SSHing in and restarting the kiosk service.
// ensureAtcAudio refuses outright on IS_KIOSK (see its definition above);
// this is fine and reliable from any normal browser tab (laptop, phone, the
// Funnel URL), which is the only place the settings panel now offers it.
// krdu_twr2 (tower) was the first choice -- more directly matches "landing/
// takeoff" comms -- but that specific feeder was found offline (stuck
// "reconnecting..." indefinitely, confirmed directly on LiveATC's own page,
// not something wrong in our code) when this was tested against the real
// kiosk. krdu_app2 (approach/departure) was confirmed actually playing at
// the same time, so that's what's wired up now. If tower comes back later,
// swap the mount param -- both still show RDU arrival/departure traffic
// either way, just from a different controller position.
function liveAtcUrl() {
  return AIRPORT.atcMount ? `https://www.liveatc.net/hlisten.php?mount=${encodeURIComponent(AIRPORT.atcMount)}` : null;
}
let atcWindow = null; // named-window handle so repeated calls reuse one tab instead of spawning a new one per landing

function ensureAtcAudio() {
  if (IS_KIOSK) return;
  const url = liveAtcUrl();
  if (!url) return; // relocated unit with no configured feed -- see AIRPORT.atcMount
  if (atcWindow && !atcWindow.closed) return;
  atcWindow = window.open(url, 'flightradar_atc');
}

function closeAtcAudio() {
  if (atcWindow && !atcWindow.closed) atcWindow.close();
  atcWindow = null;
}

// ---- RDU landing/takeoff chime -------------------------------------------
// Reuses rduPhaseOf's own classification (tight radius + real vertical rate
// right at field elevation -- see its comment above) so "sounds like a
// landing/takeoff" always matches "highlighted like one" on screen, rather
// than keeping a second, possibly-drifting definition of the same thing. No
// auto-popped panel here, unlike the other two alerts -- RDU traffic is
// frequent enough that interrupting the display for every one would be a lot
// more disruptive than a quiet chime.
function checkRduPhaseAlert(pl) {
  if (!pl) return;
  const phase = rduPhaseOf(pl);
  if (phase) {
    if (pl.rduPhaseAlerted !== phase) {
      pl.rduPhaseAlerted = phase;
      if (alertSettings.rduPhase) playRduPhaseSound(phase);
      if (alertSettings.atc) ensureAtcAudio();
    }
  } else {
    pl.rduPhaseAlerted = null;
  }
}

// ---- Route lookup --------------------------------------------------
// Batched/cached/throttled the same way tar1090 itself queries this API:
// collect callsigns as they're seen, flush a batch every ROUTE_BATCH_MS,
// cache results (including negative ones) for the rest of the session so
// we never look up the same callsign twice.
function queueRouteLookup(cs, lat, lng) {
  if (routeCache.has(cs) || routePending.has(cs)) return;
  if (routeQueue.some(e => e.callsign === cs)) return;
  routeQueue.push({ callsign: cs, lat, lng });
  if (!routeTimer) routeTimer = setTimeout(flushRouteQueue, ROUTE_BATCH_MS);
}

async function flushRouteQueue() {
  routeTimer = null;
  if (routeQueue.length === 0) return;
  const batch = routeQueue.splice(0, ROUTE_BATCH_MAX);
  for (const e of batch) routePending.add(e.callsign);

  try {
    const res = await fetch(ROUTE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ planes: batch.map(({ callsign, lat, lng }) => ({ callsign, lat, lng })) }),
    });
    const routes = res.ok ? await res.json() : [];
    const found = new Set();
    for (const route of routes) {
      if (!route || !route.callsign) continue;
      found.add(route.callsign);
      // Still shown when the API flags a route implausible for this
      // flight's current position (e.g. a reused flight number resolving to
      // a stale scheduled route) -- rather than silently hiding it, flag it
      // visibly (see the .route.implausible styling) so it reads as "here's
      // our best guess, don't trust it" instead of a wrong-but-confident
      // city pair.
      // Regional/commuter flight numbers commonly cover more than one leg
      // in a day's rotation (e.g. CLT-GSO-CLT, an out-and-back) -- _airports
      // lists every stop in order, not just an origin/destination pair, and
      // requiring exactly 2 silently dropped every one of these (common
      // enough on regional carriers to be the main reason their flights
      // often showed no route at all). Join every stop instead of just the
      // first/last, since first-to-last alone degenerates to "same city
      // both ends" for a round trip like this one.
      const airports = route._airports;
      routeCache.set(route.callsign, (airports && airports.length >= 2)
        ? { text: airports.map(ap => ap.location).join(' → '), plausible: route.plausible !== false }
        : null);
    }
    for (const e of batch) {
      if (!found.has(e.callsign)) routeCache.set(e.callsign, null);
    }
  } catch (e) {
    // network hiccup — don't cache anything, so these get retried later
  } finally {
    for (const e of batch) routePending.delete(e.callsign);
  }

  if (routeQueue.length > 0) routeTimer = setTimeout(flushRouteQueue, ROUTE_BATCH_MS);
}

// ---- Aircraft type lookup --------------------------------------------------
// ADS-B carries no aircraft type/model info directly. tar1090 (already
// installed alongside readsb on this same box) ships its own local hex ->
// [registration, icaoType, flags, typeLong] database, split into a prefix
// trie of small same-origin files so the browser only fetches what it needs.
// We read that same data ourselves (same-origin static files, not tar1090's
// code) rather than duplicating or fetching a multi-hundred-MB database.
//
// "CIRRUS SR-22" -> "Cirrus SR-22": only re-cases words that are ALL CAPS
// (manufacturer names), leaving model numbers like "SR-22"/"737-800" as-is.
function humanizeType(s) {
  return s.split(' ').map(w => /^[A-Z]+$/.test(w) ? w[0] + w.slice(1).toLowerCase() : w).join(' ');
}

async function discoverDatabaseFolder() {
  try {
    const res = await fetch('/tar1090/index.html', { cache: 'force-cache' });
    const html = await res.text();
    const m = /databaseFolder\s*=\s*"([^"]+)"/.exec(html);
    if (m) databaseFolder = m[1];
  } catch (e) {
    // type lookups just stay disabled; everything else still works
  }
}

// Each entry is [typeLong, typeDescription, wtc] -- typeDescription is the
// ICAO Doc 8643 3-char code (e.g. "L2J" = landplane/2 engines/jet, "H1T" =
// helicopter/1 engine/turbine) and wtc is wake-turbulence category (L/M/H/J).
// Both are used by classifyAircraft() below to pick a blip shape.
async function loadTypeCodeTable() {
  if (!databaseFolder) return;
  try {
    const res = await fetch(`/tar1090/${databaseFolder}/icao_aircraft_types2.js`, { cache: 'force-cache' });
    const data = await res.json();
    for (const code in data) {
      const entry = data[code];
      if (!entry) continue;
      const [typeLong, desc, wtc] = entry;
      typeCodeTable.set(code, { label: typeLong ? humanizeType(typeLong) : null, desc: desc || null, wtc: wtc || null });
    }
  } catch (e) {
    // fine — per-hex typeLong (below) still covers most aircraft on its own
  }
}

function fetchShard(bkey) {
  // cache the in-flight promise itself, not just the resolved value — several
  // aircraft sharing a hex prefix (e.g. all US-registered "A...") otherwise
  // race and each fire their own duplicate fetch for the same shard
  if (shardCache.has(bkey)) return shardCache.get(bkey);
  const promise = (async () => {
    try {
      const res = await fetch(`/tar1090/${databaseFolder}/${bkey}.js`, { cache: 'force-cache' });
      return res.ok ? await res.json() : null;
    } catch (e) {
      return null;
    }
  })();
  shardCache.set(bkey, promise);
  return promise;
}

// Walks the same prefix-trie structure tar1090 stores its hex database in:
// each shard either has the remaining hex suffix as a direct key, or a
// "children" list naming deeper shards to descend into.
async function lookupType(hex) {
  const empty = { type: null, reg: null, desc: null, wtc: null };
  if (hexTypeCache.has(hex)) return hexTypeCache.get(hex);
  if (!databaseFolder || hexTypePending.has(hex)) return empty;
  hexTypePending.add(hex);

  const icao = hex.toUpperCase();
  let level = 1, entry = null;
  while (level <= icao.length) {
    const bkey = icao.substring(0, level);
    const data = await fetchShard(bkey);
    if (!data) break;
    const dkey = icao.substring(level);
    if (dkey in data) { entry = data[dkey]; break; }
    if (data.children && data.children.includes(bkey + dkey[0])) { level++; continue; }
    break;
  }

  let result = empty;
  if (entry) {
    const [reg, typeCode, , typeLong] = entry;
    const meta = typeCode ? typeCodeTable.get(typeCode.toUpperCase()) : null;
    let type = null;
    if (typeLong) type = humanizeType(typeLong);
    else if (meta) type = meta.label;
    result = { type, reg: reg || null, desc: meta ? meta.desc : null, wtc: meta ? meta.wtc : null };
  }

  hexTypeCache.set(hex, result);
  hexTypePending.delete(hex);
  return result;
}

// ---- Data loading --------------------------------------------------
async function loadHome() {
  if (HOME_OVERRIDE) {
    home = HOME_OVERRIDE;
    locEl.textContent = formatLoc();
    initMap();
    return;
  }
  try {
    const res = await fetch(RECEIVER_URL, { cache: 'no-store' });
    const data = await res.json();
    if (typeof data.lat === 'number' && typeof data.lon === 'number') {
      home = { lat: data.lat, lon: data.lon };
      locEl.textContent = formatLoc();
      initMap();
    }
  } catch (e) {
    // retried by caller
  }
}

function normalizeAircraft(a) {
  // range/bearing: prefer readsb's precomputed r_dst/r_dir, else derive from
  // lat/lon — but never trust r_dst/r_dir when HOME_OVERRIDE is active, since
  // those are computed by readsb relative to the real antenna position, not
  // whatever point we're displaying as home
  let bearing, range;
  if (!HOME_OVERRIDE && typeof a.r_dst === 'number' && typeof a.r_dir === 'number') {
    range = a.r_dst;
    bearing = a.r_dir;
  } else if (home && typeof a.lat === 'number' && typeof a.lon === 'number') {
    const hb = haversineBearingRange(home.lat, home.lon, a.lat, a.lon);
    bearing = hb.bearing;
    range = hb.range;
  } else {
    return null; // no usable position yet
  }

  const altRaw = a.alt_baro ?? a.alt_geom;
  const alt = altRaw === 'ground' ? 'ground' : (typeof altRaw === 'number' ? altRaw : null);
  const realHdg = a.track ?? a.true_heading ?? a.mag_heading ?? a.calc_track ?? null;
  const hdg = realHdg ?? bearing; // blip rotation falls back to bearing; detail panel shows realHdg only
  // readsb decodes a contact's identity (flight) squitter separately from
  // (and slower than) its position -- a freshly-acquired plane commonly has
  // real lat/lon for several polls before `flight` shows up at all. Falling
  // back to the hex as `cs` in that gap is fine as a display placeholder
  // (it's literally what tar1090 does too), but badging that gap "Private
  // Aircraft" is actively wrong, not just uninformative -- it's a real
  // confirmed-scheduled-carrier flight whose callsign we just haven't seen
  // yet (self-corrects to the real badge within a poll or two once it
  // arrives, no special handling needed there). Track hasCallsign so the two
  // "no airline" cases -- genuinely unknown yet vs. a real GA tail number
  // that will never match -- don't get conflated under one label.
  const hasCallsign = !!(a.flight && a.flight.trim());
  const cs = hasCallsign ? a.flight.trim() : a.hex.toUpperCase();

  // scheduled/charter flights are 3 letters + a number (e.g. DAL1234); GA tail
  // numbers (N1182D) correctly don't match and get labeled "Private Aircraft"
  const airlineMatch = hasCallsign ? /^([A-Z]{3})\d/.exec(cs) : null;
  const airlineIcao = airlineMatch ? airlineMatch[1] : null;
  const airline = airlineIcao ? (AIRLINES[airlineIcao] || null) : null;
  const airlineLabel = airline ? airline.name : (hasCallsign ? PRIVATE_LABEL : ACQUIRING_LABEL);
  const badgeColor = airline ? airline.color : (hasCallsign ? PRIVATE_COLOR : ACQUIRING_COLOR);

  return {
    hex: a.hex, cs, hasCallsign, bearing, range, alt, hdg, realHdg, speed: a.gs ?? null,
    lat: typeof a.lat === 'number' ? a.lat : null,
    lon: typeof a.lon === 'number' ? a.lon : null,
    squawk: a.squawk ?? null,
    vrate: a.baro_rate ?? a.geom_rate ?? null,
    category: a.category ?? null,
    airlineIcao, airlineLabel, badgeColor,
  };
}

async function fetchAircraft() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastGoodFetch = performance.now();
    connected = true;
    applyUpdate(data.aircraft || []);
  } catch (e) {
    connected = false;
  }
}

function applyUpdate(list) {
  const now = performance.now();
  const seen = new Set();

  for (const raw of list) {
    const n = normalizeAircraft(raw);
    if (!n) continue;
    seen.add(n.hex);

    const existing = planes.get(n.hex);
    if (existing) {
      existing.targetBearing = n.bearing;
      existing.targetRange = n.range;
      existing.cs = n.cs;
      existing.alt = n.alt;
      existing.hdg = n.hdg;
      existing.speed = n.speed;
      existing.lat = n.lat;
      existing.lon = n.lon;
      existing.airlineIcao = n.airlineIcao;
      existing.airlineLabel = n.airlineLabel;
      existing.badgeColor = n.badgeColor;
      existing.realHdg = n.realHdg;
      existing.squawk = n.squawk;
      existing.vrate = n.vrate;
      existing.category = n.category;
      existing.lastSeen = now;
      existing.trail.push({ bearing: n.bearing, range: n.range, t: now });
      pruneTrail(existing.trail, now);
    } else {
      planes.set(n.hex, {
        ...n,
        targetBearing: n.bearing,
        targetRange: n.range,
        typeLabel: null,
        registration: null,
        typeDesc: null,
        wtc: null,
        lastSeen: now,
        trail: [{ bearing: n.bearing, range: n.range, t: now }],
      });
      recordSightingOnce(n.hex, 'total'); // a genuinely new visit, not just still-in-view -- see "Sighting counts" above
    }

    if (!hexTypeCache.has(n.hex)) {
      lookupType(n.hex).then(info => {
        const pl = planes.get(n.hex);
        if (pl) { pl.typeLabel = info.type; pl.registration = info.reg; pl.typeDesc = info.desc; pl.wtc = info.wtc; }
      });
    }

    // Fired proactively here (not just when the detail panel opens, see
    // loadOwner) so the label itself can show it too, not only the panel --
    // same "fire once per hex, cache the miss too via lookupOwner" shape as
    // the type lookup just above.
    if (n.airlineLabel === PRIVATE_LABEL && !ownerCache.has(n.hex)) {
      loadOwner(n.hex);
    }

    // Try for every real callsign, not just ones that look like a scheduled
    // airline flight number -- on-demand/charter GA traffic (badged "Private
    // Aircraft") occasionally does have a route adsb.im can resolve, and
    // there's no harm in asking; a miss just caches null same as today. Only
    // truly skipped when there's no real callsign yet at all (n.cs is the
    // hex fallback -- see hasCallsign in normalizeAircraft), since querying
    // a hex code as if it were a flight number can't return anything.
    if (n.hasCallsign) {
      queueRouteLookup(n.cs, n.lat ?? home?.lat ?? 0, n.lon ?? home?.lon ?? 0);
    }

    updateApproachTracking(planes.get(n.hex), n.lat, n.lon, n.alt);
    checkNearbyAlert(planes.get(n.hex), n.range);
    checkEmergencySquawk(planes.get(n.hex));
    checkRduPhaseAlert(planes.get(n.hex));
  }

  // aircraft readsb no longer reports aren't dropped immediately -- they
  // coast (see COAST_TOTAL_MS) at their last known position/heading, fading
  // out in drawPlanes, and are only removed once that grace period elapses
  for (const hex of [...planes.keys()]) {
    if (seen.has(hex)) continue;
    const pl = planes.get(hex);
    if (now - pl.lastSeen > COAST_TOTAL_MS) {
      confirmApproachOnDrop(pl); // catches signal loss right at touchdown, before readsb ever reports 'ground'
      planes.delete(hex);
    }
  }
}

// ---- Drawing ---------------------------------------------------
function drawRings() {
  ctx.save();
  for (let i = 1; i <= RINGS; i++) {
    const r = (R / RINGS) * i;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = i === RINGS ? COLORS.ringBright : COLORS.ring;
    ctx.lineWidth = 1;
    ctx.stroke();

    const nm = Math.round((RANGE_NM / RINGS) * i);
    ctx.fillStyle = COLORS.ringLabel;
    ctx.font = '15px JetBrains Mono, monospace';
    ctx.fillText(nm + 'nm', CX + 6, CY - r + 14);
  }

  ctx.strokeStyle = COLORS.crosshair;
  ctx.beginPath();
  ctx.moveTo(CX, CY - R); ctx.lineTo(CX, CY + R);
  ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY);
  ctx.stroke();

  ctx.fillStyle = COLORS.compass;
  ctx.font = '600 20px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', CX, CY - R + 26);
  ctx.fillText('S', CX, CY + R - 12);
  ctx.fillText('E', CX + R - 16, CY + 7);
  ctx.fillText('W', CX - R + 16, CY + 7);
  ctx.textAlign = 'left';

  ctx.beginPath();
  ctx.arc(CX, CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = COLORS.sweep;
  ctx.fill();

  ctx.restore();
}

// Drawn for every in-range aircraft, every frame, underneath that frame's
// fresh blips/labels. Reuses each poll's already-computed bearing/range
// (pushed onto p.trail in applyUpdate) rather than raw lat/lon, so a replayed
// point lands exactly where that plane's blip actually was at the time --
// consistent with HOME_OVERRIDE's effect on live positions too.
function drawTrails() {
  const now = performance.now();
  ctx.save();
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (const p of planes.values()) {
    if (p.range > RANGE_NM) continue; // matches drawPlanes' own in-range filter -- no point trailing a blip that isn't drawn
    if (!p.trail || p.trail.length < 2) continue;
    ctx.strokeStyle = p.color || COLORS.text;
    for (let i = 1; i < p.trail.length; i++) {
      const a = p.trail[i - 1], b = p.trail[i];
      const pa = polarToXY(a.bearing, a.range);
      const pb = polarToXY(b.bearing, b.range);
      ctx.globalAlpha = Math.max(TRAIL_FADE_FLOOR, 1 - (now - b.t) / TRAIL_FADE_MS) * 0.85;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Canvas gradient stops need a literal color string, not a CSS var() --
// this turns COLORS.sweep's hex (theme-aware, see refreshCanvasColors) into
// an rgba() string at whatever alpha the gradient needs.
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function drawSweep() {
  ctx.save();
  const grad = ctx.createConicGradient(sweepAngle - Math.PI / 2, CX, CY);
  grad.addColorStop(0, hexToRgba(COLORS.sweep, 0.35));
  grad.addColorStop(0.06, hexToRgba(COLORS.sweep, 0));
  grad.addColorStop(1, hexToRgba(COLORS.sweep, 0));
  ctx.beginPath();
  ctx.arc(CX, CY, SWEEP_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  const lineX = CX + SWEEP_RADIUS * Math.cos(sweepAngle);
  const lineY = CY + SWEEP_RADIUS * Math.sin(sweepAngle);
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(lineX, lineY);
  ctx.strokeStyle = COLORS.sweep;
  ctx.lineWidth = 2;
  ctx.shadowColor = COLORS.sweep;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.restore();
}

// Shared by the on-screen tag and the detail panel, so "the label's altitude"
// and "the detail page's altitude" are always the exact same text -- was two
// separate formats (a flight-level shorthand on the tag, real feet in the
// panel) until the tag was asked to match the panel's wording.
function formatAltitude(alt) {
  if (alt === 'ground') return 'On ground';
  if (alt === null) return '—';
  return `${alt.toLocaleString()} ft`;
}

function drawPlanes(dt) {
  const stageRect = stage.getBoundingClientRect();
  const scale = stageRect.width / W;
  const inRange = [];
  const now = performance.now();

  // exponential chase toward the latest fix — never fully "arrives," so motion
  // stays continuous instead of visibly settling then pausing between polls
  const alpha = 1 - Math.exp(-dt / SMOOTH_TAU);
  const springAlpha = 1 - Math.exp(-dt / LABEL_SPRING_TAU);

  // --- pass 1: advance motion, draw blips, update each tag's content -----
  // (content must be finalized before we measure box sizes in pass 2)
  for (const p of planes.values()) {
    p.bearing += bearingDelta(p.bearing, p.targetBearing) * alpha;
    p.bearing = ((p.bearing % 360) + 360) % 360; // keep in [0,360) -- pure accumulation would otherwise drift arbitrarily far past it over a long-lived contact (e.g. a tight holding pattern), same issue labelAngle already guards against below
    p.range += (p.targetRange - p.range) * alpha;

    if (p.range > RANGE_NM) continue;
    inRange.push(p);

    // signal lost this poll (or several) -> hold position and fade rather
    // than vanishing outright; see COAST_TOTAL_MS
    const coastAge = now - p.lastSeen;
    p.opacity = coastAge <= COAST_FRESH_MS ? 1 : Math.max(0, 1 - (coastAge - COAST_FRESH_MS) / COAST_FADE_MS);

    const { x, y } = polarToXY(p.bearing, p.range);
    const color = altColor(p.alt); // no longer overridden for RDU landing/takeoff -- see rduPhaseOf's comment above
    const rduPhase = rduPhaseOf(p);
    p.anchorX = x * scale;
    p.anchorY = y * scale;
    p.color = color;

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(x, y);
    ctx.rotate((p.hdg) * Math.PI / 180);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    drawBlipShape(classifyAircraft(p));
    ctx.restore();

    if (rduPhase) {
      // A ring around the blip, drawn un-rotated (it's a circle -- rotating
      // it would be pointless) so it reads as "this plane" regardless of
      // heading, distinct from the blip's own altitude color.
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(x, y);
      ctx.strokeStyle = COLORS.rduHighlight;
      ctx.lineWidth = 2;
      ctx.shadowColor = COLORS.rduHighlight;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    let node = tagNodes.get(p.hex);
    if (!node) {
      node = document.createElement('div');
      node.className = 'tag';
      node.innerHTML = '<div class="cs"></div><div class="badge"></div><div class="seen"></div><div class="type"></div><div class="alt"></div><div class="route"></div><div class="owner"></div>';
      tagsEl.appendChild(node);
      tagNodes.set(p.hex, node);
    }
    node.classList.toggle('rdu-phase', !!rduPhase);
    node.style.borderLeft = `2px solid ${color}`;
    node.querySelector('.cs').textContent = p.cs;
    node.querySelector('.cs').style.color = color;
    const speedTxt = p.speed === null ? '--' : Math.round(p.speed);
    node.querySelector('.alt').textContent = `${formatAltitude(p.alt)} · ${speedTxt}kt`;

    const badgeEl = node.querySelector('.badge');
    badgeEl.textContent = p.airlineLabel;
    badgeEl.style.background = p.badgeColor;
    badgeEl.style.display = 'inline-block';

    // Only shown once it's actually a signal worth noticing ("you've seen
    // this one before") -- every first-time sighting showing "×1" would
    // just be noise on every label, every time, which is exactly the kind
    // of label clutter this app has repeatedly tried to avoid elsewhere.
    const seenEl = node.querySelector('.seen');
    const counts = sightingCounts.get(p.hex);
    if (counts && counts.total > 1) {
      seenEl.textContent = `SEEN ×${counts.total}`;
      seenEl.style.display = 'block';
    } else {
      seenEl.style.display = 'none';
    }

    const typeEl = node.querySelector('.type');
    if (p.typeLabel) {
      typeEl.textContent = p.typeLabel;
      typeEl.style.display = 'block';
    } else {
      typeEl.style.display = 'none';
    }

    const routeEl = node.querySelector('.route');
    const route = routeCache.get(p.cs);
    if (route) {
      routeEl.textContent = route.plausible ? route.text : `${route.text} (unconfirmed)`;
      routeEl.classList.toggle('implausible', !route.plausible);
      routeEl.style.display = 'block';
    } else {
      routeEl.style.display = 'none';
    }

    const ownerEl = node.querySelector('.owner');
    if (p.owner) {
      ownerEl.textContent = p.ownerCountry ? `${p.owner} (${p.ownerCountry})` : p.owner;
      ownerEl.style.display = 'block';
    } else {
      ownerEl.style.display = 'none';
    }

    p.node = node;
  }

  // --- pass 2: measure boxes, ease each toward its natural ring angle ------
  for (const p of inRange) {
    const rect = p.node.getBoundingClientRect();
    p.labelW = rect.width;
    p.labelH = rect.height;

    const desiredAngle = p.bearing; // natural ring position matches bearing exactly
    if (p.labelAngle === undefined) {
      p.labelAngle = desiredAngle;
    } else {
      p.labelAngle += bearingDelta(p.labelAngle, desiredAngle) * springAlpha;
      p.labelAngle = ((p.labelAngle % 360) + 360) % 360;
    }
  }

  // --- pass 3: push apart along the ring, preserving bearing order ---------
  // Only ever adjusting a label's ANGLE (never pulling it off the ring), and
  // only ever swapping pushes between bearing-adjacent neighbors, is what
  // guarantees leader lines never cross — see the comment on LABEL_RING_RADIUS.
  const sorted = inRange.slice().sort((a, b) => a.bearing - b.bearing);
  const n = sorted.length;
  for (let pass = 0; pass < LABEL_SEPARATION_PASSES; pass++) {
    for (let i = 0; i < n; i++) {
      const a = sorted[i];
      const b = sorted[(i + 1) % n];
      if (a === b) continue;

      const wrap = i === n - 1;
      const aAngle = a.labelAngle;
      const bAngle = wrap ? b.labelAngle + 360 : b.labelAngle;

      const aPt = ringPointForAngle(aAngle, scale);
      const bPt = ringPointForAngle(bAngle, scale);
      const aBox = { x: aPt.x - a.labelW / 2, y: aPt.y - a.labelH / 2, w: a.labelW, h: a.labelH };
      const bBox = { x: bPt.x - b.labelW / 2, y: bPt.y - b.labelH / 2, w: b.labelW, h: b.labelH };

      const overlapX = Math.min(aBox.x + aBox.w, bBox.x + bBox.w) - Math.max(aBox.x, bBox.x) + LABEL_MARGIN;
      const overlapY = Math.min(aBox.y + aBox.h, bBox.y + bBox.h) - Math.max(aBox.y, bBox.y) + LABEL_MARGIN;
      if (overlapX <= 0 || overlapY <= 0) continue;

      // push direction is never ambiguous here (a always precedes b in
      // sorted bearing order), so unlike a free-floating 2D layout there's
      // no need for a tie-break — just the measured overlap, which is
      // always genuinely positive at this point (the guard above already
      // filtered out non-overlapping pairs)
      const push = Math.min(overlapX, overlapY) / 2;
      const angleDelta = (push / (LABEL_RING_RADIUS * scale)) * 180 / Math.PI;

      a.labelAngle = ((a.labelAngle - angleDelta) % 360 + 360) % 360;
      b.labelAngle = ((b.labelAngle + angleDelta) % 360 + 360) % 360;
    }
  }

  // --- pass 4: place labels, draw a leader line back to each plane ---------
  // The HUD (location + aircraft count) sits centered near the top of the
  // stage -- close enough to a due-north label's natural ring position that
  // the two can overlap. Computed once per frame (the HUD doesn't move) and
  // used below to nudge any label that would land underneath it.
  const hudBox = hudEl.getBoundingClientRect();
  const hudLeft = hudBox.left - stageRect.left - LABEL_MARGIN;
  const hudRight = hudBox.right - stageRect.left + LABEL_MARGIN;
  const hudBottom = hudBox.bottom - stageRect.top + LABEL_MARGIN;

  const cxScaled = CX * scale, cyScaled = CY * scale, boundRadiusScaled = LABEL_BOUND_RADIUS * scale;
  for (const p of inRange) {
    const ringPt = ringPointForAngle(p.labelAngle, scale);
    let cxBox = ringPt.x, cyBox = ringPt.y; // box center
    const hw = p.labelW / 2, hh = p.labelH / 2;

    // Pull the box's center radially inward, if needed, so every corner
    // stays inside the visible circle -- a few iterations converge because
    // moving the center closer to CX,CY shrinks all four corner distances.
    for (let iter = 0; iter < 4; iter++) {
      let maxDist = 0;
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          const d = Math.hypot(cxBox + sx * hw - cxScaled, cyBox + sy * hh - cyScaled);
          if (d > maxDist) maxDist = d;
        }
      }
      if (maxDist <= boundRadiusScaled) break;
      const s = boundRadiusScaled / maxDist;
      cxBox = cxScaled + (cxBox - cxScaled) * s;
      cyBox = cyScaled + (cyBox - cyScaled) * s;
    }

    let lx = cxBox - hw;
    let ly = cyBox - hh;
    // final defensive clamp against the square stage bounds themselves
    lx = Math.max(2, Math.min(stageRect.width - p.labelW - 2, lx));
    ly = Math.max(2, Math.min(stageRect.height - p.labelH - 2, ly));

    // clear the HUD text block rather than sit underneath it -- only
    // triggers for labels whose ring position lands near due north
    if (ly < hudBottom && lx < hudRight && lx + p.labelW > hudLeft) {
      ly = Math.max(2, Math.min(stageRect.height - p.labelH - 2, hudBottom));
    }
    p.labelX = lx;
    p.labelY = ly;
    p.node.style.left = lx + 'px';
    p.node.style.top = ly + 'px';
    p.node.style.opacity = p.opacity;

    const attach = closestPointOnRect(p.anchorX, p.anchorY, lx, ly, p.labelW, p.labelH);
    const attachX = attach.x, attachY = attach.y;

    let line = leaderNodes.get(p.hex);
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      leadersEl.appendChild(line);
      leaderNodes.set(p.hex, line);
    }
    line.setAttribute('x1', p.anchorX);
    line.setAttribute('y1', p.anchorY);
    line.setAttribute('x2', attachX);
    line.setAttribute('y2', attachY);
    line.setAttribute('stroke', p.color);
    line.style.opacity = LEADER_BASE_OPACITY * p.opacity; // preserve the CSS base opacity, just scaled by coast fade
  }

  // remove tag/leader nodes for aircraft no longer tracked or out of range
  for (const [hex, node] of tagNodes) {
    const pl = planes.get(hex);
    if (!pl || pl.range > RANGE_NM) {
      node.remove();
      tagNodes.delete(hex);
      const line = leaderNodes.get(hex);
      if (line) { line.remove(); leaderNodes.delete(hex); }
    }
  }

  countEl.textContent = inRange.length + (inRange.length === 1 ? ' AIRCRAFT' : ' AIRCRAFT');
}

function updateStatus() {
  const now = performance.now();
  const stale = !connected || (now - lastGoodFetch) > STALE_MS;
  statusEl.classList.toggle('show', stale);

  if ((now - lastGoodFetch) > DROP_MS && planes.size > 0) {
    planes.clear();
    for (const node of tagNodes.values()) node.remove();
    tagNodes.clear();
  }
}

// ---- Main loop -------------------------------------------------
let lastFrameTs = performance.now();

function tick(ts) {
  // re-arm first: an early return below must not kill the loop
  requestAnimationFrame(tick);

  const since = ts - lastFrameTs;
  if (since < FRAME_MIN_MS) return; // frame budget not up yet -- skip the repaint
  // dt is measured from the last frame actually DRAWN, so interpolation and
  // the sweep stay correct across skipped frames
  const dt = Math.min(0.25, Math.max(0, since / 1000));
  lastFrameTs = ts;

  ctx.clearRect(0, 0, W, H);
  drawRings();
  drawSweep();
  drawTrails();
  drawPlanes(dt);
  updateStatus();

  sweepAngle += SWEEP_RAD_PER_SEC * dt;
  if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;
}

// ---- Touch interaction --------------------------------------------------
// Tap a plane's blip or label -> detail panel with fields the compact tag
// doesn't show (registration, heading, vertical rate, squawk, precise
// range/bearing). Tap empty space -> toggle the storm radar overlay.
const toastEl = document.getElementById('toast');
const detailPanelEl = document.getElementById('detailPanel');
const detailBackdropEl = document.getElementById('detailBackdrop');
const gearBtnEl = document.getElementById('gearBtn');
const settingsPanelEl = document.getElementById('settingsPanel');
const settingsBackdropEl = document.getElementById('settingsBackdrop');
let toastTimer = null;
let detailDismissTimer = null;

function showToast(text, durationMs = 1400) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), durationMs);
}

function vrateLabel(vrate) {
  if (vrate === null) return '—';
  if (Math.abs(vrate) < 100) return 'Level';
  return (vrate > 0 ? '↑ ' : '↓ ') + Math.abs(Math.round(vrate)) + ' ft/min';
}

let detailPanelHex = null; // guards against a photo fetch resolving after the panel moved on to a different plane (or closed)

function showDetailPanel(p, isAlert = false, alertLabel = 'WITHIN 2 MILES') {
  hideSettingsPanel(); // mutually exclusive -- see showSettingsPanel
  detailPanelHex = p.hex;
  const speedTxt = p.speed === null ? '—' : Math.round(p.speed) + ' kt';
  const altTxt = formatAltitude(p.alt);
  const hdgTxt = p.realHdg != null ? Math.round(p.realHdg) + '°' : '—';
  const rangeTxt = `${p.range.toFixed(1)} nm · ${Math.round(p.bearing)}°`;
  const route = routeCache.get(p.cs);
  const routeTxt = route ? (route.plausible ? route.text : `${route.text} (unconfirmed)`) : null;
  const subtitle = [p.typeLabel || 'Unknown type', p.registration].filter(Boolean).join(' · ');
  const isPrivate = p.airlineLabel === PRIVATE_LABEL;
  const counts = sightingCounts.get(p.hex) || { total: 0, nearby: 0 };

  detailPanelEl.innerHTML = `
    <div class="dp-close">&times;</div>
    ${isAlert ? `<div class="dp-alert-tag">⚠ ${esc(alertLabel)}</div>` : ''}
    <div class="dp-photo" style="display:none"></div>
    <div class="dp-cs" style="color:${p.color}">${esc(p.cs)}</div>
    <div class="dp-badge" style="background:${p.badgeColor}">${esc(p.airlineLabel)}</div>
    <div class="dp-type">${esc(subtitle)}</div>
    ${isPrivate ? `<div class="dp-owner" style="display:none"></div>` : ''}
    ${routeTxt ? `<div class="dp-route${route.plausible ? '' : ' implausible'}">${esc(routeTxt)}</div>` : ''}
    <div class="dp-grid">
      <div class="dp-field"><div class="dp-label">Altitude</div><div class="dp-value">${altTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Speed</div><div class="dp-value">${speedTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Heading</div><div class="dp-value">${hdgTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Vert. rate</div><div class="dp-value">${vrateLabel(p.vrate)}</div></div>
      <div class="dp-field"><div class="dp-label">Squawk</div><div class="dp-value">${p.squawk ?? '—'}</div></div>
      <div class="dp-field"><div class="dp-label">Range / Brg</div><div class="dp-value">${rangeTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Sightings</div><div class="dp-value">${counts.total}</div></div>
      <div class="dp-field"><div class="dp-label">Within 2mi</div><div class="dp-value">${counts.nearby}</div></div>
    </div>
  `;
  detailPanelEl.classList.add('show');
  detailPanelEl.classList.toggle('alert', isAlert);
  detailBackdropEl.classList.add('show');
  clearTimeout(detailDismissTimer);
  detailDismissTimer = setTimeout(hideDetailPanel, 18000);
  loadDetailPhoto(p.hex);
  if (isPrivate) loadOwner(p.hex);
}

// Registered-owner lookup for confirmed-private aircraft (a real callsign
// that just doesn't match the airline flight-number pattern -- not the
// "Identifying..." case, which isn't confirmed as anything yet). adsbdb.com
// aggregates public aircraft registry data -- the FAA's releasable registry
// for US tails, plus other countries' equivalents -- behind a free, no-key
// API, same class of source as everything else this app already leans on
// (adsb.im, planespotters, Wikipedia, Overpass, RainViewer). Queried by hex
// rather than parsing a registration out of the callsign, since we always
// have the hex and it's exactly what readsb already identifies the plane by.
// Only a real answer (found, or a confirmed 404 -- not in the registry) gets
// cached; a network hiccup doesn't, so it just retries next time the panel
// opens, same reasoning as lookupStockPhoto above.
//
// Country of registration (registered_owner_country_name) is included too --
// that's as far as "location" goes here, deliberately: adsbdb doesn't expose
// anything more granular than country, and that's the right amount of detail
// anyway -- it's public aviation-registry metadata, same category as the
// registration number itself, not anything that narrows down a real person's
// location the way street-address-level lookup would (see HANDOFF.md for the
// earlier, explicitly declined request to go further than this).
async function lookupOwner(hex) {
  if (ownerCache.has(hex)) return ownerCache.get(hex);
  try {
    const res = await fetch(`https://api.adsbdb.com/v0/aircraft/${hex}`);
    if (res.status === 404) { ownerCache.set(hex, null); return null; }
    if (!res.ok) return null;
    const data = await res.json();
    const owner = data?.response?.aircraft?.registered_owner || null;
    const country = data?.response?.aircraft?.registered_owner_country_name || null;
    const result = owner ? { owner, country } : null;
    ownerCache.set(hex, result);
    return result;
  } catch (e) {
    return null;
  }
}

async function loadOwner(hex) {
  const info = await lookupOwner(hex);
  if (!info) return;
  const pl = planes.get(hex);
  if (pl) { pl.owner = info.owner; pl.ownerCountry = info.country; } // so the tag can show it too, not just the detail panel
  if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
  const ownerEl = detailPanelEl.querySelector('.dp-owner');
  if (!ownerEl) return;
  ownerEl.textContent = info.country ? `Registered to ${info.owner} (${info.country})` : `Registered to ${info.owner}`;
  ownerEl.style.display = 'block';
}

// Photo comes from planespotters.net via our own same-origin /photo/<hex>
// proxy (see deploy/photo-proxy.py) -- their API requires a descriptive
// custom User-Agent that browser fetch() can never set itself. Shown as
// plain, non-clickable text credit rather than a real link: this same page
// also runs unattended in the kiosk's Chromium, and a tap-driven navigation
// away from the app with no way back isn't an acceptable risk there, even
// though a normal browser tab (e.g. via the Funnel URL) would handle it
// fine. Per planespotters.net's terms of use, attribution (photographer
// credit + naming the source) is still given either way.
// Generic silhouette (Google Material Icons "flight" glyph, Apache-2.0)
// shown in place of a real photo when planespotters.net has none on file --
// drawn inline so it needs no network fetch and matches the panel's theme.
const PLACEHOLDER_PHOTO_SVG = `
  <svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>

function showPlaceholderPhoto(photoEl) {
  photoEl.innerHTML = PLACEHOLDER_PHOTO_SVG + '<div class="dp-photo-credit">No photo available</div>';
  photoEl.style.display = 'block';
}

// Most tracked tails (private/GA especially) have no dedicated planespotters
// photo -- rather than always falling back to the generic silhouette, try a
// representative photo of the aircraft *type* instead (e.g. any Cessna 172,
// not necessarily this exact tail). Wikipedia/Wikimedia Commons, the same
// free/no-key-required class of source as adsb.im's routes, RainViewer's
// radar, and Overpass's runways elsewhere in this file. Cached per type
// string (typeLabel), not per hex, since many tails share a type -- one
// lookup covers every Cessna 172 this receiver ever sees. Clearly labeled
// "Representative photo" (a badge on the image itself, not just the credit
// line) so it's never mistaken for a real photo of that specific airframe --
// unlike the planespotters credit above, this isn't a specific photographer
// crediting a specific photo of a specific plane, so a "site name + link"
// level of attribution (same non-clickable-text treatment as planespotters,
// same kiosk-navigation-safety reasoning) felt like the right proportional
// effort here, not full Commons per-image license/author boilerplate.
async function lookupStockPhoto(typeLabel) {
  if (stockPhotoCache.has(typeLabel)) return stockPhotoCache.get(typeLabel);
  if (stockPhotoPending.has(typeLabel)) return null;
  stockPhotoPending.add(typeLabel);
  let result = null;
  try {
    // action=query&list=search (full-text search over article content) --
    // NOT action=opensearch, which only prefix-matches page *titles* and
    // badly undershoots real hit rate: e.g. our own typeLabel string
    // "Bombardier Regional Jet CRJ-900" doesn't share a common prefix with
    // Wikipedia's actual title "Bombardier CRJ" (opensearch: no match), but
    // full-text search finds it fine since the words all appear in the
    // article regardless of order. Confirmed via a real browser fetch (not
    // curl) that this endpoint honors CORS and doesn't require special
    // headers for ordinary, human-paced usage.
    const searchRes = await fetch(
      `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(typeLabel)}&srlimit=1&format=json&origin=*`,
      { cache: 'force-cache' }
    );
    const searchData = await searchRes.json();
    const title = searchData.query && searchData.query.search && searchData.query.search[0] && searchData.query.search[0].title;
    if (title) {
      const sumRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`, { cache: 'force-cache' });
      const sumData = await sumRes.json();
      const thumb = sumData.thumbnail && sumData.thumbnail.source;
      const page = sumData.content_urls && sumData.content_urls.desktop && sumData.content_urls.desktop.page;
      if (thumb) result = { thumb, page: page || null };
    }
  } catch (e) {
    // offline or Wikipedia unavailable this attempt -- caller falls back to
    // the placeholder, but see below: not cached, so a later reopen retries
  }
  // Only successful lookups are cached, deliberately -- caching a null here
  // would mean one transient failure (a network hiccup, a momentary
  // Wikipedia rate-limit) permanently shows the placeholder for that whole
  // aircraft type for the rest of the session, never retried, the exact
  // failure mode loadRunways() had before its retry fix. Unlike runways
  // (fetched once automatically at page load), this only ever runs on a
  // tap, so an occasional repeat lookup for a type that's genuinely not on
  // Wikipedia is cheap and bounded by how often someone taps that type,
  // same tradeoff already made for the specific-tail planespotters photo
  // lookup above, which also isn't cached and re-fetches every open.
  if (result) stockPhotoCache.set(typeLabel, result);
  stockPhotoPending.delete(typeLabel);
  return result;
}

// Photo comes from planespotters.net via our own same-origin /photo/<hex>
// proxy (see deploy/photo-proxy.py) -- their API requires a descriptive
// custom User-Agent that browser fetch() can never set itself. Shown as
// plain, non-clickable text credit rather than a real link: this same page
// also runs unattended in the kiosk's Chromium, and a tap-driven navigation
// away from the app with no way back isn't an acceptable risk there, even
// though a normal browser tab (e.g. via the Funnel URL) would handle it
// fine. Per planespotters.net's terms of use, attribution (photographer
// credit + naming the source) is still given either way.
async function tryStockPhoto(hex, photoEl) {
  const typeLabel = planes.get(hex)?.typeLabel;
  if (!typeLabel) { showPlaceholderPhoto(photoEl); return; }
  const stock = await lookupStockPhoto(typeLabel);
  if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
  if (!stock) { showPlaceholderPhoto(photoEl); return; }
  photoEl.innerHTML = `
    <div class="dp-photo-badge">Representative photo</div>
    <img src="${esc(stock.thumb)}" alt="${esc(typeLabel)} (representative photo, not this specific aircraft)">
    <div class="dp-photo-credit">${esc(typeLabel)} · Wikipedia</div>
  `;
  photoEl.style.display = 'block';
}

async function loadDetailPhoto(hex) {
  const photoEl = detailPanelEl.querySelector('.dp-photo');
  if (!photoEl) return;
  try {
    const res = await fetch(`/photo/${hex}`, { cache: 'no-store' });
    const data = await res.json();
    if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
    if (!data.found) { await tryStockPhoto(hex, photoEl); return; }
    photoEl.innerHTML = `
      <img src="${esc(data.thumbLarge || data.thumb)}" alt="${esc(detailPanelEl.querySelector('.dp-cs')?.textContent || 'Aircraft')} photo">
      <div class="dp-photo-credit">© ${esc(data.photographer || 'Unknown')} · planespotters.net</div>
    `;
    photoEl.style.display = 'block';
  } catch (e) {
    if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return;
    await tryStockPhoto(hex, photoEl);
  }
}

function hideDetailPanel() {
  detailPanelHex = null;
  detailPanelEl.classList.remove('show');
  detailPanelEl.classList.remove('alert');
  detailBackdropEl.classList.remove('show');
  clearTimeout(detailDismissTimer);
}

// occasionally, not a hot path, so the simplicity is worth more than the
// avoided re-render.
// A function, not a const array: the labels interpolate AIRPORT.code, and
// AIRPORT is not final until loadAirportConfig() resolves during start().
// Evaluated at parse time this would have frozen "RDU" into the labels of

// Talks to the loopback-only setup listener. Not reachable from the network,
// so no credential is needed -- and none can be required, since this is the
// only way back in for someone who has forgotten the admin password.
const DEVICE_API = 'http://127.0.0.1:8090';

async function deviceApi(path, opts = {}) {
  const r = await fetch(DEVICE_API + path, {
    ...opts, headers: { 'Content-Type': 'application/json' } });
  let b = {};
  try { b = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(b?.error?.message || 'That did not work.');
  return b;
}

let deviceView = null;   // null | 'wifi' | 'location' | 'airport' | 'reset' | 'password'
let deviceStatus = null; // last /onboard payload, so screens can show what is already set
let deviceMsg = '';
let deviceBusy = false;
let wifiNets = [];
let airportRows = [];

function renderDeviceSetup() {
  const msg = deviceMsg
    ? `<div class="sp-sub" style="padding:8px 0;color:var(--text)">${esc(deviceMsg)}</div>` : '';

      ? wifiNets.map(n => `
          <div class="sp-menu-row" data-wifi="${esc(n.ssid)}">
            <div><div class="sp-label">${esc(n.ssid)}</div>
                 <div class="sp-sub">${n.secured ? 'password needed' : 'open'} · ${n.signal}%</div></div>
            <div class="sp-chevron">&#8250;</div>
          </div>`).join('')
      : '<div class="sp-sub" style="padding:10px 0">Tap Scan to look for networks.</div>';
    const cur = (deviceStatus && deviceStatus.network) || {};
    const curLine = cur.ssid
      ? `<div class="sp-sub" style="padding:6px 0">Currently on <b>${esc(cur.ssid)}</b></div>` : '';
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">WiFi</div>${curLine}
            <div class="sp-menu-row" data-act="wifi-scan">
              <div><div class="sp-label">Scan for networks</div></div><div class="sp-chevron">&#8250;</div>
            </div>${busy}${msg}${list}`;
  }
  if (deviceView === 'airport') {
    const list = airportRows.map(a => `
      <div class="sp-menu-row" data-airport="${esc(a.code)}">
        <div><div class="sp-label">${esc(a.code)} — ${esc(a.name)}</div>
             <div class="sp-sub">${esc(a.city || '')}, ${esc(a.state || '')}</div></div>
        <div class="sp-chevron">&#8250;</div>
      </div>`).join('');
    const cua = (deviceStatus && deviceStatus.airport) || null;
    const cuaLine = cua
      ? `<div class="sp-sub" style="padding:6px 0">Currently <b>${esc(cua.code)}</b></div>` : '';
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Home airport</div>${cuaLine}
            <div class="sp-menu-row" data-act="airport-search">
              <div><div class="sp-label">Search airports</div>
                   <div class="sp-sub">By code, name or city</div></div>
              <div class="sp-chevron">&#8250;</div></div>${busy}${msg}${list}`;
  }
  if (deviceView === 'remote') {
    const rem = deviceStatus && deviceStatus.remote || {};
    if (rem.loginUrl) {
      return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Remote access</div>
        <div class="sp-sub" style="padding:10px 0;line-height:1.8">
          On your phone or computer, open this address and sign in to
          Tailscale. This radar is waiting.</div>
        <div style="padding:10px 0;font-size:1.05rem;color:var(--mid);word-break:break-all">
          ${esc(rem.loginUrl)}</div>
        ${busy}${msg}
        <div class="sp-menu-row" data-act="remote-check">
          <div><div class="sp-label">I have signed in</div>
               <div class="sp-sub">Check now</div></div><div class="sp-chevron">&#8250;</div></div>`;
    }
    if (rem.state === 'Running') {
      return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Remote access</div>
        <div class="sp-sub" style="padding:10px 0;line-height:1.8">
          Connected as <b>${esc(rem.magicDnsName || 'this device')}</b>.
          ${rem.publicUrl ? `Public page: <b>${esc(rem.publicUrl)}</b>` : ''}</div>
        ${busy}${msg}
        <div class="sp-menu-row" data-act="remote-funnel-${rem.publicUrl ? 'off' : 'on'}">
          <div><div class="sp-label">${rem.publicUrl ? 'Turn off the public page' : 'Publish a public page'}</div>
               <div class="sp-sub">${rem.publicUrl
                 ? 'Keeps remote access, removes the public web address'
                 : 'Anyone with the address can view your radar'}</div></div>
          <div class="sp-chevron">&#8250;</div></div>`;
    }
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Remote access</div>
      <div class="sp-sub" style="padding:10px 0;line-height:1.8">
        Optional. Lets you view this radar from anywhere using your own free
        Tailscale account. You will sign in on your phone — nothing long needs
        typing here.</div>
      ${busy}${msg}
      <div class="sp-menu-row" data-act="remote-start">
        <div><div class="sp-label">Set up remote access</div>
             <div class="sp-sub">Shows a link to open on your phone</div></div>
        <div class="sp-chevron">&#8250;</div></div>`;
  }
  if (deviceView === 'reset') {
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Erase everything</div>
      <div class="sp-sub" style="padding:10px 0;line-height:1.7">
        This removes the WiFi network, the remote access account, the admin
        password, this radar's location, and the flight history and approach
        heatmap built up here. Use it before giving the radar to someone else,
        or to start over if you have forgotten the password.<br><br>
        The radar will then start its own setup network and show new
        instructions on this screen.</div>
      ${busy}${msg}
      <div class="sp-menu-row" data-act="reset-confirm">
        <div><div class="sp-label" style="color:#ff6b6b">Type ERASE to confirm</div>
             <div class="sp-sub">Nothing happens until the word matches</div></div>
        <div class="sp-chevron">&#8250;</div></div>`;
  }
  // Every row states what it is CURRENTLY set to. Without this the owner has
  // no way to tell a configured device from an unconfigured one, and would
  // have to re-enter a value just to find out what it already was.
  const d = deviceStatus || {};
  const net = d.network || {};
  const wifiNow = net.hotspotActive ? 'Running its own setup network'
                : net.ssid ? `Connected to ${net.ssid}${net.ipv4 ? ' · ' + net.ipv4 : ''}`
                : 'Not connected';
  const locNow = d.location
    ? `${Number(d.location.lat).toFixed(4)}, ${Number(d.location.lon).toFixed(4)}`

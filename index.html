<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlightRadar</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0d0f;
    --ring: #1c3236;
    --ring-bright: #2a4a4f;
    --sweep: #ffb020;
    --text-dim: #5b7278;
    --text: #cfe8ea;
    --low: #ffb020;
    --mid: #4fd6c8;
    --high: #a78bfa;
    --ground: #6b8087;
    --taxi: #4a90d9;
    --bad: #ff5d5d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(100vmin, 1080px);
    height: min(100vmin, 1080px);
  }

  #mapbg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg);
    filter: brightness(0.44) saturate(1.5);
  }

  #mapbg .maplibregl-ctrl-attrib {
    background: transparent;
    font-size: 8px;
    opacity: 0.5;
  }
  #mapbg .maplibregl-ctrl-attrib a { color: var(--text-dim); }
  #mapbg .maplibregl-ctrl-bottom-right { right: auto; left: 4px; bottom: 2px; }

  canvas {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: transparent;
    display: block;
    box-shadow:
      0 0 0 2px #14201f,
      0 0 0 6px #05080a,
      0 0 40px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(0,0,0,0.5);
  }

  .hud {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .hud .loc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    color: var(--text);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .status {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--bad);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .status.show { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  #leaders {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #leaders line {
    stroke-width: 1;
    opacity: 0.55;
  }

  .tag {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.15;
    padding: 4px 8px;
    border-radius: 3px;
    background: rgba(5, 8, 10, 0.75);
    border: 1px solid rgba(255,255,255,0.06);
    white-space: nowrap;
    pointer-events: none;
    will-change: left, top;
  }
  .tag .cs { font-weight: 700; letter-spacing: 0.04em; font-size: 0.91rem; }
  .tag .type { display: none; color: var(--text-dim); margin-top: 0; }
  .tag .alt { color: var(--text-dim); }
  .tag .route { color: var(--text-dim); display: none; margin-top: 0; }
  .tag .route.implausible { color: var(--bad); }
  .tag .seen {
    display: none;
    color: var(--mid);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-top: 1px;
  }
  .tag .badge {
    display: none;
    margin-top: 1px;
    margin-bottom: 0;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 0px 6px;
    border-radius: 2px;
    color: #fff;
    letter-spacing: 0.02em;
  }

  #toast {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translate(-50%, 0);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: var(--text);
    background: rgba(5, 8, 10, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 14px;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #toast.show { opacity: 1; }

  #detailBackdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #detailBackdrop.show { opacity: 1; pointer-events: auto; }

  #detailPanel {
    /* Anchored to the bottom edge, not centered -- a centered panel sat
       right on top of the dial's middle, which is exactly where a plane's
       flight trail (drawTrails) is most likely to pass, now that every
       in-range aircraft always shows one, not just the tapped plane.
       Bottom-anchoring plus a height cap leaves the upper dial clear so the
       trail stays visible while a plane's panel is open. */
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translate(-50%, 0) scale(0.96);
    width: min(72%, 480px);
    max-height: 80%;
    overflow-y: auto;
    background: rgba(8, 12, 14, 0.96);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 18px 20px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  #detailPanel.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  /* Auto-popped by the nearby-aircraft alert (checkNearbyAlert), not a tap --
     a red-tinted border/glow distinguishes "this interrupted you" from a
     panel you opened yourself, which otherwise looks identical. */
  #detailPanel.alert {
    border-color: var(--bad);
    animation: alertGlow 1.4s ease-in-out infinite;
  }
  @keyframes alertGlow {
    0%, 100% { box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,93,93,0.25); }
    50% { box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 16px 2px rgba(255,93,93,0.55); }
  }
  #detailPanel .dp-alert-tag {
    color: var(--bad);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  #detailPanel .dp-cs { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; }
  #detailPanel .dp-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    color: #fff;
    letter-spacing: 0.03em;
  }
  #detailPanel .dp-type { margin-top: 10px; color: var(--text-dim); font-size: 0.75rem; }
  #detailPanel .dp-owner { margin-top: 2px; color: var(--text-dim); font-size: 0.75rem; }
  #detailPanel .dp-route { margin-top: 2px; color: var(--text-dim); font-size: 0.75rem; }
  #detailPanel .dp-route.implausible { color: var(--bad); }
  #detailPanel .dp-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  #detailPanel .dp-field .dp-label {
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  #detailPanel .dp-field .dp-value {
    font-size: 0.95rem;
    margin-top: 2px;
  }
  #detailPanel .dp-close {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 1.1rem;
    color: var(--text-dim);
    padding: 4px 8px;
  }
  #detailPanel .dp-photo {
    position: relative;
    margin: -18px -20px 14px;
    border-radius: 10px 10px 0 0;
    overflow: hidden;
  }
  /* The -18px top bleed above assumes the photo is the first thing in the
     panel, flush with its top edge -- true normally, but the alert tag
     (see .dp-alert-tag) renders above it when this is an auto-popped
     nearby-aircraft alert, and the negative margin was pulling the photo
     up over that text instead of past it. Drop just the top bleed there;
     the left/right/bottom bleed (and rounded top corners) still look fine
     sitting a little lower instead of flush with the panel edge. */
  #detailPanel.alert .dp-photo {
    margin-top: 0;
  }
  #detailPanel .dp-photo img,
  #detailPanel .dp-photo svg {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
  }
  #detailPanel .dp-photo-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text);
    background: rgba(5, 8, 10, 0.8);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 3px 7px;
    border-radius: 3px;
  }
  #detailPanel .dp-photo-credit {
    font-size: 0.55rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    background: rgba(5, 8, 10, 0.7);
    padding: 3px 8px;
  }
</style>
</head>
<body>

<div class="stage">
  <div id="mapbg"></div>
  <canvas id="radar" width="1080" height="1080"></canvas>
  <svg id="leaders"></svg>
  <div class="hud">
    <div class="loc" id="loc">LOCATING…</div>
    <div class="count" id="count">0 AIRCRAFT</div>
  </div>
  <div class="status" id="status">NO SIGNAL — CHECK RECEIVER</div>
  <div id="tags"></div>
  <div id="toast"></div>
  <div id="detailBackdrop"></div>
  <div id="detailPanel"></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script>
// ---- Config ------------------------------------------------------
const DATA_URL = '/tar1090/data/aircraft.json';
const RECEIVER_URL = '/tar1090/data/receiver.json';
// Overrides the receiver's actual configured position for DISPLAY purposes
// only (readsb keeps using its own real antenna position internally for
// signal-range/MLAT math — this only changes what FlightRadar centers on).
// Set to null to go back to auto-detecting the receiver's real position
// from receiver.json. When set, bearing/range are always computed via
// haversine from raw lat/lon rather than trusting readsb's r_dst/r_dir,
// since those are relative to the real antenna, not this override point.
const HOME_OVERRIDE = null; // was briefly set to a different address for a one-off request, then reverted to auto-detecting the real receiver position
// "dark" turned out to be near-grayscale by design (water/parks/woods are
// all ~0% saturation), so no CSS filter could make it colorful. "liberty"
// has real color (blue water, green parks, warm road tones) — we darken it
// ourselves via the #mapbg CSS filter instead.
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
// same free, no-key route API tar1090 itself uses (adsb.im asks http-loaded
// pages to call it over http, mirrored below to match their preference)
let ROUTE_API_URL = 'https://adsb.im/api/0/routeset';
const ROUTE_BATCH_MS = 4000;      // how often we flush queued route lookups
const ROUTE_BATCH_MAX = 50;       // callsigns per request
const RANGE_NM = 20;             // outer ring range in nautical miles
const RINGS = 2;                 // number of range rings
const SWEEP_SPEED = 0.008;       // radians per frame
const SMOOTH_TAU = 0.35;         // seconds; exponential smoothing time constant for plane motion
const FETCH_INTERVAL_MS = 1000;  // how often we poll aircraft.json
const STALE_MS = 15000;          // no good fetch in this long -> show NO SIGNAL
const DROP_MS = 45000;           // no good fetch in this long -> clear stale blips

// A plane missing from a poll doesn't necessarily mean it's gone -- at low
// altitude especially, a bank turn or terrain can mask ADS-B reception for a
// few seconds. Rather than vanishing instantly, a plane "coasts" at its last
// known position, fading out, before actually being dropped.
const COAST_FRESH_MS = 2000;  // no fade within this long of the last confirmed contact (normal poll jitter)
const COAST_FADE_MS = 6000;   // then fade out over this long
const COAST_TOTAL_MS = COAST_FRESH_MS + COAST_FADE_MS;
const LEADER_BASE_OPACITY = 0.55; // matches #leaders line's CSS opacity -- scaled by coast fade, not replaced

// Every tracked aircraft always shows its recent flight path (drawTrails, in
// the main loop below) -- originally only drawn for the plane with an open
// detail panel, but always-on for every plane in view was preferred. This
// receiver has no server-side trace history (readsb's data/traces/*.json
// isn't populated on this Pi), so the trail is built client-side from each
// poll's already-computed bearing/range -- it only covers time since this
// page was last loaded, not real flight history. See HANDOFF.md.
// 3 minutes, not the original 10: that was sized for one plane at a time on
// tap; drawn continuously for every in-range plane every frame instead, a
// shorter window keeps the display legible (a 10-minute trail per plane,
// all at once, gets visually messy fast) and meaningfully caps the
// per-frame line-segment count on a Pi running this render loop 24/7.
const TRAIL_MAX_MS = 3 * 60 * 1000;

function pruneTrail(trail, now) {
  while (trail.length && now - trail[0].t > TRAIL_MAX_MS) trail.shift();
}

// HTML-escapes a value before it goes into an innerHTML template literal.
// Most fields we display are tightly constrained (Mode S callsigns are a
// fixed 6-bit charset with no room for markup), but route city names come
// from adsb.im and photo attribution comes from planespotters.net's own
// user-submitted photographer names -- both external, neither ours to
// trust blindly. Escaping unconditionally is cheap and means nothing here
// depends on staying aware of which specific field came from where.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ICAO airline designators (ICAO Doc 8585, a public standard) mapped to a
// display name, IATA code, and a badge color loosely associated with the
// carrier — not an attempt at exact brand colors, just visual distinction.
// Scoped to carriers plausible near a US East Coast receiver; unmapped
// codes (private GA, unlisted operators) simply get no badge.
const AIRLINES = {
  AAL: { name: 'American Airlines',      iata: 'AA', color: '#a5342a' },
  DAL: { name: 'Delta Air Lines',        iata: 'DL', color: '#9c1238' },
  UAL: { name: 'United Airlines',        iata: 'UA', color: '#1f5fa8' },
  SWA: { name: 'Southwest Airlines',     iata: 'WN', color: '#b5860f' },
  JBU: { name: 'JetBlue Airways',        iata: 'B6', color: '#146fa0' },
  ASA: { name: 'Alaska Airlines',        iata: 'AS', color: '#0f766e' },
  NKS: { name: 'Spirit Airlines',        iata: 'NK', color: '#a68a00' },
  FFT: { name: 'Frontier Airlines',      iata: 'F9', color: '#1a7a3c' },
  AAY: { name: 'Allegiant Air',          iata: 'G4', color: '#1a3a6b' },
  HAL: { name: 'Hawaiian Airlines',      iata: 'HA', color: '#6a1b4d' },
  SCX: { name: 'Sun Country Airlines',   iata: 'SY', color: '#0e5c3a' },
  SKW: { name: 'SkyWest Airlines',       iata: 'OO', color: '#3a4a5a' },
  ENY: { name: 'Envoy Air',              iata: 'MQ', color: '#3a4a5a' },
  RPA: { name: 'Republic Airways',       iata: 'YX', color: '#3a4a5a' },
  PDT: { name: 'Piedmont Airlines',      iata: 'PT', color: '#3a4a5a' },
  JIA: { name: 'PSA Airlines',           iata: 'OH', color: '#3a4a5a' },
  EDV: { name: 'Endeavor Air',           iata: '9E', color: '#3a4a5a' },
  ASH: { name: 'Air Wisconsin',          iata: 'ZW', color: '#3a4a5a' },
  GJS: { name: 'GoJet Airlines',         iata: 'G7', color: '#3a4a5a' },
  FDX: { name: 'FedEx Express',          iata: 'FX', color: '#4b1f7a' },
  UPS: { name: 'UPS Airlines',           iata: '5X', color: '#4a3510' },
  GTI: { name: 'Atlas Air',              iata: '5Y', color: '#43494f' },
  ABX: { name: 'ABX Air',                iata: 'GB', color: '#43494f' },
  BAW: { name: 'British Airways',        iata: 'BA', color: '#1a2a5e' },
  DLH: { name: 'Lufthansa',              iata: 'LH', color: '#0d3a5c' },
  ACA: { name: 'Air Canada',             iata: 'AC', color: '#7a1420' },
  AFR: { name: 'Air France',             iata: 'AF', color: '#1a3a7a' },
  KLM: { name: 'KLM Royal Dutch Airlines', iata: 'KL', color: '#0a5c9e' },
  VIR: { name: 'Virgin Atlantic',        iata: 'VS', color: '#7a1030' },
  QTR: { name: 'Qatar Airways',          iata: 'QR', color: '#5a1030' },
  UAE: { name: 'Emirates',               iata: 'EK', color: '#a3151e' },
  EJA: { name: 'NetJets',                iata: 'EJ', color: '#43494f' },
  LXJ: { name: 'Flexjet',                iata: 'LX', color: '#43494f' },
};
const PRIVATE_LABEL = 'Private Aircraft';
const PRIVATE_COLOR = '#44494e';
// Distinct from PRIVATE_LABEL -- this is a contact whose callsign readsb
// hasn't decoded yet, not a confirmed GA tail number. See normalizeAircraft.
const ACQUIRING_LABEL = 'Identifying…';
const ACQUIRING_COLOR = '#33393e';

// ---- State -----------------------------------------------------
let home = null;                 // { lat, lon } of the receiver
let planes = new Map();          // hex -> plane record
let lastGoodFetch = 0;
let connected = false;
let map = null;                  // MapLibre background map instance
const routeCache = new Map();    // callsign -> { from, to } or null (looked up, no route)
const routePending = new Set();  // callsigns currently in-flight
let routeQueue = [];             // [{ callsign, lat, lng }, ...] awaiting the next batch
let routeTimer = null;

let databaseFolder = null;       // tar1090's local hex database folder, discovered at startup
const typeCodeTable = new Map(); // ICAO type code (e.g. "SR22") -> human-readable type string
const shardCache = new Map();    // db shard key -> parsed contents (or null)
const hexTypeCache = new Map();  // hex -> human-readable type string or null
const hexTypePending = new Set();
const stockPhotoCache = new Map();   // typeLabel -> { thumb, page } or null -- keyed by type, not hex, since many tails share a type
const stockPhotoPending = new Set();
const ownerCache = new Map();        // hex -> registered owner name, or null if confirmed not in the registry

if (location.protocol === 'http:') {
  // adsb.im asks that http-loaded pages call their API over http too
  ROUTE_API_URL = ROUTE_API_URL.replace('https://', 'http://');
}

// ---- Canvas setup --------------------------------------------------
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;
const R = W * 0.38; // usable radius, leaving a wider outer band for the label ring
const SWEEP_RADIUS = W / 2; // the sweep wedge/line fills the whole dial, not just the plotted range

let sweepAngle = 0;
const tagsEl = document.getElementById('tags');
const leadersEl = document.getElementById('leaders');
const stage = document.querySelector('.stage');
const hudEl = document.querySelector('.hud');
const locEl = document.getElementById('loc');
const countEl = document.getElementById('count');
const statusEl = document.getElementById('status');
const tagNodes = new Map();    // hex -> tag DOM node
const leaderNodes = new Map(); // hex -> leader-line SVG node

// Label layout: labels sit in a ring around the edge of the dial rather than
// floating next to their plane. Each label's natural position is its own
// bearing angle (LABEL_SPRING_TAU eases it there as the plane moves), and
// labels are only ever pushed apart ALONG the ring, never off it — which,
// combined with always resolving neighbors in bearing-sorted order, means
// leader lines are never allowed to cross (connecting points on an inner
// circle to points on an outer ring in the same cyclic order can't produce
// crossing chords, so preserving that order is what keeps crossings at
// zero rather than just "minimized").
const LABEL_RING_RADIUS = R + 75;
const LABEL_MARGIN = 8;
const LABEL_SPRING_TAU = 0.4;
const LABEL_SEPARATION_PASSES = 24; // cheap: adjacent-pair only, O(n) per pass now

// The panel is round, not square -- the stage element is a square bounding
// box, but only the inscribed circle is actual visible glass. A label
// centered on the ring (radius LABEL_RING_RADIUS) can still have a corner
// poke past that circle at diagonal angles, since the box's own half-diagonal
// adds to the ring's radius. Bounding labels to the square stage isn't
// enough -- they need to stay inside this circle instead.
const LABEL_BOUND_RADIUS = W / 2 - 6;

// scale converts internal canvas-space (1080 units) to real CSS px, same
// factor drawPlanes already uses for anchorX/anchorY -- only equals 1 on the
// physical 1080x1080 kiosk panel; without it labels land at the wrong CSS
// pixel position on any other viewport (e.g. viewing over Tailscale Funnel).
function ringPointForAngle(angleDeg, scale) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: CX * scale + LABEL_RING_RADIUS * scale * Math.cos(rad), y: CY * scale + LABEL_RING_RADIUS * scale * Math.sin(rad) };
}

// nearest point on an axis-aligned box to an external point — used to attach
// each leader line to whichever edge of the label box faces its plane
function closestPointOnRect(px, py, rx, ry, rw, rh) {
  return { x: Math.max(rx, Math.min(px, rx + rw)), y: Math.max(ry, Math.min(py, ry + rh)) };
}

const style = getComputedStyle(document.documentElement);
const COLORS = {
  low: style.getPropertyValue('--low').trim(),
  mid: style.getPropertyValue('--mid').trim(),
  high: style.getPropertyValue('--high').trim(),
  ground: style.getPropertyValue('--ground').trim(),
  taxi: style.getPropertyValue('--taxi').trim(),
};

function altColor(alt) {
  if (alt === 'ground') return COLORS.taxi;   // confirmed on the ground
  if (alt === null) return COLORS.ground;     // unknown altitude, not the same thing
  if (alt < 10000) return COLORS.low;
  if (alt < 25000) return COLORS.mid;
  return COLORS.high;
}

// ---- Blip shape classification -----------------------------------------
// Distinguishes large commercial jets / smaller jets / prop planes / rotor-
// craft on the radar, the way tar1090's own map does. Rather than porting
// tar1090's icon set (its own code license is unclear -- "Other"/NOASSERTION
// on GitHub, see the aircraft-type-lookup note above for the same concern),
// these are simple shapes drawn to match this app's existing kite-blip style.
// Classification prefers the specific tail's ICAO type info (from the same
// type database lookupType() already reads: typeDesc is the ICAO Doc 8643
// 3-char code, e.g. "L2J" = landplane/2 engines/jet, "H1T" = helicopter/1
// engine/turbine; wtc is wake-turbulence category L/M/H/J) and falls back to
// the raw ADS-B "category" field readsb reports per-aircraft (A1 light .. A5
// heavy, A7 rotorcraft, B2 lighter-than-air) when type info isn't known yet
// or at all -- common for GA tails with no database entry. Unclassifiable
// aircraft keep the original kite blip, so most traffic looks unchanged.
function classifyAircraft(p) {
  const desc = p.typeDesc, wtc = p.wtc, cat = p.category;
  if (desc && desc.length === 3) {
    const kind = desc[0], engine = desc[2];
    if (kind === 'H' || kind === 'G' || kind === 'T') return 'heli';
    if (engine === 'J') return (wtc === 'H' || wtc === 'J') ? 'heavy' : 'jet';
    if (engine === 'P' || engine === 'T' || engine === 'E') return 'prop';
  }
  if (cat) {
    if (cat === 'A7') return 'heli';
    if (cat === 'B2') return 'lta';
    if (cat === 'A4' || cat === 'A5') return 'heavy';
    if (cat === 'A3') return 'jet';
    if (cat === 'A1' || cat === 'A2') return 'prop';
  }
  return 'unknown';
}

// Each draw*() assumes the canvas is already translated to the blip's
// position and rotated so "forward" is -Y, with fillStyle/strokeStyle/
// shadowColor/shadowBlur already set to the plane's color by the caller.
function drawKite(scale) {
  ctx.beginPath();
  ctx.moveTo(0, -9 * scale);
  ctx.lineTo(6 * scale, 7 * scale);
  ctx.lineTo(0, 3 * scale);
  ctx.lineTo(-6 * scale, 7 * scale);
  ctx.closePath();
  ctx.fill();
}

function drawProp() {
  ctx.beginPath();
  ctx.moveTo(-1.5, -9);
  ctx.lineTo(1.5, -9);
  ctx.lineTo(1.5, -1.5);
  ctx.lineTo(9, 1.5);
  ctx.lineTo(9, 3.5);
  ctx.lineTo(1.5, 1);
  ctx.lineTo(1.5, 8);
  ctx.lineTo(-1.5, 8);
  ctx.lineTo(-1.5, 1);
  ctx.lineTo(-9, 3.5);
  ctx.lineTo(-9, 1.5);
  ctx.lineTo(-1.5, -1.5);
  ctx.closePath();
  ctx.fill();
}

function drawHeli() {
  ctx.beginPath();
  ctx.arc(0, -2, 7, 0, Math.PI * 2);
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = ctx.fillStyle;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-1.3, 4);
  ctx.lineTo(1.3, 4);
  ctx.lineTo(0.8, 11);
  ctx.lineTo(-0.8, 11);
  ctx.closePath();
  ctx.fill();
}

function drawBlimp() {
  ctx.beginPath();
  ctx.ellipse(0, 0, 5, 11, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBlipShape(kind) {
  switch (kind) {
    case 'heavy': drawKite(1.55); break;
    case 'prop': drawProp(); break;
    case 'heli': drawHeli(); break;
    case 'lta': drawBlimp(); break;
    case 'jet':
    case 'unknown':
    default: drawKite(1); break;
  }
}

function polarToXY(bearingDeg, rangeNm) {
  const angle = (bearingDeg - 90) * Math.PI / 180; // 0deg = up (north)
  const r = (rangeNm / RANGE_NM) * R;
  return { x: CX + r * Math.cos(angle), y: CY + r * Math.sin(angle) };
}

// shortest signed delta between two bearings, e.g. 359 -> 2 gives +3
function bearingDelta(from, to) {
  let d = (to - from) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

function haversineBearingRange(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const phi1 = toRad(lat1), phi2 = toRad(lat2);
  const dLambda = toRad(lon2 - lon1);

  const y = Math.sin(dLambda) * Math.cos(phi2);
  const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);
  const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

  const R_NM = 3440.065;
  const dPhi = toRad(lat2 - lat1);
  const a = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) ** 2;
  const range = R_NM * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return { bearing, range };
}

// The inverse of haversineBearingRange: given a start point plus a bearing
// and distance, find the destination point (standard great-circle "direct"
// geodesic formula). Used to project a line beyond a runway's real pavement
// end, approximating its final approach corridor -- see loadRunways().
function destinationPoint(lat, lon, bearingDeg, distanceNm) {
  const R_NM = 3440.065;
  const toRad = d => d * Math.PI / 180;
  const bearing = toRad(bearingDeg);
  const phi1 = toRad(lat), lambda1 = toRad(lon);
  const delta = distanceNm / R_NM;

  const phi2 = Math.asin(Math.sin(phi1) * Math.cos(delta) + Math.cos(phi1) * Math.sin(delta) * Math.cos(bearing));
  const lambda2 = lambda1 + Math.atan2(
    Math.sin(bearing) * Math.sin(delta) * Math.cos(phi1),
    Math.cos(delta) - Math.sin(phi1) * Math.sin(phi2)
  );

  return [lambda2 * 180 / Math.PI, phi2 * 180 / Math.PI]; // [lon, lat] -- GeoJSON coordinate order
}

// Aircraft in the immediate vicinity of RDU's runways, climbing or
// descending, get called out with a distinct color regardless of their
// altitude band -- this is deliberately narrow (tight radius + real vertical
// rate, not just "low altitude") so normal traffic flying low nearby doesn't
// get flagged.
const RDU_LAT = 35.8776, RDU_LON = -78.7875;
const RDU_ELEV_FT = 435;         // airport reference elevation, MSL
const RDU_PROXIMITY_NM = 0.869;  // 1 statute mile
const RDU_VERT_FT = 500;         // within this of field elevation
const RDU_VRATE_MIN = 150;       // ft/min -- filters out level-flight noise near zero
const COLOR_LANDING = '#ff2d2d';
const COLOR_TAKEOFF = '#2dff6a';

function flightPhaseColor(p) {
  if (typeof p.alt !== 'number' || p.lat == null || p.lon == null || p.vrate == null) return null;
  if (Math.abs(p.alt - RDU_ELEV_FT) > RDU_VERT_FT) return null;
  if (haversineBearingRange(RDU_LAT, RDU_LON, p.lat, p.lon).range > RDU_PROXIMITY_NM) return null;
  if (p.vrate <= -RDU_VRATE_MIN) return COLOR_LANDING;
  if (p.vrate >= RDU_VRATE_MIN) return COLOR_TAKEOFF;
  return null;
}

// ---- RDU approach-path accumulation -------------------------------------
// Builds a faint picture of RDU's *real* arrival corridors from actually-
// observed traffic, growing more defined the more landings it sees --
// persisted server-side (not localStorage -- see APPROACH_STORE_URL below)
// so it's shared across every viewer and keeps building across kiosk
// reboots/reloads, not just within one session. There's no good free
// dataset of official approach paths to draw from instead (unlike runways,
// which OSM/Overpass has real geometry for -- FAA approach plates are PDF
// charts, not simple line data); see extendedApproachLines() above for the
// free-but-approximate stand-in this complements.
const RDU_APPROACH_RADIUS_NM = 12;       // track candidate points out to this far from RDU
const RDU_APPROACH_CEILING_FT = RDU_ELEV_FT + 6000; // ignore traffic well above a normal approach profile
// "Actually landed" confirmation window -- deliberately looser than a
// well-sited receiver would need. This receiver's antenna isn't mast-
// mounted yet (see HANDOFF.md), so ADS-B reception at low altitude/close
// range is likely worse than these numbers would suggest for a mature
// setup: a real landing's signal can plausibly drop out well before the
// aircraft is actually this close/low, which would mean confirmApproachOnDrop
// never fires and a genuine landing's buffered points get silently
// discarded. Revisit (tighten back up) once the new antenna is mast-mounted
// and reception characteristics actually improve -- these values are a
// starting point for current conditions, not a settled calibration.
const RDU_APPROACH_CONFIRM_RADIUS_NM = 4;
const RDU_APPROACH_CONFIRM_ALT_FT = RDU_ELEV_FT + 3000;
// Backed by a small same-origin service (deploy/approach-store.py, proxied
// at /approaches -- see 91-flightradar-approach-store.conf) instead of
// localStorage. localStorage is scoped per-browser/per-device, so the
// kiosk's own accumulated picture would never be visible to anyone
// checking in from a separate browser (their laptop, phone, the Funnel
// URL) -- this way every viewer reads and contributes to the same shared,
// growing picture. Multiple viewers open at once could each independently
// report the same real landing; harmless, it just over-represents that one
// landing by a point or two, not wrong.
const APPROACH_STORE_URL = '/approaches';
const APPROACH_MAX_POINTS = 6000; // bounds render cost -- oldest points evicted first (server enforces its own copy of this cap too)

let approachPoints = []; // [[lon,lat], ...] confirmed-landing points, shared across viewers

async function loadApproachPoints() {
  try {
    const res = await fetch(APPROACH_STORE_URL, { cache: 'no-store' });
    const data = await res.json();
    if (Array.isArray(data)) approachPoints = data;
  } catch (e) {
    // approach-store unavailable -- starts/stays empty for this session, purely cosmetic either way
  }
  if (map && map.getSource('approaches')) map.getSource('approaches').setData(approachPointsGeoJSON());
}

function approachPointsGeoJSON() {
  return { type: 'FeatureCollection', features: approachPoints.map(pt => ({ type: 'Feature', geometry: { type: 'Point', coordinates: pt } })) };
}

function commitApproachTrack(points) {
  if (!points.length) return;
  approachPoints.push(...points);
  if (approachPoints.length > APPROACH_MAX_POINTS) approachPoints.splice(0, approachPoints.length - APPROACH_MAX_POINTS);
  if (map && map.getSource('approaches')) map.getSource('approaches').setData(approachPointsGeoJSON());
  fetch(APPROACH_STORE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(points) })
    .catch(e => {}); // approach-store unavailable -- this session's own view still updated above, just won't be shared
}

// ---- Sighting counts ----------------------------------------------------
// How many distinct times this receiver has picked up each aircraft
// ("total"), and how many of those times it came within the nearby-alert
// radius ("nearby", see ALERT_RADIUS_NM) -- shared server-side (same
// reasoning as approachPoints above: a browser-local count would never be
// visible to anyone checking in from a different device) so the kiosk's
// own accumulated history is visible to every viewer, not just whoever
// happens to have it open. "Distinct visit", not "every poll" -- recorded
// once when a plane is newly added to `planes` (applyUpdate) or once when
// checkNearbyAlert's pl.alerted first flips true, not once a second while
// it's actually in view.
const SIGHTING_STORE_URL = '/sightings';
const sightingCounts = new Map(); // hex -> { total, nearby }

async function loadSightingCounts() {
  try {
    const res = await fetch(SIGHTING_STORE_URL, { cache: 'no-store' });
    const data = await res.json();
    if (data && typeof data === 'object') {
      for (const [hex, counts] of Object.entries(data)) sightingCounts.set(hex, counts);
    }
  } catch (e) {
    // sighting-store unavailable -- counts start/stay empty for this session, purely cosmetic either way
  }
}

// Updates the local view immediately (so this session's own label/panel
// stay responsive without waiting on a round-trip) and separately
// fire-and-forgets a POST so the increment is shared and persisted --
// same split responsibility as commitApproachTrack above. The server's
// response (the authoritative post-increment counts) overwrites the local
// guess once it arrives, reconciling any drift from other viewers
// incrementing the same hex concurrently.
function recordSighting(hex, kind) {
  const current = sightingCounts.get(hex) || { total: 0, nearby: 0 };
  sightingCounts.set(hex, { ...current, [kind]: (current[kind] || 0) + 1 });
  fetch(SIGHTING_STORE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hex, kind }) })
    .then(res => res.ok ? res.json() : null)
    .then(counts => { if (counts) sightingCounts.set(hex, counts); })
    .catch(e => {}); // sighting-store unavailable -- this session's own optimistic count stands, just won't be shared
}

// Called once per poll (not per animation frame -- this wants real GPS
// fixes, not smoothed/eased blip positions) for each tracked aircraft.
// Buffers candidate points on `pl` while a plane is plausibly on approach
// to RDU (within radius, below a normal-approach altitude ceiling), and
// commits that buffer to the persistent store once the plane is confirmed
// to have actually landed -- either it reaches 'ground' status close in, or
// (since ADS-B reception commonly drops out right at touchdown, especially
// before a receiving antenna is mast-mounted) it disappears close to the
// field at low altitude. If instead it climbs back out or flies back away
// without either signal, the buffer is discarded -- overflights and
// go-arounds shouldn't shape the picture, only real landings.
function updateApproachTracking(pl, lat, lon, alt) {
  if (typeof lat !== 'number' || typeof lon !== 'number') return;
  if (!pl.approachPoints) pl.approachPoints = [];

  const rduRange = haversineBearingRange(RDU_LAT, RDU_LON, lat, lon).range;

  if (alt === 'ground' && rduRange <= RDU_APPROACH_CONFIRM_RADIUS_NM) {
    commitApproachTrack(pl.approachPoints);
    pl.approachPoints = [];
    return;
  }

  const withinRadius = rduRange <= RDU_APPROACH_RADIUS_NM;
  const belowCeiling = typeof alt === 'number' && alt <= RDU_APPROACH_CEILING_FT;
  if (withinRadius && belowCeiling) {
    pl.approachPoints.push([lon, lat]);
    if (pl.approachPoints.length > 400) pl.approachPoints.shift(); // bound per-plane buffer
  } else if (pl.approachPoints.length) {
    pl.approachPoints = []; // climbed out or flew away without landing -- not a real approach
  }
}

// Called when a coasted-out plane is finally dropped from tracking (see
// applyUpdate) -- catches the common case where ADS-B signal is lost right
// at/just before touchdown rather than readsb ever reporting 'ground'.
function confirmApproachOnDrop(pl) {
  if (!pl.approachPoints || !pl.approachPoints.length) return;
  if (typeof pl.alt !== 'number' || pl.alt > RDU_APPROACH_CONFIRM_ALT_FT) return;
  if (pl.lat == null || pl.lon == null) return;
  if (haversineBearingRange(RDU_LAT, RDU_LON, pl.lat, pl.lon).range > RDU_APPROACH_CONFIRM_RADIUS_NM) return;
  commitApproachTrack(pl.approachPoints);
}

function formatLoc() {
  if (!home) return 'LOCATING…';
  const ns = home.lat >= 0 ? 'N' : 'S';
  const ew = home.lon >= 0 ? 'E' : 'W';
  return `${Math.abs(home.lat).toFixed(4)}°${ns} ${Math.abs(home.lon).toFixed(4)}°${ew} · ${RANGE_NM}NM`;
}

// ---- Background map --------------------------------------------------
// Zoom level whose ground scale at `lat` matches RANGE_NM across R pixels,
// so the map's visible extent lines up with the radar's outer ring.
// rPixels must be real CSS/DOM pixels, not canvas-internal units -- MapLibre's
// zoom is calibrated against the container's actual rendered size, which only
// equals the canvas's fixed 1080-unit internal resolution (R) when the stage
// happens to render at exactly 1080 CSS px. True on the physical 1080x1080
// kiosk panel (which is why this went unnoticed there), but not for anyone
// viewing the same page at a different size via the Tailscale Funnel URL.
function zoomForRange(rangeNm, lat, rPixels) {
  const metersPerPixel = (rangeNm * 1852) / rPixels;
  // 156543.03392 is meters-per-pixel-at-zoom-0 for the classic 256px slippy-
  // tile convention (earth circumference / 256). MapLibre/Mapbox GL define
  // zoom for 512px tiles instead (whole world = 512px at zoom 0), so a zoom
  // computed straight from the 256px constant renders one level too far in
  // -- barely visible right at `home` (zero range), but growing fast with
  // distance, since it's a per-nm scale error not a fixed offset. That's
  // what made real ground features (e.g. RDU's runways) drift further and
  // further from where the radar independently plots aircraft at the same
  // true bearing/range, the farther out you looked -- the "-1" corrects for
  // the doubled tile size (2x pixels per tile = 1 fewer zoom level needed).
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / metersPerPixel) - 1;
}

function initMap() {
  if (!home || map) return;
  // Initial zoom, calibrated against the stage's CSS size at this moment --
  // the resize listener below recalibrates this the same way if the window
  // is resized later (e.g. via the Funnel URL).
  const rCss = R * (stage.getBoundingClientRect().width / W);
  map = new maplibregl.Map({
    container: 'mapbg',
    style: MAP_STYLE_URL,
    center: [home.lon, home.lat],
    zoom: zoomForRange(RANGE_NM, home.lat, rCss),
    interactive: false,
    attributionControl: { compact: true },
  });
  // The vector tileset's own aeroway (runway/taxiway) layers simply carry no
  // geometry at this low a zoom (confirmed via queryRenderedFeatures — the
  // tiles are generated without that detail below ~z11, independent of the
  // style's minzoom setting), so raising the zoom gate there does nothing.
  // Runway outlines instead come from an OpenStreetMap Overpass query
  // (retried a few times on failure), added as our own GeoJSON layer — see
  // loadRunways().
  map.on('load', loadRunways);
  map.on('load', recolorLabels);
  map.on('load', refreshStorms);
  map.on('load', initApproachLayer);
}

// Registered before loadRunways() resolves (that one waits on a network
// round-trip to Overpass; this doesn't, so it always finishes first),
// meaning the real runway/taxiway layers loadRunways() adds later paint on
// top of this automatically -- no explicit layer ordering needed.
function initApproachLayer() {
  map.addSource('approaches', { type: 'geojson', data: approachPointsGeoJSON() });
  map.addLayer({
    id: 'approaches-heat',
    type: 'heatmap',
    source: 'approaches',
    // Tuned faint on purpose, but the original numbers here (radius 6,
    // intensity 0.6, opacity 0.45) turned out faint to the point of
    // effectively invisible once #mapbg's own `brightness(0.3)` filter (see
    // initMap) darkens it further on top -- confirmed live against the real
    // accumulated point data (thousands of points, correctly clustered right
    // over RDU) that at the production numbers nothing perceptible reached
    // the screen at the normal operating zoom.
    // Originally a solid orange fill (matching --low), but that both read as
    // an undifferentiated blob and visually blended into the base map's own
    // orange roads. Went through a non-monotonic "outline" ramp after that
    // (peaked at low density, faded in the interior) at a specific request
    // for an outline look -- reverted after a follow-up request wanted the
    // opposite: genuine heatmap behavior, where a busier stretch of the
    // corridor (more accumulated landings overlapping there) reads as more
    // visually distinguished than a lightly-used one. This ramp is strictly
    // monotonic -- transparent at zero density, growing smoothly to a bold,
    // clearly-saturated teal at the highest-density cores -- confirmed live
    // against the real accumulated data that denser stretches of the real
    // corridor genuinely read as more solid/bright than sparser ones, not
    // just "some outline exists here." Teal (matches --mid) still contrasts
    // against the map's orange roads instead of disappearing into them.
    paint: {
      'heatmap-weight': 0.6,
      'heatmap-intensity': 1.2,
      'heatmap-radius': 10,
      'heatmap-opacity': 0.85,
      'heatmap-color': [
        'interpolate', ['linear'], ['heatmap-density'],
        0, 'rgba(0,0,0,0)',
        0.15, 'rgba(79,214,200,0.15)',
        0.4, 'rgba(79,214,200,0.4)',
        0.7, 'rgba(79,214,200,0.7)',
        1, 'rgba(79,214,200,0.95)',
      ],
    },
  });
}

// "liberty" is styled for a light background (black text, white halo) —
// flip place-name labels to the opposite convention so they stay legible
// once #mapbg's CSS filter darkens everything underneath them.
function recolorLabels() {
  const LABEL_LAYERS = ['label_city_capital', 'label_city', 'label_town', 'label_village', 'label_other'];
  for (const id of LABEL_LAYERS) {
    if (!map.getLayer(id)) continue;
    map.setPaintProperty(id, 'text-color', '#e8e2d5');
    map.setPaintProperty(id, 'text-halo-color', '#05080a');
  }
  if (map.getLayer('water_name_point_label')) {
    map.setPaintProperty('water_name_point_label', 'text-color', '#9fc4e8');
    map.setPaintProperty('water_name_point_label', 'text-halo-color', '#05080a');
  }
}

// Zoom is calibrated against the stage's CSS pixel size (see zoomForRange's
// comment above) -- a window resized after load needs both a container
// resize AND a fresh zoom to stay aligned with the radar, not just the
// former. Fine on the kiosk (fixed physical resolution, this never fires
// there in practice), but keeps a resized Funnel/desktop view aligned too.
window.addEventListener('resize', () => {
  if (!map) return;
  map.resize();
  const rCss = R * (stage.getBoundingClientRect().width / W);
  map.setZoom(zoomForRange(RANGE_NM, home.lat, rCss));
});

// ---- Runway outlines --------------------------------------------------
// Fetch (home location never changes at runtime, so this only needs to
// truly succeed once) of real runway/taxiway geometry from OSM's public
// Overpass API, covering the same RANGE_NM box the radar shows. Purely
// additive — if every attempt fails (offline, Overpass rate-limited, etc.)
// the map/radar keep working without runway outlines.
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
const OVERPASS_MAX_ATTEMPTS = 4;
const OVERPASS_RETRY_MS = 20000; // generous backoff -- shared public API, and this only needs to eventually land once per (rare) kiosk reload, not be fast

function rangeBBox(lat, lon, rangeNm) {
  const rangeM = rangeNm * 1852;
  const latDelta = rangeM / 111320;
  const lonDelta = rangeM / (111320 * Math.cos(lat * Math.PI / 180));
  return { south: lat - latDelta, west: lon - lonDelta, north: lat + latDelta, east: lon + lonDelta };
}

function overpassToGeoJSON(elements) {
  const nodes = new Map();
  for (const el of elements) {
    if (el.type === 'node') nodes.set(el.id, [el.lon, el.lat]);
  }
  const features = [];
  for (const el of elements) {
    if (el.type !== 'way' || !el.tags) continue;
    const aeroway = el.tags.aeroway;
    if (aeroway !== 'runway' && aeroway !== 'taxiway') continue;
    const coords = el.nodes.map(id => nodes.get(id)).filter(Boolean);
    if (coords.length < 2) continue;
    features.push({ type: 'Feature', properties: { aeroway, ref: el.tags.ref || '' }, geometry: { type: 'LineString', coordinates: coords } });
  }
  return { type: 'FeatureCollection', features };
}

// A rough, immediate approximation of final approach corridors, derived
// entirely from runway geometry we already have -- no new data source
// needed. Real approach procedures curve and vector well out from the
// field, but the final several miles always line up with the runway's own
// heading (that's what "final approach" means), so extending each runway's
// centerline outward a representative distance is a reasonable placeholder.
// This is deliberately just an approximation, styled faintly/dashed to read
// as one -- see RDU_APPROACH_* below for the real thing, built from
// actually-observed landings over time.
const RUNWAY_EXTENSION_NM = 8; // roughly a typical ILS/RNAV final approach segment length

function extendedApproachLines(runwayGeojson) {
  const features = [];
  for (const f of runwayGeojson.features) {
    if (f.properties.aeroway !== 'runway') continue;
    const coords = f.geometry.coordinates;
    if (coords.length < 2) continue;
    const [lon1, lat1] = coords[0];
    const [lon2, lat2] = coords[coords.length - 1];
    const bearingFwd = haversineBearingRange(lat1, lon1, lat2, lon2).bearing;
    const bearingRev = (bearingFwd + 180) % 360;
    const ext1 = destinationPoint(lat1, lon1, bearingRev, RUNWAY_EXTENSION_NM); // beyond threshold 1
    const ext2 = destinationPoint(lat2, lon2, bearingFwd, RUNWAY_EXTENSION_NM); // beyond threshold 2
    features.push({
      type: 'Feature',
      properties: { ref: f.properties.ref },
      geometry: { type: 'LineString', coordinates: [ext1, [lon1, lat1], [lon2, lat2], ext2] },
    });
  }
  return { type: 'FeatureCollection', features };
}

async function loadRunways(attempt = 1) {
  const bb = rangeBBox(home.lat, home.lon, RANGE_NM);
  const query = `[out:json][timeout:25];(way["aeroway"="runway"](${bb.south},${bb.west},${bb.north},${bb.east});way["aeroway"="taxiway"](${bb.south},${bb.west},${bb.north},${bb.east}););out body;>;out skel qt;`;

  // A single failed/empty attempt used to mean no runways for the rest of
  // the kiosk's uptime (this only ever ran once, on map load, with no
  // retry) -- a transient Overpass hiccup or rate-limit at exactly the
  // wrong moment (e.g. right as the kiosk boots) silently lost runways for
  // a session that can run for days before the next reload. Retrying a
  // bounded number of times with a generous backoff fixes that without
  // hammering a shared public API.
  const retry = () => { if (attempt < OVERPASS_MAX_ATTEMPTS) setTimeout(() => loadRunways(attempt + 1), OVERPASS_RETRY_MS); };

  let geojson;
  try {
    const res = await fetch(OVERPASS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(query),
    });
    if (!res.ok) { retry(); return; }
    const data = await res.json();
    geojson = overpassToGeoJSON(data.elements || []);
  } catch (e) {
    retry(); // offline or Overpass unavailable this attempt -- map/radar work fine without runways meanwhile
    return;
  }
  if (geojson.features.length === 0) { retry(); return; }

  map.addSource('runways', { type: 'geojson', data: geojson });
  map.addSource('runway-extensions', { type: 'geojson', data: extendedApproachLines(geojson) });
  // Added first so the real runway/taxiway pavement (added next, below)
  // paints on top of it -- the approximation reads as a faint hint
  // underneath the crisp, real geometry, not competing with it.
  // line-opacity/width bumped from the original 0.22/1 -- same issue as
  // approaches-heat above: that faint by itself, plus #mapbg's own
  // brightness(0.3) filter darkening it further, added up to genuinely
  // invisible rather than just subtle. Confirmed live at the real production
  // zoom that these numbers are visible without reading as "real pavement".
  map.addLayer({
    id: 'runway-extensions',
    type: 'line',
    source: 'runway-extensions',
    paint: { 'line-color': '#c7d0d3', 'line-width': 1.6, 'line-opacity': 0.45, 'line-dasharray': [2, 3] },
  });
  map.addLayer({
    id: 'runways-taxiway',
    type: 'line',
    source: 'runways',
    filter: ['==', ['get', 'aeroway'], 'taxiway'],
    paint: { 'line-color': '#5a6469', 'line-width': 1.2 },
  });
  map.addLayer({
    id: 'runways-runway',
    type: 'line',
    source: 'runways',
    filter: ['==', ['get', 'aeroway'], 'runway'],
    paint: { 'line-color': '#c7d0d3', 'line-width': 2.5 },
  });
}

// ---- Storm radar overlay -----------------------------------------------
// RainViewer's public discovery API needs no key and is free for hobby use
// like this. It returns the current radar frame's tile path, which we
// refresh periodically since RainViewer publishes a new frame roughly every
// 10 minutes and this kiosk runs for days without a page reload. Tap empty
// space to toggle it on/off (see the pointerup handler below); off by
// default so the map isn't cluttered when there's nothing worth showing.
const RAINVIEWER_API_URL = 'https://api.rainviewer.com/public/weather-maps.json';
const RAINVIEWER_REFRESH_MS = 5 * 60 * 1000;
const RAINVIEWER_COLOR = 6;       // NEXRAD Level III palette -- the familiar green/yellow/red/purple intensity scale
const RAINVIEWER_OPTIONS = '1_1'; // smooth interpolation, snow shown distinctly
// Always on -- was previously a tap-to-toggle option (default off), but
// that made storms easy to miss unless someone happened to tap empty space.
// Freed up the empty-tap gesture for the nearby-aircraft alert toggle below.
async function refreshStorms() {
  if (!map) return;
  try {
    const res = await fetch(RAINVIEWER_API_URL, { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const frames = data.radar && data.radar.past;
    if (!frames || frames.length === 0) return;
    const latest = frames[frames.length - 1];
    const url = `${data.host}${latest.path}/256/{z}/{x}/{y}/${RAINVIEWER_COLOR}/${RAINVIEWER_OPTIONS}.png`;

    if (map.getSource('storms')) {
      map.getSource('storms').setTiles([url]);
    } else {
      // RainViewer's 256px radar tiles top out at z7 -- capping maxzoom here
      // makes MapLibre overzoom (upsample) that real data at our much closer
      // zoom instead of requesting tiles that don't exist, which otherwise
      // come back as a small tiled "Zoom Level Not Supported" placeholder.
      map.addSource('storms', { type: 'raster', tiles: [url], tileSize: 256, maxzoom: 7 });
      map.addLayer({
        id: 'storms',
        type: 'raster',
        source: 'storms',
        paint: { 'raster-opacity': 0.65 },
      });
    }
  } catch (e) {
    // offline or RainViewer unavailable — storms layer just stays as it was
  }
}

// ---- Nearby-aircraft alert ---------------------------------------------
// Automatically pops the detail panel (see showDetailPanel) for any plane
// that comes within ALERT_RADIUS_NM of the receiver -- on by default,
// toggled via the empty-tap gesture that used to control storms.
const ALERT_RADIUS_NM = 1.738;      // 2 statute miles -- entry threshold
const ALERT_CLEAR_RADIUS_NM = 2.0;  // slightly wider exit threshold, so a
                                     // plane sitting right at the boundary
                                     // can't flap the alert on noisy range
let nearbyAlertsOn = true;

function toggleNearbyAlerts() {
  nearbyAlertsOn = !nearbyAlertsOn;
  showToast(nearbyAlertsOn ? 'NEARBY ALERTS ON' : 'NEARBY ALERTS OFF');
}

// A short two-note chime synthesized with the Web Audio API rather than a
// bundled audio file -- nothing to source, license, or ship as a binary
// asset, and the tone is trivially tunable right here. Browsers block audio
// until a user gesture on the page, so the context is resumed opportunistically
// on the very first tap (well before any real alert is likely to fire) --
// on the kiosk itself, which may never get an incidental tap, Chromium is
// instead launched with --autoplay-policy=no-user-gesture-required (see
// deploy/flightradar-kiosk.service) so it isn't blocked there at all.
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
stage.addEventListener('pointerdown', () => { getAudioCtx().resume().catch(() => {}); }, { once: true });

function playAlertSound() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    for (const [freq, start, dur] of [[880, now, 0.14], [1175, now + 0.15, 0.18]]) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    }
  } catch (e) {
    // Web Audio unavailable or still blocked -- the visual alert still shows regardless
  }
}

// Called once per poll (real GPS-derived range, not the eased per-frame
// value) for each tracked aircraft -- mirrors updateApproachTracking's same
// reasoning for why this belongs on the poll, not the render loop.
function checkNearbyAlert(pl, range) {
  if (!pl) return;
  if (range <= ALERT_RADIUS_NM) {
    if (!pl.alerted) {
      pl.alerted = true;
      // The count is a standing record of real proximity events -- kept
      // regardless of whether the interactive popup/sound happen to be
      // toggled on right now, which is a separate, purely presentational
      // concern (see toggleNearbyAlerts).
      recordSighting(pl.hex, 'nearby');
      if (nearbyAlertsOn) {
        showDetailPanel(pl, true);
        playAlertSound();
      }
    }
  } else if (range > ALERT_CLEAR_RADIUS_NM) {
    pl.alerted = false; // free to re-alert if it later comes back around
  }
}

// ---- Route lookup --------------------------------------------------
// Batched/cached/throttled the same way tar1090 itself queries this API:
// collect callsigns as they're seen, flush a batch every ROUTE_BATCH_MS,
// cache results (including negative ones) for the rest of the session so
// we never look up the same callsign twice.
function queueRouteLookup(cs, lat, lng) {
  if (routeCache.has(cs) || routePending.has(cs)) return;
  if (routeQueue.some(e => e.callsign === cs)) return;
  routeQueue.push({ callsign: cs, lat, lng });
  if (!routeTimer) routeTimer = setTimeout(flushRouteQueue, ROUTE_BATCH_MS);
}

async function flushRouteQueue() {
  routeTimer = null;
  if (routeQueue.length === 0) return;
  const batch = routeQueue.splice(0, ROUTE_BATCH_MAX);
  for (const e of batch) routePending.add(e.callsign);

  try {
    const res = await fetch(ROUTE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ planes: batch.map(({ callsign, lat, lng }) => ({ callsign, lat, lng })) }),
    });
    const routes = res.ok ? await res.json() : [];
    const found = new Set();
    for (const route of routes) {
      if (!route || !route.callsign) continue;
      found.add(route.callsign);
      // Still shown when the API flags a route implausible for this
      // flight's current position (e.g. a reused flight number resolving to
      // a stale scheduled route) -- rather than silently hiding it, flag it
      // visibly (see the .route.implausible styling) so it reads as "here's
      // our best guess, don't trust it" instead of a wrong-but-confident
      // city pair.
      // Regional/commuter flight numbers commonly cover more than one leg
      // in a day's rotation (e.g. CLT-GSO-CLT, an out-and-back) -- _airports
      // lists every stop in order, not just an origin/destination pair, and
      // requiring exactly 2 silently dropped every one of these (common
      // enough on regional carriers to be the main reason their flights
      // often showed no route at all). Join every stop instead of just the
      // first/last, since first-to-last alone degenerates to "same city
      // both ends" for a round trip like this one.
      const airports = route._airports;
      routeCache.set(route.callsign, (airports && airports.length >= 2)
        ? { text: airports.map(ap => ap.location).join(' → '), plausible: route.plausible !== false }
        : null);
    }
    for (const e of batch) {
      if (!found.has(e.callsign)) routeCache.set(e.callsign, null);
    }
  } catch (e) {
    // network hiccup — don't cache anything, so these get retried later
  } finally {
    for (const e of batch) routePending.delete(e.callsign);
  }

  if (routeQueue.length > 0) routeTimer = setTimeout(flushRouteQueue, ROUTE_BATCH_MS);
}

// ---- Aircraft type lookup --------------------------------------------------
// ADS-B carries no aircraft type/model info directly. tar1090 (already
// installed alongside readsb on this same box) ships its own local hex ->
// [registration, icaoType, flags, typeLong] database, split into a prefix
// trie of small same-origin files so the browser only fetches what it needs.
// We read that same data ourselves (same-origin static files, not tar1090's
// code) rather than duplicating or fetching a multi-hundred-MB database.
//
// "CIRRUS SR-22" -> "Cirrus SR-22": only re-cases words that are ALL CAPS
// (manufacturer names), leaving model numbers like "SR-22"/"737-800" as-is.
function humanizeType(s) {
  return s.split(' ').map(w => /^[A-Z]+$/.test(w) ? w[0] + w.slice(1).toLowerCase() : w).join(' ');
}

async function discoverDatabaseFolder() {
  try {
    const res = await fetch('/tar1090/index.html', { cache: 'force-cache' });
    const html = await res.text();
    const m = /databaseFolder\s*=\s*"([^"]+)"/.exec(html);
    if (m) databaseFolder = m[1];
  } catch (e) {
    // type lookups just stay disabled; everything else still works
  }
}

// Each entry is [typeLong, typeDescription, wtc] -- typeDescription is the
// ICAO Doc 8643 3-char code (e.g. "L2J" = landplane/2 engines/jet, "H1T" =
// helicopter/1 engine/turbine) and wtc is wake-turbulence category (L/M/H/J).
// Both are used by classifyAircraft() below to pick a blip shape.
async function loadTypeCodeTable() {
  if (!databaseFolder) return;
  try {
    const res = await fetch(`/tar1090/${databaseFolder}/icao_aircraft_types2.js`, { cache: 'force-cache' });
    const data = await res.json();
    for (const code in data) {
      const entry = data[code];
      if (!entry) continue;
      const [typeLong, desc, wtc] = entry;
      typeCodeTable.set(code, { label: typeLong ? humanizeType(typeLong) : null, desc: desc || null, wtc: wtc || null });
    }
  } catch (e) {
    // fine — per-hex typeLong (below) still covers most aircraft on its own
  }
}

function fetchShard(bkey) {
  // cache the in-flight promise itself, not just the resolved value — several
  // aircraft sharing a hex prefix (e.g. all US-registered "A...") otherwise
  // race and each fire their own duplicate fetch for the same shard
  if (shardCache.has(bkey)) return shardCache.get(bkey);
  const promise = (async () => {
    try {
      const res = await fetch(`/tar1090/${databaseFolder}/${bkey}.js`, { cache: 'force-cache' });
      return res.ok ? await res.json() : null;
    } catch (e) {
      return null;
    }
  })();
  shardCache.set(bkey, promise);
  return promise;
}

// Walks the same prefix-trie structure tar1090 stores its hex database in:
// each shard either has the remaining hex suffix as a direct key, or a
// "children" list naming deeper shards to descend into.
async function lookupType(hex) {
  const empty = { type: null, reg: null, desc: null, wtc: null };
  if (hexTypeCache.has(hex)) return hexTypeCache.get(hex);
  if (!databaseFolder || hexTypePending.has(hex)) return empty;
  hexTypePending.add(hex);

  const icao = hex.toUpperCase();
  let level = 1, entry = null;
  while (level <= icao.length) {
    const bkey = icao.substring(0, level);
    const data = await fetchShard(bkey);
    if (!data) break;
    const dkey = icao.substring(level);
    if (dkey in data) { entry = data[dkey]; break; }
    if (data.children && data.children.includes(bkey + dkey[0])) { level++; continue; }
    break;
  }

  let result = empty;
  if (entry) {
    const [reg, typeCode, , typeLong] = entry;
    const meta = typeCode ? typeCodeTable.get(typeCode.toUpperCase()) : null;
    let type = null;
    if (typeLong) type = humanizeType(typeLong);
    else if (meta) type = meta.label;
    result = { type, reg: reg || null, desc: meta ? meta.desc : null, wtc: meta ? meta.wtc : null };
  }

  hexTypeCache.set(hex, result);
  hexTypePending.delete(hex);
  return result;
}

// ---- Data loading --------------------------------------------------
async function loadHome() {
  if (HOME_OVERRIDE) {
    home = HOME_OVERRIDE;
    locEl.textContent = formatLoc();
    initMap();
    return;
  }
  try {
    const res = await fetch(RECEIVER_URL, { cache: 'no-store' });
    const data = await res.json();
    if (typeof data.lat === 'number' && typeof data.lon === 'number') {
      home = { lat: data.lat, lon: data.lon };
      locEl.textContent = formatLoc();
      initMap();
    }
  } catch (e) {
    // retried by caller
  }
}

function normalizeAircraft(a) {
  // range/bearing: prefer readsb's precomputed r_dst/r_dir, else derive from
  // lat/lon — but never trust r_dst/r_dir when HOME_OVERRIDE is active, since
  // those are computed by readsb relative to the real antenna position, not
  // whatever point we're displaying as home
  let bearing, range;
  if (!HOME_OVERRIDE && typeof a.r_dst === 'number' && typeof a.r_dir === 'number') {
    range = a.r_dst;
    bearing = a.r_dir;
  } else if (home && typeof a.lat === 'number' && typeof a.lon === 'number') {
    const hb = haversineBearingRange(home.lat, home.lon, a.lat, a.lon);
    bearing = hb.bearing;
    range = hb.range;
  } else {
    return null; // no usable position yet
  }

  const altRaw = a.alt_baro ?? a.alt_geom;
  const alt = altRaw === 'ground' ? 'ground' : (typeof altRaw === 'number' ? altRaw : null);
  const realHdg = a.track ?? a.true_heading ?? a.mag_heading ?? a.calc_track ?? null;
  const hdg = realHdg ?? bearing; // blip rotation falls back to bearing; detail panel shows realHdg only
  // readsb decodes a contact's identity (flight) squitter separately from
  // (and slower than) its position -- a freshly-acquired plane commonly has
  // real lat/lon for several polls before `flight` shows up at all. Falling
  // back to the hex as `cs` in that gap is fine as a display placeholder
  // (it's literally what tar1090 does too), but badging that gap "Private
  // Aircraft" is actively wrong, not just uninformative -- it's a real
  // confirmed-scheduled-carrier flight whose callsign we just haven't seen
  // yet (self-corrects to the real badge within a poll or two once it
  // arrives, no special handling needed there). Track hasCallsign so the two
  // "no airline" cases -- genuinely unknown yet vs. a real GA tail number
  // that will never match -- don't get conflated under one label.
  const hasCallsign = !!(a.flight && a.flight.trim());
  const cs = hasCallsign ? a.flight.trim() : a.hex.toUpperCase();

  // scheduled/charter flights are 3 letters + a number (e.g. DAL1234); GA tail
  // numbers (N1182D) correctly don't match and get labeled "Private Aircraft"
  const airlineMatch = hasCallsign ? /^([A-Z]{3})\d/.exec(cs) : null;
  const airlineIcao = airlineMatch ? airlineMatch[1] : null;
  const airline = airlineIcao ? (AIRLINES[airlineIcao] || null) : null;
  const airlineLabel = airline ? airline.name : (hasCallsign ? PRIVATE_LABEL : ACQUIRING_LABEL);
  const badgeColor = airline ? airline.color : (hasCallsign ? PRIVATE_COLOR : ACQUIRING_COLOR);

  return {
    hex: a.hex, cs, hasCallsign, bearing, range, alt, hdg, realHdg, speed: a.gs ?? null,
    lat: typeof a.lat === 'number' ? a.lat : null,
    lon: typeof a.lon === 'number' ? a.lon : null,
    squawk: a.squawk ?? null,
    vrate: a.baro_rate ?? a.geom_rate ?? null,
    category: a.category ?? null,
    airlineIcao, airlineLabel, badgeColor,
  };
}

async function fetchAircraft() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastGoodFetch = performance.now();
    connected = true;
    applyUpdate(data.aircraft || []);
  } catch (e) {
    connected = false;
  }
}

function applyUpdate(list) {
  const now = performance.now();
  const seen = new Set();

  for (const raw of list) {
    const n = normalizeAircraft(raw);
    if (!n) continue;
    seen.add(n.hex);

    const existing = planes.get(n.hex);
    if (existing) {
      existing.targetBearing = n.bearing;
      existing.targetRange = n.range;
      existing.cs = n.cs;
      existing.alt = n.alt;
      existing.hdg = n.hdg;
      existing.speed = n.speed;
      existing.lat = n.lat;
      existing.lon = n.lon;
      existing.airlineIcao = n.airlineIcao;
      existing.airlineLabel = n.airlineLabel;
      existing.badgeColor = n.badgeColor;
      existing.realHdg = n.realHdg;
      existing.squawk = n.squawk;
      existing.vrate = n.vrate;
      existing.category = n.category;
      existing.lastSeen = now;
      existing.trail.push({ bearing: n.bearing, range: n.range, t: now });
      pruneTrail(existing.trail, now);
    } else {
      planes.set(n.hex, {
        ...n,
        targetBearing: n.bearing,
        targetRange: n.range,
        typeLabel: null,
        registration: null,
        typeDesc: null,
        wtc: null,
        lastSeen: now,
        trail: [{ bearing: n.bearing, range: n.range, t: now }],
      });
      recordSighting(n.hex, 'total'); // a genuinely new visit, not just still-in-view -- see "Sighting counts" above
    }

    if (!hexTypeCache.has(n.hex)) {
      lookupType(n.hex).then(info => {
        const pl = planes.get(n.hex);
        if (pl) { pl.typeLabel = info.type; pl.registration = info.reg; pl.typeDesc = info.desc; pl.wtc = info.wtc; }
      });
    }

    // Try for every real callsign, not just ones that look like a scheduled
    // airline flight number -- on-demand/charter GA traffic (badged "Private
    // Aircraft") occasionally does have a route adsb.im can resolve, and
    // there's no harm in asking; a miss just caches null same as today. Only
    // truly skipped when there's no real callsign yet at all (n.cs is the
    // hex fallback -- see hasCallsign in normalizeAircraft), since querying
    // a hex code as if it were a flight number can't return anything.
    if (n.hasCallsign) {
      queueRouteLookup(n.cs, n.lat ?? home?.lat ?? 0, n.lon ?? home?.lon ?? 0);
    }

    updateApproachTracking(planes.get(n.hex), n.lat, n.lon, n.alt);
    checkNearbyAlert(planes.get(n.hex), n.range);
  }

  // aircraft readsb no longer reports aren't dropped immediately -- they
  // coast (see COAST_TOTAL_MS) at their last known position/heading, fading
  // out in drawPlanes, and are only removed once that grace period elapses
  for (const hex of [...planes.keys()]) {
    if (seen.has(hex)) continue;
    const pl = planes.get(hex);
    if (now - pl.lastSeen > COAST_TOTAL_MS) {
      confirmApproachOnDrop(pl); // catches signal loss right at touchdown, before readsb ever reports 'ground'
      planes.delete(hex);
    }
  }
}

// ---- Drawing ---------------------------------------------------
function drawRings() {
  ctx.save();
  for (let i = 1; i <= RINGS; i++) {
    const r = (R / RINGS) * i;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = i === RINGS ? '#2a4a4f' : '#1c3236';
    ctx.lineWidth = 1;
    ctx.stroke();

    const nm = Math.round((RANGE_NM / RINGS) * i);
    ctx.fillStyle = '#3d5a5f';
    ctx.font = '15px JetBrains Mono, monospace';
    ctx.fillText(nm + 'nm', CX + 6, CY - r + 14);
  }

  ctx.strokeStyle = '#16282b';
  ctx.beginPath();
  ctx.moveTo(CX, CY - R); ctx.lineTo(CX, CY + R);
  ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY);
  ctx.stroke();

  ctx.fillStyle = '#4a6b70';
  ctx.font = '600 20px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', CX, CY - R + 26);
  ctx.fillText('S', CX, CY + R - 12);
  ctx.fillText('E', CX + R - 16, CY + 7);
  ctx.fillText('W', CX - R + 16, CY + 7);
  ctx.textAlign = 'left';

  ctx.beginPath();
  ctx.arc(CX, CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ffb020';
  ctx.fill();

  ctx.restore();
}

// Drawn for every in-range aircraft, every frame, underneath that frame's
// fresh blips/labels. Reuses each poll's already-computed bearing/range
// (pushed onto p.trail in applyUpdate) rather than raw lat/lon, so a replayed
// point lands exactly where that plane's blip actually was at the time --
// consistent with HOME_OVERRIDE's effect on live positions too.
function drawTrails() {
  const now = performance.now();
  ctx.save();
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (const p of planes.values()) {
    if (p.range > RANGE_NM) continue; // matches drawPlanes' own in-range filter -- no point trailing a blip that isn't drawn
    if (!p.trail || p.trail.length < 2) continue;
    ctx.strokeStyle = p.color || '#cfe8ea';
    for (let i = 1; i < p.trail.length; i++) {
      const a = p.trail[i - 1], b = p.trail[i];
      const pa = polarToXY(a.bearing, a.range);
      const pb = polarToXY(b.bearing, b.range);
      ctx.globalAlpha = Math.max(0, 1 - (now - b.t) / TRAIL_MAX_MS) * 0.85;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSweep() {
  ctx.save();
  const grad = ctx.createConicGradient(sweepAngle - Math.PI / 2, CX, CY);
  grad.addColorStop(0, 'rgba(255,176,32,0.35)');
  grad.addColorStop(0.06, 'rgba(255,176,32,0.0)');
  grad.addColorStop(1, 'rgba(255,176,32,0.0)');
  ctx.beginPath();
  ctx.arc(CX, CY, SWEEP_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  const lineX = CX + SWEEP_RADIUS * Math.cos(sweepAngle);
  const lineY = CY + SWEEP_RADIUS * Math.sin(sweepAngle);
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(lineX, lineY);
  ctx.strokeStyle = '#ffb020';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ffb020';
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.restore();
}

function altLabel(alt) {
  if (alt === 'ground') return 'GND';
  if (alt === null) return '----';
  return 'FL' + Math.round(alt / 100);
}

function drawPlanes(dt) {
  const stageRect = stage.getBoundingClientRect();
  const scale = stageRect.width / W;
  const inRange = [];
  const now = performance.now();

  // exponential chase toward the latest fix — never fully "arrives," so motion
  // stays continuous instead of visibly settling then pausing between polls
  const alpha = 1 - Math.exp(-dt / SMOOTH_TAU);
  const springAlpha = 1 - Math.exp(-dt / LABEL_SPRING_TAU);

  // --- pass 1: advance motion, draw blips, update each tag's content -----
  // (content must be finalized before we measure box sizes in pass 2)
  for (const p of planes.values()) {
    p.bearing += bearingDelta(p.bearing, p.targetBearing) * alpha;
    p.bearing = ((p.bearing % 360) + 360) % 360; // keep in [0,360) -- pure accumulation would otherwise drift arbitrarily far past it over a long-lived contact (e.g. a tight holding pattern), same issue labelAngle already guards against below
    p.range += (p.targetRange - p.range) * alpha;

    if (p.range > RANGE_NM) continue;
    inRange.push(p);

    // signal lost this poll (or several) -> hold position and fade rather
    // than vanishing outright; see COAST_TOTAL_MS
    const coastAge = now - p.lastSeen;
    p.opacity = coastAge <= COAST_FRESH_MS ? 1 : Math.max(0, 1 - (coastAge - COAST_FRESH_MS) / COAST_FADE_MS);

    const { x, y } = polarToXY(p.bearing, p.range);
    const color = flightPhaseColor(p) || altColor(p.alt);
    p.anchorX = x * scale;
    p.anchorY = y * scale;
    p.color = color;

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(x, y);
    ctx.rotate((p.hdg) * Math.PI / 180);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    drawBlipShape(classifyAircraft(p));
    ctx.restore();

    let node = tagNodes.get(p.hex);
    if (!node) {
      node = document.createElement('div');
      node.className = 'tag';
      node.innerHTML = '<div class="cs"></div><div class="badge"></div><div class="seen"></div><div class="type"></div><div class="alt"></div><div class="route"></div>';
      tagsEl.appendChild(node);
      tagNodes.set(p.hex, node);
    }
    node.style.borderLeft = `2px solid ${color}`;
    node.querySelector('.cs').textContent = p.cs;
    node.querySelector('.cs').style.color = color;
    const speedTxt = p.speed === null ? '--' : Math.round(p.speed);
    node.querySelector('.alt').textContent = `${altLabel(p.alt)} · ${speedTxt}kt`;

    const badgeEl = node.querySelector('.badge');
    badgeEl.textContent = p.airlineLabel;
    badgeEl.style.background = p.badgeColor;
    badgeEl.style.display = 'inline-block';

    // Only shown once it's actually a signal worth noticing ("you've seen
    // this one before") -- every first-time sighting showing "×1" would
    // just be noise on every label, every time, which is exactly the kind
    // of label clutter this app has repeatedly tried to avoid elsewhere.
    const seenEl = node.querySelector('.seen');
    const counts = sightingCounts.get(p.hex);
    if (counts && counts.total > 1) {
      seenEl.textContent = `SEEN ×${counts.total}`;
      seenEl.style.display = 'block';
    } else {
      seenEl.style.display = 'none';
    }

    const typeEl = node.querySelector('.type');
    if (p.typeLabel) {
      typeEl.textContent = p.typeLabel;
      typeEl.style.display = 'block';
    } else {
      typeEl.style.display = 'none';
    }

    const routeEl = node.querySelector('.route');
    const route = routeCache.get(p.cs);
    if (route) {
      routeEl.textContent = route.plausible ? route.text : `${route.text} (unconfirmed)`;
      routeEl.classList.toggle('implausible', !route.plausible);
      routeEl.style.display = 'block';
    } else {
      routeEl.style.display = 'none';
    }

    p.node = node;
  }

  // --- pass 2: measure boxes, ease each toward its natural ring angle ------
  for (const p of inRange) {
    const rect = p.node.getBoundingClientRect();
    p.labelW = rect.width;
    p.labelH = rect.height;

    const desiredAngle = p.bearing; // natural ring position matches bearing exactly
    if (p.labelAngle === undefined) {
      p.labelAngle = desiredAngle;
    } else {
      p.labelAngle += bearingDelta(p.labelAngle, desiredAngle) * springAlpha;
      p.labelAngle = ((p.labelAngle % 360) + 360) % 360;
    }
  }

  // --- pass 3: push apart along the ring, preserving bearing order ---------
  // Only ever adjusting a label's ANGLE (never pulling it off the ring), and
  // only ever swapping pushes between bearing-adjacent neighbors, is what
  // guarantees leader lines never cross — see the comment on LABEL_RING_RADIUS.
  const sorted = inRange.slice().sort((a, b) => a.bearing - b.bearing);
  const n = sorted.length;
  for (let pass = 0; pass < LABEL_SEPARATION_PASSES; pass++) {
    for (let i = 0; i < n; i++) {
      const a = sorted[i];
      const b = sorted[(i + 1) % n];
      if (a === b) continue;

      const wrap = i === n - 1;
      const aAngle = a.labelAngle;
      const bAngle = wrap ? b.labelAngle + 360 : b.labelAngle;

      const aPt = ringPointForAngle(aAngle, scale);
      const bPt = ringPointForAngle(bAngle, scale);
      const aBox = { x: aPt.x - a.labelW / 2, y: aPt.y - a.labelH / 2, w: a.labelW, h: a.labelH };
      const bBox = { x: bPt.x - b.labelW / 2, y: bPt.y - b.labelH / 2, w: b.labelW, h: b.labelH };

      const overlapX = Math.min(aBox.x + aBox.w, bBox.x + bBox.w) - Math.max(aBox.x, bBox.x) + LABEL_MARGIN;
      const overlapY = Math.min(aBox.y + aBox.h, bBox.y + bBox.h) - Math.max(aBox.y, bBox.y) + LABEL_MARGIN;
      if (overlapX <= 0 || overlapY <= 0) continue;

      // push direction is never ambiguous here (a always precedes b in
      // sorted bearing order), so unlike a free-floating 2D layout there's
      // no need for a tie-break — just the measured overlap, which is
      // always genuinely positive at this point (the guard above already
      // filtered out non-overlapping pairs)
      const push = Math.min(overlapX, overlapY) / 2;
      const angleDelta = (push / (LABEL_RING_RADIUS * scale)) * 180 / Math.PI;

      a.labelAngle = ((a.labelAngle - angleDelta) % 360 + 360) % 360;
      b.labelAngle = ((b.labelAngle + angleDelta) % 360 + 360) % 360;
    }
  }

  // --- pass 4: place labels, draw a leader line back to each plane ---------
  // The HUD (location + aircraft count) sits centered near the top of the
  // stage -- close enough to a due-north label's natural ring position that
  // the two can overlap. Computed once per frame (the HUD doesn't move) and
  // used below to nudge any label that would land underneath it.
  const hudBox = hudEl.getBoundingClientRect();
  const hudLeft = hudBox.left - stageRect.left - LABEL_MARGIN;
  const hudRight = hudBox.right - stageRect.left + LABEL_MARGIN;
  const hudBottom = hudBox.bottom - stageRect.top + LABEL_MARGIN;

  const cxScaled = CX * scale, cyScaled = CY * scale, boundRadiusScaled = LABEL_BOUND_RADIUS * scale;
  for (const p of inRange) {
    const ringPt = ringPointForAngle(p.labelAngle, scale);
    let cxBox = ringPt.x, cyBox = ringPt.y; // box center
    const hw = p.labelW / 2, hh = p.labelH / 2;

    // Pull the box's center radially inward, if needed, so every corner
    // stays inside the visible circle -- a few iterations converge because
    // moving the center closer to CX,CY shrinks all four corner distances.
    for (let iter = 0; iter < 4; iter++) {
      let maxDist = 0;
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          const d = Math.hypot(cxBox + sx * hw - cxScaled, cyBox + sy * hh - cyScaled);
          if (d > maxDist) maxDist = d;
        }
      }
      if (maxDist <= boundRadiusScaled) break;
      const s = boundRadiusScaled / maxDist;
      cxBox = cxScaled + (cxBox - cxScaled) * s;
      cyBox = cyScaled + (cyBox - cyScaled) * s;
    }

    let lx = cxBox - hw;
    let ly = cyBox - hh;
    // final defensive clamp against the square stage bounds themselves
    lx = Math.max(2, Math.min(stageRect.width - p.labelW - 2, lx));
    ly = Math.max(2, Math.min(stageRect.height - p.labelH - 2, ly));

    // clear the HUD text block rather than sit underneath it -- only
    // triggers for labels whose ring position lands near due north
    if (ly < hudBottom && lx < hudRight && lx + p.labelW > hudLeft) {

let fleetState = null;   // /onboard/fleet: { available, fleet: { name } | null }

async function loadDeviceStatus() {
  try { deviceStatus = await deviceApi('/onboard'); }
  catch (e) { deviceStatus = null; }
  try { fleetState = await deviceApi('/onboard/fleet'); }
  catch (e) { fleetState = null; }
}

async function handleDeviceTap(row) {
  const { dev, act, wifi, airport, tz, addr } = row.dataset;
  deviceMsg = '';

  if (addr !== undefined && addr !== null && addr !== '') {
    const m = addrRows[Number(addr)];
    if (!m) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/location', { method: 'POST',
        body: JSON.stringify({ lat: m.lat, lon: m.lon }) });
      deviceMsg = `Location set to ${m.lat.toFixed(4)}, ${m.lon.toFixed(4)}.`;
      deviceView = null;
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (tz) {
    deviceBusy = true; renderSettingsPanel();
    try {
      // The WiFi regulatory region is set from the same country as the
      // timezone, so a recipient never has to know what a regulatory domain
      // is -- getting it wrong is a radio-compliance problem, not a
      // preference.
      const cc = (AIRPORT.country || '').toUpperCase();
      const r = await deviceApi('/onboard/locale', { method: 'POST',
        body: JSON.stringify({ timezone: tz, country: cc || undefined }) });
      tzCurrent = tz;
      // Only when the region actually changed -- re-saving the same one must
      // not send anyone to restart a device that is working.
      rebootPending = !!(r && r.result && r.result.appliesAfterReboot);
      deviceMsg = `Time zone set to ${tz}.` +
        (rebootPending ? ` WiFi region ${cc} is stored but only applies after a restart.` : '');
      deviceView = null;
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (dev) { deviceView = dev; wifiNets = []; airportRows = []; return renderSettingsPanel(); }

  if (act === 'set-name') {
    const cur = deviceStatus && deviceStatus.nameIsOwn ? deviceStatus.name : '';
    const v = await openKeyboard('NAME FOR THIS RADAR  (empty = from the home airport)', cur);
    if (v === null) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      const r = await deviceApi('/onboard/name', { method: 'POST', body: JSON.stringify({ name: v }) });
      radarName = (r && r.result && r.result.name) || radarName;
      deviceMsg = `Named ${radarName}. Paired phones pick it up next time they're home.`;
      await loadDeviceStatus();
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'set-password') {
    const pw = await openKeyboard('NEW ADMIN PASSWORD  (8+ characters)', '', { secret: true });
    if (pw === null) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/password', { method: 'POST',
        body: JSON.stringify({ password: pw }) });
      deviceMsg = 'Password set. Setup is complete.';
      await loadDeviceStatus();
      refreshOnboarding();     // dismisses the first-run screen
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'wifi-scan') {
    deviceBusy = true; renderSettingsPanel();
    try { wifiNets = (await deviceApi('/onboard/wifi/scan', { method: 'POST' })).result || []; }
    catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (wifi) {
    const psk = await openKeyboard(`PASSWORD FOR ${wifi}`, '', { secret: true });
    if (psk === null) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/wifi/connect', { method: 'POST',
        body: JSON.stringify({ ssid: wifi, psk }) });
      deviceMsg = `Connected to ${wifi}.`;
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'set-timezone' || act === 'tz-all') {
    deviceBusy = true; deviceView = 'timezone'; renderSettingsPanel();
    try {
      // Seeded from the configured airport's country, so the list is the one
      // or two zones that country uses rather than all 485.
      const cc = act === 'tz-all' ? '' : (AIRPORT.country || '');
      const res = await deviceApi('/onboard/locale?country=' + encodeURIComponent(cc)) || {};
      tzCurrent = res.current?.timezone || '';
      tzRows = (act === 'tz-all' || !(res.forCountry || []).length)
        ? (res.all || []) : res.forCountry;
      deviceMsg = '';
    } catch (e) { deviceMsg = e.message; tzRows = []; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'ota') {
    const st = otaState || {};
    if (st.state === 'applying') return;
    // An available update is installed only on a second, explicit tap. The
    // first tap checks. Nothing installs itself.
    if (st.state === 'checked' && st.update_available) {
      deviceBusy = true; deviceMsg = ''; renderSettingsPanel();
      try {
        await deviceApi('/onboard/ota', { method: 'POST',
          body: JSON.stringify({ action: 'apply' }) });
        deviceMsg = 'Installing. The screen will restart; if the new version '
                  + 'does not come up, the old one is put back automatically.';
        await loadOtaStatus();
        startOtaPolling();
      } catch (e) { deviceMsg = e.message; }
      deviceBusy = false; return renderSettingsPanel();
    }
    deviceBusy = true; deviceMsg = ''; renderSettingsPanel();
    try {
      await deviceApi('/onboard/ota', { method: 'POST',
        body: JSON.stringify({ action: 'check' }) });
      await loadOtaStatus();
      deviceMsg = (otaState && otaState.update_available)
        ? '' : 'No newer version found.';
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'reboot-for-region') {
    deviceBusy = true; deviceMsg = ''; renderSettingsPanel();
    try {
      await deviceApi('/onboard/reboot', { method: 'POST',
        body: JSON.stringify({ confirm: 'REBOOT' }) });
      deviceBusy = false;
      rebootPending = false;
      deviceMsg = 'Restarting… this screen will go dark shortly.';
      return renderSettingsPanel();
    } catch (e) {
      deviceBusy = false; deviceMsg = e.message; return renderSettingsPanel();
    }
  }

  if (act === 'set-address') {
    // Address first here too. The lookup runs on the device, so it works from
    // the touchscreen with no phone involved at all.
    const q = await openKeyboard('ADDRESS  (street, town, country)', '');
    if (q === null || q.trim().length < 3) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      const r = await deviceApi('/onboard/geocode?q=' + encodeURIComponent(q.trim()));
      addrRows = (r && r.results) || [];
      deviceMsg = addrRows.length ? '' : 'No match. Try adding the town and country.';
      deviceView = 'address';
    } catch (e) { deviceMsg = e.message; addrRows = []; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'set-location') {
    // The numeric layout carries a minus key, so the sign can simply be
    // typed. It used to be guessed instead -- latitude forced positive and
    // longitude forced negative, because every unit was assumed to be in the
    // continental US. That put a receiver in the Netherlands (4.49E) into the
    // Atlantic and made the southern hemisphere unreachable.
    const latS = await openKeyboard('LATITUDE  (minus for south, e.g. 35.8776)', '', { mode: 'num' });
    if (latS === null) return;
    const lonS = await openKeyboard('LONGITUDE  (minus for west, e.g. -78.7875)', '', { mode: 'num' });
    if (lonS === null) return;
    const lat = parseFloat(latS), lon = parseFloat(lonS);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)
        || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
      deviceMsg = 'Latitude must be 0-90, longitude 0-180.';
      return renderSettingsPanel();
    }
    if (lat === 0 && lon === 0) {
      deviceMsg = '0, 0 is in the Gulf of Guinea - check the numbers.';
      return renderSettingsPanel();
    }
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/location', { method: 'POST',
        body: JSON.stringify({ lat, lon }) });
      deviceMsg = `Location set to ${lat.toFixed(4)}, ${lon.toFixed(4)}.`;
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'airport-search') {
    const q = await openKeyboard('SEARCH AIRPORTS', '');
    if (q === null || q.trim().length < 2) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      airportRows = (await deviceApi('/onboard/airports?q=' +
        encodeURIComponent(q.trim()))).airports || [];
      if (!airportRows.length) deviceMsg = 'No airports matched.';
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (airport) {
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/airport', { method: 'POST',
        body: JSON.stringify({ code: airport }) });
      await loadAirportConfig();           // pick the change up immediately
      deviceMsg = `Home airport set to ${airport}.`;
      airportRows = [];
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'hotspot-toggle') {
    const on = !((deviceStatus && deviceStatus.hotspot) || {}).active;
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/hotspot', { method: 'POST',
        body: JSON.stringify({ on }) });
      await loadDeviceStatus();
      const h = (deviceStatus && deviceStatus.hotspot) || {};
      deviceMsg = on
        ? `Setup network on. Join "${h.ssid}" (password ${h.psk}) and open http://${h.address || '10.42.0.1'}/setup`
        : 'Setup network off.';
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'remote-start') {
    const name = await openKeyboard('NAME FOR THIS RADAR  (letters, digits, -)', 'stratoscan');
    if (name === null) return;
    deviceBusy = true; renderSettingsPanel();
    try {
      const r = await deviceApi('/onboard/remote/start', { method: 'POST',
        body: JSON.stringify({ hostname: name.trim().toLowerCase() }) });
      deviceStatus = deviceStatus || {};
      deviceStatus.remote = { ...(deviceStatus.remote || {}),
                              loginUrl: r.result.url, state: r.result.state };
      if (!r.result.url) deviceMsg = 'Already connected.';
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'remote-check') {
    deviceBusy = true; renderSettingsPanel();
    try {
      const r = await deviceApi('/onboard/remote/status', { method: 'POST' });
      deviceStatus.remote = { state: r.result.state,
                              magicDnsName: r.result.magicDnsName,
                              loginUrl: r.result.url };
      if (r.result.state !== 'Running') deviceMsg = 'Not signed in yet — try again in a moment.';
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'remote-funnel-on' || act === 'remote-funnel-off') {
    const on = act.endsWith('-on');
    deviceBusy = true; renderSettingsPanel();
    try {
      const r = await deviceApi('/onboard/remote/funnel', { method: 'POST',
        body: JSON.stringify({ enabled: on }) });
      deviceStatus.remote = { ...(deviceStatus.remote || {}),
                              publicUrl: r.result.publicUrl };
      deviceMsg = on ? 'Published.' : 'Public page turned off.';
    } catch (e) { deviceMsg = e.message; }
    deviceBusy = false; return renderSettingsPanel();
  }

  if (act === 'reboot-confirm') {
    // A second tap is enough here, unlike the typed word reset demands: this
    // is recoverable, and making a routine restart feel dangerous would push
    // people back toward pulling the plug, which is not.
    deviceBusy = true; deviceMsg = ''; renderSettingsPanel();
    try {
      await deviceApi('/onboard/reboot', { method: 'POST',
        body: JSON.stringify({ confirm: 'REBOOT' }) });
      deviceBusy = false;
      deviceMsg = 'Restarting… this screen will go dark shortly.';
      renderSettingsPanel();
    } catch (e) {
      // A reboot can tear the socket down before the reply is written, which
      // surfaces as a fetch failure even though the command was accepted.
      // Reporting that as an error would be misleading, so say what is
      // actually known and let the screen going dark be the confirmation.
      deviceBusy = false;
      deviceMsg = 'Restart requested. If the screen does not go dark within a minute, try again.';
      renderSettingsPanel();
    }
  }

  if (act === 'reset-confirm') {
    // Typed confirmation, not a second tap: this wipes the owner's WiFi,
    // password and location, and a stray touch must never reach it.
    const word = await openKeyboard('TYPE  ERASE  TO CONFIRM', '', { mode: 'upper' });
    if (word === null) return;
    if (word.trim().toUpperCase() !== 'ERASE') {
      deviceMsg = 'Not erased — the word did not match.';
      return renderSettingsPanel();
    }
    deviceBusy = true; renderSettingsPanel();
    try {
      await deviceApi('/onboard/reset', { method: 'POST',
        body: JSON.stringify({ confirm: 'ERASE' }) });
      hideSettingsPanel();
      refreshOnboarding();                 // the setup screen takes over
    } catch (e) { deviceMsg = e.message; deviceBusy = false; renderSettingsPanel(); }
  }
}

// The logo markup, written into the start-up screen by assets/brand/make.py.
const BRAND_LOGO = (document.querySelector('#splash .ss-logo') || {}).outerHTML || '';

function renderSettingsMenu() {
  settingsPanelEl.innerHTML = `
    <div class="sp-close">&times;</div>
    <div class="sp-brand">${BRAND_LOGO}</div>
    <div class="sp-title">Settings</div>
    ${radarName ? `<div class="sp-sub" style="padding:0 0 8px">${esc(radarName)}</div>` : ''}
    ${SETTINGS_GROUPS.map(({ key, label, sub }) => `
      <div class="sp-menu-row" data-group="${key}">
        <div>
          <div class="sp-label">${esc(label)}</div>
          <div class="sp-sub">${esc(sub)}</div>
        </div>
        <div class="sp-chevron">&#8250;</div>
      </div>
    `).join('')}
      <div class="sp-sub" style="padding:16px 0 4px;opacity:.65;font-size:.72rem;line-height:1.5">StratoScan™ and the
      StratoScan logo are trademarks of Michael Ferris. © 2026 Michael Ferris. Open source under the MIT licence.
      Visits to this page are counted for its owner: counts only, with no cookies and nothing that identifies you.</div>
  `;
}

function showSettingsPanel() {
  // Only one panel may be open at a time. Tapping the gear while a plane's
  // detail panel was up left BOTH open: settings rendered on top, and
  // dismissing it revealed the stale detail panel underneath, so it looked
  // like the gear "kept bringing up the same plane details". The gear's own
  // stopPropagation meant the stage handler never got to close it either.
  hideDetailPanel();
  settingsSection = null; // always open at the top level
  deviceView = null; deviceMsg = ''; deviceBusy = false;
  statsView = null;
  renderSettingsPanel();
  settingsPanelEl.classList.add('show');
  settingsBackdropEl.classList.add('show');
}

function hideSettingsPanel() {
  settingsPanelEl.classList.remove('show');
  settingsBackdropEl.classList.remove('show');
  stopPhonePolling();
  rewindSelected = null;
}

// Tapping a row toggles that setting without closing the panel (stops the
// tap from bubbling to the stage's own pointerup handler below, which would
// otherwise treat it as "tap anywhere while the panel's open -> close it").
// The panel scrolls by dragging anywhere on it, so a press on a row must NOT
// be treated as a choice: dragging used to end in a pointerup on whatever row
// happened to be under your finger, flipping that setting every time you tried
// to scroll. Two guards now: the press has to land on an actual control (the
// switch or the theme radio -- both given generous invisible hit areas in the
// CSS above), and it has to be a tap rather than a drag.
const PANEL_DRAG_SLOP_PX = 8; // a real tap wanders a few px; a scroll goes much further
let settingsPointerStart = null;

// Drag-to-scroll, done in JS rather than left to the browser.
//
// Relying on native touch panning was not enough on the kiosk: dragging
// across the option text did nothing and the only thing that actually
// scrolled the list was the scrollbar itself, which is a few pixels wide and
// easy to miss -- missing it lands on the backdrop and shuts the panel. So
// the panel now follows the finger directly: grab anywhere and slide, exactly
// as if you had hold of the scrollbar.
//
// Deliberately no setPointerCapture here: capturing retargets subsequent
// events to the panel, which would break the `e.target.closest('.sp-switch')`
// checks that decide whether a press was on a control.
function attachDragScroll(el, getStart) {
  el.addEventListener('pointermove', (e) => {
    // `start` is set on pointerdown and cleared on pointerup/cancel, so its
    // presence alone means a drag is under way. Deliberately NOT gating on
    // e.buttons: that is not reliably populated for touch pointers, and on a
    // touch-only kiosk it would silently disable this whole feature.
    const start = getStart();
    if (!start) return;
    const dy = e.clientY - start.y;
    if (Math.abs(dy) <= PANEL_DRAG_SLOP_PX) return; // still within tap tolerance
    el.scrollTop = start.scrollTop - dy;
  });
}

attachDragScroll(settingsPanelEl, () => settingsPointerStart);

// The detail panel scrolls the same way. It differs from the settings panel
// in that a TAP anywhere on it is a legitimate dismiss gesture (and always
// has been -- that's how the close button works, by bubbling to the stage
// handler), so the only thing to suppress here is the drag: without this,
// scrolling a long panel ended in a pointerup that reached the stage and
// closed the panel mid-scroll.
let detailPointerStart = null;

detailPanelEl.addEventListener('pointerdown', (e) => {
  detailPointerStart = { x: e.clientX, y: e.clientY, scrollTop: detailPanelEl.scrollTop };
});

detailPanelEl.addEventListener('pointercancel', () => { detailPointerStart = null; });

attachDragScroll(detailPanelEl, () => detailPointerStart);

detailPanelEl.addEventListener('pointerup', (e) => {
  const start = detailPointerStart;
  detailPointerStart = null;
  if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > PANEL_DRAG_SLOP_PX) {
    e.stopPropagation(); // that was a scroll -- leave the panel open
  }
  // a genuine tap falls through to the stage handler, which dismisses
});

settingsPanelEl.addEventListener('pointerdown', (e) => {
  // The range input owns its own drag entirely. Without this exemption the
  // panel's manual scroll-by-touch (below) still runs -- pointer capture only
  // changes hit-testing, the pointermove still bubbles here -- and a real
  // finger rarely drags perfectly horizontally, so a small vertical wobble
  // while sliding the volume thumb would ALSO scroll the settings list at
  // the same time. Same category as the switch/radio/swatch already being
  // exempt from "row body is for scrolling", just for a control that needs
  // its native drag left alone rather than a tap distinguished from a drag.
  if (e.target.closest('input[type=range]')) { settingsPointerStart = null; return; }
  settingsPointerStart = { x: e.clientX, y: e.clientY, scrollTop: settingsPanelEl.scrollTop };
});

settingsPanelEl.addEventListener('pointercancel', () => { settingsPointerStart = null; });

// Delegated onto the panel rather than attached to the slider element
// directly. renderSettingsPanel() rebuilds the panel's whole innerHTML on
// every OTHER settings change too -- muting, switching sound themes, opening
// a different section and coming back -- each of which throws away and
// recreates the slider element. A directly-attached listener would need to
// be re-attached after every one of those; a listener on the stable panel
// element never needs to be.
let volumeDebounce = null;
settingsPanelEl.addEventListener('input', (e) => {
  if (e.target.id !== 'volumeSlider') return;
  // Live while dragging: the gain node updates every tick so the setting is
  // never stale, and the on-screen percentage tracks the thumb. What does NOT
  // happen on every tick is a sound or a write to storage -- see 'change'
  // below -- a slider fires 'input' dozens of times over one drag, and doing
  // either of those that often would be a alert-sound machine gun and a
  // localStorage write storm for a single gesture.
  alertSettings.volume = parseFloat(e.target.value);
  alertSettings.muted = false;
  applyVolume();
  const valueEl = settingsPanelEl.querySelector('.sp-slider-value');
  if (valueEl) valueEl.textContent = `${Math.round(alertSettings.volume * 100)}%`;
  clearTimeout(volumeDebounce);
  volumeDebounce = setTimeout(() => { saveAlertSettings(); }, 400);
});
settingsPanelEl.addEventListener('change', (e) => {
  if (e.target.id !== 'volumeSlider') return;
  // Fires once, when the drag actually ends (Chromium-only kiosk, so this is
  // reliable rather than a cross-browser guess). This is the confirmation
  // sound and the guaranteed-persisted write, in case the 400ms debounce
  // above hasn't fired yet by the time the finger lifts.
  clearTimeout(volumeDebounce);
  saveAlertSettings();
  playAlertSound();
});

settingsPanelEl.addEventListener('pointerup', (e) => {
  const start = settingsPointerStart;
  settingsPointerStart = null;

  // The close button is the one interior control that dismisses. It used to
  // work purely by bubbling to the stage handler; now that everything else
  // inside the panel stops propagation (below), it has to say so itself.
  if (e.target.closest('.sp-close')) {
    e.stopPropagation();
    hideSettingsPanel();
    return;
  }

  // Nothing else inside the panel dismisses it. Without this the stage
  // handler -- which closes the panel on any tap that reaches it -- would
  // shut the panel every time a scroll drag ended on the panel background.
  e.stopPropagation();

  // moved too far -> that was a scroll, not a choice
  if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > PANEL_DRAG_SLOP_PX) return;

  if (e.target.closest('.sp-back')) {
    if (settingsSection === 'device' && deviceView) {
      deviceView = null; deviceMsg = '';   // step back within device setup
    } else if (settingsSection === 'stats' && statsView) {
      statsView = null;                    // step back within statistics
    } else {
      settingsSection = null;
    }
    renderSettingsPanel();
    return;
  }
  const rwWin = e.target.closest('.rw-win');
  if (rwWin && settingsSection === 'rewind') {
    rewindWindowMin = Number(rwWin.dataset.rwin) || 5;
    rewindSelected = null;
    rewindRows = null;
    renderSettingsPanel();
    loadRewind().then(() => { if (settingsSection === 'rewind') renderSettingsPanel(); });
    return;
  }
  const rwRow = e.target.closest('[data-rhex]');
  if (rwRow && settingsSection === 'rewind') {
    const hex = rwRow.dataset.rhex;
    rewindSelected = rewindSelected === hex ? null : hex;
    renderSettingsPanel();
    if (rewindSelected) {
      const row = (rewindRows || []).find(x => x.hex === hex);
      lookupType(hex).then(() => { if (settingsSection === 'rewind') renderSettingsPanel(); });
      if (row && row.cs && !routeCache.has(row.cs)) queueRouteLookup(row.cs, home.lat, home.lon);
    }
    return;
  }
  const menuRow = e.target.closest('.sp-menu-row');
  if (menuRow && menuRow.dataset.group === 'stats') {
    settingsSection = 'stats';
    statsView = null;
    settingsPanelEl.scrollTop = 0;
    renderSettingsPanel();
    // Re-read rather than trust whatever was loaded at startup: this page may
    // have been open for days, and other viewers have been adding to the same
    // store the whole time.
    loadFlightStats().then(renderSettingsPanel);
    return;
  }
  if (menuRow && menuRow.dataset.stat) {
    statsView = menuRow.dataset.stat;
    settingsPanelEl.scrollTop = 0;
    if (statsView === 'year') {
      yearStats = null;
      loadYearStats().then(() => { if (statsView === 'year') renderSettingsPanel(); });
    }
    if (statsView === 'visitors') {
      visitorStats = null;
      deviceApi('/onboard/visits').then(v => { visitorStats = v; }, () => { visitorStats = { available: false }; })
        .then(() => { if (statsView === 'visitors') renderSettingsPanel(); });
    }
    renderSettingsPanel();
    return;
  }
  if (menuRow && menuRow.dataset.group === 'phone') {
    settingsSection = 'phone';
    settingsPanelEl.scrollTop = 0;
    phoneState = null; phoneMsg = ''; phoneConfirm = null;
    renderSettingsPanel();
    if (IS_KIOSK) {
      loadPhoneStatus().then(() => {
        if (settingsSection !== 'phone') return;
        renderSettingsPanel();
        if (phoneState && phoneState.offer) startPhonePolling();
      });
    }
    return;
  }
  if (menuRow && settingsSection === 'phone' && (menuRow.dataset.pact || menuRow.dataset.unpair)) {
    handlePhoneTap(menuRow);
    return;
  }
  if (menuRow && menuRow.dataset.group === 'device') {
    settingsSection = 'device';
    settingsPanelEl.scrollTop = 0;
    renderSettingsPanel();
    loadDeviceStatus().then(renderSettingsPanel); // fill in the current values
    loadOtaStatus().then(() => {
      // A rollback happens while this page is dead, so the only place anyone
      // can learn about it is here, on the way back up.
      if (otaState && otaState.state === 'applying') startOtaPolling();
      if (settingsSection === 'device') renderSettingsPanel();
    });
    return;
  }
  if (menuRow && (menuRow.dataset.dev || menuRow.dataset.act ||
                  menuRow.dataset.wifi || menuRow.dataset.airport ||
                  menuRow.dataset.tz || menuRow.dataset.addr)) {
    handleDeviceTap(menuRow);
    return;
  }
  if (menuRow) {
    // The whole row is the target here, not a small control: there is
    // nothing on it to toggle, so a tap anywhere on it is unambiguous.
    settingsSection = menuRow.dataset.group;
    settingsPanelEl.scrollTop = 0;
    renderSettingsPanel();
    return;
  }
  // Sound theme. This MUST be handled before the colour-theme block below:
  // it reuses .sp-theme-row for its radio styling but carries no
  // data-theme-key, so falling through would call applyTheme(undefined) and
  // wipe the colour theme as a side effect of picking a sound theme.
  //
  // Accepts a tap ANYWHERE on the row, unlike the switch rows and the
  // colour-theme rows below (which gate on '.sp-radio' or the swatch
  // graphic). That is not an oversight -- the colour-theme row has its big
  // swatch circle as an obvious, generous target; this row has no equivalent
  // graphic, only the same 18px dot every row carries, and on a touchscreen a
  // physical tap naturally lands on the label text someone is reading, not on
  // a small dot beside it. A toggle switch getting fat-fingered while
  // scrolling is worth guarding against -- it flips a boolean that may go
  // unnoticed. A radio row like this is the opposite: picking the wrong one
  // of two visible options is corrected by looking at the screen and tapping
  // the right one, immediately. The drag-vs-tap slop check above this already
  // separates "scrolling past this row" from "a tap that landed on it" -- the
  // row-body restriction on other rows is an extra safety margin on top of
  // that, one this row does not need as badly. Also plays the theme's sound
  // on selection: choosing a voice you have never heard is otherwise
  // guesswork.
  const soundRow = e.target.closest('[data-sound-theme]');
  if (soundRow) {
    alertSettings.soundTheme = soundRow.dataset.soundTheme;
    saveAlertSettings();
    // Warm every file in the newly-picked theme now, not just the one
    // playAlertSound() below happens to preview -- so a real alert on the
    // OTHER two sounds does not pay a decode the first time it matters.
    preloadSoundTheme(soundTheme());
    if (!alertSettings.muted) { allowThroughQuiet(3000); playAlertSound(); }
    renderSettingsPanel();
    return;
  }
  const quietStep = e.target.closest('[data-quiet-step]');
  if (quietStep) {
    const k = quietStep.dataset.quietStep;
    alertSettings[k] = (alertSettings[k] + 30 * Number(quietStep.dataset.dir) + 1440) % 1440;
    saveAlertSettings();
    applyVolume();
    renderSettingsPanel();
    return;
  }
  const quietRow = e.target.closest('[data-quiet]');
  if (quietRow) {
    if (!e.target.closest('.sp-switch')) return; // row body is for scrolling
    const k = quietRow.dataset.quiet;
    alertSettings[k] = !alertSettings[k];
    saveAlertSettings();
    applyVolume();
    renderSettingsPanel();
    return;
  }
  const muteRow = e.target.closest('[data-mute]');
  if (muteRow) {
    if (!e.target.closest('.sp-switch')) return;
    alertSettings.muted = !alertSettings.muted;
    saveAlertSettings();
    applyVolume();
    if (!alertSettings.muted) { allowThroughQuiet(3000); playAlertSound(); }   // prove it came back
    renderSettingsPanel();
    return;
  }
  const themeRow = e.target.closest('.sp-theme-row');
  if (themeRow) {
    // the swatch counts as a control too: it's the big obvious circle on
    // each theme row, so pressing it doing nothing read as broken
    if (!e.target.closest('.sp-radio, .sp-theme-swatch')) return; // row body is for scrolling
    applyTheme(themeRow.dataset.themeKey, true);
    renderSettingsPanel();
    return;
  }
  const row = e.target.closest('.sp-row');
  if (!row) return;
  if (!e.target.closest('.sp-switch')) return; // row body is for scrolling
  if (row.classList.contains('disabled')) return;
  const key = row.dataset.key;
  alertSettings[key] = !alertSettings[key];
  saveAlertSettings();
  if (key === 'atc') {
    if (alertSettings.atc) ensureAtcAudio(); else closeAtcAudio();
  }
  if (key === 'storms') applyStormsVisibility();
  if (key === 'heatmap') applyHeatmapVisibility();
  if (key === 'networkCompare') refreshNetworkCompare();
  if (key === 'lightning') applyLightningVisibility();
  if (key === 'nightDim') { nightWakeUntil = 0; applyNightDim(); } // re-evaluate now, don't wait for the next minute tick
  renderSettingsPanel();
});

gearBtnEl.addEventListener('pointerup', (e) => {
  e.stopPropagation(); // otherwise this tap also reaches the stage handler below and immediately closes what it just opened
  // Toggle, not just open. The panel covers most of a 1080px round display
  // and no longer dismisses on a body tap (that was given over to scrolling),
  // so without this the gear is a one-way door: the only ways out are the
  // small close button or the narrow strip of screen beside the panel.
  if (settingsPanelEl.classList.contains('show')) hideSettingsPanel();
  else showSettingsPanel();
});

document.getElementById('rewindBtn').addEventListener('pointerup', (e) => {
  e.stopPropagation(); // same reason as the gear: the stage handler would close what this opens
  if (settingsPanelEl.classList.contains('show') && settingsSection === 'rewind') hideSettingsPanel();
  else showRewindPanel();
});

function findPlaneAtStagePoint(x, y) {
  const HIT_RADIUS = 22; // px, around the blip anchor
  // when two hit targets overlap (close blips, or a blip under a neighbor's
  // label), pick whichever plane's own blip is nearest the tap rather than
  // just the first match in Map iteration order
  let best = null, bestDistSq = Infinity;
  for (const p of planes.values()) {
    if (p.range > RANGE_NM) continue;
    const dx = x - p.anchorX, dy = y - p.anchorY;
    const distSq = dx * dx + dy * dy;
    const hitBlip = distSq <= HIT_RADIUS * HIT_RADIUS;
    const hitLabel = p.labelX !== undefined && x >= p.labelX && x <= p.labelX + p.labelW && y >= p.labelY && y <= p.labelY + p.labelH;
    if (!hitBlip && !hitLabel) continue;
    if (distSq < bestDistSq) { bestDistSq = distSq; best = p; }
  }
  return best;
}

stage.addEventListener('pointerup', (e) => {
  if (detailPanelEl.classList.contains('show')) {
    hideDetailPanel(); // any tap while open just dismisses it
    return;
  }
  if (settingsPanelEl.classList.contains('show')) {
    hideSettingsPanel(); // any tap outside a row (see settingsPanelEl's own listener above) just dismisses it
    return;
  }
  const rect = stage.getBoundingClientRect();
  // p.anchorX/p.labelX etc. are already in screen space (drawPlanes scales
  // canvas-space by rect.width/W before storing them), so no conversion here
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const p = findPlaneAtStagePoint(x, y);
  if (p) showDetailPanel(p);
  else {
    // only after no real contact matched -- see findGhostAtStagePoint
    const g = findGhostAtStagePoint(x, y);
    if (g) showGhostPanel(g);
  }
  // a tap on empty sky does nothing. Settings open only from #gearBtn --
  // on a wall-mounted touch panel, any stray brush against the glass used
  // to throw the settings panel over the radar.
});

async function start() {
  // Must complete before the settings panel renders or any approach/phase
  // logic runs, so a relocated unit never briefly uses RDU's coordinates.
  await loadAirportConfig();
  discoverDatabaseFolder().then(loadTypeCodeTable); // non-blocking; type labels fill in once ready
  loadApproachPoints(); // non-blocking; heatmap fills in once ready (or once initApproachLayer adds the source, whichever comes second)
  loadSightingCounts(); // non-blocking; counts fill in once ready, same reasoning
  loadFlightStats();    // the standing records, so a first plane cannot look like one
  loadNotableDb();      // non-blocking; notable-aircraft labels fill in once ready
  setTimeout(backfillClassifications, BACKFILL_START_DELAY_MS); // fill in history that predates classification

  // Both of these belong here, once, for the life of the page. They were
  // registered inside wakeScreenForAlert instead, which got them exactly
  // backwards in two ways: neither polled at all until the first alert fired
  // -- so on a quiet receiver the connectivity pill's network half never
  // refreshed and no ghost ever appeared -- and every alert after that added
  // another permanent pair. On a receiver that sees a couple of hundred close
  // passes, /onboard would end up being hit a couple of hundred times per
  // cycle, and that endpoint shells out to about six nmcli processes per call
  // on a Pi already sitting near its thermal limit.
  refreshNetStatus();
  setInterval(refreshNetStatus, NET_STATUS_POLL_MS);
  refreshNetworkCompare();
  setInterval(refreshNetworkCompare, NETWORK_POLL_MS);
  await loadHome();
  if (!home) useCachedHome();
  if (!home || homeFromCache) {
    // keep retrying receiver info in the background until it succeeds
    const retryHome = setInterval(async () => {
      if (home && !homeFromCache) { clearInterval(retryHome); return; }
      await loadHome();
    }, FETCH_INTERVAL_MS);
  }
  fetchAircraft();
  setInterval(fetchAircraft, FETCH_INTERVAL_MS);
  setInterval(refreshStorms, RAINVIEWER_REFRESH_MS);
  setInterval(refreshLightning, LIGHTNING_REFRESH_MS);
  setTimeout(checkLightningNearby, 10000); // give home time to populate from the first receiver.json fetch
  setInterval(checkLightningNearby, LIGHTNING_ALERT_CHECK_MS);
  applyNightDim();
  setInterval(applyNightDim, NIGHT_DIM_CHECK_MS);
  refreshOnboarding();
  setInterval(refreshOnboarding, ONBOARD_POLL_MS);
  requestAnimationFrame(tick);
}

start();
</script>

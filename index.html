<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StratoScan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230a1a3a%22/><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22none%22 stroke=%22%23274a86%22 stroke-width=%227%22/><path d=%22M50 50 L50 12 A38 38 0 0 1 82.9 31 Z%22 fill=%22%235ee7ff%22 opacity=%220.35%22/><line x1=%2250%22 y1=%2250%22 x2=%2282.9%22 y2=%2231%22 stroke=%22%235ee7ff%22 stroke-width=%228%22 stroke-linecap=%22round%22/><circle cx=%2230%22 cy=%2264%22 r=%227%22 fill=%22%233ddc97%22/><circle cx=%2245%22 cy=%2236%22 r=%228.5%22 fill=%22%23ffffff%22/></svg>">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  /* Color theme -- three options, selected in the settings panel (see
     THEMES/applyTheme in the main script below) and applied via
     [data-theme] on <html>. :root itself is "classic", the original/default
     look; the two theme blocks after it override every token below for
     "daylight" (a pale, light-mode option) and "highcontrast" (built
     specifically for low-vision/colorblind readability, not just "the
     light one with a different name" -- see its own comment).
     Canvas-drawn colors (blips, range rings, sweep) can't just read CSS at
     draw time, so applyTheme() also re-reads these into JS via
     refreshCanvasColors() whenever the theme changes -- keep any new token
     used by canvas code in sync with that function if you add one. */
  :root {
    --bg: #0a0d0f;
    --ring: #1c3236;
    --ring-bright: #2a4a4f;
    --ring-label: #3d5a5f;
    --crosshair: #16282b;
    --compass: #4a6b70;
    --sweep: #ffb020;
    --text-dim: #5b7278;
    --text: #cfe8ea;
    --low: #ffb020;
    --mid: #4fd6c8;
    --high: #a78bfa;
    --ground: #6b8087;
    --taxi: #4a90d9;
    --bad: #ff5d5d;
    --good: #3ddc97;
    --warn: #ffb020;
    --ghost: #86c5ff;
    --airport-highlight: #39ff6a;
    --panel-bg: rgba(5, 8, 10, 0.78);
    --panel-bg-strong: rgba(8, 12, 14, 0.96);
    --panel-border: rgba(255, 255, 255, 0.1);
    --switch-track-off: rgba(255, 255, 255, 0.15);
    --map-filter: brightness(0.44) saturate(1.5);
  }

  /* Pale, light-mode option: light blue/green wash, black text. Accent
     colors (altitude bands, alerts, RDU highlight) are NOT pastel versions
     of the same blue/green -- a background wash and its foreground signal
     colors sharing one hue family is exactly what makes a light theme hard
     to read for colorblind users, so these lean on the same hue spread as
     "classic" (amber/teal/purple/blue/red) just deepened enough to hold
     contrast against a light background instead of a dark one. */
  html[data-theme="daylight"] {
    --bg: #eaf3f1;
    --ring: #bfdcd6;
    --ring-bright: #93bfb6;
    --ring-label: #4b6066;
    --crosshair: #a9c9c2;
    --compass: #33484c;
    --sweep: #c97a00;
    --text-dim: #4b6066;
    --text: #10181a;
    --low: #b45f06;
    --mid: #0f7a6c;
    --high: #6b3fa0;
    --ground: #5c6b6e;
    --taxi: #1d5fa8;
    --bad: #c0202e;
    --good: #0a7d4f;
    --warn: #8a5a00;
    --ghost: #1d4e6b;
    --airport-highlight: #0f9d4a;
    --panel-bg: rgba(255, 255, 255, 0.82);
    --panel-bg-strong: rgba(255, 255, 255, 0.95);
    --panel-border: rgba(16, 24, 26, 0.14);
    --switch-track-off: rgba(16, 24, 26, 0.15);
    --map-filter: brightness(1.05) saturate(0.9);
  }

  /* Built specifically for visual accessibility, not just "the light theme
     with different names" -- requested as a check on whether "daylight"
     above was good enough on its own; it wasn't quite, mainly because a
     pastel palette still asks a low-vision or colorblind viewer to
     distinguish similar-lightness hues at low contrast. This instead uses:
     true black (the highest-contrast background there is, same principle
     as OS-level "high contrast black" modes) with white/near-white text;
     an accent palette adapted from Okabe & Ito's colorblind-safe palette
     (a standard reference set designed to stay distinguishable across the
     common forms of color vision deficiency) instead of picking hues by
     eye; and every accent kept at a contrast ratio against pure black
     comfortably past WCAG's AA text threshold (4.5:1), most past AAA
     (7:1). Color is also never the *only* signal anywhere in this app
     (alerts already pair with text/icons/animation), which matters just as
     much as the palette itself. */
  html[data-theme="highcontrast"] {
    --bg: #000000;
    --ring: #3a3a3a;
    --ring-bright: #6e6e6e;
    --ring-label: #cfcfcf;
    --crosshair: #4a4a4a;
    --compass: #f2f2f2;
    --sweep: #ffd400;
    --text-dim: #d8d8d8;
    --text: #ffffff;
    --low: #e69f00;
    --mid: #56b4e9;
    --high: #cc79a7;
    --ground: #999999;
    --taxi: #009e73;
    --bad: #ff4d4d;
    --good: #009e73;
    --warn: #e69f00;
    --ghost: #ffffff;
    --airport-highlight: #00e5ff;
    --panel-bg: rgba(0, 0, 0, 0.92);
    --panel-bg-strong: rgba(0, 0, 0, 0.97);
    --panel-border: rgba(255, 255, 255, 0.35);
    --switch-track-off: rgba(255, 255, 255, 0.25);
    --map-filter: brightness(0.15) saturate(0.4);
  }

  /* Old CRT plan-position-indicator radar: black screen, phosphor green.
     Real single-phosphor scopes (P1/P39) had exactly one hue and told
     targets apart by brightness alone -- the purest version of "authentic"
     here. Not used: this app's OTHER two themes already establish, and the
     high-contrast theme's own comment already argues, that same-hue-
     different-brightness is a real usability cost, not just a style choice
     -- eyes pick out a hue difference far faster than a brightness one when
     scanning a screen of moving blips. So altitude keeps three DISTINCT
     greens (warm yellow-green low, the classic phosphor mid, a cool
     cyan-green high) rather than one hue at three intensities -- which also
     has real precedent: dual- and multi-phosphor tactical scopes (P7 being
     the well-known one) existed specifically because a single hue was not
     always enough. --bad (red) and --warn (amber) are the other deliberate
     breaks from monochrome, for the same reason those two are the one
     universal-across-every-instrument-era exception: red-for-danger and
     amber-for-caution read as an alarm on an otherwise green screen exactly
     as they would on a real one -- most ATC and TCAS displays overlay red
     conflict alerts on an otherwise monochrome or near-monochrome scope.

     --map-filter is doing the real work of "authentic": these OSM tiles are
     a light basemap (pale cream fill, dark linework), the opposite polarity
     of a radar screen, so brightness/contrast alone just produces a dim
     green FIELD, not a black screen with glowing traces. invert(1) first
     flips that polarity -- background pixels go dark, linework goes
     bright -- so grayscale+sepia+hue-rotate has bright traces on a dark
     field to tint, the same shape a real PPI display actually has. Tuned by
     eye against the live map, not computed: dial breaks (a green FIELD
     instead of black-with-traces) below brightness ~0.75 or without the
     invert are both easy to hit by guessing.

     First cut of this filter (brightness 0.85, contrast 1.4, saturate 9) hit
     a real problem reported after living with it: the map itself came out
     bright and saturated enough to compete with the things actually drawn
     ON it. Aircraft blips already carry their own glow (shadowBlur, see the
     per-aircraft draw call) and altitude keeps distinct hues, as argued
     above -- but a green blip over a brightly-lit green road can still lose
     most of its contrast, because glow and hue don't help when the
     background reaches similar brightness in the same hue family. Brought
     down to 0.78/1.25/5.5 so the map has a clear ceiling under the blips'
     floor -- confirmed side by side, not assumed: three reference blips
     (one per altitude colour) drawn over live map clutter are visibly
     cleaner against the calmer version, and the same map still reads as
     "black screen, green traces", not "map with the saturation turned
     down" -- city labels and roads are dimmer, not gone. */
  html[data-theme="radar"] {
    --bg: #000000;
    --ring: #0b3d0b;
    --ring-bright: #1f7a1f;
    --ring-label: #4ee44e;
    --crosshair: #145214;
    --compass: #6dff6d;
    --sweep: #39ff14;
    /* Raised from #2f8f2f (~40% perceived luminance) to ~62%: the coordinate
       readout and every secondary label use this against a TRUE BLACK
       background, and #2f8f2f read as flatly hard to read there -- compare
       the high-contrast theme's own --text-dim, #d8d8d8, ~85% luminance on
       the same true-black bg, chosen for exactly this reason. Still clearly
       dimmer than --text below, just no longer fighting the background to
       be seen at all. */
    --text-dim: #45d645;
    --text: #8cff8c;
    --low: #b6ff3d;
    --mid: #33ff33;
    --high: #33ffc4;
    --ground: #2f6b2f;
    --taxi: #33cc88;
    --bad: #ff3b3b;
    --good: #39ff14;
    --warn: #ffcc00;
    --ghost: #3a5f3a;
    --airport-highlight: #aaff00;
    --panel-bg: rgba(0, 12, 0, 0.80);
    --panel-bg-strong: rgba(0, 8, 0, 0.96);
    --panel-border: rgba(57, 255, 20, 0.28);
    --switch-track-off: rgba(57, 255, 20, 0.18);
    --map-filter: invert(1) grayscale(1) brightness(0.78) contrast(1.25) sepia(1) hue-rotate(75deg) saturate(5.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    /* This is a touch kiosk -- nothing here is text to be selected, and
       letting it be selectable actively breaks the UI: dragging a finger
       across a settings row to scroll the panel started a text selection
       instead of panning, so the list wouldn't move. Also suppresses the
       long-press callout/magnifier for the same reason. */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .stage {
    position: relative;
    width: min(100vmin, 1080px);
    height: min(100vmin, 1080px);
  }

  #mapbg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg);
    filter: var(--map-filter);
  }

  #mapbg .maplibregl-ctrl-attrib {
    background: transparent;
    font-size: 8px;
    opacity: 0.5;
  }
  #mapbg .maplibregl-ctrl-attrib a { color: var(--text-dim); }
  #mapbg .maplibregl-ctrl-bottom-right { right: auto; left: 4px; bottom: 2px; }

  canvas {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: transparent;
    display: block;
    box-shadow:
      0 0 0 2px #14201f,
      0 0 0 6px #05080a,
      0 0 40px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(0,0,0,0.5);
  }

  /* Roadmap 1.11: what never moves is drawn once, not 15 times a second.
     .radar-layer sits under #radar, which now holds only moving things. The
     generic canvas rule above gives every canvas the bezel ring and inset
     shade, so these opt out of it -- two more copies would darken the dial.
     The sweep is a sprite drawn once and turned by a CSS transform, which the
     compositor does on the GPU without re-rasterising anything; its wrapper
     clips the rotating square to the dial so the corners never overflow. */
  .radar-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: none;
    pointer-events: none;
  }
  #sweepClip { overflow: hidden; }
  #radarSweep {
    width: 100%;
    height: 100%;
    box-shadow: none;
    will-change: transform;
  }

  .hud {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .hud .loc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    color: var(--text);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* Empty-sky screen: a clock, the weather and today's tally in the middle
     of the radar when nothing is in range, instead of an empty disc. Behind
     every panel and the HUD, and never catches taps. */
  #emptySky {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    text-shadow: 0 0 12px var(--bg), 0 0 4px var(--bg);
  }
  #emptySky.show { opacity: 1; }
  /* The StratoScan logo (assets/brand; written in by make.py): the words take
     the theme's colours, the mark keeps its own sky tile. */
  .ss-logo .ss-strato { fill: var(--text); }
  .ss-logo .ss-scan { fill: #5ee7ff; }
  html[data-theme="daylight"] .ss-logo .ss-scan { fill: #0e7fa3; }
  html[data-theme="radar"] .ss-logo .ss-scan { fill: var(--text); }
  #emptySky .es-brand .ss-logo { height: 34px; width: auto; opacity: 0.85; margin-bottom: 18px; }
  #settingsPanel .sp-brand .ss-logo { height: 30px; width: auto; display: block; margin: 4px auto 6px; }
  /* Start-up: the logo on the panel while the radar loads, as an appliance
     shows its name when it powers on. */
  #splash {
    position: absolute; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-radius: 50%;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #splash .ss-logo { width: 62%; height: auto; }
  #splash.done { opacity: 0; }
  #emptySky .es-time { font-size: 4.2rem; font-weight: 500; letter-spacing: 0.02em; line-height: 1; }
  #emptySky .es-date { font-size: 0.95rem; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; }
  #emptySky .es-weather { font-size: 1.15rem; margin-top: 22px; }
  #emptySky .es-today { font-size: 0.85rem; color: var(--text-dim); margin-top: 14px; letter-spacing: 0.06em; }
  #emptySky .es-credit { font-size: 0.5rem; color: var(--text-dim); margin-top: 18px; opacity: 0.7; }

  .status {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--bad);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .status.show { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  #leaders {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #leaders line {
    stroke-width: 1;
    opacity: 0.55;
  }

  .tag {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.15;
    padding: 4px 8px;
    border-radius: 3px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    white-space: nowrap;
    pointer-events: none;
    /* moved with transform, not left/top: the compositor shifts it without
       laying the page out again (#35) */
    left: 0;
    top: 0;
    will-change: transform;
  }
  .tag .cs { font-weight: 700; letter-spacing: 0.04em; font-size: 0.91rem; }
  .tag .type { display: none; color: var(--text-dim); margin-top: 0; }
  .tag .alt { color: var(--text-dim); }
  .tag .route { color: var(--text-dim); display: none; margin-top: 0; }
  .tag .route.implausible { color: var(--bad); }
  .tag .owner { color: var(--text-dim); display: none; margin-top: 0; font-size: 0.68rem; }
  .tag .seen {
    display: none;
    color: var(--mid);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-top: 1px;
  }
  .tag .badge {
    display: none;
    margin-top: 1px;
    margin-bottom: 0;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 0px 6px;
    border-radius: 2px;
    color: #fff;
    letter-spacing: 0.02em;
  }
  /* Matches the highlight ring drawn around the blip itself (see
     COLORS.airportHighlight/drawPlanes) -- a rectangular outline rather than a
     literal circle, since the tag is a box, but same color/purpose: this
     plane is plausibly on RDU's frequency right now (landing/taking off
     within AIRPORT_PROXIMITY_NM), worth a glance if ATC audio is on. */
  /* The rare-aircraft reason, in the detail panel. Uses the same accent as
     the landing/takeoff ring so "the app is pointing at something" reads
     consistently, rather than introducing a fourth alert colour. */
  .dp-field.dp-rare { grid-column: 1 / -1; }
  .dp-field.dp-rare .dp-value { color: var(--airport-highlight); }

  .tag.airport-phase {
    outline: 2px solid var(--airport-highlight);
    outline-offset: 1px;
    box-shadow: 0 0 8px 1px color-mix(in srgb, var(--airport-highlight) 55%, transparent);
  }

  #toast {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translate(-50%, 0);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: var(--text);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 6px 14px;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #toast.show { opacity: 1; }

  #detailBackdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #detailBackdrop.show { opacity: 1; pointer-events: auto; }

  #detailPanel {
    /* Centered, same as an auto-popped alert -- used to be bottom-anchored
       for a tapped plane specifically (to stay clear of the flight trail
       passing through the dial's middle, now that every in-range aircraft
       always shows one), but centering was requested for every panel, not
       just alerts, so tap-opened and auto-popped panels now look/sit
       identically aside from the alert-only red glow below. Trade-off:
       an open panel does now sit over the middle of the dial, briefly
       covering whatever trail happens to be there. */
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    width: min(72%, 480px);
    max-height: 80%;
    overflow-y: auto;
    /* let the browser own vertical panning, and don't chain the scroll to
       whatever is behind the panel when it hits an end */
    touch-action: pan-y;
    overscroll-behavior: contain;
    background: var(--panel-bg-strong);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 18px 20px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  #detailPanel.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  /* Auto-popped by the nearby-aircraft alert (checkNearbyAlert) or an
     emergency squawk (checkEmergencySquawk), not a tap -- a red-tinted
     border/glow is the only thing left distinguishing "this interrupted
     you" from a panel you opened yourself, now that both share the same
     centered position. */
  #detailPanel.alert {
    border-color: var(--bad);
    animation: alertGlow 1.4s ease-in-out infinite;
  }
  @keyframes alertGlow {
    0%, 100% { box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 0 1px color-mix(in srgb, var(--bad) 25%, transparent); }
    50% { box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 16px 2px color-mix(in srgb, var(--bad) 55%, transparent); }
  }
  #detailPanel .dp-alert-tag {
    color: var(--bad);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  /* Same position as .dp-alert-tag but NOT var(--bad): a ghost is not an
     alarm. Red here read as "something is wrong with this aircraft" when
     the actual meaning is "your antenna cannot hear it". */
  #detailPanel .dp-ghost-note {
    color: var(--text-dim);
    font-size: 0.72rem;
    line-height: 1.5;
    margin-top: 8px;
  }
  #detailPanel .dp-ghost-tag {
    color: var(--ghost);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  #detailPanel .dp-cs { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; }
  #detailPanel .dp-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    color: #fff;
    letter-spacing: 0.03em;
  }
  #detailPanel .dp-type { margin-top: 10px; color: var(--text-dim); font-size: 0.75rem; }
  #detailPanel .dp-owner { margin-top: 2px; color: var(--text-dim); font-size: 0.75rem; }
  #detailPanel .dp-route { margin-top: 2px; color: var(--text-dim); font-size: 0.75rem; }
  #detailPanel .dp-route.implausible { color: var(--bad); }
  #detailPanel .dp-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  #detailPanel .dp-field .dp-label {
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  #detailPanel .dp-field .dp-value {
    font-size: 0.95rem;
    margin-top: 2px;
  }
  #detailPanel .dp-close {
    position: absolute;
    top: 6px;
    right: 8px;
    /* 44px square: a real touch target. Was 26x30, which on the kiosk's
       touch panel needed a deliberate fingertip poke to hit. */
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    line-height: 1;
    color: var(--text-dim);
    /* .dp-photo is positioned and comes LATER in the panel markup, so with

<script src="vendor/maplibre-gl.js"></script>
<script>
// ---- Saved settings from before the rename -----------------------------
// Everything this page keeps in localStorage was stored under 'flightradar'
// keys until the project became StratoScan. Copy each one across once, before
// anything below reads them, so a kiosk keeps its theme, alert settings,
// quiet hours, cached home and runways through the update instead of quietly
// resetting to defaults. A key already set under the new name wins.
try {
  for (const [from, to] of [
    ['flightradar.lastCounted', 'stratoscan.lastCounted'],
    ['flightradar_runways_v1', 'stratoscan_runways_v1'],
    ['flightradar_alert_settings_v1', 'stratoscan_alert_settings_v1'],
    ['flightradar_nearby_repair_v1', 'stratoscan_nearby_repair_v1'],
    ['flightradar_theme_v1', 'stratoscan_theme_v1'],
    ['flightradar_home_v1', 'stratoscan_home_v1'],
  ]) {
    const old = localStorage.getItem(from);
    if (old !== null) {
      if (localStorage.getItem(to) === null) localStorage.setItem(to, old);
      localStorage.removeItem(from);
    }
  }
} catch (e) { /* storage unavailable: nothing to carry over */ }

// ---- Config ------------------------------------------------------
const DATA_URL = '/tar1090/data/aircraft.json';
// The unit's core feed (roadmap 1.9, #33): the same aircraft, already
// labelled -- operator by the shared labels.py, route and owner looked up on
// the unit -- so this page needn't ask adsb.im or adsbdb itself. Trial
// first: on with ?core=1 (the public page, then the kiosk), off otherwise,
// and the old path stays until it has proved itself.
const USE_CORE_FEED = new URLSearchParams(location.search).get('core') === '1';
const CORE_URL = '/api/aircraft';

// A core-feed aircraft in the shape the rest of the page reads (readsb's),
// with the feed's own labels kept alongside.
function fromCore(a) {
  return {
    hex: a.hex, flight: a.flight, lat: a.lat, lon: a.lon, gs: a.gs, track: a.track,
    alt_baro: a.alt, seen_pos: a.seenPos, seen: a.seen, squawk: a.squawk,
    category: a.category, emergency: a.emergency, baro_rate: a.vrate,
    _core: a,
  };
}
const RECEIVER_URL = '/tar1090/data/receiver.json';
// Set by deploy/stratoscan-kiosk.service's launch URL (?kiosk=1) -- the
// physical kiosk's Chromium runs --kiosk, a single locked-down fullscreen
// window with no tab bar/window switcher reachable by touch. Learned the
// hard way: window.open() there can leave the display stuck on whatever it
// opened with no way back short of an SSH restart. Anything that opens a
// new window/tab (see ensureAtcAudio below) must check this first and
// refuse on the kiosk; it's unrestricted on a normal browser tab (laptop,
// phone, the Funnel URL), where a second tab is just a second tab.
const IS_KIOSK = new URLSearchParams(location.search).get('kiosk') === '1';
// Overrides the receiver's actual configured position for DISPLAY purposes
// only (readsb keeps using its own real antenna position internally for
// signal-range/MLAT math — this only changes what StratoScan centers on).
// Set to null to go back to auto-detecting the receiver's real position
// from receiver.json. When set, bearing/range are always computed via
// haversine from raw lat/lon rather than trusting readsb's r_dst/r_dir,
// since those are relative to the real antenna, not this override point.
const HOME_OVERRIDE = null; // was briefly set to a different address for a one-off request, then reverted to auto-detecting the real receiver position
// "dark" turned out to be near-grayscale by design (water/parks/woods are
// all ~0% saturation), so no CSS filter could make it colorful. "liberty"
// has real color (blue water, green parks, warm road tones) — we darken it
// ourselves via the #mapbg CSS filter instead.
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
// same free, no-key route API tar1090 itself uses (adsb.im asks http-loaded
// pages to call it over http, mirrored below to match their preference)
let ROUTE_API_URL = 'https://adsb.im/api/0/routeset';
const ROUTE_BATCH_MS = 4000;      // how often we flush queued route lookups
const ROUTE_BATCH_MAX = 50;       // callsigns per request
const RANGE_NM = 20;             // outer ring range in nautical miles
const RINGS = 2;                 // number of range rings
// Radians per SECOND, not per frame. It was 0.008 rad/frame, which silently
// tied the sweep's speed to whatever frame rate the browser happened to hit
// -- and broke outright once the loop below started skipping frames.
// 0.008 * 60fps = 0.48, so the sweep keeps its original ~13s per revolution.
const SWEEP_RAD_PER_SEC = 0.48;

// The kiosk redraws a 1080x1080 canvas -- 1.17M pixels cleared and repainted
// every frame. At full rAF that pinned Chromium at ~85% CPU and held the Pi 5
// at 77-79C with its fan already maxed (pwm 250/255, 5300rpm), tripping the
// soft temperature limit. Nothing on a radar needs 60fps: the sweep takes 13
// seconds per revolution and aircraft are interpolated from 1Hz data. On a
// 60Hz panel the achievable rates are 60/n, so this lands on a divisor of 60.
//
// Now 15 (60/4) rather than 20 (60/3). Measured in the printed enclosure at
// 20fps: busy daytime traffic ran 79C average and peaked at 84.5C with the
// fan already maxed, which trips the Pi 5's soft limit and quietly caps the
// clock at exactly the moments there is most traffic to draw. Frame rate is
// the largest CPU lever here and the sweep is the only thing that visibly
// loses smoothness at 15.
const TARGET_FPS = 15;
let frameMinMs = 1000 / TARGET_FPS - 4; // slack so vsync jitter doesn't cost a whole frame (a perf experiment can change it)
// The aircraft canvas's own, lower rate: see tick().
const CANVAS_FPS = 5;
let canvasMinMs = 1000 / CANVAS_FPS - 4;
const SMOOTH_TAU = 0.35;         // seconds; exponential smoothing time constant for plane motion
// A position in aircraft.json is not "now" -- it is the last position message
// readsb decoded, and `seen_pos` says how long ago that was. Measured against
// the live feed here, that age runs a median of ~7s and a 90th percentile of
// ~48s, because ADS-B position squitters arrive far less often than the
// velocity/altitude ones (and drop out entirely at the edge of coverage).
// Drawing a blip at that raw fix puts a jet up to 8nm -- a third of the radar
// radius -- behind where it actually is, trailing its own track, which is
// what made departures appear to lag the runway they had just left. So the
// fix is carried forward along the reported ground track before it is
// plotted, the same dead reckoning tar1090 does.
const DR_MAX_S = 60;             // stop extrapolating past this; a minute-old fix is a guess, not a position
const DR_MIN_GS_KT = 25;         // below this the aircraft is taxiing/parked and the track is noise
const FETCH_INTERVAL_MS = 1000;  // how often we poll aircraft.json
const STALE_MS = 15000;          // no good fetch in this long -> show NO SIGNAL
const DROP_MS = 45000;           // no good fetch in this long -> clear stale blips

// A plane missing from a poll doesn't necessarily mean it's gone -- at low
// altitude especially, a bank turn or terrain can mask ADS-B reception for a
// few seconds. Rather than vanishing instantly, a plane "coasts" at its last
// known position, fading out, before actually being dropped.
const COAST_FRESH_MS = 2000;  // no fade within this long of the last confirmed contact (normal poll jitter)
const COAST_FADE_MS = 6000;   // then fade out over this long
const COAST_TOTAL_MS = COAST_FRESH_MS + COAST_FADE_MS;
const LEADER_BASE_OPACITY = 0.55; // matches #leaders line's CSS opacity -- scaled by coast fade, not replaced

// Every tracked aircraft always shows its recent flight path (drawTrails, in
// the main loop below) -- originally only drawn for the plane with an open
// detail panel, but always-on for every plane in view was preferred. This
// receiver has no server-side trace history (readsb's data/traces/*.json
// isn't populated on this Pi), so the trail is built client-side from each
// poll's already-computed bearing/range -- it only covers time since this
// page was last loaded, not real flight history. See HANDOFF.md.
// No time cutoff -- the whole path stays for as long as the plane itself
// stays tracked (the trail array is discarded along with the plane object
// once it coasts out of range, see applyUpdate's removal pass below, so
// this never outlives what's actually on screen). TRAIL_MAX_POINTS is just
// a safety net against unbounded growth for the rare case of a plane
// sitting in view a very long time (e.g. a local helicopter loitering for
// hours) -- one point per TRAIL_SAMPLE_MS, so this is a generous ceiling
// (~30 minutes of continuous track), not a visible cutoff for any normal
// overflight/approach.
// How often the drawn position is recorded into the trail. The trail is a
// record of where the blip actually WAS, so it is sampled from the render
// loop rather than pushed once per poll from the incoming fix -- see the
// note on p.trail in drawPlanes. 250ms sits comfortably under SMOOTH_TAU
// (0.35s), so the recorded path resolves the easing rather than cutting
// corners across it, without storing a point per frame.
const TRAIL_SAMPLE_MS = 250;
// Don't record a point the blip has not meaningfully moved to. Once the
// eased position converges on its target -- an aircraft holding still, or
// simply settled between fixes -- every sample would otherwise be a
// duplicate, filling the ring buffer with coincident points and drawing
// thousands of zero-length segments. ~0.02nm is well under half a pixel at
// the 20nm/410px scale, so nothing visible is dropped.
const TRAIL_MIN_MOVE_NM = 0.02;
const TRAIL_MAX_POINTS = 7200;
// Fade-only window: older segments dim toward TRAIL_FADE_FLOOR rather than
// disappearing, so a long flight path stays visible end to end but still
// reads "recent vs older" at a glance.
const TRAIL_FADE_MS = 5 * 60 * 1000;
const TRAIL_FADE_FLOOR = 0.25;

function pruneTrail(trail, now) {
  while (trail.length > TRAIL_MAX_POINTS) trail.shift();
}

// HTML-escapes a value before it goes into an innerHTML template literal.
// Most fields we display are tightly constrained (Mode S callsigns are a
// fixed 6-bit charset with no room for markup), but route city names come
// from adsb.im and photo attribution comes from planespotters.net's own
// user-submitted photographer names -- both external, neither ours to
// trust blindly. Escaping unconditionally is cheap and means nothing here
// depends on staying aware of which specific field came from where.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ICAO airline designators (ICAO Doc 8585, a public standard) mapped to a
// display name, IATA code, and a badge color loosely associated with the
// carrier — not an attempt at exact brand colors, just visual distinction.
// Scoped to carriers plausible near a US East Coast receiver; unmapped
// codes (private GA, unlisted operators) simply get no badge.
const AIRLINES = {
  AAL: { name: 'American Airlines',      iata: 'AA', color: '#a5342a' },
  DAL: { name: 'Delta Air Lines',        iata: 'DL', color: '#9c1238' },
  UAL: { name: 'United Airlines',        iata: 'UA', color: '#1f5fa8' },
  SWA: { name: 'Southwest Airlines',     iata: 'WN', color: '#b5860f' },
  JBU: { name: 'JetBlue Airways',        iata: 'B6', color: '#146fa0' },
  ASA: { name: 'Alaska Airlines',        iata: 'AS', color: '#0f766e' },
  NKS: { name: 'Spirit Airlines',        iata: 'NK', color: '#a68a00' },
  FFT: { name: 'Frontier Airlines',      iata: 'F9', color: '#1a7a3c' },

// numbers (N1182D) correctly don't match and get labeled "Private Aircraft".
// Shared by local contacts and network ghosts: the callsign means the same
// thing whichever receiver decoded it, and a ghost badged "the network"
// while the identical flight from our own antenna reads "Delta Air Lines"
// makes the two look like different kinds of object rather than the same
// aircraft seen two ways.
// A transponder can be configured with a placeholder instead of a callsign,
// and this receiver regularly sees "00000000" over the house. It is not blank,
// so every "is there a callsign?" test passed it, and it was then badged
// "Private Aircraft", looked up as a flight number -- which came back Nantes
// to Paris, at which point a screen full of real information was carrying a
// fabricated route -- and filed under private traffic in the statistics.
//
// Every real callsign and every real registration contains at least one
// letter: airline callsigns are three letters plus a number, registrations
// carry a country prefix. An all-digit or all-punctuation "callsign" is a
// placeholder, and is treated exactly as a missing one -- the aircraft shows
// its hex and "Identifying…" until a real callsign arrives.
function realCallsign(flight) {
  const cs = (flight || '').trim();

// Apache calling itself ZEUS41 has a real callsign that is not an airline's,
// and was badged "Private Aircraft" -- which also queued an owner lookup for
// it. The hex block says who is flying, whatever the crew typed.
function airlineFor(cs, hasCallsign, hex) {
  const mil = hex ? militaryOperator(hex) : null;
  if (mil) return { icao: null, label: mil, color: MILITARY_COLOR };
  const m = hasCallsign ? /^([A-Z]{3})\d/.exec(cs) : null;
  const icao = m ? m[1] : null;
  const airline = icao ? (AIRLINES[icao] || null) : null;
  return {
    icao,
    label: airline ? airline.name : (hasCallsign ? PRIVATE_LABEL : ACQUIRING_LABEL),
    color: airline ? airline.color : (hasCallsign ? PRIVATE_COLOR : ACQUIRING_COLOR),
  };
}

// floating next to their plane. Each label's natural position is its own
// bearing angle (LABEL_SPRING_TAU eases it there as the plane moves), and
// labels are only ever pushed apart ALONG the ring, never off it — which,
// combined with always resolving neighbors in bearing-sorted order, means
// leader lines are never allowed to cross (connecting points on an inner
// circle to points on an outer ring in the same cyclic order can't produce
// crossing chords, so preserving that order is what keeps crossings at
// zero rather than just "minimized").
const LABEL_RING_RADIUS = R + 75;
const LABEL_MARGIN = 8;
const LABEL_SPRING_TAU = 0.4;
const LABEL_SEPARATION_PASSES = 24; // cheap: adjacent-pair only, O(n) per pass now

// centered on the ring (radius LABEL_RING_RADIUS) can still have a corner
// poke past that circle at diagonal angles, since the box's own half-diagonal
// adds to the ring's radius. Bounding labels to the square stage isn't
// enough -- they need to stay inside this circle instead.
const LABEL_BOUND_RADIUS = W / 2 - 6;

// scale converts internal canvas-space (1080 units) to real CSS px, same
// factor drawPlanes already uses for anchorX/anchorY -- only equals 1 on the
// physical 1080x1080 kiosk panel; without it labels land at the wrong CSS
// pixel position on any other viewport (e.g. viewing over Tailscale Funnel).
function ringPointForAngle(angleDeg, scale) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: CX * scale + LABEL_RING_RADIUS * scale * Math.cos(rad), y: CY * scale + LABEL_RING_RADIUS * scale * Math.sin(rad) };
}

// nearest point on an axis-aligned box to an external point — used to attach
// each leader line to whichever edge of the label box faces its plane
function closestPointOnRect(px, py, rx, ry, rw, rh) {
  return { x: Math.max(rx, Math.min(px, rx + rw)), y: Math.max(ry, Math.min(py, ry + rh)) };

function altColor(alt) {
  if (alt === 'ground') return COLORS.taxi;   // confirmed on the ground
  if (alt === null) return COLORS.ground;     // unknown altitude, not the same thing
  if (alt < 10000) return COLORS.low;
  if (alt < 25000) return COLORS.mid;
  return COLORS.high;
}

// Blip size as a second altitude cue, alongside altColor's hue: small and
// tight near the ground, larger at cruise. Deliberately not a perspective
// effect -- a higher aircraft is further away and would look SMALLER if this
// were about distance. It reads as "how high", which is the useful fact.
//
// The curve is sqrt rather than linear because near an airport almost all the
// interesting spread is in the bottom few thousand feet: linear would make
// everything below 10,000ft look identical and spend the whole range on
// airliners at cruise that are all the same anyway.
//
// Hit testing is unaffected: findPlaneAtStagePoint uses a fixed 22px radius
// around the anchor, so a shrunken low blip stays exactly as easy to tap.
const BLIP_SCALE_MIN = 0.68;    // on the ground
const BLIP_SCALE_MAX = 1.30;    // at BLIP_SCALE_TOP_FT and above
const BLIP_SCALE_TOP_FT = 35000;

function blipScale(alt) {
  if (alt === 'ground') return BLIP_SCALE_MIN;
  if (typeof alt !== 'number') return 1;   // unknown altitude: don't imply one
  const t = Math.min(1, Math.max(0, alt / BLIP_SCALE_TOP_FT));
  return BLIP_SCALE_MIN + (BLIP_SCALE_MAX - BLIP_SCALE_MIN) * Math.sqrt(t);
}

// ---- Blip shape classification -----------------------------------------
// Distinguishes large commercial jets / smaller jets / prop planes / rotor-
// craft on the radar, the way tar1090's own map does. Rather than porting
// tar1090's icon set (its own code license is unclear -- "Other"/NOASSERTION
// on GitHub, see the aircraft-type-lookup note above for the same concern),
// these are simple shapes drawn to match this app's existing kite-blip style.
// Classification prefers the specific tail's ICAO type info (from the same
// type database lookupType() already reads: typeDesc is the ICAO Doc 8643
// 3-char code, e.g. "L2J" = landplane/2 engines/jet, "H1T" = helicopter/1
// engine/turbine; wtc is wake-turbulence category L/M/H/J) and falls back to
// the raw ADS-B "category" field readsb reports per-aircraft (A1 light .. A5
// heavy, A7 rotorcraft, B2 lighter-than-air) when type info isn't known yet
// or at all -- common for GA tails with no database entry. Unclassifiable
// aircraft keep the original kite blip, so most traffic looks unchanged.
function classifyAircraft(p) {
  const desc = p.typeDesc, wtc = p.wtc, cat = p.category;
  if (desc && desc.length === 3) {
    const kind = desc[0], engine = desc[2];
    if (kind === 'H' || kind === 'G' || kind === 'T') return 'heli';
    if (engine === 'J') return (wtc === 'H' || wtc === 'J') ? 'heavy' : 'jet';
    if (engine === 'P' || engine === 'T' || engine === 'E') return 'prop';
  }
  if (cat) {
    if (cat === 'A7') return 'heli';
    if (cat === 'B2') return 'lta';
    if (cat === 'A4' || cat === 'A5') return 'heavy';
    if (cat === 'A3') return 'jet';
    if (cat === 'A1' || cat === 'A2') return 'prop';
  }
  return 'unknown';
}

// Each draw*() draws into context c, assumed already translated to the blip's
// position and rotated so "forward" is -Y, with fillStyle/strokeStyle/
// shadowColor/shadowBlur already set to the plane's color by the caller.
function drawKite(c, scale) {
  c.beginPath();
  c.moveTo(0, -9 * scale);
  c.lineTo(6 * scale, 7 * scale);
  c.lineTo(0, 3 * scale);
  c.lineTo(-6 * scale, 7 * scale);
  c.closePath();
  c.fill();
}

function drawProp(c) {
  c.beginPath();
  c.moveTo(-1.5, -9);
  c.lineTo(1.5, -9);
  c.lineTo(1.5, -1.5);
  c.lineTo(9, 1.5);
  c.lineTo(9, 3.5);
  c.lineTo(1.5, 1);
  c.lineTo(1.5, 8);
  c.lineTo(-1.5, 8);
  c.lineTo(-1.5, 1);
  c.lineTo(-9, 3.5);
  c.lineTo(-9, 1.5);
  c.lineTo(-1.5, -1.5);
  c.closePath();
  c.fill();
}

function drawHeli(c) {
  c.beginPath();
  c.arc(0, -2, 7, 0, Math.PI * 2);
  c.lineWidth = 1.6;
  c.strokeStyle = c.fillStyle;
  c.stroke();
  c.beginPath();
  c.moveTo(-1.3, 4);
  c.lineTo(1.3, 4);
  c.lineTo(0.8, 11);
  c.lineTo(-0.8, 11);
  c.closePath();
  c.fill();
}

function drawBlimp(c) {
  c.beginPath();
  c.ellipse(0, 0, 5, 11, 0, 0, Math.PI * 2);
  c.fill();
}

function drawBlipShape(c, kind) {
  switch (kind) {
    case 'heavy': drawKite(c, 1.55); break;
    case 'prop': drawProp(c); break;
    case 'heli': drawHeli(c); break;
    case 'lta': drawBlimp(c); break;
    case 'jet':
    case 'unknown':
    default: drawKite(c, 1); break;
  }
}

// ---- Glow sprites ----------------------------------------------------------
// shadowBlur was the costliest thing this page drew. On the Pi's GPU every
// blurred shape is its own offscreen blur pass, on every frame, and shrinking
// the moving-things canvas to 1px took the GPU process from ~96% of a core to
// ~21% (#35). A glowing shape only changes when its colour or size does, so
// each one is drawn once, glow and all, into a small canvas, and a frame just
// stamps copies: the same pixels, no blur per frame.
const glowSprites = new Map();
function glowSprite(key, extent, blur, draw) {
  let s = glowSprites.get(key);
  if (s) return s;
  const half = Math.ceil(extent + blur * 2);   // a shadowBlur fades out within about 2x its value
  s = document.createElement('canvas');
  s.width = s.height = half * 2;
  const c = s.getContext('2d');
  c.translate(half, half);
  draw(c);
  s.half = half;
  if (glowSprites.size > 300) glowSprites.clear();   // colours follow the theme; don't grow forever
  glowSprites.set(key, s);
  return s;
}

// Sizes step in 5% (blips) or half pixels (rings) so the cache stays small;

const quantizeScale = (v) => Math.round(v * 20) / 20;

function polarToXY(bearingDeg, rangeNm) {
  const angle = (bearingDeg - 90) * Math.PI / 180; // 0deg = up (north)
  const r = (rangeNm / RANGE_NM) * R;
  return { x: CX + r * Math.cos(angle), y: CY + r * Math.sin(angle) };
}

// shortest signed delta between two bearings, e.g. 359 -> 2 gives +3
function bearingDelta(from, to) {
  let d = (to - from) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

function haversineBearingRange(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const phi1 = toRad(lat1), phi2 = toRad(lat2);
  const dLambda = toRad(lon2 - lon1);

  const y = Math.sin(dLambda) * Math.cos(phi2);
  const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);
  const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

  const R_NM = 3440.065;
  const dPhi = toRad(lat2 - lat1);
  const a = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) ** 2;
  const range = R_NM * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return { bearing, range };
}

// The inverse of haversineBearingRange: given a start point plus a bearing
// and distance, find the destination point (standard great-circle "direct"
// geodesic formula). Used to project a line beyond a runway's real pavement
// end, approximating its final approach corridor -- see loadRunways().
function destinationPoint(lat, lon, bearingDeg, distanceNm) {
  const R_NM = 3440.065;
  const toRad = d => d * Math.PI / 180;
  const bearing = toRad(bearingDeg);
  const phi1 = toRad(lat), lambda1 = toRad(lon);
  const delta = distanceNm / R_NM;

  const phi2 = Math.asin(Math.sin(phi1) * Math.cos(delta) + Math.cos(phi1) * Math.sin(delta) * Math.cos(bearing));
  const lambda2 = lambda1 + Math.atan2(
    Math.sin(bearing) * Math.sin(delta) * Math.cos(phi1),
    Math.cos(delta) - Math.sin(phi1) * Math.sin(phi2)
  );

  return [lambda2 * 180 / Math.PI, phi2 * 180 / Math.PI]; // [lon, lat] -- GeoJSON coordinate order
}

// Aircraft in the immediate vicinity of RDU's runways, climbing or
// descending -- deliberately narrow (tight radius + real vertical rate, not
// just "low altitude") so normal traffic flying low nearby doesn't get
// flagged. Originally recolored the blip/label entirely (COLOR_LANDING red /
// COLOR_TAKEOFF green), but that read poorly in practice -- swapping the
// plane's whole identity color made it harder to track, not easier. Now
// just a classification (airportPhaseOf below) that a highlight ring is drawn
// around instead, leaving the plane's normal altitude color alone -- see
// COLORS.airportHighlight (theme-aware, see refreshCanvasColors) and
// drawPlanes/tag-rendering below.
// ---- Home airport, configurable ------------------------------------------
// These were hardcoded to RDU. They are now defaults, overridden at startup
// by /config.json if the device has been set up for somewhere else (see
// deploy/setup-server.py). Everything airport-shaped reads through
// AIRPORT.*: the landing/takeoff highlight, the approach heatmap, and the
// ATC link. Without this, relocating a unit left it drawing an approach
// corridor for an airport hundreds of miles away.
//
// Deliberately a `let` bound once at load rather than a const: the page has
// to render sensibly before /config.json resolves, so RDU stands in until
// (and unless) a real config arrives.
let AIRPORT = {
  code: 'RDU',
  lat: 35.8776,
  lon: -78.7875,
  elevFt: 435,
  // LiveATC mount for this field. Empty string disables the ATC feature
  // rather than linking somewhere wrong for a relocated unit.
  atcMount: 'krdu_app2',
};

async function loadAirportConfig() {
  try {
    const res = await fetch('/config.json', { cache: 'no-store' });
    if (!res.ok) return; // no config deployed -- defaults stand
    const cfg = await res.json();
    const a = cfg && cfg.airport;
    if (!a) return;
    if (typeof a.lat === 'number' && typeof a.lon === 'number') {
      AIRPORT = {
        code: typeof a.code === 'string' ? a.code : AIRPORT.code,
        country: typeof a.country === 'string' ? a.country : '',
        lat: a.lat,
        lon: a.lon,
        elevFt: typeof a.elevFt === 'number' ? a.elevFt : 0,
        atcMount: typeof a.atcMount === 'string' ? a.atcMount : '',
      };
    }
  } catch (e) {
    // unreachable or malformed -- the RDU defaults above stand, which is
    // wrong for a relocated unit but never breaks the page
  }
}

const AIRPORT_PROXIMITY_NM = 0.869;  // 1 statute mile
const AIRPORT_VERT_FT = 500;         // within this of field elevation
const AIRPORT_VRATE_MIN = 150;       // ft/min -- filters out level-flight noise near zero

function airportPhaseOf(p) {
  if (typeof p.alt !== 'number' || p.lat == null || p.lon == null || p.vrate == null) return null;
  if (Math.abs(p.alt - AIRPORT.elevFt) > AIRPORT_VERT_FT) return null;
  if (haversineBearingRange(AIRPORT.lat, AIRPORT.lon, p.lat, p.lon).range > AIRPORT_PROXIMITY_NM) return null;
  if (p.vrate <= -AIRPORT_VRATE_MIN) return 'landing';
  if (p.vrate >= AIRPORT_VRATE_MIN) return 'takeoff';
  return null;
}

// ---- RDU approach-path accumulation -------------------------------------
// Builds a faint picture of RDU's *real* arrival corridors from actually-
// observed traffic, growing more defined the more landings it sees --
// persisted server-side (not localStorage -- see APPROACH_STORE_URL below)
// so it's shared across every viewer and keeps building across kiosk
// reboots/reloads, not just within one session. There's no good free
// dataset of official approach paths to draw from instead (unlike runways,
// which OSM/Overpass has real geometry for -- FAA approach plates are PDF
// charts, not simple line data); see extendedApproachLines() above for the
// free-but-approximate stand-in this complements.
const AIRPORT_APPROACH_RADIUS_NM = 12;       // track candidate points out to this far from RDU
function approachCeilingFt() { return AIRPORT.elevFt + 6000; } // ignore traffic well above a normal approach profile
// "Actually landed" confirmation window -- deliberately looser than a
// well-sited receiver would need. This receiver's antenna isn't mast-
// mounted yet (see HANDOFF.md), so ADS-B reception at low altitude/close
// range is likely worse than these numbers would suggest for a mature
// setup: a real landing's signal can plausibly drop out well before the
// aircraft is actually this close/low, which would mean confirmApproachOnDrop
// never fires and a genuine landing's buffered points get silently
// discarded. Revisit (tighten back up) once the new antenna is mast-mounted
// and reception characteristics actually improve -- these values are a
// starting point for current conditions, not a settled calibration.
const AIRPORT_APPROACH_CONFIRM_RADIUS_NM = 4;
function approachConfirmAltFt() { return AIRPORT.elevFt + 3000; }
// Backed by a small same-origin service (deploy/approach-store.py, proxied
// at /approaches -- see 91-stratoscan-approach-store.conf) instead of
// localStorage. localStorage is scoped per-browser/per-device, so the
// kiosk's own accumulated picture would never be visible to anyone
// checking in from a separate browser (their laptop, phone, the Funnel
// URL) -- this way every viewer reads and contributes to the same shared,
// growing picture. Multiple viewers open at once could each independently
// report the same real landing; harmless, it just over-represents that one
// landing by a point or two, not wrong.
const APPROACH_STORE_URL = '/approaches';
const APPROACH_MAX_POINTS = 6000; // bounds render cost -- oldest points evicted first (server enforces its own copy of this cap too)

let approachPoints = []; // [[lon,lat], ...] confirmed-landing points, shared across viewers

async function loadApproachPoints() {
  try {
    const res = await fetch(APPROACH_STORE_URL, { cache: 'no-store' });
    const data = await res.json();
    if (Array.isArray(data)) approachPoints = data;
  } catch (e) {
    // approach-store unavailable -- starts/stays empty for this session, purely cosmetic either way
  }
  if (map && map.getSource('approaches')) map.getSource('approaches').setData(approachPointsGeoJSON());
}

function approachPointsGeoJSON() {
  return { type: 'FeatureCollection', features: approachPoints.map(pt => ({ type: 'Feature', geometry: { type: 'Point', coordinates: pt } })) };
}

function commitApproachTrack(points) {
  if (!points.length) return;
  approachPoints.push(...points);
  if (approachPoints.length > APPROACH_MAX_POINTS) approachPoints.splice(0, approachPoints.length - APPROACH_MAX_POINTS);
  if (map && map.getSource('approaches')) map.getSource('approaches').setData(approachPointsGeoJSON());
  fetch(APPROACH_STORE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(points) })
    .catch(e => {}); // approach-store unavailable -- this session's own view still updated above, just won't be shared
}

// ---- Sighting counts ----------------------------------------------------
// How many distinct times this receiver has picked up each aircraft
// ("total"), and how many of those times it came within the nearby-alert
// radius ("nearby", see ALERT_RADIUS_NM) -- shared server-side (same
// reasoning as approachPoints above: a browser-local count would never be
// visible to anyone checking in from a different device) so the kiosk's
// own accumulated history is visible to every viewer, not just whoever
// happens to have it open. "Distinct visit", not "every poll" -- recorded
// once when a plane is newly added to `planes` (applyUpdate) or once when
// checkNearbyAlert's pl.alerted first flips true, not once a second while
// it's actually in view.
const SIGHTING_STORE_URL = '/sightings';
const sightingCounts = new Map(); // hex -> { total, nearby }

// A plane briefly dropping off ADS-B reception (weak/unmounted antenna --
// see the RDU-approach notes on this) and reappearing seconds later is the
// *same* real-world visit, not a new one -- but `planes` losing the hex
// during that gap (see COAST_TOTAL_MS) makes applyUpdate/checkNearbyAlert
// look like a fresh sighting. This cooldown survives that coast-and-return
// cycle so a signal hiccup mid-pass doesn't inflate the count; a plane
// genuinely returning later (next lap, next day) still counts again once
// the cooldown elapses.
const SIGHTING_COOLDOWN_MS = 5 * 60 * 1000;
// Persisted, in wall-clock ms, because the kiosk reloads itself several times
// a day (shm-guard, the 04:00 restart) and an in-memory map started empty
// each time -- counting every aircraft on screen at that moment as a brand
// new visit.
const COUNTED_KEY = 'stratoscan.lastCounted';
const lastCountedAt = new Map(); // hex -> { total: ts, nearby: ts, network: ts }
try {
  const saved = JSON.parse(localStorage.getItem(COUNTED_KEY) || '{}');
  const cutoff = Date.now() - SIGHTING_COOLDOWN_MS;
  for (const [hex, kinds] of Object.entries(saved)) {
    if (kinds && Object.values(kinds).some(ts => ts > cutoff)) lastCountedAt.set(hex, kinds);
  }
} catch (e) {}
let countedSaveTimer = null;
function saveLastCounted() {
  countedSaveTimer = null;
  // Pruning here also keeps the in-memory map bounded on a busy site.
  const cutoff = Date.now() - SIGHTING_COOLDOWN_MS;
  const out = {};
  for (const [hex, kinds] of lastCountedAt) {
    if (Object.values(kinds).some(ts => ts > cutoff)) out[hex] = kinds;
    else lastCountedAt.delete(hex);
  }
  try { localStorage.setItem(COUNTED_KEY, JSON.stringify(out)); } catch (e) {}
}
addEventListener('pagehide', saveLastCounted);

function recordSightingOnce(hex, kind) {
  const now = Date.now();
  const last = lastCountedAt.get(hex) || {};
  if (last[kind] !== undefined && now - last[kind] < SIGHTING_COOLDOWN_MS) return;
  lastCountedAt.set(hex, { ...last, [kind]: now });
  if (!countedSaveTimer) countedSaveTimer = setTimeout(saveLastCounted, 15000);
  recordSighting(hex, kind);
}

async function loadSightingCounts() {
  try {
    const res = await fetch(SIGHTING_STORE_URL, { cache: 'no-store' });
    const data = await res.json();
    if (data && typeof data === 'object') {
      for (const [hex, counts] of Object.entries(data)) sightingCounts.set(hex, counts);
    }
  } catch (e) {
    // sighting-store unavailable -- counts start/stay empty for this session, purely cosmetic either way
  }
}

// Updates the local view immediately (so this session's own label/panel
// stay responsive without waiting on a round-trip) and separately
// fire-and-forgets a POST so the increment is shared and persisted --
// same split responsibility as commitApproachTrack above. The server's
// response (the authoritative post-increment counts) overwrites the local
// guess once it arrives, reconciling any drift from other viewers
// incrementing the same hex concurrently.
function recordSighting(hex, kind) {
  const current = sightingCounts.get(hex) || { total: 0, nearby: 0 };
  sightingCounts.set(hex, { ...current, [kind]: (current[kind] || 0) + 1 });
  fetch(SIGHTING_STORE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hex, kind }) })
    .then(res => res.ok ? res.json() : null)
    .then(counts => { if (counts) sightingCounts.set(hex, counts); })
    .catch(e => {}); // sighting-store unavailable -- this session's own optimistic count stands, just won't be shared
}

// ---- Flight statistics ---------------------------------------------
// The counts above answer "have I seen this one before?". These answer the
// questions the Statistics screens ask of the whole accumulated history: who
// flies over this house (commercial / private / military), what flies over it
// (jets / props / helicopters), how much of it actually comes close, and what
// the extremes have been.
//
// Classification happens here rather than on the server because this is where
// it is already known -- the callsign gives the operator, the type database
// gives the airframe -- and the store has neither. The store only keeps and
// aggregates what it is told.
const FLIGHT_STATS_URL = '/sightings/stats';
let flightStats = null;      // last aggregate; null until the first load

async function loadFlightStats() {
  try {
    const res = await fetch(FLIGHT_STATS_URL, { cache: 'no-store' });
    if (res.ok) flightStats = await res.json();
  } catch (e) {
    // store unavailable -- the Statistics screens say so rather than
    // rendering a page of zeroes that looks like "nothing has ever flown over"
  }
  return flightStats;
}

// A history collected before classification existed is not a lost cause. The
// airframe can be recovered from the hex alone, using the same type database
// that already decides each blip's shape on the radar -- 3,000-odd aircraft
// that would otherwise sit in "not identified" forever. The operator cannot
// be: that needs the callsign, which the old store never kept, so those
// aircraft stay unidentified on the operator screen and the screen says so.
//
// Self-terminating by construction: the device only ever hands back aircraft
// that still lack an airframe, so once the backlog is done this costs exactly
// one request. Deliberately unhurried -- it is filling in history nobody is
// waiting on, on a Pi that is already close to its thermal limit.
const BACKFILL_START_DELAY_MS = 30 * 1000;
const BACKFILL_CHUNK_PAUSE_MS = 2000;
const BACKFILL_MAX_ROUNDS = 16;

async function backfillClassifications() {
  for (let round = 0; round < BACKFILL_MAX_ROUNDS; round++) {
    let list;
    try {
      const res = await fetch('/sightings/unclassified', { cache: 'no-store' });
      if (!res.ok) return;
      list = await res.json();
    } catch (e) {
      return;   // store unreachable; nothing to do and nothing to report
    }
    const hexes = (list && list.hexes) || [];
    if (!hexes.length) return;   // backlog cleared
    const batch = [];
    for (const hex of hexes) {
      const info = await lookupType(hex);
      batch.push({ hex, class: {
        // An aircraft the database has never heard of resolves to 'unknown',
        // which is itself a recorded answer -- so it leaves the backlog
        // rather than being asked about again on every future load.
        k: classifyAircraft({ typeDesc: info.desc, wtc: info.wtc, category: null }),
        // militaryOperator reads the address block, not the callsign, so this
        // much of the operator class survives the missing callsign.
        op: militaryOperator(hex) ? 'mil' : null,
      } });
    }
    try {
      await fetch(SIGHTING_STORE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ batch }),
      });
    } catch (e) {
      return;
    }
    if (!list.remaining) return;
    await new Promise(r => setTimeout(r, BACKFILL_CHUNK_PAUSE_MS));
  }
}

function postSighting(body) {
  return fetch(SIGHTING_STORE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).catch(e => null);   // same tolerance as recordSighting: it is a counter, not a transaction
}

// Military outranks the callsign deliberately: a military airframe flying
// something that parses as an airline flight number is still military, and
// militaryOperator() keys off the hex block, which cannot be spoofed by a
// callsign the crew typed in.
function operatorClassOf(pl) {
  if (militaryOperator(pl.hex)) return 'mil';
  if (pl.airlineIcao && AIRLINES[pl.airlineIcao]) return 'com';
  if (pl.airlineLabel === PRIVATE_LABEL) return 'pri';
  return null;   // callsign not decoded yet -- nothing honest to say, ask again next poll
}

// Sent twice over a normal aircraft's life: once at first sight, when the
// callsign already says who is flying, and again when the type database
// resolves and the airframe is known. The store keeps the last valid value
// per field, so the second call upgrades "unclassified" to "helicopter"
// without the first having been wrong.
const classifiedAs = new Map();  // hex -> signature last sent, so a steady aircraft posts once
function classifySighting(pl) {
  if (!pl) return;
  const op = operatorClassOf(pl);
  const k = classifyAircraft(pl);
  const cs = pl.hasCallsign ? pl.cs : null;
  const sig = `${op}|${k}|${cs}`;
  if (classifiedAs.get(pl.hex) === sig) return;      // nothing new to say
  if (!op && k === 'unknown' && !cs) return;         // nothing to say at all
  classifiedAs.set(pl.hex, sig);
  postSighting({ hex: pl.hex, class: { op, k, cs } });
}

// All-time extremes. Offered from here because range, altitude and speed are
// already computed here, but *decided* on the server, which holds the standing
// record -- so the same 142nm contact offered by four open viewers is recorded
// once. recordsOffered is this session's own high-water mark, which stops a
// plane that beats the record from re-posting on every poll of its pass.
const recordsOffered = { far: 0, near: Infinity, high: 0, fast: 0 };
function noteFlightRecords(pl) {
  // Without a baseline every session's first aircraft would look like a
  // record and post one. Wait for the standing values instead.
  if (!pl || !flightStats) return;
  const standing = flightStats.records || {};
  const offer = {};
  const consider = (key, value, higherWins) => {
    if (typeof value !== 'number' || !isFinite(value) || value <= 0) return;
    const held = standing[key] && typeof standing[key].v === 'number'
      ? standing[key].v : (higherWins ? 0 : Infinity);
    const best = higherWins ? Math.max(held, recordsOffered[key])
                            : Math.min(held, recordsOffered[key]);
    if (higherWins ? value > best : value < best) {
      offer[key] = Math.round(value * 10) / 10;
      recordsOffered[key] = value;
    }
  };
  consider('far', pl.range, true);
  consider('near', pl.range, false);
  consider('high', typeof pl.alt === 'number' ? pl.alt : null, true);  // 'ground' is not an altitude
  consider('fast', pl.speed, true);
  if (Object.keys(offer).length) postSighting({ hex: pl.hex, rec: offer });
}

// Called once per poll (not per animation frame -- this wants real GPS
// fixes, not smoothed/eased blip positions) for each tracked aircraft.
// Buffers candidate points on `pl` while a plane is plausibly on approach
// to RDU (within radius, below a normal-approach altitude ceiling), and
// commits that buffer to the persistent store once the plane is confirmed
// to have actually landed -- either it reaches 'ground' status close in, or
// (since ADS-B reception commonly drops out right at touchdown, especially
// before a receiving antenna is mast-mounted) it disappears close to the
// field at low altitude. If instead it climbs back out or flies back away
// without either signal, the buffer is discarded -- overflights and
// go-arounds shouldn't shape the picture, only real landings.
function updateApproachTracking(pl, lat, lon, alt) {
  if (typeof lat !== 'number' || typeof lon !== 'number') return;
  if (!pl.approachPoints) pl.approachPoints = [];

  const airportRange = haversineBearingRange(AIRPORT.lat, AIRPORT.lon, lat, lon).range;

  if (alt === 'ground' && airportRange <= AIRPORT_APPROACH_CONFIRM_RADIUS_NM) {
    commitApproachTrack(pl.approachPoints);
    pl.approachPoints = [];
    return;
  }

  const withinRadius = airportRange <= AIRPORT_APPROACH_RADIUS_NM;
  const belowCeiling = typeof alt === 'number' && alt <= approachCeilingFt();
  if (withinRadius && belowCeiling) {
    pl.approachPoints.push([lon, lat]);
    if (pl.approachPoints.length > 400) pl.approachPoints.shift(); // bound per-plane buffer
  } else if (pl.approachPoints.length) {
    pl.approachPoints = []; // climbed out or flew away without landing -- not a real approach
  }
}

// Called when a coasted-out plane is finally dropped from tracking (see
// applyUpdate) -- catches the common case where ADS-B signal is lost right
// at/just before touchdown rather than readsb ever reporting 'ground'.
function confirmApproachOnDrop(pl) {
  if (!pl.approachPoints || !pl.approachPoints.length) return;
  if (typeof pl.alt !== 'number' || pl.alt > approachConfirmAltFt()) return;
  // The raw fix, not the dead-reckoned position: this asks "was it over the
  // field when we lost it", and the fix is the only part of that we actually
  // observed. Extrapolating a lost contact up to DR_MAX_S forward could
  // carry it clean past the confirmation radius and discard a real landing.
  const lat = pl.fixLat ?? pl.lat, lon = pl.fixLon ?? pl.lon;
  if (lat == null || lon == null) return;
  if (haversineBearingRange(AIRPORT.lat, AIRPORT.lon, lat, lon).range > AIRPORT_APPROACH_CONFIRM_RADIUS_NM) return;
  commitApproachTrack(pl.approachPoints);
}

function formatLoc() {
  if (!home) return 'LOCATING…';
  const ns = home.lat >= 0 ? 'N' : 'S';
  const ew = home.lon >= 0 ? 'E' : 'W';
  return `${Math.abs(home.lat).toFixed(4)}°${ns} ${Math.abs(home.lon).toFixed(4)}°${ew} · ${RANGE_NM}NM`;
}

// ---- Background map --------------------------------------------------
// Zoom level whose ground scale at `lat` matches RANGE_NM across R pixels,
// so the map's visible extent lines up with the radar's outer ring.
// rPixels must be real CSS/DOM pixels, not canvas-internal units -- MapLibre's
// zoom is calibrated against the container's actual rendered size, which only
// equals the canvas's fixed 1080-unit internal resolution (R) when the stage
// happens to render at exactly 1080 CSS px. True on the physical 1080x1080
// kiosk panel (which is why this went unnoticed there), but not for anyone
// viewing the same page at a different size via the Tailscale Funnel URL.
function zoomForRange(rangeNm, lat, rPixels) {
  const metersPerPixel = (rangeNm * 1852) / rPixels;
  // 156543.03392 is meters-per-pixel-at-zoom-0 for the classic 256px slippy-
  // tile convention (earth circumference / 256). MapLibre/Mapbox GL define
  // zoom for 512px tiles instead (whole world = 512px at zoom 0), so a zoom
  // computed straight from the 256px constant renders one level too far in
  // -- barely visible right at `home` (zero range), but growing fast with
  // distance, since it's a per-nm scale error not a fixed offset. That's
  // what made real ground features (e.g. RDU's runways) drift further and
  // further from where the radar independently plots aircraft at the same
  // true bearing/range, the farther out you looked -- the "-1" corrects for
  // the doubled tile size (2x pixels per tile = 1 fewer zoom level needed).
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / metersPerPixel) - 1;
}

// ---- Map style: online, with an on-device fallback -------------------------
// The live basemap comes from one free service. When it can't be reached --
// no internet yet after a power cut, the service down, or gone for good --
// the map falls back to an extract of this unit's own area stored on the
// device (deploy/offline-map.py builds it whenever the location is set or
// changed, and serves it at /offline-map/). The fallback style below reuses
// the online style's layer ids for everything the themes touch ('water',
// 'label_city', ...), so recolorLabels() and the Retro Radar water fix work
// on either.
const OFFLINE_MAP_BASE = '/offline-map/';
const ONLINE_STYLE_TIMEOUT_MS = 10 * 1000;
const ONLINE_TILE_CHECK_MS = 45 * 1000;
const ONLINE_RECHECK_MS = 20 * 60 * 1000;
let mapIsOffline = false;
let mapStarting = false;

async function fetchOnlineStyle() {
  try {
    const res = await fetch(MAP_STYLE_URL, { signal: AbortSignal.timeout(ONLINE_STYLE_TIMEOUT_MS) });
    if (!res.ok) return null;
    const style = await res.json();
    return style && style.version && style.sources ? style : null;
  } catch (e) {
    return null;
  }
}

async function fetchOfflineMeta() {
  try {
    const res = await fetch(OFFLINE_MAP_BASE + 'meta.json', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
    return res.ok ? await res.json() : null;
  } catch (e) {
    return null;
  }
}

// Colours follow the online style's light basemap (cream land, mid-blue
// water, darker road casings) on purpose: every theme's --map-filter was
// tuned against that polarity, Retro Radar's invert() above all, so a
// fallback drawn any other way would look wrong under every theme but one.
function offlineStyle(meta) {
  const base = location.origin + OFFLINE_MAP_BASE;
  const kind = ['get', 'kind'];
  const detail = ['get', 'kind_detail'];
  const name = ['get', 'name'];
  const label = (id, filter, size, extra = {}) => ({
    id, type: 'symbol', source: 'offline', 'source-layer': 'places', filter,
    layout: {
      'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': size,
      'text-max-width': 8,
      'symbol-sort-key': ['-', 20, ['coalesce', ['get', 'population_rank'], 0]],
      ...extra,
    },
    paint: { 'text-color': '#333333', 'text-halo-color': '#ffffff', 'text-halo-width': 1.2 },
  });
  const road = (id, kinds, color, widths, minzoom = 0) => ({
    id, type: 'line', source: 'offline', 'source-layer': 'roads', minzoom,
    filter: ['in', kind, ['literal', kinds]],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': color, 'line-width': ['interpolate', ['linear'], ['zoom'], ...widths] },
  });
  return {
    version: 8,
    glyphs: base + 'fonts/{fontstack}/{range}.pbf',
    sources: {
      offline: {
        type: 'vector',
        tiles: [base + 'tiles/{z}/{x}/{y}.pbf'],
        minzoom: meta.minzoom ?? 0,
        maxzoom: meta.maxzoom ?? 11,
        attribution: meta.attribution || '© OpenStreetMap contributors',
      },
    },
    layers: [
      { id: 'background', type: 'background', paint: { 'background-color': '#f8f4f0' } },
      { id: 'landcover', type: 'fill', source: 'offline', 'source-layer': 'landcover',
        paint: { 'fill-color': ['match', kind,
          ['forest', 'wood'], '#d6e6c4',
          ['grassland', 'scrub', 'farmland'], '#e6eed8',
          'urban_area', '#ebe6df',
          '#f8f4f0'], 'fill-opacity': 0.7 } },
      { id: 'water', type: 'fill', source: 'offline', 'source-layer': 'water',
        filter: ['==', ['geometry-type'], 'Polygon'],
        paint: { 'fill-color': 'rgb(158, 189, 255)' } },
      { id: 'waterway', type: 'line', source: 'offline', 'source-layer': 'water',
        filter: ['==', ['geometry-type'], 'LineString'],
        paint: { 'line-color': '#a0c8f0', 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 0.5, 12, 1.5] } },
      { id: 'boundary', type: 'line', source: 'offline', 'source-layer': 'boundaries',
        paint: { 'line-color': '#9e9cab', 'line-width': 1, 'line-dasharray': [3, 2] } },
      road('road_minor', ['minor_road', 'other'], '#d6d0c8', [9, 0.3, 12, 1.2], 9),
      road('road_medium_casing', ['medium_road'], '#c4bdb3', [8, 0.8, 12, 3]),
      road('road_medium', ['medium_road'], '#ffffff', [8, 0.4, 12, 2]),
      road('road_major_casing', ['major_road'], '#c9a877', [6, 1, 12, 4]),
      road('road_major', ['major_road'], '#fff1b8', [6, 0.5, 12, 3]),
      road('road_highway_casing', ['highway'], '#d18f52', [5, 1.2, 12, 5]),
      road('road_highway', ['highway'], '#ffcc88', [5, 0.7, 12, 3.8]),
      { id: 'water_name_point_label', type: 'symbol', source: 'offline', 'source-layer': 'water',
        filter: ['all', ['==', ['geometry-type'], 'Point'], ['has', 'name']],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Italic'], 'text-size': 11, 'text-max-width': 8 },
        paint: { 'text-color': '#1d5fa8', 'text-halo-color': '#ffffff', 'text-halo-width': 1 } },
      label('label_other', ['in', detail, ['literal', ['hamlet', 'suburb', 'quarter', 'neighbourhood', 'isolated_dwelling']]], 10, { 'text-transform': 'uppercase', 'text-letter-spacing': 0.08 }),
      label('label_village', ['==', detail, 'village'], 11),
      label('label_town', ['==', detail, 'town'], 12.5),
      label('label_city', ['all', ['==', detail, 'city'], ['!', ['has', 'capital']]], 14.5),
      label('label_city_capital', ['all', ['==', kind, 'locality'], ['has', 'capital']], 15.5),
    ],
  };
}

// Picks the style, then builds the map. Async (both checks are network
// round trips), so a second call while one is in flight is ignored rather
// than building two maps into the same container.
async function initMap() {
  if (!home || map || mapStarting) return;
  mapStarting = true;
  try {
    const online = await fetchOnlineStyle();
    const meta = online ? null : await fetchOfflineMeta();
    if (!home || map) return;
    if (online) createMap(online, false);
    else if (meta) createMap(offlineStyle(meta), true);
    // Neither: try the online URL anyway, and let the load timeout below
    // retry with backoff -- there is nothing better to show.
    else createMap(MAP_STYLE_URL, false);
  } finally {
    mapStarting = false;
  }
}

function replaceMap() {
  if (!map) return;
  try { map.remove(); } catch (e) {}
  map = null;
  clearTimeout(mapLoadTimer);
}

// The start-up logo (#splash): up for at least 2 s, then gone as soon as the
// map has drawn -- or after 8 s whatever happens, so a map that never loads
// (offline, or switched off) can't leave the logo over the radar.
const SPLASH_SHOWN_AT = performance.now();
function hideSplash() {
  const el = document.getElementById('splash');
  if (!el || el.classList.contains('done')) return;
  setTimeout(() => {
    el.classList.add('done');
    setTimeout(() => { el.style.display = 'none'; }, 1000);
  }, Math.max(0, 2000 - (performance.now() - SPLASH_SHOWN_AT)));
}
setTimeout(hideSplash, 8000);

function createMap(style, offline) {
  mapIsOffline = offline;
  // Initial zoom, calibrated against the stage's CSS size at this moment --
  // the resize listener below recalibrates this the same way if the window
  // is resized later (e.g. via the Funnel URL).
  const rCss = R * (stage.getBoundingClientRect().width / W);
  map = new maplibregl.Map({
    container: 'mapbg',
    style,
    center: [home.lon, home.lat],
    zoom: zoomForRange(RANGE_NM, home.lat, rCss),
    interactive: false,
    attributionControl: { compact: true },
  });
  // The vector tileset's own aeroway (runway/taxiway) layers simply carry no
  // geometry at this low a zoom (confirmed via queryRenderedFeatures — the
  // tiles are generated without that detail below ~z11, independent of the
  // style's minzoom setting), so raising the zoom gate there does nothing.
  // Runway outlines instead come from an OpenStreetMap Overpass query
  // (retried a few times on failure), added as our own GeoJSON layer — see
  // loadRunways(). loadCachedRunways() renders a previous successful
  // result immediately, if one exists, while loadRunways() still runs
  // regardless to refresh it in the background.
  map.once('idle', hideSplash);
  map.on('load', loadCachedRunways);
  map.on('load', loadRunways);
  map.on('load', recolorLabels);
  map.on('load', refreshStorms);
  map.on('load', refreshLightning);
  map.on('load', initApproachLayer);

  // If 'load' hasn't fired in time, throw this map away and build a fresh
  // one, backing off so a dead tile host isn't hammered. A failure used to be
  // permanent until the next page reload: after a power cut the kiosk often
  // starts before WiFi is up, leaving a blank disc for hours.
  const thisMap = map;
  map.on('load', () => { clearTimeout(mapLoadTimer); mapRetryMs = MAP_RETRY_MIN_MS; });
  clearTimeout(mapLoadTimer);
  armMapLoadTimer(thisMap);

  // The style can load while every tile fails (the tile host down behind a
  // style that still resolves), and MapLibre still fires 'load' -- a blank
  // disc that the timeout above never catches. If nothing from the online
  // tile source has arrived after a while but errors have, fall back.
  // Only the basemap's own sources count: storm and lightning tiles load
  // into the same map and would otherwise mask a dead basemap.
  if (!offline && typeof style === 'object') {
    const baseSources = new Set(Object.keys(style.sources || {}));
    let tilesOk = 0, tileErrors = 0;
    map.on('sourcedata', e => { if (e.tile && baseSources.has(e.sourceId)) tilesOk++; });
    map.on('error', e => { if (baseSources.has(e.sourceId)) tileErrors++; });
    setTimeout(async () => {
      if (map !== thisMap || tilesOk > 0 || tileErrors === 0) return;
      const meta = await fetchOfflineMeta();
      if (!meta || map !== thisMap) return;
      replaceMap();
      createMap(offlineStyle(meta), true);
    }, ONLINE_TILE_CHECK_MS);
  }
}
const MAP_LOAD_TIMEOUT_MS = 60 * 1000;
const MAP_RETRY_MIN_MS = 15 * 1000;
const MAP_RETRY_MAX_MS = 10 * 60 * 1000;
let mapRetryMs = MAP_RETRY_MIN_MS;
let mapLoadTimer = null;
let mapRetryTimer = null;

// A hidden page gets no animation frames, and MapLibre cannot finish loading
// without them -- which is the kiosk's normal state whenever the screensaver
// has powered the panel off (the 04:00 restart always lands there). Counting
// that as a failure tore the map down every minute all night and backed the
// retry off to 10 minutes, so whoever woke the screen could wait that long
// for a map. Hidden time is not failure: re-arm and wait, and let becoming
// visible (below) restart the clock.
function armMapLoadTimer(thisMap) {
  clearTimeout(mapLoadTimer);
  mapLoadTimer = setTimeout(() => {
    if (map !== thisMap || thisMap.loaded()) return;
    if (document.visibilityState === 'hidden') { armMapLoadTimer(thisMap); return; }
    replaceMap();
    clearTimeout(mapRetryTimer);
    mapRetryTimer = setTimeout(initMap, mapRetryMs);
    mapRetryMs = Math.min(mapRetryMs * 2, MAP_RETRY_MAX_MS);
  }, MAP_LOAD_TIMEOUT_MS);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !home) return;
  if (map && !map.loaded()) {
    armMapLoadTimer(map);                 // a full timeout now that it can load
  } else if (!map && !mapStarting) {
    // Waiting out a retry backoff: someone is looking, so try now.
    clearTimeout(mapRetryTimer);

      ly = Math.max(2, Math.min(stageRect.height - p.labelH - 2, hudBottom));
    }
    p.labelX = lx;
    p.labelY = ly;
    p.node.style.left = lx + 'px';
    p.node.style.top = ly + 'px';
    p.node.style.opacity = p.opacity;

    const attach = closestPointOnRect(p.anchorX, p.anchorY, lx, ly, p.labelW, p.labelH);
    const attachX = attach.x, attachY = attach.y;

    let line = leaderNodes.get(p.hex);
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      leadersEl.appendChild(line);
      leaderNodes.set(p.hex, line);
    }
    line.setAttribute('x1', p.anchorX);
    line.setAttribute('y1', p.anchorY);
    line.setAttribute('x2', attachX);
    line.setAttribute('y2', attachY);
    line.setAttribute('stroke', p.color);
    line.style.opacity = LEADER_BASE_OPACITY * p.opacity; // preserve the CSS base opacity, just scaled by coast fade
  }

  // remove tag/leader nodes for aircraft no longer tracked or out of range
  for (const [hex, node] of tagNodes) {
    const pl = planes.get(hex);
    if (!pl || pl.range > RANGE_NM) {
      node.remove();
      tagNodes.delete(hex);
      const line = leaderNodes.get(hex);
      if (line) { line.remove(); leaderNodes.delete(hex); }
    }
  }

  countEl.textContent = inRange.length + (inRange.length === 1 ? ' AIRCRAFT' : ' AIRCRAFT');
}

function updateStatus() {
  const now = performance.now();
  const stale = !connected || (now - lastGoodFetch) > STALE_MS;
  statusEl.classList.toggle('show', stale);

  if ((now - lastGoodFetch) > DROP_MS && planes.size > 0) {
    planes.clear();
    for (const node of tagNodes.values()) node.remove();
    tagNodes.clear();
  }
}

// ---- Main loop -------------------------------------------------
let lastFrameTs = performance.now();

function tick(ts) {
  const dt = Math.min(0.25, Math.max(0, (ts - lastFrameTs) / 1000)); // seconds, clamped
  lastFrameTs = ts;

  ctx.clearRect(0, 0, W, H);
  drawRings();
  drawSweep();
  drawTrails();
  drawPlanes(dt);
  updateStatus();

  sweepAngle += SWEEP_SPEED;
  if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;

  requestAnimationFrame(tick);
}

// ---- Touch interaction --------------------------------------------------
// Tap a plane's blip or label -> detail panel with fields the compact tag
// doesn't show (registration, heading, vertical rate, squawk, precise
// range/bearing). Tap empty space -> toggle the storm radar overlay.
const toastEl = document.getElementById('toast');
const detailPanelEl = document.getElementById('detailPanel');
const detailBackdropEl = document.getElementById('detailBackdrop');
let toastTimer = null;
let detailDismissTimer = null;

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

function vrateLabel(vrate) {
  if (vrate === null) return '—';
  if (Math.abs(vrate) < 100) return 'Level';
  return (vrate > 0 ? '↑ ' : '↓ ') + Math.abs(Math.round(vrate)) + ' ft/min';
}

let detailPanelHex = null; // guards against a photo fetch resolving after the panel moved on to a different plane (or closed)

function showDetailPanel(p, isAlert = false) {
  detailPanelHex = p.hex;
  const speedTxt = p.speed === null ? '—' : Math.round(p.speed) + ' kt';
  const altTxt = p.alt === 'ground' ? 'On ground' : (p.alt === null ? '—' : `${p.alt.toLocaleString()} ft`);
  const hdgTxt = p.realHdg != null ? Math.round(p.realHdg) + '°' : '—';
  const rangeTxt = `${p.range.toFixed(1)} nm · ${Math.round(p.bearing)}°`;
  const route = routeCache.get(p.cs);
  const routeTxt = route ? (route.plausible ? route.text : `${route.text} (unconfirmed)`) : null;
  const subtitle = [p.typeLabel || 'Unknown type', p.registration].filter(Boolean).join(' · ');
  const isPrivate = p.airlineLabel === PRIVATE_LABEL;
  const counts = sightingCounts.get(p.hex) || { total: 0, nearby: 0 };

  detailPanelEl.innerHTML = `
    <div class="dp-close">&times;</div>

    <div class="dp-photo" style="display:none"></div>
    <div class="dp-cs" style="color:${p.color}">${esc(p.cs)}</div>
    <div class="dp-badge" style="background:${p.badgeColor}">${esc(p.airlineLabel)}</div>
    <div class="dp-type">${esc(subtitle)}</div>
    ${isPrivate ? `<div class="dp-owner" style="display:none"></div>` : ''}
    ${routeTxt ? `<div class="dp-route${route.plausible ? '' : ' implausible'}">${esc(routeTxt)}</div>` : ''}
    <div class="dp-grid">
      <div class="dp-field"><div class="dp-label">Altitude</div><div class="dp-value">${altTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Speed</div><div class="dp-value">${speedTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Heading</div><div class="dp-value">${hdgTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Vert. rate</div><div class="dp-value">${vrateLabel(p.vrate)}</div></div>
      <div class="dp-field"><div class="dp-label">Squawk</div><div class="dp-value">${p.squawk ?? '—'}</div></div>
      <div class="dp-field"><div class="dp-label">Range / Brg</div><div class="dp-value">${rangeTxt}</div></div>
      <div class="dp-field"><div class="dp-label">Sightings</div><div class="dp-value">${counts.total}</div></div>
      <div class="dp-field"><div class="dp-label">Within 2mi</div><div class="dp-value">${counts.nearby}</div></div>
    </div>
  `;
  detailPanelEl.classList.add('show');
  detailPanelEl.classList.toggle('alert', isAlert);
  detailBackdropEl.classList.add('show');
  clearTimeout(detailDismissTimer);
  detailDismissTimer = setTimeout(hideDetailPanel, 18000);
  loadDetailPhoto(p.hex);
  if (isPrivate) loadOwner(p.hex);
}

// Registered-owner lookup for confirmed-private aircraft (a real callsign
// that just doesn't match the airline flight-number pattern -- not the
// "Identifying..." case, which isn't confirmed as anything yet). adsbdb.com
// aggregates public aircraft registry data -- the FAA's releasable registry
// for US tails, plus other countries' equivalents -- behind a free, no-key
// API, same class of source as everything else this app already leans on
// (adsb.im, planespotters, Wikipedia, Overpass, RainViewer). Queried by hex
// rather than parsing a registration out of the callsign, since we always
// have the hex and it's exactly what readsb already identifies the plane by.
// Only a real answer (found, or a confirmed 404 -- not in the registry) gets
// cached; a network hiccup doesn't, so it just retries next time the panel
// opens, same reasoning as lookupStockPhoto above.
async function lookupOwner(hex) {
  if (ownerCache.has(hex)) return ownerCache.get(hex);
  try {
    const res = await fetch(`https://api.adsbdb.com/v0/aircraft/${hex}`);
    if (res.status === 404) { ownerCache.set(hex, null); return null; }
    if (!res.ok) return null;
    const data = await res.json();
    const owner = data?.response?.aircraft?.registered_owner || null;
    ownerCache.set(hex, owner);
    return owner;
  } catch (e) {
    return null;
  }
}

async function loadOwner(hex) {
  const owner = await lookupOwner(hex);
  if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
  if (!owner) return;
  const ownerEl = detailPanelEl.querySelector('.dp-owner');
  if (!ownerEl) return;
  ownerEl.textContent = `Registered to ${owner}`;
  ownerEl.style.display = 'block';
}

// Photo comes from planespotters.net via our own same-origin /photo/<hex>
// proxy (see deploy/photo-proxy.py) -- their API requires a descriptive
// custom User-Agent that browser fetch() can never set itself. Shown as
// plain, non-clickable text credit rather than a real link: this same page
// also runs unattended in the kiosk's Chromium, and a tap-driven navigation
// away from the app with no way back isn't an acceptable risk there, even
// though a normal browser tab (e.g. via the Funnel URL) would handle it
// fine. Per planespotters.net's terms of use, attribution (photographer
// credit + naming the source) is still given either way.
// Generic silhouette (Google Material Icons "flight" glyph, Apache-2.0)
// shown in place of a real photo when planespotters.net has none on file --
// drawn inline so it needs no network fetch and matches the panel's theme.
const PLACEHOLDER_PHOTO_SVG = `
  <svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="dpPhBg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#141c1f"/>
        <stop offset="100%" stop-color="#0a0d0f"/>
      </linearGradient>
    </defs>
    <rect width="400" height="220" fill="url(#dpPhBg)"/>
    <circle cx="200" cy="104" r="90" fill="none" stroke="var(--ring)" stroke-width="1"/>
    <circle cx="200" cy="104" r="55" fill="none" stroke="var(--ring)" stroke-width="1"/>
    <circle cx="200" cy="104" r="20" fill="none" stroke="var(--ring)" stroke-width="1"/>
    <g transform="translate(170,74) scale(2.5)" fill="var(--text-dim)">
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5l8 2.5z"/>
    </g>
  </svg>
`;

function showPlaceholderPhoto(photoEl) {
  photoEl.innerHTML = PLACEHOLDER_PHOTO_SVG + '<div class="dp-photo-credit">No photo available</div>';
  photoEl.style.display = 'block';
}

// Most tracked tails (private/GA especially) have no dedicated planespotters
// photo -- rather than always falling back to the generic silhouette, try a
// representative photo of the aircraft *type* instead (e.g. any Cessna 172,
// not necessarily this exact tail). Wikipedia/Wikimedia Commons, the same
// free/no-key-required class of source as adsb.im's routes, RainViewer's
// radar, and Overpass's runways elsewhere in this file. Cached per type
// string (typeLabel), not per hex, since many tails share a type -- one
// lookup covers every Cessna 172 this receiver ever sees. Clearly labeled
// "Representative photo" (a badge on the image itself, not just the credit
// line) so it's never mistaken for a real photo of that specific airframe --
// unlike the planespotters credit above, this isn't a specific photographer
// crediting a specific photo of a specific plane, so a "site name + link"
// level of attribution (same non-clickable-text treatment as planespotters,
// same kiosk-navigation-safety reasoning) felt like the right proportional
// effort here, not full Commons per-image license/author boilerplate.
async function lookupStockPhoto(typeLabel) {
  if (stockPhotoCache.has(typeLabel)) return stockPhotoCache.get(typeLabel);
  if (stockPhotoPending.has(typeLabel)) return null;
  stockPhotoPending.add(typeLabel);
  let result = null;
  try {
    // action=query&list=search (full-text search over article content) --
    // NOT action=opensearch, which only prefix-matches page *titles* and
    // badly undershoots real hit rate: e.g. our own typeLabel string
    // "Bombardier Regional Jet CRJ-900" doesn't share a common prefix with
    // Wikipedia's actual title "Bombardier CRJ" (opensearch: no match), but
    // full-text search finds it fine since the words all appear in the
    // article regardless of order. Confirmed via a real browser fetch (not
    // curl) that this endpoint honors CORS and doesn't require special
    // headers for ordinary, human-paced usage.
    const searchRes = await fetch(
      `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(typeLabel)}&srlimit=1&format=json&origin=*`,
      { cache: 'force-cache' }
    );
    const searchData = await searchRes.json();
    const title = searchData.query && searchData.query.search && searchData.query.search[0] && searchData.query.search[0].title;
    if (title) {
      const sumRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`, { cache: 'force-cache' });
      const sumData = await sumRes.json();
      const thumb = sumData.thumbnail && sumData.thumbnail.source;
      const page = sumData.content_urls && sumData.content_urls.desktop && sumData.content_urls.desktop.page;
      if (thumb) result = { thumb, page: page || null };
    }
  } catch (e) {
    // offline or Wikipedia unavailable this attempt -- caller falls back to
    // the placeholder, but see below: not cached, so a later reopen retries
  }
  // Only successful lookups are cached, deliberately -- caching a null here
  // would mean one transient failure (a network hiccup, a momentary
  // Wikipedia rate-limit) permanently shows the placeholder for that whole
  // aircraft type for the rest of the session, never retried, the exact
  // failure mode loadRunways() had before its retry fix. Unlike runways
  // (fetched once automatically at page load), this only ever runs on a
  // tap, so an occasional repeat lookup for a type that's genuinely not on
  // Wikipedia is cheap and bounded by how often someone taps that type,
  // same tradeoff already made for the specific-tail planespotters photo
  // lookup above, which also isn't cached and re-fetches every open.
  if (result) stockPhotoCache.set(typeLabel, result);
  stockPhotoPending.delete(typeLabel);
  return result;
}

// Photo comes from planespotters.net via our own same-origin /photo/<hex>
// proxy (see deploy/photo-proxy.py) -- their API requires a descriptive
// custom User-Agent that browser fetch() can never set itself. Shown as
// plain, non-clickable text credit rather than a real link: this same page
// also runs unattended in the kiosk's Chromium, and a tap-driven navigation
// away from the app with no way back isn't an acceptable risk there, even
// though a normal browser tab (e.g. via the Funnel URL) would handle it
// fine. Per planespotters.net's terms of use, attribution (photographer
// credit + naming the source) is still given either way.
async function tryStockPhoto(hex, photoEl) {
  const typeLabel = planes.get(hex)?.typeLabel;
  if (!typeLabel) { showPlaceholderPhoto(photoEl); return; }
  const stock = await lookupStockPhoto(typeLabel);
  if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
  if (!stock) { showPlaceholderPhoto(photoEl); return; }
  photoEl.innerHTML = `
    <div class="dp-photo-badge">Representative photo</div>
    <img src="${esc(stock.thumb)}" alt="${esc(typeLabel)} (representative photo, not this specific aircraft)">
    <div class="dp-photo-credit">${esc(typeLabel)} · Wikipedia</div>
  `;
  photoEl.style.display = 'block';
}

async function loadDetailPhoto(hex) {
  const photoEl = detailPanelEl.querySelector('.dp-photo');
  if (!photoEl) return;
  try {
    const res = await fetch(`/photo/${hex}`, { cache: 'no-store' });
    const data = await res.json();
    if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
    if (!data.found) { await tryStockPhoto(hex, photoEl); return; }
    photoEl.innerHTML = `
      <img src="${esc(data.thumbLarge || data.thumb)}" alt="${esc(detailPanelEl.querySelector('.dp-cs')?.textContent || 'Aircraft')} photo">
      <div class="dp-photo-credit">© ${esc(data.photographer || 'Unknown')} · planespotters.net</div>
    `;
    photoEl.style.display = 'block';
  } catch (e) {
    if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return;
    await tryStockPhoto(hex, photoEl);
  }
}

function hideDetailPanel() {
  detailPanelHex = null;
  detailPanelEl.classList.remove('show');
  detailPanelEl.classList.remove('alert');
  detailBackdropEl.classList.remove('show');
  clearTimeout(detailDismissTimer);
}

function findPlaneAtStagePoint(x, y) {
  const HIT_RADIUS = 22; // px, around the blip anchor
  // when two hit targets overlap (close blips, or a blip under a neighbor's
  // label), pick whichever plane's own blip is nearest the tap rather than
  // just the first match in Map iteration order
  let best = null, bestDistSq = Infinity;
  for (const p of planes.values()) {
    if (p.range > RANGE_NM) continue;
    const dx = x - p.anchorX, dy = y - p.anchorY;
    const distSq = dx * dx + dy * dy;
    const hitBlip = distSq <= HIT_RADIUS * HIT_RADIUS;
    const hitLabel = p.labelX !== undefined && x >= p.labelX && x <= p.labelX + p.labelW && y >= p.labelY && y <= p.labelY + p.labelH;
    if (!hitBlip && !hitLabel) continue;
    if (distSq < bestDistSq) { bestDistSq = distSq; best = p; }
  }
  return best;
}

stage.addEventListener('pointerup', (e) => {
  if (detailPanelEl.classList.contains('show')) {
    hideDetailPanel(); // any tap while open just dismisses it
    return;
  }
  const rect = stage.getBoundingClientRect();
  // p.anchorX/p.labelX etc. are already in screen space (drawPlanes scales
  // canvas-space by rect.width/W before storing them), so no conversion here
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const p = findPlaneAtStagePoint(x, y);
  if (p) showDetailPanel(p);
  else toggleNearbyAlerts();
});

async function start() {
  discoverDatabaseFolder().then(loadTypeCodeTable); // non-blocking; type labels fill in once ready
  loadApproachPoints(); // non-blocking; heatmap fills in once ready (or once initApproachLayer adds the source, whichever comes second)
  loadSightingCounts(); // non-blocking; counts fill in once ready, same reasoning
  await loadHome();
  if (!home) {
    // keep retrying receiver info in the background until it succeeds
    const retryHome = setInterval(async () => {
      if (home) { clearInterval(retryHome); return; }
      await loadHome();
    }, FETCH_INTERVAL_MS);
  }
  fetchAircraft();
  setInterval(fetchAircraft, FETCH_INTERVAL_MS);
  setInterval(refreshStorms, RAINVIEWER_REFRESH_MS);
  requestAnimationFrame(tick);
}

start();
</script>

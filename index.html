    mapRetryMs = MAP_RETRY_MIN_MS;
    initMap();
  }
});

// True only if an actual basemap tile for this location downloads. The style
// answering is not enough: when the style host is up and the tile host is
// down, switching back on the style alone blanked the radar for the ~45 s the
// tile check needs to fall back again -- every 20 minutes, for the whole outage.
async function onlineTilesReachable(style) {
  try {
    const src = Object.values(style.sources || {}).find(s => s.type === 'vector');
    if (!src) return false;
    let tiles = src.tiles;
    if (!tiles && src.url) {
      const res = await fetch(src.url, { signal: AbortSignal.timeout(ONLINE_STYLE_TIMEOUT_MS) });
      if (!res.ok) return false;
      tiles = (await res.json()).tiles;
    }
    if (!Array.isArray(tiles) || !tiles.length) return false;
    const z = 10, n = 2 ** z;
    const x = Math.floor((home.lon + 180) / 360 * n);
    const latR = home.lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n);
    const url = tiles[0].replace('{z}', z).replace('{x}', x).replace('{y}', y);
    const res = await fetch(url, { signal: AbortSignal.timeout(ONLINE_STYLE_TIMEOUT_MS) });
    return res.ok;
  } catch (e) {
    return false;
  }
}

// On the fallback, keep checking for the real map, and go back to it once
// it genuinely works -- the extract is a safety net, not a place to stay.
setInterval(async () => {
  if (!map || !mapIsOffline || mapStarting || !home) return;
  const online = await fetchOnlineStyle();
  if (!online || !(await onlineTilesReachable(online)) || !map || !mapIsOffline) return;
  replaceMap();
  createMap(online, false);
}, ONLINE_RECHECK_MS);

// Registered before loadRunways() resolves (that one waits on a network
// round-trip to Overpass; this doesn't, so it always finishes first),
// meaning the real runway/taxiway layers loadRunways() adds later paint on
// top of this automatically -- no explicit layer ordering needed.
function initApproachLayer() {
  map.addSource('approaches', { type: 'geojson', data: approachPointsGeoJSON() });
  map.addLayer({
    id: 'approaches-heat',
    type: 'heatmap',
    source: 'approaches',
    // Tuned faint on purpose, but the original numbers here (radius 6,
    // intensity 0.6, opacity 0.45) turned out faint to the point of
    // effectively invisible once #mapbg's own `brightness(0.3)` filter (see
    // initMap) darkens it further on top -- confirmed live against the real
    // accumulated point data (thousands of points, correctly clustered right
    // over RDU) that at the production numbers nothing perceptible reached
    // the screen at the normal operating zoom.
    // Originally a solid orange fill (matching --low), but that both read as
    // an undifferentiated blob and visually blended into the base map's own
    // orange roads. Went through a non-monotonic "outline" ramp after that
    // (peaked at low density, faded in the interior) at a specific request
    // for an outline look -- reverted after a follow-up request wanted the
    // opposite: genuine heatmap behavior, where a busier stretch of the
    // corridor (more accumulated landings overlapping there) reads as more
    // visually distinguished than a lightly-used one.
    // radius 10 looked great at a manually-zoomed-in inspection view, but
    // that isn't the view anyone actually sees -- at the real production
    // zoom (the full RANGE_NM disc, what both the kiosk and every other
    // viewer always render, since the map is non-interactive), that radius
    // was wide enough relative to the compressed on-screen scale that
    // individual accumulated points merged into one soft mass with no
    // visible internal structure -- confirmed live, reproduced with a
    // frozen snapshot of the real data so it wasn't just later points
    // organically accumulating mid-comparison. Tried forcing MapLibre's
    // pixelRatio up first, suspecting a device-pixel-density difference
    // between the kiosk (standard DPI) and a phone/laptop (typically
    // HiDPI) -- that turned out to be a red herring (made it worse, not
    // better) once tested properly; the zoom-level compression was the
    // real cause all along. A much smaller radius keeps individual
    // accumulated flight paths visible as distinguishable curved lines
    // rather than one blob, while genuinely busy convergence points (e.g.
    // right at the runway threshold) still read as more solid/bright than
    // lightly-used stretches -- the whole point of the density gradient
    // above. Dropped further still (3 -> 2) and switched from the muted
    // --mid teal to a brighter, more saturated cyan/mint at a follow-up
    // request for even more visible dot structure -- confirmed live at the
    // real production zoom that individual points read clearly rather than
    // smearing together, and the color pops harder against the darkened
    // map than the original teal did.
    paint: {
      'heatmap-weight': 0.6,
      'heatmap-intensity': 2.5,
      'heatmap-radius': 2,
      'heatmap-opacity': 0.95,
      'heatmap-color': [
        'interpolate', ['linear'], ['heatmap-density'],
        0, 'rgba(0,0,0,0)',
        0.15, 'rgba(0,255,225,0.3)',
        0.4, 'rgba(0,255,225,0.55)',
        0.7, 'rgba(0,255,225,0.8)',
        1, 'rgba(120,255,240,1)',
      ],
    },
  });
  applyHeatmapVisibility(); // a freshly-added MapLibre layer defaults to visible -- immediately match the real setting (off by default, see alertSettings.heatmap)
}

// Same pattern as applyStormsVisibility -- toggleable in the settings panel
// (default off, unlike storms: this is denser/more visually busy, and
// starts empty on a fresh install anyway, so opting in makes more sense
// than opting out).
function applyHeatmapVisibility() {
  if (!map || !map.getLayer('approaches-heat')) return;
  map.setLayoutProperty('approaches-heat', 'visibility', alertSettings.heatmap ? 'visible' : 'none');
}

// "liberty" is styled for a light background (black text, white halo) --
// on the "classic"/"highcontrast" themes (#mapbg's CSS filter darkens
// everything underneath), labels are flipped to the opposite convention so
// they stay legible; "daylight" keeps the map close to its own natural
// light styling, so labels stay close to liberty's own default instead.
// Re-run from applyTheme (not just once at map load) so switching themes
// re-colors labels already on screen, not just future ones.
function recolorLabels() {
  if (!map) return;
  const LABEL_LAYERS = ['label_city_capital', 'label_city', 'label_town', 'label_village', 'label_other'];
  const light = uiTheme === 'daylight';
  const textColor = light ? '#1a2426' : '#e8e2d5';
  const haloColor = light ? '#f3f8f6' : '#05080a';
  for (const id of LABEL_LAYERS) {
    if (!map.getLayer(id)) continue;
    map.setPaintProperty(id, 'text-color', textColor);
    map.setPaintProperty(id, 'text-halo-color', haloColor);
  }
  if (map.getLayer('water_name_point_label')) {
    map.setPaintProperty('water_name_point_label', 'text-color', light ? '#1d5fa8' : '#9fc4e8');
    map.setPaintProperty('water_name_point_label', 'text-halo-color', haloColor);
  }

  // The radar theme's --map-filter works by INVERTING the whole map before
  // tinting it (see that token's own comment): background pixels need to
  // start LIGHT so invert() turns them dark, and traces need to start DARK
  // so invert() turns them bright. That is true of this style's actual
  // background (#f8f4f0, a light cream) and of roads/labels (dark), which is
  // why those come out right without any override. It is NOT true of water,
  // which this style fills at a solid rgb(158,189,255) -- a MEDIUM blue,
  // neither light enough to recede nor dark enough to glow. The result was
  // found on a real receiver location, not this one: a harbor or lake shows
  // up as a big, flat, oddly bright field, wrong on any theme but especially
  // wrong on the one styled as a mostly-black screen with sparse traces.
  //
  // Setting water's fill to the same light cream as the background makes it
  // recede through the invert exactly like land does -- confirmed against a
  // dense harbor (New York) and a lake-heavy coastline (Amsterdam), not just
  // the one location this theme was designed against. Only for radar: every
  // other theme uses water's real blue at reduced brightness, which reads
  // as "dim water", not "a mistake", so they are left alone. Must be reset
  // when leaving the theme -- setPaintProperty persists across style state,
  // so switching to classic without this line would show cream-colored
  // water there too.
  if (map.getLayer('water')) {
    map.setPaintProperty('water', 'fill-color',
      uiTheme === 'radar' ? '#f8f4f0' : 'rgb(158, 189, 255)');
  }
}

// Zoom is calibrated against the stage's CSS pixel size (see zoomForRange's
// comment above) -- a window resized after load needs both a container
// resize AND a fresh zoom to stay aligned with the radar, not just the
// former. Fine on the kiosk (fixed physical resolution, this never fires
// there in practice), but keeps a resized Funnel/desktop view aligned too.
window.addEventListener('resize', () => {
  if (!map) return;
  map.resize();
  const rCss = R * (stage.getBoundingClientRect().width / W);
  map.setZoom(zoomForRange(RANGE_NM, home.lat, rCss));
});

// ---- Runway outlines --------------------------------------------------
// Fetch (home location never changes at runtime, so this only needs to
// truly succeed once) of real runway/taxiway geometry from OSM's public
// Overpass API, covering the same RANGE_NM box the radar shows. Purely
// additive — if every attempt fails (offline, Overpass rate-limited, etc.)
// the map/radar keep working without runway outlines.
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
const OVERPASS_MAX_ATTEMPTS = 4;
const OVERPASS_RETRY_MS = 20000; // generous backoff -- shared public API, and this only needs to eventually land once per (rare) kiosk reload, not be fast

function rangeBBox(lat, lon, rangeNm) {
  const rangeM = rangeNm * 1852;
  const latDelta = rangeM / 111320;
  const lonDelta = rangeM / (111320 * Math.cos(lat * Math.PI / 180));
  return { south: lat - latDelta, west: lon - lonDelta, north: lat + latDelta, east: lon + lonDelta };
}

function overpassToGeoJSON(elements) {
  const nodes = new Map();
  for (const el of elements) {
    if (el.type === 'node') nodes.set(el.id, [el.lon, el.lat]);
  }
  const features = [];
  for (const el of elements) {
    if (el.type !== 'way' || !el.tags) continue;
    const aeroway = el.tags.aeroway;
    if (aeroway !== 'runway' && aeroway !== 'taxiway') continue;
    const coords = el.nodes.map(id => nodes.get(id)).filter(Boolean);
    if (coords.length < 2) continue;
    features.push({ type: 'Feature', properties: { aeroway, ref: el.tags.ref || '' }, geometry: { type: 'LineString', coordinates: coords } });
  }
  return { type: 'FeatureCollection', features };
}

// A rough, immediate approximation of final approach corridors, derived
// entirely from runway geometry we already have -- no new data source
// needed. Real approach procedures curve and vector well out from the
// field, but the final several miles always line up with the runway's own
// heading (that's what "final approach" means), so extending each runway's
// centerline outward a representative distance is a reasonable placeholder.
// This is deliberately just an approximation, styled faintly/dashed to read
// as one -- see AIRPORT_APPROACH_* below for the real thing, built from
// actually-observed landings over time.
const RUNWAY_EXTENSION_NM = 8; // roughly a typical ILS/RNAV final approach segment length

function extendedApproachLines(runwayGeojson) {
  const features = [];
  for (const f of runwayGeojson.features) {
    if (f.properties.aeroway !== 'runway') continue;
    const coords = f.geometry.coordinates;
    if (coords.length < 2) continue;
    const [lon1, lat1] = coords[0];
    const [lon2, lat2] = coords[coords.length - 1];
    const bearingFwd = haversineBearingRange(lat1, lon1, lat2, lon2).bearing;
    const bearingRev = (bearingFwd + 180) % 360;
    const ext1 = destinationPoint(lat1, lon1, bearingRev, RUNWAY_EXTENSION_NM); // beyond threshold 1
    const ext2 = destinationPoint(lat2, lon2, bearingFwd, RUNWAY_EXTENSION_NM); // beyond threshold 2
    features.push({
      type: 'Feature',
      properties: { ref: f.properties.ref },
      geometry: { type: 'LineString', coordinates: [ext1, [lon1, lat1], [lon2, lat2], ext2] },
    });
  }
  return { type: 'FeatureCollection', features };
}

// Runway geometry for a fixed home location never changes at runtime, so a
// successful fetch is worth remembering across reloads, not just within one
// -- a kiosk restart used to mean waiting out the full Overpass retry cycle
// (up to OVERPASS_MAX_ATTEMPTS attempts, OVERPASS_RETRY_MS apart, each with
// its own network timeout -- a couple of minutes in the worst case) before
// runways reappeared, every single time. Caching the last successful result
// means a restart shows real runways immediately; loadRunways() still runs
// in the background regardless to self-heal the cache if OSM data ever
// changes, and a failed refresh just leaves the already-displayed cached
// copy alone.
const RUNWAY_CACHE_KEY = 'stratoscan_runways_v1';

// Shared by both the cache-hit path (synchronous, fires before the other
// map.on('load', ...) handlers below get their turn) and the network-fetch
// path (async, resolves well after them) -- moveLayer() with no second
// argument pins these to the very top regardless of which path added them
// or when, so "real runway pavement paints over the faint approach-outline
// hint" holds up either way instead of depending on incidental ordering.
function applyRunwayData(geojson) {
  const extensions = extendedApproachLines(geojson);
  if (map.getSource('runways')) {
    map.getSource('runways').setData(geojson);
    map.getSource('runway-extensions').setData(extensions);
    return;
  }
  map.addSource('runways', { type: 'geojson', data: geojson });
  map.addSource('runway-extensions', { type: 'geojson', data: extensions });
  // line-opacity/width bumped from the original 0.22/1 -- faint by itself,
  // plus #mapbg's own brightness(0.3) filter darkening it further, added up
  // to genuinely invisible rather than just subtle. Confirmed live at the
  // real production zoom that these numbers are visible without reading as
  // "real pavement".
  map.addLayer({
    id: 'runway-extensions',
    type: 'line',
    source: 'runway-extensions',
    paint: { 'line-color': '#c7d0d3', 'line-width': 1.6, 'line-opacity': 0.45, 'line-dasharray': [2, 3] },
  });
  map.addLayer({
    id: 'runways-taxiway',
    type: 'line',
    source: 'runways',
    filter: ['==', ['get', 'aeroway'], 'taxiway'],
    paint: { 'line-color': '#5a6469', 'line-width': 1.2 },
  });
  map.addLayer({
    id: 'runways-runway',
    type: 'line',
    source: 'runways',
    filter: ['==', ['get', 'aeroway'], 'runway'],
    paint: { 'line-color': '#c7d0d3', 'line-width': 2.5 },
  });
  for (const id of ['runway-extensions', 'runways-taxiway', 'runways-runway']) map.moveLayer(id);
}

function loadCachedRunways() {
  try {
    const cached = localStorage.getItem(RUNWAY_CACHE_KEY);
    if (cached) applyRunwayData(JSON.parse(cached));
  } catch (e) {
    // corrupt/unavailable cache entry -- ignore, loadRunways() below repopulates it
  }
}

async function loadRunways(attempt = 1) {
  const bb = rangeBBox(home.lat, home.lon, RANGE_NM);
  const query = `[out:json][timeout:25];(way["aeroway"="runway"](${bb.south},${bb.west},${bb.north},${bb.east});way["aeroway"="taxiway"](${bb.south},${bb.west},${bb.north},${bb.east}););out body;>;out skel qt;`;

  // A single failed/empty attempt used to mean no runways for the rest of
  // the kiosk's uptime (this only ever ran once, on map load, with no
  // retry) -- a transient Overpass hiccup or rate-limit at exactly the
  // wrong moment (e.g. right as the kiosk boots) silently lost runways for
  // a session that can run for days before the next reload. Retrying a
  // bounded number of times with a generous backoff fixes that without
  // hammering a shared public API.
  const retry = () => { if (attempt < OVERPASS_MAX_ATTEMPTS) setTimeout(() => loadRunways(attempt + 1), OVERPASS_RETRY_MS); };

  let geojson;
  try {
    const res = await fetch(OVERPASS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(query),
    });
    if (!res.ok) { retry(); return; }
    const data = await res.json();
    geojson = overpassToGeoJSON(data.elements || []);
  } catch (e) {
    retry(); // offline or Overpass unavailable this attempt -- map/radar work fine without runways meanwhile
    return;
  }
  if (geojson.features.length === 0) { retry(); return; }

  try { localStorage.setItem(RUNWAY_CACHE_KEY, JSON.stringify(geojson)); } catch (e) {} // storage full/unavailable -- non-fatal, just skip caching this time
  applyRunwayData(geojson);
}

// ---- Storm radar overlay -----------------------------------------------
// RainViewer's public discovery API needs no key and is free for hobby use
// like this. It returns the current radar frame's tile path, which we
// refresh periodically since RainViewer publishes a new frame roughly every
// 10 minutes and this kiosk runs for days without a page reload. On by
// default (toggleable in the settings panel -- see alertSettings.storms) --
// was previously an always-on-no-toggle layer, before storms joined the
// other display/alert options there.
const RAINVIEWER_API_URL = 'https://api.rainviewer.com/public/weather-maps.json';
const RAINVIEWER_REFRESH_MS = 5 * 60 * 1000;
const RAINVIEWER_COLOR = 6;       // NEXRAD Level III palette -- the familiar green/yellow/red/purple intensity scale
const RAINVIEWER_OPTIONS = '1_1'; // smooth interpolation, snow shown distinctly

// Applies the current alertSettings.storms value to the actual map layer --
// called after the layer is (re)created in refreshStorms, and directly from
// the settings panel's row handler so toggling it is instant rather than
// waiting up to RAINVIEWER_REFRESH_MS for the next refresh to notice.
// Switching an overlay off tears its source down rather than just hiding it.
// Hiding leaves every tile MapLibre has fetched sitting in GPU memory, and --
// worse -- left the refresher below still re-tiling a layer nobody could see.
// Measured on the device: the raster overlays were leaking about 550MB/hour
// of Chromium shared memory, which is what eventually killed the GPU context
// and froze the display. Removing the source releases the textures; the
// refresher recreates it from scratch when the overlay is switched back on.
function applyStormsVisibility() {
  if (!map) return;
  if (alertSettings.storms) {
    if (map.getLayer('storms')) {
      map.setLayoutProperty('storms', 'visibility', 'visible');
    } else {
      refreshStorms();   // gone because it was switched off; build it again
    }
    return;
  }
  if (map.getLayer('storms')) map.removeLayer('storms');
  if (map.getSource('storms')) map.removeSource('storms');
}

let lastStormUrl = null;
async function refreshStorms() {
  // An overlay that is switched off must cost nothing: no request to
  // RainViewer, no tiles decoded, no textures uploaded. This ran on its timer
  // regardless before, so a radar with storms off was still pulling a fresh
  // radar mosaic every five minutes and throwing it away.
  if (!map || !alertSettings.storms) return;
  try {
    const res = await fetch(RAINVIEWER_API_URL, { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const frames = data.radar && data.radar.past;
    if (!frames || frames.length === 0) return;
    const latest = frames[frames.length - 1];
    const url = `${data.host}${latest.path}/256/{z}/{x}/{y}/${RAINVIEWER_COLOR}/${RAINVIEWER_OPTIONS}.png`;
    // RainViewer publishes a new frame every ~10 min but this runs every 5,
    // so half the rebuilds below re-fetched the frame already on screen --
    // pure texture churn on a GPU whose shared memory is the kiosk's main
    // long-run pressure point.
    if (url === lastStormUrl && map.getSource('storms')) return;
    lastStormUrl = url;

    // Rebuilt, not re-pointed. setTiles() swaps the URL but leaves the tiles
    // fetched under the old one held in GPU memory: measured on the device,
    // refreshing this way cost about 400MB of Chromium shared memory per hour
    // -- roughly 36MB every five minutes -- until the GPU context could no
    // longer allocate and the display stopped painting at all. Dropping the
    // layer and source first releases those textures, and each refresh has to
    // load new tiles either way, so it costs nothing extra in bandwidth.
    if (map.getSource('storms')) {
      if (map.getLayer('storms')) map.removeLayer('storms');
      map.removeSource('storms');
    }
    {
      // RainViewer's 256px radar tiles top out at z7 -- capping maxzoom here
      // makes MapLibre overzoom (upsample) that real data at our much closer
      // zoom instead of requesting tiles that don't exist, which otherwise
      // come back as a small tiled "Zoom Level Not Supported" placeholder.
      map.addSource('storms', { type: 'raster', tiles: [url], tileSize: 256, maxzoom: 7,
        // RainViewer's API is free for personal use and asks to be credited.
        attribution: '<a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>' });
      map.addLayer({
        id: 'storms',
        type: 'raster',
        source: 'storms',
        paint: { 'raster-opacity': 0.65 },
      });
      applyStormsVisibility(); // new layer defaults to visible -- match the current setting immediately
    }
  } catch (e) {
    // offline or RainViewer unavailable — storms layer just stays as it was
  }
}

// ---- Lightning overlay ---------------------------------------------------
// GOES-East GLM (Geostationary Lightning Mapper) flash-extent density --
// a 5-minute rolling accumulation of actual satellite-observed lightning,
// refreshed every couple of minutes -- from RealEarth (SSEC, UW-Madison),
// a free public tile service, same "raster tile pyramid" shape as
// RainViewer's storms layer above. Off by default (toggleable, see
// alertSettings.lightning) -- like the approach heatmap, this is visually
// busy enough that opting in makes more sense than opting out.
//
// Free tier requires attribution ("Source: SSEC RealEarth, UW-Madison" --
// see the README's Data sources section) but no key/account. Considered
// and rejected two other free lightning sources first: Blitzortung.org's
// community feed, whose documented endpoint no longer works when tested
// live, and NOAA nowCOAST's own lightning layer, discontinued in their
// 2023 platform migration -- this is the one that actually works.
const LIGHTNING_TILE_URL = 'https://realearth.ssec.wisc.edu/tiles/GOESEastGLMFEDRadC/{z}/{x}/{y}.png';
// GOES-East is a geostationary satellite parked over the Americas: its
// lightning mapper sees roughly 15W to 135W. Outside that footprint the
// layer is not "empty", it is unavailable -- every tile is a 404 -- so a unit
// in Europe would show a permanently blank overlay and a setting that does
// nothing. The setting hides itself instead, and says why.
const LIGHTNING_LON_MIN = -135, LIGHTNING_LON_MAX = -15;
const LIGHTNING_LAT_MIN = -60,  LIGHTNING_LAT_MAX = 60;
function lightningCovers(h) {
  return !!h && h.lon >= LIGHTNING_LON_MIN && h.lon <= LIGHTNING_LON_MAX
             && h.lat >= LIGHTNING_LAT_MIN && h.lat <= LIGHTNING_LAT_MAX;
}
const LIGHTNING_REFRESH_MS = 2 * 60 * 1000;

// See applyStormsVisibility. This one mattered more: lightning ships OFF, so
// every unit was re-tiling an invisible layer every two minutes for its whole
// uptime -- thirty pointless tile loads an hour on a device with no spare
// thermal headroom, and the larger half of the leak.
function applyLightningVisibility() {
  if (!map) return;
  if (alertSettings.lightning && lightningCovers(home)) {
    if (map.getLayer('lightning')) {
      map.setLayoutProperty('lightning', 'visibility', 'visible');
    } else {
      refreshLightning();
    }
    return;
  }
  if (map.getLayer('lightning')) map.removeLayer('lightning');
  if (map.getSource('lightning')) map.removeSource('lightning');
}

// The tile URL always points at RealEarth's "latest" alias for this
// product (no explicit timestamp), so the underlying PNGs change over time
// at the exact same URL -- a plain query-string cache-buster forces
// MapLibre (and the browser) to actually refetch instead of reusing a
// stale cached tile indefinitely, same problem RainViewer's storms layer
// avoids by baking a real timestamp into its own tile path instead.
function refreshLightning() {
  if (!map || !alertSettings.lightning) return;
  // A unit relocated out of GOES-East's footprint keeps whatever setting it
  // had, so the guard belongs here too, not only on the settings row: every
  // tile outside the footprint is a 404, forever, on a timer.
  if (!lightningCovers(home)) return;
  const url = `${LIGHTNING_TILE_URL}?t=${Date.now()}`;
  // Same teardown as refreshStorms -- see the note there.
  if (map.getSource('lightning')) {
    if (map.getLayer('lightning')) map.removeLayer('lightning');
    map.removeSource('lightning');
  }
  {
    map.addSource('lightning', { type: 'raster', tiles: [url], tileSize: 256, maxzoom: 7,
      // Required by RealEarth's terms of use, verbatim.
      attribution: 'Source: SSEC RealEarth, UW-Madison' });
    map.addLayer({
      id: 'lightning',
      type: 'raster',
      source: 'lightning',
      paint: { 'raster-opacity': 0.85 },
    });
    applyLightningVisibility(); // new layer defaults to visible -- match the real (likely off) setting immediately
  }
}

// ---- Lightning-proximity alert -------------------------------------------
// Distinct from the lightning overlay above (a visual density layer) --
// this actively checks whether there's been recent lightning within
// LIGHTNING_ALERT_RADIUS_NM of the receiver and raises an alert if so.
// Reuses RealEarth's "probe" API (a point-value query, not a tile fetch)
// against glmgroupdensity (a 60-minute rolling density product -- chosen
// specifically because, unlike GOESEastGLMFEDRadC shown on the map, it's
// one of the two RealEarth products that actually supports point probing).
//
// A single probe at home's exact coordinates only really tells you about
// the one small grid-cell-sized patch of sky right overhead -- to cover a
// real radius, this probes two concentric rings of points around home
// (reusing destinationPoint(), the same geodesic helper the extended
// runway lines use) plus the center point, and treats "any probe
// non-zero" as "lightning nearby". This is a real approximation, not
// exhaustive coverage -- storm cells are normally much wider than the gaps
// between probe points, but a narrow cell could in principle pass between
// them undetected. Hysteresis (separate enter/clear radii, same idea as
// ALERT_RADIUS_NM/ALERT_CLEAR_RADIUS_NM above) avoids flapping the alert
// on/off as a storm's exact reported density wobbles near the threshold.
const LIGHTNING_PROBE_PRODUCT = 'glmgroupdensity';
const LIGHTNING_ALERT_RADIUS_NM = 15;        // ~17 statute miles -- entry threshold
const LIGHTNING_ALERT_CLEAR_RADIUS_NM = 20;  // wider exit threshold
const LIGHTNING_ALERT_CHECK_MS = 2 * 60 * 1000; // matches the overlay's own refresh cadence -- no point checking more often than the underlying data updates
const LIGHTNING_PROBE_RING_POINTS = 8;

let lightningAlerted = false; // survives across checks, not per-plane -- there's no single "object" a storm alert is about

async function probeLightningValue(lat, lon) {
  try {
    const res = await fetch(`https://realearth.ssec.wisc.edu/api/probe?products=${LIGHTNING_PROBE_PRODUCT}&lat=${lat}&lon=${lon}`);
    if (!res.ok) return null;
    const html = await res.text();
    const m = html.match(/Data value:\s*<b>([^<]+)<\/b>/);
    if (!m) return null;
    const val = parseFloat(m[1]);
    return Number.isFinite(val) ? val : null;
  } catch (e) {
    return null; // offline or RealEarth unavailable -- this check just tries again next cycle
  }
}

async function checkLightningNearby() {
  if (!home || !alertSettings.lightningAlert) return;
  const radius = lightningAlerted ? LIGHTNING_ALERT_CLEAR_RADIUS_NM : LIGHTNING_ALERT_RADIUS_NM;
  const points = [[home.lat, home.lon]];
  for (const r of [radius / 2, radius]) {
    for (let i = 0; i < LIGHTNING_PROBE_RING_POINTS; i++) {
      const bearing = i * 360 / LIGHTNING_PROBE_RING_POINTS;
      const [lon, lat] = destinationPoint(home.lat, home.lon, bearing, r);
      points.push([lat, lon]);
    }
  }

  const values = await Promise.all(points.map(([lat, lon]) => probeLightningValue(lat.toFixed(4), lon.toFixed(4))));
  const nearby = values.some(v => v !== null && v > 0);

  if (nearby && !lightningAlerted) {
    lightningAlerted = true;
    playLightningAlertSound();
    showToast(`⚡ LIGHTNING WITHIN ${LIGHTNING_ALERT_RADIUS_NM}NM`, 8000);
  } else if (!nearby && lightningAlerted) {
    lightningAlerted = false; // free to re-alert once it's genuinely cleared past the wider radius
  }
}

// A slower, more insistent three-note pattern -- distinct from every other
// alert sound in the app (nearby-aircraft, emergency squawk, RDU phase),
// since this is the one alert that isn't about a specific aircraft at all.
function playLightningAlertSound() {
  playTones([[600, 0, 0.18, 0.28], [600, 0.25, 0.18, 0.28], [600, 0.5, 0.24, 0.3]]);
}

// ---- On-screen keyboard --------------------------------------------------
// The device has to be fully set up from its own screen: a recipient may
// have no phone, and someone who has forgotten the admin password has no
// other way in at all. That makes a touch keyboard a hard requirement, not
// a convenience.
const KBD_ROWS = {
  lower: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
  upper: ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'],
  num:   ['1234567890', '-_.:/@#&+', '!?$%*()='],
};
let kbdState = { mode: 'lower', value: '', onDone: null, secret: false };

function openKeyboard(label, initial, { secret = false, mode = 'lower' } = {}) {
  return new Promise((resolve) => {
    // Open on the layout the field actually needs: coordinates are digits and
    // a minus, and making someone hunt for the 123 key first is the kind of
    // friction that makes an on-screen keyboard feel unusable.
    //
    // `secret` marks a field as maskable, but it starts REVEALED. On an
    // unfamiliar touch keyboard a mistyped WiFi password is near-certain and
    // invisible, and this screen is in someone's home, not in public. A Hide
    // key is offered for anyone who wants it.
    kbdState = { mode, value: initial || '', onDone: resolve, secret, masked: false };
    document.getElementById('kbdLabel').textContent = label;
    document.getElementById('kbd').classList.add('show');
    drawKeyboard();
  });
}

function closeKeyboard(value) {
  document.getElementById('kbd').classList.remove('show');
  const done = kbdState.onDone;
  kbdState.onDone = null;
  if (done) done(value);
}

function drawKeyboard() {
  const shown = (kbdState.secret && kbdState.masked)
    ? '•'.repeat(kbdState.value.length)
    : kbdState.value;
  const valueEl = document.getElementById('kbdValue');
  valueEl.textContent = shown;
  valueEl.classList.toggle('empty', kbdState.value.length === 0);
  valueEl.dataset.placeholder = 'type here…';
  const keys = document.getElementById('kbdKeys');
  keys.textContent = '';
  const newRow = () => {
    const r = document.createElement('div');
    r.className = 'kbd-row';
    keys.appendChild(r);
    return r;
  };
  const add = (row, text, cls, action) => {
    const d = document.createElement('div');
    d.textContent = text;
    if (cls) d.className = cls;
    d.dataset.action = action || '';
    row.appendChild(d);
  };
  // One container per letter row, so the layout is what it looks like rather
  // than whatever flex-wrap happens to produce at this width.
  KBD_ROWS[kbdState.mode].forEach(row => {
    const r = newRow();
    [...row].forEach(ch => add(r, ch));
  });
  const fn = newRow();
  add(fn, kbdState.mode === 'num' ? 'abc' : '123', 'wide', 'mode');
  add(fn, kbdState.mode === 'upper' ? 'abc' : 'ABC', 'wide', 'case');
  add(fn, 'space', 'wide', 'space');
  add(fn, '\u232B', 'wide', 'back');
  const fn2 = newRow();
  if (kbdState.secret) add(fn2, kbdState.masked ? 'Show' : 'Hide', 'wide', 'mask');
  add(fn2, 'Cancel', 'wide', 'cancel');
  add(fn2, 'Done', 'wide go', 'done');
}

document.getElementById('kbd').addEventListener('pointerup', (e) => {
  e.stopPropagation();
  const k = e.target.closest('.kbd-row div');
  if (!k) return;
  const a = k.dataset.action;
  if (a === 'done') return closeKeyboard(kbdState.value);
  if (a === 'cancel') return closeKeyboard(null);
  if (a === 'back') kbdState.value = kbdState.value.slice(0, -1);
  else if (a === 'space') kbdState.value += ' ';
  else if (a === 'mode') kbdState.mode = kbdState.mode === 'num' ? 'lower' : 'num';
  else if (a === 'case') kbdState.mode = kbdState.mode === 'upper' ? 'lower' : 'upper';
  else if (a === 'mask') kbdState.masked = !kbdState.masked;
  else if (!a && k.textContent.length === 1) kbdState.value += k.textContent;
  drawKeyboard();
});

// ---- First-run onboarding overlay ---------------------------------------
// Reads a loopback-only endpoint (127.0.0.1:8090) that is deliberately NOT
// proxied by lighttpd, so the claim code it carries is readable by software
// running on the device -- this page -- and by nothing on the network.
// Fails silently when the setup service is absent, so a hand-built unit that
// never had one behaves exactly as before.
const ONBOARD_URL = 'http://127.0.0.1:8090/onboard';
let radarName = '';   // this radar's name, once the setup service has said it
const ONBOARD_POLL_MS = 5000;

async function refreshOnboarding() {
  const el = document.getElementById('onboard');
  if (!el) return;
  let d = null;
  try {
    const res = await fetch(ONBOARD_URL, { cache: 'no-store' });
    if (res.ok) d = await res.json();
  } catch (e) {
    // no setup service on this unit -- nothing to show, ever
  }
  // The radar's name (roadmap 2.17), from the loopback-only endpoint, so it
  // shows on this screen and never on the public page.
  if (d && typeof d.name === 'string') radarName = d.name;
  if (!d || d.claimed) { el.classList.remove('show'); return; }
  // Never reappear on top of someone who is actively using the setup screens.
  if (settingsPanelEl.classList.contains('show')) { el.classList.remove('show'); return; }

  const hs = d.hotspot || {};
  const addr = (d.addresses || [])[0];
  const steps = [];
  // Branch on whether the AP is actually UP, not merely on whether it has a
  // name: if the radar is already on a network, sending someone to look for
  // "StratoScan-Setup" sends them hunting for a network that isn't there.
  if (hs.active && hs.ssid) {
    steps.push(`On your phone, join the WiFi network <b>${esc(hs.ssid)}</b>` +
               (hs.psk ? ` using password <b>${esc(hs.psk)}</b>` : ''));
    // Never hardcode this address. The first version printed 192.168.4.1,
    // which was just the development network's router -- anyone following it
    // reached nothing at all. Use whatever the hotspot is really serving on.
    const hsAddr = hs.address || addr;
    steps.push(hsAddr
      ? `Open <b>http://${esc(hsAddr)}/setup</b> in your browser`
      : 'Open the address shown on your phone once it connects');
  } else if (addr) {
    steps.push(`On a device on the same network, open <b>http://${esc(addr)}/setup</b>`);
  } else {
    steps.push('Connect this radar to a network, or wait for it to start its own');
  }
  if (d.claimCode) steps.push('Enter the code below when asked');

  // One code for the StratoScan app (roadmap 2.18): it joins the setup network,
  // claims the radar and does every step from the phone. The typed steps stay
  // for anyone setting it up from a browser instead.
  const appQr = d.setupQr
    ? `<div class="ob-app"><img class="ob-qr" alt="Set up with the StratoScan app"
         src="data:image/svg+xml;base64,${btoa(d.setupQr)}">
       <div><b>Easiest:</b> scan this with your iPhone's Camera to set up with the StratoScan app.</div></div>
       <div class="foot" style="margin:6px 0 4px">Or, from any browser:</div>`
    : '';
  document.getElementById('onboardInner').innerHTML =
    `<h2>SET UP THIS RADAR</h2>` + appQr +
    `<ol><li>${steps.join('</li><li>')}</li></ol>` +
    (d.claimCode
      ? `<div class="code">${esc(d.claimCode)}</div>`
      : `<div class="foot" style="color:#e3b341">No setup code available — use
         "set it up on this screen" below, or restart the radar to generate one.</div>`) +
    `<div class="ob-btn" id="obSetupHere">Or set it up on this screen &#8250;</div>` +
    `<div class="foot">This screen disappears once a password is set.</div>`;
  el.classList.add('show');
}

// The overlay sits above the gear, so it carries its own way through to the
// on-screen setup. Without this a brand-new device -- the one case where the
// on-screen route matters most -- could only be set up from a phone.
document.getElementById('onboard').addEventListener('pointerup', (e) => {
  e.stopPropagation();
  if (!e.target.closest('#obSetupHere')) return;
  document.getElementById('onboard').classList.remove('show');
  settingsSection = 'device';
  deviceView = null;
  deviceMsg = '';
  showSettingsPanel();
  settingsSection = 'device';        // showSettingsPanel resets it to the menu
  renderSettingsPanel();
  loadDeviceStatus().then(renderSettingsPanel);
});

// ---- Night dimming ------------------------------------------------------
// Darkens the whole display between sunset and sunrise at the RECEIVER's own
// coordinates, so it tracks the seasons on its own instead of needing hours
// typed in twice a year (sunset here swings from ~17:00 in December to
// ~20:30 in June). Pixels only -- this Pi exposes no backlight control, so
// the backlight stays lit; the real power-off is the separate screensaver
// service (deploy/stratoscan-screensaver.service).
const NIGHT_DIM_CHECK_MS = 60 * 1000;
const NIGHT_WAKE_MS = 60 * 1000;   // how long an alert holds the screen bright
let nightWakeUntil = 0;

// Sunrise/sunset from lat/lon using the standard low-precision solar
// position algorithm (Astronomical Almanac / NOAA). Good to about a minute,
// which is far tighter than "is it dark out" needs. Returns null when the
// sun neither rises nor sets that day (polar latitudes) so callers can fall
// back rather than trusting a NaN.
function sunTimesFor(date, lat, lon) {
  const rad = Math.PI / 180, dayMs = 86400000;
  const jdate = date.valueOf() / dayMs - 0.5 + 2440588;
  const n = Math.round(jdate - 2451545 - 0.0009 + lon / 360);
  const jNoon = 2451545 + 0.0009 - lon / 360 + n;
  const M = rad * (357.5291 + 0.98560028 * (jNoon - 2451545));
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const jTransit = jNoon + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const dec = Math.asin(Math.sin(rad * 23.4397) * Math.sin(L));
  // -0.833deg: the sun's apparent radius plus atmospheric refraction, i.e.
  // the standard definition of sunrise/sunset (upper limb at the horizon)
  const cosH = (Math.sin(rad * -0.833) - Math.sin(rad * lat) * Math.sin(dec)) /
               (Math.cos(rad * lat) * Math.cos(dec));
  if (cosH > 1 || cosH < -1) return null; // polar day or night
  const H = Math.acos(cosH) / (2 * Math.PI);
  const jSet = 2451545 + 0.0009 + (H - lon / 360) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const jRise = jTransit - (jSet - jTransit);
  const toDate = (j) => new Date((j + 0.5 - 2440588) * dayMs);
  return { sunrise: toDate(jRise), sunset: toDate(jSet) };
}

// True when the sun is down at the receiver right now. Checks against
// yesterday's sunset too -- after midnight, "today's" sunset is still in the
// future, so a naive now>sunset test reads as daytime at 2am.
function isNightAtReceiver(now = new Date()) {
  if (!home) return false;
  const t = sunTimesFor(now, home.lat, home.lon);
  if (!t) return false;
  if (now < t.sunrise) {
    const y = sunTimesFor(new Date(now.valueOf() - 86400000), home.lat, home.lon);
    return !y || now >= y.sunset;
  }
  return now >= t.sunset;
}

function applyNightDim() {
  const el = document.getElementById('nightDim');
  if (!el) return;
  const wake = Date.now() < nightWakeUntil;
  el.classList.toggle('on', !!alertSettings.nightDim && isNightAtReceiver() && !wake);
}

// Called when an alert fires. Undims for NIGHT_WAKE_MS, and asks the Pi to
// power the panel back on if the screensaver has blanked it (see
// deploy/wake-listener.py). The fetch is best-effort: on a laptop, or with
// the service absent, it just fails quietly and the undim still happens.
function wakeScreenForAlert() {
  if (!alertSettings.alertWake) return;
  nightWakeUntil = Date.now() + NIGHT_WAKE_MS;
  applyNightDim();
  fetch('/wake', { method: 'POST' }).catch(() => {});
}

// ---- Nearby-aircraft alert ---------------------------------------------
// Automatically pops the detail panel (see showDetailPanel) for any plane
// that comes within ALERT_RADIUS_NM of the receiver -- on by default,
// toggled via the settings panel (see #gearBtn/showSettingsPanel below).
const ALERT_RADIUS_NM = 1.738;      // 2 statute miles -- entry threshold
// The same threshold in the unit people actually say out loud. The alert copy
// has always read "within 2 miles"; the Statistics screens say it too, and one
// constant keeps the two from drifting apart.
const ALERT_RADIUS_MI = 2;
const ALERT_CLEAR_RADIUS_NM = 2.0;  // slightly wider exit threshold, so a
                                     // plane sitting right at the boundary
                                     // can't flap the alert on noisy range

// ---- Alert settings -------------------------------------------------
// One place for every alert/sound toggle -- started as a single nearby-alert
// on/off (the empty-tap gesture below used to flip just that), but once
// emergency squawks, the landing/takeoff chime, and ATC audio all became separate
// concerns, a single blind toggle stopped making sense. localStorage, not
// the shared server-side stores used elsewhere (sightings, approach track)
// -- this is a personal display preference for whoever's looking at this
// particular screen, not data that should be the same for every viewer.
const ALERT_SETTINGS_KEY = 'stratoscan_alert_settings_v1';
// volume is a plain 0..1 multiplier on the master gain; muted is kept separate
// rather than being volume 0, so silencing it for an evening does not throw
// away the level someone settled on. soundTheme picks the voice alerts speak in.
const DEFAULT_ALERT_SETTINGS = { nearby: true, emergency: true, rareAircraft: true, airportPhase: true, networkCompare: true, emptySky: true, voice: false, atc: false, storms: true, heatmap: false, lightning: false, lightningAlert: true, nightDim: true, alertWake: true, volume: 0.7, muted: false, soundTheme: 'classic', quietHours: false, quietFrom: 1320, quietTo: 420, quietSunset: false, quietLetEmergencies: true };
let alertSettings = { ...DEFAULT_ALERT_SETTINGS };
try {
  const saved = JSON.parse(localStorage.getItem(ALERT_SETTINGS_KEY));
  if (saved && typeof saved === 'object') {
    // This toggle was stored as 'rduPhase' before the airport became
    // configurable. Carry the old value over rather than letting the spread
    // below fall through to the default -- the default is ON, so a device
    // where someone had deliberately silenced the chime would have started
    // chiming again on upgrade.
    if ('rduPhase' in saved && !('airportPhase' in saved)) {
      saved.airportPhase = saved.rduPhase;
    }
    delete saved.rduPhase;
    alertSettings = { ...DEFAULT_ALERT_SETTINGS, ...saved };
  }
} catch (e) {
  // corrupt/unavailable storage -- defaults stand
}
// A slider, after all. The stepped-rows version reasoned that a thin range
// input is a poor touch target on a round panel driven by a fingertip --
// true, and fixed by styling the thumb generously (see #settingsPanel
// input[type=range] below) rather than by avoiding range inputs altogether.
// What forced the change was the ceiling: three fixed stops cannot express
// "some specific amount louder than the loudest stop", which is exactly what
// was asked for once real speakers were on the other end of this.
//
// VOLUME_MAX is 3 (300%): headroom for a physically quiet speaker, past the
// 1.0 (unity) gain the old "High" stop meant. Above 1.0 this is amplifying,
// not just un-attenuating, and the mastered sample peaks (-1 to -3dBFS, see
// sounds/kitten/CREDITS.md) will clip well before reaching it -- which is why
// getMasterGain() below feeds a compressor rather than the destination
// directly, so "louder than it was mastered for" costs a little bit of
// squash at the very top rather than harsh digital clipping.
const VOLUME_MAX = 3;
// Clamp the volume that came out of storage. A bad value here either silences
// the device or deafens the room, and neither shows on the settings screen --
// the row looks perfectly normal while the sound is wrong. soundTheme needs no
// guard: soundTheme() falls back to classic for anything it does not know,
// which also covers a theme removed in a later release.
if (typeof alertSettings.volume !== 'number' || !isFinite(alertSettings.volume)) {
  alertSettings.volume = DEFAULT_ALERT_SETTINGS.volume;
}
alertSettings.volume = Math.min(VOLUME_MAX, Math.max(0, alertSettings.volume));
// Quiet-hours times are minutes after local midnight. Same reasoning as the
// volume clamp: a bad stored value would silence the unit at the wrong hours
// with nothing on the settings screen to say so.
for (const k of ['quietFrom', 'quietTo']) {
  const v = alertSettings[k];
  if (typeof v !== 'number' || !isFinite(v)) alertSettings[k] = DEFAULT_ALERT_SETTINGS[k];
  alertSettings[k] = ((Math.round(alertSettings[k] / 30) * 30) % 1440 + 1440) % 1440;
}
// Force-correct a stored 'atc: true' on the kiosk itself -- this is exactly
// the value that got left behind by testing the feature directly on the
// physical hardware before ensureAtcAudio's own IS_KIOSK guard existed.
// Belt-and-suspenders alongside that guard: this setting should never even
// read as "on" here, not just silently refuse to act on it.
if (IS_KIOSK && alertSettings.atc) {
  alertSettings.atc = false;
  saveAlertSettings();
}

// One-time repair for the nearby alert. It defaults on, but until the
// drag-to-scroll fix a scroll gesture toggled whatever row sat under your
// finger -- and "Nearby aircraft alert" is the FIRST row in the panel, so it
// is the one that got silently switched off on any device used before that
// fix. Restores it once per device, leaving every other choice untouched;
// after that the toggle behaves normally and can be turned off for good.
const NEARBY_REPAIR_KEY = 'stratoscan_nearby_repair_v1';
try {
  if (!localStorage.getItem(NEARBY_REPAIR_KEY)) {
    if (!alertSettings.nearby) {
      alertSettings.nearby = true;
      saveAlertSettings();
    }
    localStorage.setItem(NEARBY_REPAIR_KEY, '1');
  }
} catch (e) {
  // storage unavailable -- the default (on) already stands
}

function saveAlertSettings() {
  try { localStorage.setItem(ALERT_SETTINGS_KEY, JSON.stringify(alertSettings)); } catch (e) {}
}

// ---- Color theme ------------------------------------------------------
// Three options -- see the [data-theme] blocks in <style> for what each one
// actually changes. "classic" (the original look) is the default; applying
// a theme just sets the attribute MapLibre/CSS custom properties key off of
// and re-reads the canvas-side color copies (COLORS, see refreshCanvasColors
// above), since canvas drawing can't read CSS at draw time the way DOM
// elements can.
// v2 (2026-10-01): the v1 key held whatever theme the page last loaded
// with -- it was saved on every load, chosen or not -- so a new default could
// never reach anyone. Saved now only when someone picks a theme.
const THEME_KEY = 'stratoscan_theme_v2';
// swatchBg/swatchAccent are only for the small preview dot in the settings
// panel -- a deliberate, small duplication of each theme's --bg/--sweep
// value from the [data-theme] CSS blocks (can't read another theme's CSS
// custom properties while a different one is active, so there's no way to
// derive these live from the stylesheet itself).
const THEMES = [
  { key: 'daylight', label: 'Daylight', sub: 'Light background, black text — for a bright room', swatchBg: '#eaf3f1', swatchAccent: '#0f7a6c' },
  { key: 'classic', label: 'Classic', sub: 'The original look — dark background, warm accent colors', swatchBg: '#0a0d0f', swatchAccent: '#4fd6c8' },
  { key: 'highcontrast', label: 'High Contrast', sub: 'Built for low-vision/colorblind readability — true black background, colorblind-safe accents (Okabe–Ito palette)', swatchBg: '#000000', swatchAccent: '#ffd400' },
  { key: 'radar', label: 'Retro Radar', sub: 'Old CRT plan-position display — black screen, phosphor green', swatchBg: '#000000', swatchAccent: '#39ff14' },
];
// Daylight by default (2026-10-01, the owner's choice), first in the list;
// a theme someone picked is remembered and wins.
let uiTheme = 'daylight';
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (THEMES.some((t) => t.key === savedTheme)) uiTheme = savedTheme;
} catch (e) {
  // corrupt/unavailable storage -- default theme stands
}

// Redraw what does not move: after a theme change (new colours), and once the
// web fonts arrive -- drawn before then, the ring labels and compass letters
// would keep the fallback font for good, since nothing redraws them per frame
// any more.
function redrawStaticLayers() {
  drawRings(staticCtx);
  drawSweep(sweepCtx);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawStaticLayers);

function applyTheme(theme, chosen = false) {
  uiTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  refreshCanvasColors();
  redrawStaticLayers();
  recolorLabels(); // no-op if the map isn't up yet (e.g. this initial call at script load) -- map.on('load', recolorLabels) covers that case once it is
  if (chosen) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} }
}
applyTheme(uiTheme); // set before the first frame renders, not just on a later settings-panel interaction

// A short two-note chime synthesized with the Web Audio API rather than a
// bundled audio file -- nothing to source, license, or ship as a binary
// asset, and the tone is trivially tunable right here. Browsers block audio
// until a user gesture on the page, so the context is resumed opportunistically
// on the very first tap (well before any real alert is likely to fire) --
// on the kiosk itself, which may never get an incidental tap, Chromium is
// instead launched with --autoplay-policy=no-user-gesture-required (see
// deploy/stratoscan-kiosk.service) so it isn't blocked there at all.
let audioCtx = null;
let masterGain = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
// Every sound goes through this one node, so volume and mute live in a single
// place instead of a multiplier sprinkled through each generator.
//
// Until speakers were fitted there was nothing to turn down -- the panel had
// no output at all -- so each sound carried its own fixed peak gain and that
// was the end of it. Now that it is audible in someone's room, "off" has to be
// genuinely reachable by the person living with it, not just by whoever edits
// the source. Mute is kept separate from volume rather than being volume 0, so
// silencing it for an evening does not lose the level you had chosen.
function getMasterGain() {
  const ctx = getAudioCtx();
  if (!masterGain) {
    masterGain = ctx.createGain();
    // A limiter, not a tone-shaping compressor -- fast attack, fast release,
    // and it only starts working within a few dB of full scale. Below unity
    // gain (the whole original range) it is inaudible; it exists for the
    // headroom ABOVE unity that VOLUME_MAX opens up, where the mastered
    // sample peaks (-1 to -3dBFS) would otherwise clip hard against a plain
    // gain node once the multiplier pushes them over 0dBFS. This trades a
    // small amount of squash at the loudest instant for "louder, not
    // distorted" -- the whole point of raising the ceiling in the first
    // place.
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -3;
    limiter.knee.value = 6;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.08;
    masterGain.connect(limiter).connect(ctx.destination);
  }
  applyVolume();
  return masterGain;
}
// Push the current setting into the live node. getMasterGain() also does this,
// but only when a sound is about to play -- so muting left the node sitting at
// its old gain until the next alert happened to arrive. Harmless in practice,
// since nothing is audible in between, but it meant the node and the setting
// disagreed for arbitrarily long, and anything that later read the node would
// have read a lie. Called on every change instead.
function applyVolume() {
  if (!masterGain) return;
  masterGain.gain.value = soundAllowedNow() ? alertSettings.volume : 0;
}

// ---- Quiet hours (roadmap 4.7) --------------------------------------------
// Silences the unit's SOUNDS inside a window -- a set time range, or sunset
// to sunrise -- while every alert still appears on screen. Everything audible
// goes through the one master gain (tones, theme samples, the lightning chime,
// speech), so this is a gain decision made in applyVolume(), not a check
// scattered through every player. Times are the unit's local time, which is
// the time zone chosen during setup.
let quietEmergencyUntil = 0;     // Date.now() until which an emergency may sound
const QUIET_EMERGENCY_WINDOW_MS = 20 * 1000;   // chime + a generated spoken line

function minutesToClock(m) {
  return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
}

function inQuietHours(now = new Date()) {
  if (!alertSettings.quietHours) return false;
  if (alertSettings.quietSunset) return isNightAtReceiver(now);
  const m = now.getHours() * 60 + now.getMinutes();
  const from = alertSettings.quietFrom, to = alertSettings.quietTo;
  if (from === to) return false;                          // an empty window, not all day
  return from < to ? (m >= from && m < to) : (m >= from || m < to);   // may cross midnight
}

function soundAllowedNow() {
  if (alertSettings.muted) return false;
  if (!inQuietHours()) return true;
  return Date.now() < quietEmergencyUntil;
}

// Opens a short window in which quiet hours step aside, then closes it on its
// own. Used for an emergency (the chime and the spoken line after it) and for
// a sound someone asked for on the settings screen -- a preview that plays
// nothing during quiet hours reads as a broken speaker.
function allowThroughQuiet(ms) {
  if (!inQuietHours()) return;
  quietEmergencyUntil = Math.max(quietEmergencyUntil, Date.now() + ms);
  applyVolume();
  setTimeout(applyVolume, ms + 100);
}

// What the settings screen says about it right now.
function quietStatusText() {
  if (!alertSettings.quietHours) return null;
  if (!inQuietHours()) {
    return alertSettings.quietSunset ? 'Quiet from sunset' : `Quiet from ${minutesToClock(alertSettings.quietFrom)}`;
  }
  return alertSettings.quietSunset ? 'Quiet now, until sunrise' : `Quiet now, until ${minutesToClock(alertSettings.quietTo)}`;
}

// The window has to open and close on time without a reload, so the gain is
// re-decided every minute, not only when a setting changes.
setInterval(applyVolume, 60 * 1000);
stage.addEventListener('pointerdown', () => { getAudioCtx().resume().catch(() => {}); }, { once: true });

// Shared tone-sequence player -- each note is [freq, startOffset, dur, peakGain].
// Factored out of what used to be playAlertSound's own body so the emergency
// and RDU-phase sounds below can each get a distinct, recognizable shape
// (note count/pitch/gain) without duplicating the oscillator boilerplate.
function playTones(notes) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    for (const [freq, startOffset, dur, peakGain] of notes) {
      const start = now + startOffset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peakGain, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain).connect(getMasterGain());
      osc.start(start);
      osc.stop(start + dur + 0.02);
    }
  } catch (e) {
    // Web Audio unavailable or still blocked -- the visual alert still shows regardless
  }
}

// Real recordings for the second voice, in place of the synthesized
// approximation this replaced. That version was honest about being one: a
// sawtooth swept through a filter reads as "a cat noise", not as a cat.
//
// Four short CC0 recordings from Freesound (credited in
// sounds/kitten/CREDITS.md, which also has the exact processing applied --
// trim, normalize, and for landing/takeoff a pitch shift up or down from the
// same source trill, the same up-for-takeoff/down-for-landing distinction the
// synthesized version used). They ship as .ogg/Opus through the OTA bundle
// alongside index.html -- 20KB for all four, decoded once and cached, so
// there is no size or latency reason left to prefer synthesis.
//
// Decoded into AudioBuffers rather than played through <audio> elements, so
// playback goes through the same getMasterGain() node as playTones -- one
// volume/mute path for every sound in the app, sample or synthesized, rather
// than a second one with its own .volume property to keep in sync.
const sampleBuffers = {};
function loadSample(url) {
  if (!sampleBuffers[url]) {
    sampleBuffers[url] = fetch(url)
      .then((r) => r.arrayBuffer())
      .then((buf) => getAudioCtx().decodeAudioData(buf));
  }
  return sampleBuffers[url];
}
// Warmed on load and whenever the kitten theme is selected, so the first real
// alert plays immediately instead of paying a decode on the critical path --
// the moment that matters is a plane already inside the alert radius, not a
// good time to discover a slow decode.
function preloadSoundTheme(theme) {
  Object.values(theme.files || {}).forEach(loadSample);
}
function playSample(url) {
  loadSample(url).then((buffer) => {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(getMasterGain());
    src.start();
  }).catch(() => {
    // same contract as playTones: audio is garnish, the visual alert is the alert
  });
}

// ---- Spoken announcements -----------------------------------------------------
// After an alert's chime, one short sentence saying what it is. Synthesized on
// the unit by deploy/tts-service.py (Piper, offline) and played through the
// same master gain as every other sound, so volume and mute apply. The unit's
// /tts is local-only, so a viewer over the public URL simply hears the chime.
const COMPASS8_WORDS = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
function directionWords(deg) { return COMPASS8_WORDS[Math.round(((deg % 360) + 360) % 360 / 45) % 8]; }

function spokenName(pl) {
  const m = pl.hasCallsign ? /^([A-Z]{3})(\d+)([A-Z]*)$/.exec(pl.cs || '') : null;
  const airline = m ? AIRLINES[m[1]] : null;
  if (airline) return `${airline.name} ${m[2].split('').join(' ')}${m[3] ? ' ' + m[3].split('').join(' ') : ''}`;
  return pl.airlineLabel === PRIVATE_LABEL ? 'Private aircraft' : 'Aircraft';
}

function announcementFor(pl, lead) {
  const parts = [];
  if (lead) parts.push(lead);
  parts.push(spokenName(pl));
  if (pl.typeLabel) parts.push(pl.typeLabel.replace(/[-/]/g, ' '));
  if (pl.alt === 'ground') parts.push('on the ground');
  else if (typeof pl.alt === 'number') parts.push(`${(Math.round(pl.alt / 100) * 100).toLocaleString('en-US')} feet`);
  if (typeof pl.range === 'number') {
    const miles = pl.range * 1.15078;
    parts.push(miles < 0.75 ? 'overhead' : `${Math.round(miles)} ${Math.round(miles) === 1 ? 'mile' : 'miles'} ${directionWords(pl.bearing)}`);
  }
  const sentence = parts.join(', ') + '.';
  return sentence.charAt(0).toUpperCase() + sentence.slice(1);
}

const spokenBuffers = new Map();   // phrase -> Promise<AudioBuffer>, bounded
function speak(text, delayMs = 1100) {
  if (!alertSettings.voice || !soundAllowedNow() || !text) return;
  let p = spokenBuffers.get(text);
  if (!p) {
    p = fetch('/tts?text=' + encodeURIComponent(text.slice(0, 240)), { signal: AbortSignal.timeout(15000) })
      .then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.arrayBuffer(); })
      .then(buf => getAudioCtx().decodeAudioData(buf));
    p.catch(() => spokenBuffers.delete(text));
    spokenBuffers.set(text, p);
    if (spokenBuffers.size > 32) spokenBuffers.delete(spokenBuffers.keys().next().value);
  }
  const startAt = performance.now() + delayMs;   // after the chime, not over it
  p.then(buffer => {
    setTimeout(() => {
      const ctx = getAudioCtx();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(getMasterGain());
      src.start();
    }, Math.max(0, startAt - performance.now()));
  }).catch(() => { /* no speech on this unit or viewer: the chime already said it */ });
}

// ---- Sound themes ---------------------------------------------------
// The same three events, in two voices. Which one plays is a setting, because
// the device has no way to know what it is wearing: the case is a printed
// shell with no electrical identity, so a kitten cannot announce itself. The
// colour theme is a separate choice for the same reason and is left alone --
// somebody may well want the cat noises with the classic look.
//
// Each theme supplies the same three generators, so adding a third is a table
// entry rather than a change at every call site.
const SOUND_THEMES = {
  classic: {
    label: 'Classic',
    sub: 'Clean synth tones — the original chimes',
    nearby:    () => playTones([[880, 0, 0.14, 0.25], [1175, 0.15, 0.18, 0.25]]),
    emergency: () => playTones([
      [1300, 0, 0.1, 0.3], [900, 0.14, 0.1, 0.3],
      [1300, 0.28, 0.1, 0.3], [900, 0.42, 0.1, 0.3],
    ]),
    airportPhase: (phase) =>
      playTones(phase === 'landing' ? [[720, 0, 0.16, 0.14]] : [[1040, 0, 0.16, 0.14]]),
  },
  kitten: {
    label: 'Kitten',
    sub: 'Real meows and chirrups — made for the cat case',
    // Every file this theme can play, so preloadSoundTheme() has one place to
    // find them all rather than a call buried in each generator below.
    files: {
      nearby:    'sounds/kitten/nearby.ogg',
      emergency: 'sounds/kitten/emergency.ogg',
      landing:   'sounds/kitten/landing.ogg',
      takeoff:   'sounds/kitten/takeoff.ogg',
    },
    // One unhurried meow: the everyday sound, so it must not grate on the
    // hundredth hearing.
    nearby: () => playSample('sounds/kitten/nearby.ogg'),
    // A single hiss. A cat hiss already reads as the alarmed, back-off sound
    // on first hearing -- it does not need the classic theme's trick of
    // building urgency through repetition, and repeating a 1-second recording
    // three times would make this by far the longest sound in the app for
    // the thing that is supposed to demand the quickest reaction.
    emergency: () => playSample('sounds/kitten/emergency.ogg'),
    // A short trill, the chirrup a cat makes at a window. Quietest of the
    // three in how it was mastered, because this one fires on every landing
    // and takeoff. Landing and takeoff are the same recording pitch-shifted
    // down and up from a shared source, so the two stay recognizably one
    // sound family while remaining distinguishable by ear -- the same
    // down-for-landing/up-for-takeoff convention the classic theme's tones use.
    airportPhase: (phase) =>
      playSample(phase === 'landing' ? 'sounds/kitten/landing.ogg' : 'sounds/kitten/takeoff.ogg'),
  },
  plane: {
    label: 'Plane',
    sub: 'A real cabin chime — for the retro case, or anyone',
    files: {
      nearby:    'sounds/plane/nearby.ogg',
      emergency: 'sounds/plane/emergency.ogg',
      landing:   'sounds/plane/landing.ogg',
      takeoff:   'sounds/plane/takeoff.ogg',
    },
    // All four derive from ONE recording -- an Airbus/Boeing-style seatbelt
    // chime -- trimmed, pitched, or repeated. See sounds/plane/CREDITS.md for
    // the source and the exact cuts; the short version: the chime is two
    // notes, "ding" then "dong".
    //
    // nearby is just the first note, cut short before its natural decay --
    // the everyday sound, so it has to be quick rather than a slow fade.
    nearby: () => playSample('sounds/plane/nearby.ogg'),
    // Three fast repeats of that SAME first note, not the two-note phrase.
    // The two-note version was tried first and was wrong twice over: it ran
    // 4.7 seconds, by far the longest sound in the app for the event that
    // needs the fastest reaction, and a repeated two-note melody reads as
    // pleasant and informational -- which is exactly why it is the
    // seatbelt-sign chime -- not urgent. Real cockpit caution systems use a
    // single repeated tone for elevated alerts for the same reason: it is
    // the repetition of ONE note that reads as an alarm.
    emergency: () => playSample('sounds/plane/emergency.ogg'),
    // The full two-note chime, pitched down for landing and up for takeoff
    // from the same source -- the same down/up convention the classic
    // theme's tones and the kitten theme's trill already use, so all three
    // sound themes agree on which direction means which event.
    airportPhase: (phase) =>
      playSample(phase === 'landing' ? 'sounds/plane/landing.ogg' : 'sounds/plane/takeoff.ogg'),
  },
};
function soundTheme() {
  return SOUND_THEMES[alertSettings.soundTheme] || SOUND_THEMES.classic;
}
preloadSoundTheme(soundTheme());

// Two-note ascending chime in the classic theme; a meow in the kitten one.
function playAlertSound() {
  soundTheme().nearby();
}

// Four fast alternating beeps, higher gain and more insistent than the
// nearby-aircraft chime -- deliberately reads as more urgent, since this
// fires for actual emergency squawks (7500/7600/7700), not routine traffic.
function playEmergencySound() {
  if (alertSettings.quietLetEmergencies) allowThroughQuiet(QUIET_EMERGENCY_WINDOW_MS);
  soundTheme().emergency();
}

// A single short, quiet note -- deliberately the least intrusive of the
// three, since this fires for every RDU landing/takeoff and that's frequent
// enough that anything louder or busier would get old fast. Landing pitches
// down, takeoff pitches up, so the two are distinguishable by ear without
// looking at the screen.
function playAirportPhaseSound(phase) {
  soundTheme().airportPhase(phase);
}

// Called once per poll (real GPS-derived range, not the eased per-frame
// value) for each tracked aircraft -- mirrors updateApproachTracking's same
// reasoning for why this belongs on the poll, not the render loop.
function checkNearbyAlert(pl, range) {
  if (!pl) return;
  if (range <= ALERT_RADIUS_NM) {
    if (!pl.alerted) {
      pl.alerted = true;
      // The count is a standing record of real proximity events -- kept
      // regardless of whether the interactive popup/sound happen to be
      // toggled on right now, which is a separate, purely presentational
      // concern (see the settings panel below).
      recordSightingOnce(pl.hex, 'nearby');
      if (alertSettings.nearby) {
        wakeScreenForAlert();
        showDetailPanel(pl, true);
        playAlertSound();
        speak(announcementFor(pl));
      }
    }
  } else if (range > ALERT_CLEAR_RADIUS_NM) {
    pl.alerted = false; // free to re-alert if it later comes back around
  }
}

// ---- Network comparison --------------------------------------------------
// Two things at once, both fed by the device-side proxy at /network (see
// deploy/network-compare.py):
//
//   GHOSTS    aircraft a public ADS-B network can see in this ring that this
//             antenna did NOT hear. Drawn hollow and dimmed, with no trail,
//             so a glance always distinguishes "my receiver heard this" from
//             "the network says it is there".
//   SCORECARD what the running comparison says about this receiver -- overall
//             coverage, and which altitude bands and bearings it is blind in.
//
// OFF by default. These units get given away, and a recipient's radar should
// not contact a third party unless they have chosen to. The proxy makes no
// upstream request of its own: it only fetches when this page asks, so with
// the setting off the device is exactly as self-contained as before.
const NETWORK_URL = '/network';
const NETWORK_POLL_MS = 20 * 1000;   // proxy caches for 15s; no point going faster
// Ghosts are TRACKED, not replaced. A poll arrives every 20s, and a 450kt
// aircraft covers 2.5nm -- 51px on this ring -- in that time, so redrawing
// from each payload would make them teleport, and a trail built from those
// samples would be a chain of long straight hops rather than a path.
//
// Instead each ghost keeps identity by hex and is dead-reckoned forward from
// its last fix every frame, exactly as local aircraft are when their own
// position squitter goes stale. Every ghost in the feed carries gs and track,
// so this is the network's own reported velocity, not a guess of ours.
const ghostTracks = new Map();   // hex -> persistent track record
let ghosts = [];                 // in-ring snapshots, rebuilt each frame
const GHOST_DR_MAX_S = 45;       // stop extrapolating past this; beyond it we are inventing
const GHOST_DROP_MS = 60 * 1000; // forget one absent from the feed this long
let networkStats = null;  // last scorecard
let networkError = null;

async function refreshNetworkCompare() {
  if (!alertSettings.networkCompare) { ghosts = []; ghostTracks.clear(); return; }
  try {
    const res = await fetch(NETWORK_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    networkStats = d.stats || null;
    networkError = d.stale ? 'network unreachable — showing the last comparison' : null;
    const now = performance.now();
    for (const a of (d.ac || [])) {
      if (typeof a.lat !== 'number' || typeof a.lon !== 'number') continue;
      const prev = ghostTracks.get(a.hex);
      ghostTracks.set(a.hex, {
        hex: a.hex,
        flight: a.flight, type: a.type, reg: a.reg, alt: a.alt,
        gs: a.gs, track: a.track, seenPos: a.seen_pos,
        squawk: a.squawk ?? null, vrate: typeof a.vrate === 'number' ? a.vrate : null,
        emergency: a.emergency && a.emergency !== 'none' ? a.emergency : null,
        category: a.category ?? null,
        fixLat: a.lat, fixLon: a.lon, fixAt: now,
        lastSeenAt: now,
        // identity is what makes a trail possible: carry it across the poll
        trail: prev ? prev.trail : [],
        lastTrailAt: prev ? prev.lastTrailAt : 0,
        bearing: prev ? prev.bearing : 0, range: prev ? prev.range : 0,
        // carried across the poll so a lookup only ever runs once per hex
        typeLabel: prev ? prev.typeLabel : null,
        registration: prev ? prev.registration : null,
        typeDesc: prev ? prev.typeDesc : null,
        typeCode: prev ? prev.typeCode : null,
        wtc: prev ? prev.wtc : null,
      });
      enrichGhost(ghostTracks.get(a.hex));
      // Counted separately from a heard aircraft, never merged with it: the
      // feed only ever contains what this antenna missed, so `network` is
      // exactly "seen, but not by us". recordSightingOnce's cooldown covers
      // a ghost dropping out of the feed and coming back mid-pass.
      recordSightingOnce(a.hex, 'network');
      classifyGhost(ghostTracks.get(a.hex));
    }
  } catch (e) {
    networkError = 'comparison unavailable';
    // Deliberately NOT clearing the tracks: one failed poll should not erase
    // trails that took minutes to build. They age out via GHOST_DROP_MS.
  }
}

// A ghost deserves the same lookups a local contact gets. Real aircraft fire
// these from applyUpdate on first sight, which is why their panels already
// show "Bombardier Regional Jet CRJ-900" and a city pair while a ghost showed
// only the bare ICAO type code the network happened to send. The aircraft
// database, the route lookup and the photo proxy are all keyed by hex or
// callsign -- none of them care whether THIS antenna was the one that heard
// it. Fired on first sight rather than on tap so the data is already cached
// by the time the panel opens.
function enrichGhost(t) {
  if (!t || t.enriched) return;
  t.enriched = true;
  lookupType(t.hex).then(info => {
    t.typeLabel = info.type;
    t.registration = info.reg;
    t.typeDesc = info.desc;
    t.typeCode = info.typeCode;
    t.wtc = info.wtc;
    classifyGhost(t);   // the airframe is what the first, pre-lookup pass could not say
    // if the panel is open on this ghost, fill it in rather than making the
    // user close and reopen to see the answer arrive
    if (detailPanelHex === t.hex && detailPanelEl.classList.contains('show')) showGhostPanel(t);
  });
  if (t.flight && /^[A-Z]{3}\d/.test(t.flight)) {
    queueRouteLookup(t.flight, t.fixLat, t.fixLon);
  }
}

// A ghost holds the same facts a local contact does, under different names.
// Statistics should not care which antenna heard an aeroplane, so reshape it
// once here rather than teaching classifySighting about two record layouts.
function classifyGhost(t) {
  if (!t) return;
  const cs0 = realCallsign(t.flight);
  const hasCallsign = !!cs0;
  const cs = cs0 || t.hex.toUpperCase();
  const airline = airlineFor(cs, hasCallsign, t.hex);
  classifySighting({
    hex: t.hex, cs, hasCallsign,
    airlineIcao: airline.icao, airlineLabel: airline.label,
    typeDesc: t.typeDesc, wtc: t.wtc, category: t.category,
  });
}

// Advance every tracked ghost to now and rebuild the in-ring display list.
// Called once per drawn frame, before anything reads `ghosts`.
function updateGhosts(nowMs) {
  ghosts = [];
  if (!alertSettings.networkCompare || !home) return;
  for (const [hex, t] of ghostTracks) {
    if (nowMs - t.lastSeenAt > GHOST_DROP_MS) { ghostTracks.delete(hex); continue; }
    // age of the underlying fix: how long ago the NETWORK saw it, plus how
    // long ago we fetched that
    const ageS = Math.min(GHOST_DR_MAX_S,
                          (t.seenPos || 0) + (nowMs - t.fixAt) / 1000);
    let lat = t.fixLat, lon = t.fixLon;
    if (typeof t.gs === 'number' && t.gs >= DR_MIN_GS_KT &&
        typeof t.track === 'number' && ageS > 0) {
      const [drLon, drLat] = destinationPoint(t.fixLat, t.fixLon, t.track, t.gs * ageS / 3600);
      lat = drLat; lon = drLon;
    }
    const { bearing, range } = haversineBearingRange(home.lat, home.lon, lat, lon);
    t.bearing = bearing; t.range = range;
    // confidence fades as the extrapolation runs out of road
    t.fade = 1 - 0.55 * Math.min(1, ageS / GHOST_DR_MAX_S);
    if (range > RANGE_NM) continue;   // outside the drawn ring: keep tracking, don't draw

    if (nowMs - (t.lastTrailAt || 0) >= TRAIL_SAMPLE_MS) {
      t.lastTrailAt = nowMs;
      const last = t.trail[t.trail.length - 1];
      const moved = !last ? Infinity : Math.hypot(
        range - last.range,
        range * bearingDelta(last.bearing, bearing) * Math.PI / 180);
      if (moved >= TRAIL_MIN_MOVE_NM) {
        t.trail.push({ bearing, range, t: nowMs });
        pruneTrail(t.trail, nowMs);
      }
    }
    ghosts.push(t);
  }
}

// Ghost trails: same geometry as the real ones, but dashed and dimmer so the
// display stays dominated by what this antenna actually heard.
function drawGhostTrails() {
  if (!alertSettings.networkCompare || !ghosts.length) return;
  ctx.save();
  ctx.lineWidth = 2.4;
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = COLORS.ghost;
  const now = performance.now();
  for (const g of ghosts) {
    if (!g.trail || g.trail.length < 2) continue;
    for (let i = 1; i < g.trail.length; i++) {
      const a = g.trail[i - 1], b = g.trail[i];
      const pa = polarToXY(a.bearing, a.range), pb = polarToXY(b.bearing, b.range);
      ctx.globalAlpha = Math.max(TRAIL_FADE_FLOOR, 1 - (now - b.t) / TRAIL_FADE_MS) * 0.8 * (g.fade ?? 1);
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Hollow, dimmed, no trail, no label. The visual grammar has to make it
// obvious at a glance that these are not this receiver's own contacts --
// they are somebody else's, relayed. Drawn UNDER the real blips so a ghost
// can never obscure an aircraft this antenna actually heard.
function drawGhosts() {
  if (!alertSettings.networkCompare || !ghosts.length) return;
  ctx.save();
  // The first version of this drew 6px rings at 0.42 alpha in
  // COLORS.textDim -- a key refreshCanvasColors never sets, so it silently
  // fell through to the muted COLORS.ground and was invisible on the light
  // theme. A marker nobody can see is the same as no feature. It is still
  // hollow and dashed, which is what keeps it distinguishable from a real
  // contact; being faint was never what did that.
  ctx.lineWidth = 3;
  ctx.strokeStyle = COLORS.ghost;
  const ghostColor = COLORS.ghost;
  for (const g of ghosts) {
    const { x, y } = polarToXY(g.bearing, g.range);
    const bs = blipScale(g.alt === 'ground' ? 'ground' : g.alt);
    const r = Math.round(13 * bs * 2) / 2;
    ctx.globalAlpha = g.fade ?? 1;
    // A dashed ring with a glow, the same trick the real blips use. A thin
    // outline is legible in a screenshot and easy to lose on the actual
    // panel, which is the only place that matters.
    const ring = glowSprite(`g|${ghostColor}|${r}`, r + 2, 8, c => {
      c.lineWidth = 3;
      c.setLineDash([5, 3]);
      c.strokeStyle = ghostColor;
      c.shadowColor = ghostColor;
      c.shadowBlur = 8;
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.stroke();
    });
    ctx.drawImage(ring, x - ring.half, y - ring.half);
    // a filled core, so it reads as an object rather than an empty annulus
    ctx.globalAlpha = 0.6 * (g.fade ?? 1);
    ctx.fillStyle = COLORS.ghost;
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    // a stalk pointing the way it is heading, so a ghost reads as an
    // aircraft rather than as a map annotation
    ctx.globalAlpha = g.fade ?? 1;
    if (typeof g.track === 'number') {

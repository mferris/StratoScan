// Talks to the loopback-only setup listener. Not reachable from the network,
// so no credential is needed -- and none can be required, since this is the
// only way back in for someone who has forgotten the admin password.
const DEVICE_API = 'http://127.0.0.1:8090';

async function deviceApi(path, opts = {}) {
  const r = await fetch(DEVICE_API + path, {
    ...opts, headers: { 'Content-Type': 'application/json' } });
  let b = {};
  try { b = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(b?.error?.message || 'That did not work.');
  return b;
}

// ---- Phone & Watch: pairing the StratoScan app (roadmap 2.3) -------------------
// The code on screen is a one-time secret (deploy/pairing.py) and reaches this
// page only over the loopback-only listener above, so nothing else on the
// network can read it. Scanning it with the iPhone Camera opens the app,
// which presents it to the relay; this panel sees the new phone on its next
// poll. Alerts then flow to that phone (deploy/events.py).
const PHONE_POLL_MS = 3000;
let phoneState = null;    // last /onboard/pair: { available, phones, offer }
let phoneMsg = '';
let phoneBusy = false;
let phoneConfirm = null;  // phone id awaiting a second tap to unpair
let phonePoll = null;

async function loadPhoneStatus() {
  try {
    const prev = phoneState ? phoneState.phones.length : null;
    phoneState = (await deviceApi('/onboard/pair')).result;
    if (prev !== null && phoneState.phones.length > prev) {
      const p = phoneState.phones[phoneState.phones.length - 1];
      phoneMsg = `Paired with ${p.name || 'a phone'}. Alerts will go to it.`;
    }
  } catch (e) {
    phoneMsg = e.message;
  }
}

function stopPhonePolling() {
  if (phonePoll) { clearInterval(phonePoll); phonePoll = null; }
}

function startPhonePolling() {
  stopPhonePolling();
  phonePoll = setInterval(async () => {
    if (settingsSection !== 'phone' || !settingsPanelEl.classList.contains('show')) {
      stopPhonePolling();
      return;
    }
    await loadPhoneStatus();
    if (settingsSection === 'phone') renderSettingsPanel();
    if (!phoneState || !phoneState.offer) stopPhonePolling();
  }, PHONE_POLL_MS);
}

function renderPhone() {
  const head = `<div class="sp-back">&#8592; Settings</div><div class="sp-title">Phone &amp; Watch</div>`;
  if (!IS_KIOSK) {
    return head + `<div class="sp-sub" style="padding:10px 0;line-height:1.7">
      Pair a phone from the radar's own screen, or from this radar's setup page.
      The pairing code is only ever shown there.</div>`;
  }
  const msg = phoneMsg ? `<div class="sp-sub" style="padding:8px 0;color:var(--text)">${esc(phoneMsg)}</div>` : '';
  if (!phoneState) {
    return head + msg + `<div class="sp-sub" style="padding:10px 0">${phoneBusy || !phoneMsg ? 'Checking…' : ''}</div>`;
  }
  if (phoneState.available === false) {
    return head + `<div class="sp-sub" style="padding:10px 0">Needs a newer version of this radar's software.</div>`;
  }
  const o = phoneState.offer;
  if (o) {
    const left = Math.max(0, Math.round(o.expires - Date.now() / 1000));
    const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
    const qr = o.qr
      ? `<img class="sp-qr" alt="Pairing code" src="data:image/svg+xml;base64,${btoa(o.qr)}">`
      : `<div class="sp-sub" style="padding:10px 0">QR codes need a software update on this radar.</div>`;
    let forName = '';
    try { forName = new URL(o.link).searchParams.get('n') || ''; } catch (e) { /* older unit */ }
    return head + `
      ${forName ? `<div class="sp-label" style="padding:8px 0 0">Pairing with ${esc(forName)}</div>` : ''}
      <div class="sp-sub" style="padding:8px 0;line-height:1.6">Point your iPhone's Camera at this code,
        then tap the StratoScan banner. Or scan it from the StratoScan app.</div>
      ${qr}
      <div class="sp-sub" style="text-align:center;padding:4px 0 8px">Code works once, for ${mm}:${ss} more</div>
      ${msg}
      <div class="sp-menu-row" data-pact="cancel"><div><div class="sp-label">Cancel</div></div><div class="sp-chevron">&#8250;</div></div>`;
  }
  const phones = (phoneState.phones || []).map(p => {
    const since = p.created ? new Date(p.created * 1000).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const confirm = phoneConfirm === p.id;
    return `<div class="sp-menu-row" data-unpair="${esc(p.id)}">
      <div><div class="sp-label">${esc(p.name || 'Phone')}</div>
           <div class="sp-sub">${confirm ? '<b>Tap again to unpair</b>' : `Paired ${esc(since)} · tap to unpair`}</div></div>
      <div class="sp-chevron">&#8250;</div></div>`;
  }).join('');
  return head + msg + (phones || `<div class="sp-sub" style="padding:8px 0">No phone is paired yet.</div>`) + `
    <div class="sp-menu-row" data-pact="start">
      <div><div class="sp-label">${phoneBusy ? 'Working…' : 'Pair a phone'}</div>
           <div class="sp-sub">Shows a code to scan with the StratoScan app</div></div>
      <div class="sp-chevron">&#8250;</div></div>
    <div class="sp-sub" style="padding:12px 0 4px;line-height:1.6">Alerts reach paired phones through the StratoScan
      service. They say what flew by and roughly how far away, never where this radar is.</div>`;
}

async function handlePhoneTap(row) {
  const { pact, unpair } = row.dataset;
  if (phoneBusy) return;
  phoneMsg = '';
  if (unpair) {
    if (phoneConfirm !== unpair) { phoneConfirm = unpair; renderSettingsPanel(); return; }
    phoneConfirm = null;
  }
  phoneBusy = true; renderSettingsPanel();
  try {
    if (pact === 'start') {
      await deviceApi('/onboard/pair', { method: 'POST', body: JSON.stringify({ action: 'start' }) });
    } else if (pact === 'cancel') {
      await deviceApi('/onboard/pair', { method: 'POST', body: JSON.stringify({ action: 'cancel' }) });
    } else if (unpair) {
      await deviceApi('/onboard/pair', { method: 'POST', body: JSON.stringify({ action: 'remove', phone: unpair }) });
      phoneMsg = 'Unpaired.';
    }
    await loadPhoneStatus();
  } catch (e) {
    phoneMsg = e.message;
  }
  phoneBusy = false;
  if (settingsSection === 'phone') renderSettingsPanel();
  if (phoneState && phoneState.offer) startPhonePolling();
}

let deviceBusy = false;

function renderScorecard() {
  const st = networkStats;
  if (!alertSettings.networkCompare) {
    return `<div class="sp-back">&#8592; Statistics</div><div class="sp-title">Receiver scorecard</div>
      <div class="sp-sub" style="padding:10px 0;line-height:1.7">
        This compares what your antenna hears against a public ADS-B
        network, so you can see how much of the traffic overhead you are
        actually receiving — and, more usefully, which directions and
        altitudes you are blind in.<br><br>
        Turn on <b>Network comparison</b> under Map overlays to start
        measuring. It contacts adsb.lol, so switching it off stops both the
        comparison and the contact.
      </div>`;
  }
  if (!st || !st.ready) {
    return `<div class="sp-back">&#8592; Statistics</div><div class="sp-title">Receiver scorecard</div>
      <div class="sp-sub" style="padding:10px 0;line-height:1.7">
        ${esc(networkError || 'Collecting comparisons. A few minutes of traffic gives a usable picture; a full day gives a reliable one.')}
      </div>`;
  }
  const bands = [['0-2000','below 2,000 ft'], ['2000-6000','2,000–6,000 ft'],
                 ['6000-15000','6,000–15,000 ft'], ['15000+','above 15,000 ft']];
  const bandRows = bands.map(([k, label]) => {
    const b = st.byAlt[k] || {};
    if (!b.total) return '';
    return `<div class="sp-row"><div>
              <div class="sp-label">${esc(label)}</div>
              <div class="sp-sub">${b.heard} of ${b.total} heard</div>
            </div><div class="sp-label">${b.pct}%</div></div>`;
  }).join('');
  // Worst and best 30-degree sector, which is what actually tells you
  // where to point or move the antenna.
  const sect = Object.entries(st.byBearing || {})
    .filter(([, v]) => v.total >= 5)
    .map(([k, v]) => ({ a: Number(k) * 30, pct: v.pct, total: v.total }))
    .sort((x, y) => x.pct - y.pct);
  const dirTxt = sect.length
    ? `Worst ${sect[0].a}–${sect[0].a + 30}° at ${sect[0].pct}%, best ${sect[sect.length-1].a}–${sect[sect.length-1].a + 30}° at ${sect[sect.length-1].pct}%`
    : 'Not enough samples per direction yet';
  // The diagnosis worth stating plainly: low bands weak while high bands
  // are fine is a blocked horizon, not a deaf receiver, and no amount of
  // gain fixes it.
  const low = st.byAlt['0-2000'] || {}, high = st.byAlt['15000+'] || {};
  const verdict = (low.total >= 10 && high.total >= 10 && low.pct !== null && high.pct !== null && high.pct - low.pct > 30)
    ? 'Low traffic is being missed while high traffic is heard — that is a blocked horizon (trees, roofline, indoors), not a sensitivity problem. Height and a clear view fix it; a bigger antenna will not.'
    : 'No strong altitude bias yet.';
  return `<div class="sp-back">&#8592; Statistics</div><div class="sp-title">Receiver scorecard</div>
    <div class="sp-sub" style="padding:6px 0">vs ${esc(st.source)} · ${st.samples} comparisons</div>
    ${networkError ? `<div class="sp-sub" style="padding:4px 0;color:var(--warn)">${esc(networkError)}</div>` : ''}
    <div class="sp-row"><div><div class="sp-label">Coverage</div>
      <div class="sp-sub">${st.heard} of ${st.networkTotal} aircraft in range</div></div>
      <div class="sp-label" style="color:var(--airport-highlight)">${st.coveragePct}%</div></div>
    <div class="sp-row"><div><div class="sp-label">Position freshness</div>
      <div class="sp-sub">yours ${st.medianAgeMine === null ? '—' : st.medianAgeMine + 's'} · network ${st.medianAgeNetwork === null ? '—' : st.medianAgeNetwork + 's'} (median)</div></div></div>
    <div class="sp-section-title">By altitude</div>
    ${bandRows}
    <div class="sp-section-title">By direction</div>
    <div class="sp-sub" style="padding:6px 0;line-height:1.7">${esc(dirTxt)}</div>
    <div class="sp-sub" style="padding:10px 0;line-height:1.7">${esc(verdict)}</div>
    <div class="sp-sub" style="padding:6px 0;opacity:0.7">Network data © ADSB.lol contributors, ODbL 1.0</div>`;
}


// ---- Empty-sky screen ------------------------------------------------------
// An empty radar reads as "broken" to anyone who didn't build it. After
// EMPTY_SKY_AFTER_MS with nothing in range, show the time, the weather and
// today's tally instead; the first aircraft back clears it at once.
// Weather is Open-Meteo (free for non-commercial use, CC BY 4.0, credited on
// screen), asked for with the position rounded to 2 dp (~1 km), the same
// precision the public Funnel gateway already publishes.
const EMPTY_SKY_AFTER_MS = 30 * 1000;
const WEATHER_REFRESH_MS = 20 * 60 * 1000;
const TODAY_REFRESH_MS = 5 * 60 * 1000;
const emptySkyEl = document.getElementById('emptySky');
let emptySinceAt = null;
let emptySkyShown = false;
let emptySkyRenderedAt = 0;
let weatherAt = 0, weatherText = '';
let todayAt = 0, todayText = '';
const WMO = {
  0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Freezing fog',
  51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle',
  61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain',
  71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
  80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 85: 'Snow showers', 86: 'Snow showers',
  95: 'Thunderstorm', 96: 'Thunderstorm, hail', 99: 'Thunderstorm, hail',
};

// The configured airport's country decides, where it is known. Configs
// written before country was recorded (the first unit's) fall back to the
// unit's time zone, which setup always sets and which, unlike the kiosk
// browser's language (en-GB on the first unit), actually says where it is.
// US zones are listed rather than matched by "America/": Toronto is not.
const US_TIME_ZONES = /^(America\/(New_York|Detroit|Chicago|Denver|Boise|Phoenix|Los_Angeles|Anchorage|Juneau|Sitka|Metlakatla|Yakutat|Nome|Adak|Menominee|Puerto_Rico|Indiana\/|Kentucky\/|North_Dakota\/)|Pacific\/(Honolulu|Guam))/;
function useFahrenheit() {
  const cc = (AIRPORT.country || '').toUpperCase();
  if (cc) return ['US', 'LR', 'MM', 'BS', 'BZ', 'KY', 'PW', 'PR', 'GU'].includes(cc);
  return US_TIME_ZONES.test(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
}

async function refreshWeather() {
  if (!home) return;
  weatherAt = performance.now();
  const f = useFahrenheit();
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${home.lat.toFixed(2)}&longitude=${home.lon.toFixed(2)}`
    + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min'
    + `&timezone=auto&forecast_days=1${f ? '&temperature_unit=fahrenheit' : ''}`;
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!res.ok) return;
    const d = await res.json();
    const t = Math.round(d.current.temperature_2m), u = f ? '°F' : '°C';
    const hi = Math.round(d.daily.temperature_2m_max[0]), lo = Math.round(d.daily.temperature_2m_min[0]);
    weatherText = `${t}${u} · ${WMO[d.current.weather_code] || ''} · H ${hi}° L ${lo}°`;
  } catch (e) { /* offline: the clock still shows; try again next interval */ }
}

async function refreshToday() {
  todayAt = performance.now();
  try {
    const st = await (await fetch('/sightings/stats', { cache: 'no-store' })).json();
    const n = st && st.today ? st.today.total : null;
    if (typeof n === 'number') todayText = n === 1 ? '1 aircraft heard today' : `${n.toLocaleString()} aircraft heard today`;
  } catch (e) { /* the store is optional; show without it */ }
}

function renderEmptySky() {
  const now = new Date();
  document.getElementById('esTime').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  document.getElementById('esDate').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('esWeather').textContent = weatherText;
  document.getElementById('esToday').textContent = todayText;
  document.getElementById('esCredit').textContent = weatherText ? 'Weather: Open-Meteo.com' : '';
}

// Called from the draw loop with the number of aircraft drawn in range.
function emptySkyTick(inRangeCount) {
  const now = performance.now();
  const want = alertSettings.emptySky && inRangeCount === 0 && home;
  if (!want) {
    emptySinceAt = null;
    if (emptySkyShown) { emptySkyShown = false; emptySkyEl.classList.remove('show'); }
    return;
  }
  if (emptySinceAt === null) emptySinceAt = now;
  if (now - emptySinceAt < EMPTY_SKY_AFTER_MS) return;
  if (!emptySkyShown) {
    emptySkyShown = true;
    emptySkyEl.classList.add('show');
  }
  if (now - weatherAt > WEATHER_REFRESH_MS) refreshWeather().then(renderEmptySky);
  if (now - todayAt > TODAY_REFRESH_MS) refreshToday().then(renderEmptySky);
  // This runs every frame; the clock only needs a repaint once a second.
  if (now - emptySkyRenderedAt > 1000) { emptySkyRenderedAt = now; renderEmptySky(); }
}

// ---- "What was that?" -----------------------------------------------------
// The question gets asked right after something loud goes over, when it is
// usually already off the radar -- or the display was blanked. tar1090 keeps
// the last hour of every track in RAM on the unit (/run/tar1090: 20-snapshot
// chunks, 8 s apart, plus the in-progress "current" files), so the answer
// needs no new storage and no extra SD-card writes: fetch that history, find
// each aircraft's closest approach to here, and list the ones that came near.
// Finished chunks never change, so they are cached for the page's life.
const REWIND_WINDOWS_MIN = [5, 15, 60];
const REWIND_NEAR_NM = 5;      // "overhead" enough to have been heard
const REWIND_MIN_ROWS = 4;     // on a quiet day, show the nearest few anyway
const REWIND_MAX_ROWS = 25;
const rewindChunkCache = new Map();   // chunk name -> snapshots
let rewindWindowMin = 5;
let rewindRows = null;                 // null = not loaded yet
let rewindError = '';
let rewindSelected = null;             // hex whose track is drawn
let rewindLoadSeq = 0;

async function fetchChunk(name, fresh) {
  const res = await fetch(`/tar1090/chunks/${name}`, { cache: fresh ? 'no-store' : 'default' });
  if (!res.ok) throw new Error(`history unavailable (${res.status})`);
  const data = await res.json();
  return Array.isArray(data.files) ? data.files : [];
}

async function loadRewind() {
  const seq = ++rewindLoadSeq;
  rewindError = '';
  try {
    const list = await (await fetch('/tar1090/chunks/chunks.json', { cache: 'no-store' })).json();
    const names = Array.isArray(list.chunks) ? list.chunks : [];
    for (const k of rewindChunkCache.keys()) if (!names.includes(k)) rewindChunkCache.delete(k);
    await Promise.all(names.filter(n => !rewindChunkCache.has(n)).map(async n => {
      rewindChunkCache.set(n, await fetchChunk(n, false));
    }));
    const current = await Promise.all(['current_large.gz', 'current_small.gz']
      .map(n => fetchChunk(n, true).catch(() => [])));
    const snaps = new Map();
    for (const files of [...rewindChunkCache.values(), ...current]) {
      for (const f of files) if (f && typeof f.now === 'number') snaps.set(f.now, f);
    }
    if (seq !== rewindLoadSeq) return;           // a newer request superseded this one
    rewindRows = closestPasses([...snaps.values()], rewindWindowMin);
  } catch (e) {
    if (seq !== rewindLoadSeq) return;
    rewindError = 'History is not available right now.';
    rewindRows = [];
  }
}

// snapshots: [{ now, aircraft: [[hex, alt, gs, track, lat, lon, seen_pos, type, flight, ...]] }]
function closestPasses(snapshots, windowMin) {
  if (!home || !snapshots.length) return [];
  snapshots.sort((a, b) => a.now - b.now);
  const latest = snapshots[snapshots.length - 1].now;
  const cutoff = latest - windowMin * 60;
  const byHex = new Map();
  for (const snap of snapshots) {
    if (snap.now < cutoff) continue;
    for (const a of snap.aircraft || []) {
      const [hex, alt, gs, track, lat, lon, , , flight] = a;
      if (typeof hex !== 'string' || typeof lat !== 'number' || typeof lon !== 'number') continue;
      const { bearing, range } = haversineBearingRange(home.lat, home.lon, lat, lon);
      let e = byHex.get(hex);
      if (!e) byHex.set(hex, e = { hex, cs: null, points: [], best: null });
      e.points.push({ bearing, range });
      if (realCallsign(flight)) e.cs = realCallsign(flight);
      if (!e.best || range < e.best.range) e.best = { range, bearing, at: snap.now, alt, gs, track };
    }
  }
  const all = [...byHex.values()].filter(e => e.best);
  const near = all.filter(e => e.best.range <= REWIND_NEAR_NM);
  const rows = near.length >= REWIND_MIN_ROWS ? near
    : all.sort((a, b) => a.best.range - b.best.range).slice(0, REWIND_MIN_ROWS);
  return rows.sort((a, b) => b.best.at - a.best.at).slice(0, REWIND_MAX_ROWS)
    .map(e => ({ ...e, ago: Math.max(0, latest - e.best.at) }));
}

const COMPASS16 = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const compassOf = deg => COMPASS16[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
const agoText = s => s < 60 ? 'just now' : `${Math.round(s / 60)} min ago`;

function renderRewind() {
  const chips = REWIND_WINDOWS_MIN.map(m =>
    `<div class="rw-win${m === rewindWindowMin ? ' on' : ''}" data-rwin="${m}">${m === 60 ? '1 hour' : m + ' min'}</div>`).join('');
  let body;
  if (rewindRows === null) body = '<div class="sp-sub" style="padding:10px 0">Looking back…</div>';
  else if (rewindError) body = `<div class="sp-sub" style="padding:10px 0">${esc(rewindError)}</div>`;
  else if (!rewindRows.length) body = '<div class="sp-sub" style="padding:10px 0">Nothing was heard in this window.</div>';
  else body = rewindRows.map(r => {
    const b = r.best;
    const open = r.hex === rewindSelected;
    const info = hexTypeCache.get(r.hex);
    const route = r.cs ? routeCache.get(r.cs) : null;
    const listed = notableFor(r.hex);
    const detail = open ? `<div class="rw-detail">
        ${listed ? `<div class="sp-sub" style="color:var(--airport-highlight)">&#10022; ${esc(listed.label)}${listed.operator ? ' · ' + esc(listed.operator) : ''}</div>` : ''}
        <div class="sp-sub">${esc([info && info.type, info && info.reg].filter(Boolean).join(' · ') || 'Type not known')}</div>
        ${route ? `<div class="sp-sub">${esc(route.text)}${route.plausible ? '' : ' (unconfirmed)'}</div>` : ''}
        <div class="sp-sub">${typeof b.gs === 'number' ? Math.round(b.gs) + ' kt' : '—'}${typeof b.track === 'number' ? ' · heading ' + Math.round(b.track) + '°' : ''} · hex ${esc(r.hex.toUpperCase())}</div>
        <div class="sp-sub">Its track is drawn on the radar.</div>
      </div>` : '';
    return `<div class="sp-menu-row" data-rhex="${esc(r.hex)}">
        <div>
          <div class="sp-label">${esc(r.cs || (info && info.reg) || r.hex.toUpperCase())}</div>
          <div class="sp-sub">${agoText(r.ago)} · ${b.range.toFixed(1)} nm ${compassOf(b.bearing)} · ${esc(formatAltitude(b.alt ?? null))}</div>
        </div>
        <div class="sp-chevron">${open ? '&#8964;' : '&#8250;'}</div>
      </div>${detail}`;
  }).join('');
  return `<div class="sp-title">What was that?</div>
    <div class="sp-sub" style="padding:2px 0 4px">What passed closest to here, most recent first.</div>
    <div class="rw-windows">${chips}</div>${body}`;
}

function showRewindPanel() {
  hideDetailPanel();
  settingsSection = 'rewind';
  rewindRows = null;
  rewindSelected = null;
  settingsPanelEl.scrollTop = 0;
  renderSettingsPanel();
  settingsPanelEl.classList.add('show');
  settingsBackdropEl.classList.add('show');
  loadRewind().then(() => { if (settingsSection === 'rewind') renderSettingsPanel(); });
}

function drawRewindTrack() {
  if (!rewindSelected || settingsSection !== 'rewind' || !settingsPanelEl.classList.contains('show')) return;
  const r = (rewindRows || []).find(x => x.hex === rewindSelected);
  if (!r || r.points.length < 1) return;
  ctx.save();
  ctx.strokeStyle = COLORS.airportHighlight || COLORS.text;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  r.points.forEach((pt, i) => {
    const { x, y } = polarToXY(pt.bearing, Math.min(pt.range, RANGE_NM * 1.2));
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.setLineDash([]);
  const c = polarToXY(r.best.bearing, r.best.range);
  ctx.beginPath();
  ctx.arc(c.x, c.y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- Statistics ------------------------------------------------------
// Everything here is read from the sighting store's aggregate, not
// recomputed on the page: the history is far older than any one browser
// session, and a laptop opening the Funnel URL for the first time should see
// the same numbers the kiosk does.
let statsView = null;   // null = the Statistics menu; otherwise a screen key

const OP_LABELS = {
  com: 'Commercial', pri: 'Private', mil: 'Military', unk: 'Not identified',
};
const KIND_LABELS = {
  heavy: 'Heavy jets', jet: 'Jets', prop: 'Propeller', heli: 'Helicopters',
  lta: 'Balloons & airships', unknown: 'Not identified',
};

function scorecardSubtitle() {
  if (!alertSettings.networkCompare) return 'Turn on Network comparison in Map overlays to measure this antenna';
  if (networkStats && networkStats.ready) return `Hearing ${networkStats.coveragePct}% of the traffic in range`;
  return 'Collecting — check back in a few minutes';
}

const STATS_SCREENS = [
  { key: 'year',      label: `${new Date().getFullYear()} in review`, sub: () => 'Your year overhead: busiest times and most-seen aircraft' },
  { key: 'overview',  label: 'Overview',      sub: () => 'Everything seen here, and how much came close' },
  { key: 'operators', label: 'Who flies over', sub: () => 'Commercial, private and military' },
  { key: 'kinds',     label: 'What flies over', sub: () => 'Jets, propeller aircraft, helicopters' },
  { key: 'nearby',    label: 'Close encounters', sub: () => `Everything that came within ${ALERT_RADIUS_MI} miles` },
  { key: 'records',   label: 'Records',       sub: () => 'Farthest, closest, highest, fastest, busiest times' },
  { key: 'scorecard', label: 'Receiver scorecard', sub: scorecardSubtitle },
  // The public page's visitor counts (1.12): the owner's, so only on the
  // radar's own screen, never offered to someone viewing the public page.
  ...(IS_KIOSK ? [{ key: 'visitors', label: 'Public page visitors',
                    sub: () => 'How many people look at this radar online: counts, not tracking' }] : []),
];

// Rounding a share to whole numbers prints "100%" next to a line saying ten
// aircraft went unheard. A decimal appears only when the value is not exactly
// whole, so a genuine 100% still reads as 100%.
function sharePct(part, whole) {
  if (!whole) return '—';
  const pct = 100 * part / whole;
  return (Number.isInteger(pct) ? pct : Math.round(pct * 10) / 10) + '%';
}

function statNum(n) {
  return typeof n === 'number' ? n.toLocaleString() : '—';
}

function statRow(label, value, sub) {
  return `<div class="sp-stat"><div>
      <div class="sp-label">${esc(label)}</div>
      ${sub ? `<div class="sp-sub">${esc(sub)}</div>` : ''}
    </div><div class="sp-stat-value">${esc(String(value))}</div></div>`;
}

// Bars are scaled against the largest row, not against the total: with one
// category holding 90% of the traffic -- which is what a house near a big
// airport actually looks like -- every other bar would otherwise be a stub
// too short to compare against its neighbours.
function statBars(rows) {
  const max = Math.max(1, ...rows.map(r => r.value));
  if (!rows.some(r => r.value > 0)) {
    return '<div class="sp-sub" style="padding:10px 0">Nothing recorded yet.</div>';
  }
  return rows.map(r => `
    <div class="sp-bar-row">
      <div class="sp-bar-head">
        <div class="sp-label">${esc(r.label)}</div>
        <div class="sp-bar-num">${statNum(r.value)}${r.note ? ` · ${esc(r.note)}` : ''}</div>
      </div>
      <div class="sp-bar"><span style="width:${Math.round(100 * r.value / max)}%"></span></div>
    </div>`).join('');
}

function statsDateLine(st) {
  if (!st) return '';
  // A migrated store has counts but no start date -- see sighting-store.py.
  // Saying "since today" over months of history would be worse than saying
  // nothing, and pretending the backlog does not exist would be worse still.
  const started = st.since
    ? `Counting since ${new Date(st.since * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}`
    : 'Counting from before dates were recorded';
  const backlog = st.undated
    ? ` · ${statNum(st.undated)} aircraft were already on file by then`
    : '';
  return `<div class="sp-sub" style="padding:6px 0">${esc(started + backlog)}</div>`;
}

// Year in review, from the store's per-year counters (/sightings/year).
let yearStats = null;
async function loadYearStats() {
  try { yearStats = await (await fetch('/sightings/year', { cache: 'no-store' })).json(); }
  catch (e) { yearStats = null; }
}
const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function hourLabel(h) { return new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' }); }

function renderYearInReview(back, title) {
  const y = yearStats;
  if (!y) return `${back}${title}<div class="sp-sub" style="padding:10px 0">Looking back over the year…</div>`;
  if (!y.ready) return `${back}${title}<div class="sp-sub" style="padding:10px 0;line-height:1.7">
      The count for ${y.year} starts with the next aircraft this radar hears.</div>`;
  const since = y.countingSince
    ? `<div class="sp-sub" style="padding:6px 0">Counting since ${esc(new Date(y.countingSince * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'long' }))}</div>` : '';
  const monthsSoFar = y.year === new Date().getFullYear() ? new Date().getMonth() + 1 : 12;
  const rec = y.records || {};
  const recRow = (key, label, fmt) => rec[key]
    ? statRow(label, fmt(rec[key].v), rec[key].cs || (rec[key].hex || '').toUpperCase()) : '';
  return `${back}${title}${since}
    ${statRow('Visits overhead', statNum(y.visits), `By ${statNum(y.aircraft)} different aircraft`)}
    ${statRow('New to this radar', statNum(y.newAircraft), 'Heard here for the very first time this year')}
    ${statRow(`Came within ${ALERT_RADIUS_MI} miles`, statNum(y.nearby), 'Passes close enough to set off the nearby alert')}
    ${y.busiestMonth !== null ? statRow('Busiest month', MONTHS_SHORT[y.busiestMonth], `${statNum(y.months[y.busiestMonth])} visits`) : ''}
    ${y.busiestHour !== null ? statRow('Busiest hour', hourLabel(y.busiestHour), 'When the sky over you is fullest') : ''}
    <div class="sp-section-title">Most-seen aircraft</div>
    ${y.top.length ? y.top.map((t, i) => statRow(`${i + 1}. ${t.cs || t.hex.toUpperCase()}`, `${statNum(t.visits)}×`,
        [KIND_LABELS[t.k] || null, OP_LABELS[t.op] || null].filter(Boolean).join(' · '))).join('') : '<div class="sp-sub">Nothing yet.</div>'}
    <div class="sp-section-title">Month by month</div>
    ${statBars(y.months.slice(0, monthsSoFar).map((v, i) => ({ label: MONTHS_SHORT[i], value: v })))}
    <div class="sp-section-title">What flew over</div>
    ${statBars(Object.entries(y.kinds || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: KIND_LABELS[k] || k, value: v })))}
    <div class="sp-section-title">All-time records</div>
    ${recRow('far', 'Farthest heard', v => `${v} nm`)}
    ${recRow('high', 'Highest', v => `${Math.round(v).toLocaleString()} ft`)}
    ${recRow('fast', 'Fastest', v => `${Math.round(v)} kt`)}
    ${recRow('near', 'Closest', v => `${v} nm`)}`;
}

function renderStatsScreen(key, st) {
  const back = '<div class="sp-back">&#8592; Statistics</div>';
  const screen = STATS_SCREENS.find(x => x.key === key);
  const title = `<div class="sp-title">${esc(screen ? screen.label : 'Statistics')}</div>`;

  if (key === 'scorecard') return renderScorecard();
  if (key === 'visitors') return renderVisitors(back, title);
  if (key === 'year') return renderYearInReview(back, title);

  if (!st) {
    return `${back}${title}<div class="sp-sub" style="padding:10px 0;line-height:1.7">
      The flight history is not readable right now. It lives on the radar
      itself, so this resolves on its own once the device is reachable.</div>`;
  }

  if (key === 'overview') {
    // "Seen" and "heard" are deliberately two numbers. Everything in the ring
    // was seen; only what the antenna decoded was heard. Collapsing them
    // would let the network's reach flatter this receiver's.
    const inRing = st.heard + st.networkOnly;
    return `${back}${title}${statsDateLine(st)}
      ${statRow('Aircraft heard here', statNum(st.heard), 'Distinct aircraft this antenna has decoded')}
      ${statRow('Visits', statNum(st.visits), 'Separate passes overhead, not one per aircraft')}
      ${statRow(`Came within ${ALERT_RADIUS_MI} miles`, statNum(st.nearby), 'Passes that triggered the nearby alert')}
      <div class="sp-section-title">With the network comparison</div>
      ${statRow('Seen but not heard', statNum(st.networkOnly), 'Aircraft only ever seen because adsb.lol reported them')}
      ${statRow('Aircraft in range, all sources', statNum(inRing), inRing ? `This antenna accounted for ${sharePct(st.heard, inRing)} of them` : '')}
      <div class="sp-sub" style="padding:12px 0;line-height:1.7">
        The second group is only counted while Network comparison is on, so it
        undercounts any period it was off.</div>`;
  }

  if (key === 'operators') {
    // Only the three real classes are drawn as bars. Operator class could not
    // be recovered for aircraft recorded before it was tracked -- that needs a
    // callsign the old store never kept -- so "not identified" is a backlog
    // that shrinks over time, not a finding about the traffic. Scaling the
    // bars against it would crush the three categories that carry the answer
    // into stubs for months, so it is stated as a plain figure underneath.
    const rows = ['com', 'pri', 'mil'].map(k => ({
      label: OP_LABELS[k],
      value: st.byOp[k] ? st.byOp[k].visits : 0,
      note: `${statNum(st.byOp[k] ? st.byOp[k].ac : 0)} aircraft`,
    }));
    const unk = st.byOp.unk || { ac: 0, visits: 0 };
    return `${back}${title}
      <div class="sp-sub" style="padding:6px 0">Visits by operator, with distinct aircraft alongside</div>
      ${statBars(rows)}
      <div class="sp-sub" style="padding:12px 0;line-height:1.7">
        Military is recognised from the aircraft's address block rather than
        its callsign, so a military aircraft flying a civil-looking callsign
        still lands here.</div>
      ${!unk.visits ? '' : `
      <div class="sp-section-title">Not yet identified</div>
      ${statRow('Visits', statNum(unk.visits), `${statNum(unk.ac)} aircraft`)}
      <div class="sp-sub" style="padding:10px 0;line-height:1.7">
        Operator needs a callsign, and the history collected before this
        screen existed never stored one — so most of the backlog sits here
        and will not move. Aircraft seen from now on are identified as they
        fly over, and each one that comes back is counted properly.</div>`}`;
  }

  if (key === 'kinds') {
    const order = ['heavy', 'jet', 'prop', 'heli', 'lta', 'unknown'];
    const rows = order.map(k => ({
      label: KIND_LABELS[k],
      value: st.byKind[k] ? st.byKind[k].visits : 0,
      note: `${statNum(st.byKind[k] ? st.byKind[k].ac : 0)} aircraft`,
    }));
    return `${back}${title}
      <div class="sp-sub" style="padding:6px 0">Visits by airframe, with distinct aircraft alongside</div>
      ${statBars(rows)}
      <div class="sp-sub" style="padding:12px 0;line-height:1.7">
        Taken from the aircraft type database, which is also what picks each
        blip's shape on the radar — so these categories match what you see
        flying across the screen.</div>`;
  }

  if (key === 'nearby') {
    const opRows = ['com', 'pri', 'mil', 'unk'].map(k => ({
      label: OP_LABELS[k], value: st.byOp[k] ? st.byOp[k].nearby : 0 }));
    const kindRows = ['heavy', 'jet', 'prop', 'heli', 'lta', 'unknown'].map(k => ({
      label: KIND_LABELS[k], value: st.byKind[k] ? st.byKind[k].nearby : 0 }));
    const share = st.visits ? sharePct(st.nearby, st.visits) : null;
    return `${back}${title}
      ${statRow(`Passes within ${ALERT_RADIUS_MI} miles`, statNum(st.nearby),
                share === null ? '' : `${share} of everything that has flown over`)}
      <div class="sp-section-title">Who came close</div>
      ${statBars(opRows)}
      <div class="sp-section-title">What came close</div>
      ${statBars(kindRows)}`;
  }

  if (key === 'records') {
    const r = st.records || {};
    const who = k => {
      const rec = r[k];
      if (!rec) return '';
      const when = rec.at ? new Date(rec.at * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      return [rec.cs || (rec.hex || '').toUpperCase(), when].filter(Boolean).join(' · ');
    };
    const hours = Array.isArray(st.hours) ? st.hours : [];
    const peak = hours.length ? hours.indexOf(Math.max(...hours)) : -1;
    const hourMax = hours.length ? Math.max(1, ...hours) : 1;
    const hourBars = hours.length
      ? `<div class="sp-hours">${hours.map((v, i) =>
            `<i class="${i === peak && v > 0 ? 'peak' : ''}" style="height:${Math.max(1, Math.round(100 * v / hourMax))}%"></i>`).join('')}</div>
         <div class="sp-hours-axis"><span>12am</span><span>6am</span><span>noon</span><span>6pm</span><span>11pm</span></div>`
      : '';
    // The counts above go back further than the records do -- a store
    // migrated from before records existed has thousands of passes but no
    // measurements of them. Saying so here stops "closest approach 3.7 nm"
    // from reading as a contradiction of "916 passes within 2 miles".
    const recNote = st.undated
      ? `Measured since ${st.since ? new Date(st.since * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : 'recently'}. Earlier passes were counted, but their distances and altitudes were never recorded.`
      : '';
    return `${back}${title}
      ${recNote ? `<div class="sp-sub" style="padding:6px 0;line-height:1.6">${esc(recNote)}</div>` : ''}
      ${statRow('Farthest contact', r.far ? `${r.far.v} nm` : '—', who('far'))}
      ${statRow('Closest approach', r.near ? `${r.near.v} nm` : '—', who('near'))}
      ${statRow('Highest', r.high ? `${statNum(r.high.v)} ft` : '—', who('high'))}
      ${statRow('Fastest', r.fast ? `${statNum(r.fast.v)} kt` : '—', who('fast'))}
      <div class="sp-section-title">Busiest time of day</div>
      ${peak >= 0 && hours[peak] > 0
        ? `<div class="sp-sub" style="padding:6px 0">Most arrivals overhead between ${fmtHour(peak)} and ${fmtHour((peak + 1) % 24)}</div>${hourBars}`
        : '<div class="sp-sub" style="padding:10px 0">Not enough traffic recorded yet.</div>'}
      <div class="sp-section-title">Busiest day of the week</div>
      ${weekChart(st.dows)}
      <div class="sp-section-title">Most frequent visitors</div>
      ${(st.top || []).length
        ? (st.top || []).map(t => `<div class="sp-stat"><div>
              <div class="sp-label">${esc(t.cs || (t.hex || '').toUpperCase())}</div>
              <div class="sp-sub">${esc([OP_LABELS[t.op], KIND_LABELS[t.k]].filter(Boolean).join(' · ') || 'Not identified')}</div>
            </div><div class="sp-stat-value">${statNum(t.visits)}</div></div>`).join('')
        : '<div class="sp-sub" style="padding:10px 0">Nothing has come back often enough yet.</div>'}`;
  }

  return `${back}${title}`;
}

// Indexed by ISO weekday, Monday first, matching what the store records --
// see sighting-store.py. Kept in that order rather than shuffled to a
// Sunday-first calendar, so the chart and the stored array cannot drift.
const DOW_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function weekChart(dows) {
  const week = Array.isArray(dows) && dows.length === 7 ? dows : null;
  if (!week || !week.some(v => v > 0)) {
    return `<div class="sp-sub" style="padding:10px 0;line-height:1.7">
      Nothing recorded yet. This starts from the day the radar was updated —
      the visits counted before then were never dated.</div>`;
  }
  const max = Math.max(...week);
  const peak = week.indexOf(max);
  const total = week.reduce((a, b) => a + b, 0);
  // Comparing days only means something once every day has had a turn.
  const partial = week.some(v => v === 0);
  return `<div class="sp-sub" style="padding:6px 0;line-height:1.6">
      Busiest on ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][peak]},
      with ${sharePct(max, total)} of the passes so far${partial ? ' — but not every day has been recorded yet' : ''}</div>
    <div class="sp-week">${week.map((v, i) =>
      `<i class="${i === peak ? 'peak' : ''}" style="height:${Math.max(1, Math.round(100 * v / max))}%"></i>`).join('')}</div>
    <div class="sp-week-axis">${DOW_LABELS.map((d, i) =>
      `<span class="${i === peak ? 'peak' : ''}">${d}</span>`).join('')}</div>`;
}

function fmtHour(h) {
  if (h === 0) return '12am';
  if (h === 12) return 'noon';
  return h < 12 ? `${h}am` : `${h - 12}pm`;
}

// ---- Public page visitors (roadmap 1.12) ----------------------------------
// Read from funnel-gateway.py through the setup service's loopback listener.
let visitorStats = null;

function renderVisitors(back, title) {
  const v = visitorStats;
  if (!v) return `${back}${title}<div class="sp-sub" style="padding:10px 0">Loading…</div>`;
  if (!v.available) {
    return `${back}${title}<div class="sp-sub" style="padding:10px 0;line-height:1.7">
      Not counted on this radar yet: it needs a software update. Counting only
      covers the public web address, so a radar without one has nothing to count.</div>`;
  }
  const t = v.today || {};
  const last7 = (v.days || []).slice(-7);
  const sum = (rows, f) => rows.reduce((n, r) => n + (r[f] || 0), 0);
  const byVisitor = v.basis === 'visitors';
  const devices = Object.entries(v.devices || {}).sort((a, b) => b[1] - a[1])
    .map(([k, n]) => statRow({ phone: 'Phones', tablet: 'Tablets', computer: 'Computers' }[k] || k, statNum(n))).join('');
  const refs = (v.referrers || []).map(([site, n]) => statRow(site === 'other' ? 'Other sites' : site, statNum(n))).join('');
  const hours = v.hours7 || [];
  const peak = hours.indexOf(Math.max(...hours, 0));
  return `${back}${title}
    <div class="sp-section-title">Today</div>
    ${statRow('Page views', statNum(t.views || 0))}
    ${byVisitor ? statRow('Visitors', statNum(t.unique || 0), 'People, counted once each today') : ''}
    ${statRow('Your app, away from home', `${statNum(t.app_minutes || 0)} min`)}
    <div class="sp-section-title">Last 7 days</div>
    ${statRow('Page views', statNum(sum(last7, 'views')))}
    ${byVisitor ? statRow('Visitors', statNum(sum(last7, 'unique')), 'Each day counted on its own') : ''}
    ${sum(last7, 'views') ? statRow('Busiest hour', fmtHour(peak)) : ''}
    ${statRow('Robots and link previews', statNum(sum(last7, 'bots')), 'Not counted as visitors')}
    ${devices ? `<div class="sp-section-title">On, last 30 days</div>${devices}` : ''}
    ${refs ? `<div class="sp-section-title">Came from, last 30 days</div>${refs}` : ''}
    <div class="sp-sub" style="padding:12px 0;line-height:1.7">
      Counts only. No cookies, and nothing is kept that could identify anyone:
      ${byVisitor ? 'a visitor is recognised for one day by a code that is thrown away at midnight.'
                  : 'only page loads are counted, not who made them.'}
      ${v.kept ? 'Kept for 90 days.' : 'Kept until the radar restarts; a setup update keeps them for 90 days.'}</div>`;
}

function renderStatistics() {
  if (statsView) return renderStatsScreen(statsView, flightStats);
  return `<div class="sp-back">&#8592; Settings</div><div class="sp-title">Statistics</div>
    ${statsDateLine(flightStats)}
    ${STATS_SCREENS.map(({ key, label, sub }) => `
      <div class="sp-menu-row" data-stat="${key}">
        <div>
          <div class="sp-label">${esc(label)}</div>
          <div class="sp-sub">${esc(sub())}</div>
        </div>
        <div class="sp-chevron">&#8250;</div>
      </div>`).join('')}`;
}

// The update row. It says what it knows and no more: "up to date" only after
// a check that actually succeeded, never as the default for "we have not
// looked". A device that claims to be current when it has simply never
// checked is worse than one that admits it does not know.
function otaRow() {
  const st = otaState || {};
  const label = 'Software update';
  // What this device is RUNNING, which is not the same as st.version -- that
  // is whatever the last check found, and in the 'checked' state it is the
  // release on GitHub, not the one installed here. Shown in every state,
  // because "what version are you on" is the first question of any support
  // call about a unit in someone else's house, and the answer has to be
  // readable off the screen by the person holding it.
  const running = st.installed_version
    ? `Running ${esc(st.installed_version)}`
    : 'Version unknown';
  let sub, cls = '';
  switch (st.state) {
    case 'checking': sub = `${running} — checking…`; break;
    case 'applying': sub = 'Installing — the screen will restart shortly'; cls = ' disabled'; break;
    case 'ok':       sub = `${running} — up to date`; break;
    case 'rolled_back':
      sub = `${running} — an update failed to start and was undone, so this device is unchanged`;
      break;
    case 'error':    sub = `${running} — could not check: ${esc(st.message || 'unknown')}`; break;
    case 'checked':
      sub = st.update_available
        ? `${running} — version ${esc(st.version || '')} is available, tap to install`
        : `${running} — up to date`;
      break;
    default:         sub = `${running} — tap to check for an update`;
  }
  return `
    <div class="sp-menu-row${cls}" data-act="ota"${st.update_available ? ' style="outline:2px solid var(--airport-highlight)"' : ''}>
      <div><div class="sp-label">${label}</div><div class="sp-sub">${sub}</div></div>
      <div class="sp-chevron">&#8250;</div>
    </div>`;
}

async function loadOtaStatus() {
  try { otaState = await deviceApi('/onboard/ota'); } catch (e) { otaState = null; }
}

// While an update is running the page that started it is about to be killed
// and reloaded, so the polling exists mainly for the moment AFTER it comes
// back: the fresh page reads status.json and reports what happened, including
// a rollback that nobody was present to see.
function startOtaPolling() {
  if (otaPoll) return;
  otaPoll = setInterval(async () => {
    await loadOtaStatus();
    if (!otaState || otaState.state !== 'applying') {
      clearInterval(otaPoll); otaPoll = null;
    }
    if (settingsSection === 'device') renderSettingsPanel();
  }, 4000);
}

function renderDeviceSetup() {
  const msg = deviceMsg
    ? `<div class="sp-sub" style="padding:8px 0;color:var(--text)">${esc(deviceMsg)}</div>` : '';
  const busy = deviceBusy ? '<div class="sp-sub" style="padding:8px 0">Working…</div>' : '';

  if (deviceView === 'wifi') {
    const list = wifiNets.length
      ? wifiNets.map(n => `
          <div class="sp-menu-row" data-wifi="${esc(n.ssid)}">
            <div><div class="sp-label">${esc(n.ssid)}</div>
                 <div class="sp-sub">${n.secured ? 'password needed' : 'open'} · ${n.signal}%</div></div>
            <div class="sp-chevron">&#8250;</div>
          </div>`).join('')
      : '<div class="sp-sub" style="padding:10px 0">Tap Scan to look for networks.</div>';
    const cur = (deviceStatus && deviceStatus.network) || {};
    const curLine = cur.ssid
      ? `<div class="sp-sub" style="padding:6px 0">Currently on <b>${esc(cur.ssid)}</b></div>` : '';
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">WiFi</div>${curLine}
            <div class="sp-menu-row" data-act="wifi-scan">

            </div>${busy}${msg}${list}`;

  if (deviceView === 'address') {
    const list = addrRows.map((m, i) => `
      <div class="sp-menu-row" data-addr="${i}">
        <div><div class="sp-label">${esc(m.label.split(',').slice(0, 3).join(','))}</div>
             <div class="sp-sub">${m.lat.toFixed(4)}, ${m.lon.toFixed(4)} · ${esc(m.country || '')}</div></div>
        <div class="sp-chevron">&#8250;</div>
      </div>`).join('')

  }
  if (deviceView === 'timezone') {

      <div class="sp-menu-row" data-tz="${esc(z)}">
        <div><div class="sp-label">${esc(z)}</div></div>
        <div class="sp-chevron">&#8250;</div>
      </div>`).join('')
      || '<div class="sp-sub" style="padding:10px 0">No zones found.</div>';
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Time zone</div>
            <div class="sp-sub" style="padding:6px 0">Currently <b>${esc(tzCurrent || 'unset')}</b></div>
            <div class="sp-menu-row" data-act="tz-all">
              <div><div class="sp-label">Show all time zones</div>
                   <div class="sp-sub">Instead of just the ones for this country</div></div>
              <div class="sp-chevron">&#8250;</div>
            </div>${busy}${msg}${list}`;
  }
  if (deviceView === 'airport') {

        <div class="sp-chevron">&#8250;</div>

    const cua = (deviceStatus && deviceStatus.airport) || null;

    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Home airport</div>${cuaLine}

  if (deviceView === 'remote') {

          Connected as <b>${esc(rem.magicDnsName || 'this device')}</b>.

        <div class="sp-menu-row" data-act="remote-funnel-${rem.publicUrl ? 'off' : 'on'}">

      <div class="sp-sub" style="padding:10px 0;line-height:1.8">
        Optional. Lets you view this radar from anywhere using your own free

      <div class="sp-menu-row" data-act="remote-start">

      <div class="sp-menu-row" data-act="reboot-confirm">

  if (deviceView === 'reset') {
    return `<div class="sp-back">&#8592; Device setup</div><div class="sp-title">Erase everything</div>
      <div class="sp-sub" style="padding:10px 0;line-height:1.7">
        This removes the WiFi network, the remote access account, the admin
        password, this radar's location, and the flight history and approach

        or to start over if you have forgotten the password.<br><br>
        The radar will then start its own setup network and show new

      ${busy}${msg}
      <div class="sp-menu-row" data-act="reset-confirm">
        <div><div class="sp-label" style="color:#ff6b6b">Type ERASE to confirm</div>
             <div class="sp-sub">Nothing happens until the word matches</div></div>

  // Every row states what it is CURRENTLY set to. Without this the owner has
  // no way to tell a configured device from an unconfigured one, and would
  // have to re-enter a value just to find out what it already was.
  const d = deviceStatus || {};
  const net = d.network || {};
  const wifiNow = net.hotspotActive ? 'Running its own setup network'
                : net.ssid ? `Connected to ${net.ssid}${net.ipv4 ? ' · ' + net.ipv4 : ''}`
                : 'Not connected';
  const locNow = d.location

  const hsNow = hs2.active

    : 'Off — turn on to set this radar up from a phone';
  // Nothing destructive here, so the sub-line is used for reassurance rather
  // than warning: say what a restart costs, since on an appliance with no
  // keyboard "restart" can sound scarier than it is.
  const rebootNow = 'Takes about a minute — settings and history are kept';
  const rem = d.remote || {};
  const remNow = rem.state === 'Running'
    ? (rem.publicUrl ? `Public page at ${rem.publicUrl}` : `Connected as ${rem.magicDnsName || 'this device'}`)
    : 'Not connected';

  const nameNow = d.name
    ? (d.nameIsOwn ? d.name : `${d.name} (from the home airport; tap to choose your own)`)

  return `<div class="sp-back">&#8592; Settings</div><div class="sp-title">Device setup</div>${busy}${msg}
    <div class="sp-menu-row" data-act="set-name"><div><div class="sp-label">Name</div>
      <div class="sp-sub">${esc(nameNow)}. Shown on paired phones</div></div><div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-dev="wifi"><div><div class="sp-label">WiFi</div>
      <div class="sp-sub">${esc(wifiNow)}</div></div><div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-act="set-timezone"><div><div class="sp-label">Time zone and region</div>
      <div class="sp-sub">Clock used on every timestamp, and the WiFi region</div></div>
      <div class="sp-chevron">&#8250;</div></div>

      <div><div class="sp-label">Restart to apply the WiFi region</div>
           <div class="sp-sub">The region is stored but the radio still follows the old one</div></div>
      <div class="sp-chevron">&#8250;</div></div>` : ''}
    <div class="sp-menu-row" data-act="set-address"><div><div class="sp-label">Receiver location</div>
      <div class="sp-sub">Look up an address</div></div>
      <div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-act="set-location"><div><div class="sp-label">…or enter coordinates</div>
      <div class="sp-sub">${esc(locNow)}</div></div><div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-dev="airport"><div><div class="sp-label">Home airport</div>
      <div class="sp-sub">${esc(airNow)}</div></div><div class="sp-chevron">&#8250;</div></div>

      <div class="sp-sub">${esc(remNow)}</div></div><div class="sp-chevron">&#8250;</div></div>
    ${fleetState && fleetState.available !== false ? `
    <div class="sp-stat"><div><div class="sp-label">Fleet</div>
      <div class="sp-sub">${fleetState.fleet
        ? `In "${esc(fleetState.fleet.name || '')}": its administrator sees this radar's health and visit counts, never its location. Leave on the setup page.`
        : 'Not in a fleet. Join one with an invite code on the setup page.'}</div></div></div>` : ''}
    <div class="sp-menu-row" data-act="set-password"><div><div class="sp-label">Admin password</div>
      <div class="sp-sub">${esc(pwNow)}</div></div><div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-act="hotspot-toggle"><div><div class="sp-label">Setup network</div>
      <div class="sp-sub">${esc(hsNow)}</div></div><div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-dev="reboot"><div><div class="sp-label">Restart this radar</div>
      <div class="sp-sub">${esc(rebootNow)}</div></div><div class="sp-chevron">&#8250;</div></div>
    <div class="sp-menu-row" data-dev="reset"><div><div class="sp-label" style="color:#ff6b6b">Erase everything</div>
      <div class="sp-sub">Reset for a new owner, or if the password is lost</div></div>
      <div class="sp-chevron">&#8250;</div></div>`;

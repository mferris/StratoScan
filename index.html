      const a = (g.track - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
      ctx.lineTo(x + (r + 10) * Math.cos(a), y + (r + 10) * Math.sin(a));
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Ghosts are tappable, but they always LOSE to a real contact: the stage
// handler tries findPlaneAtStagePoint first and only falls through to here.
// An aircraft this antenna actually heard must never be shadowed by a
// relayed marker sitting on top of it.
function findGhostAtStagePoint(x, y) {
  const HIT_RADIUS = 26;                       // CSS px; the ring itself is now 13*scale
  const scale = stage.getBoundingClientRect().width / W;   // hoisted: reading
  // this inside the loop forces a layout per ghost on every tap
  let best = null, bestDistSq = Infinity;
  for (const g of ghosts) {
    const { x: gx, y: gy } = polarToXY(g.bearing, g.range);
    const dx = x - gx * scale, dy = y - gy * scale;
    const d2 = dx * dx + dy * dy;
    if (d2 <= HIT_RADIUS * HIT_RADIUS && d2 < bestDistSq) { bestDistSq = d2; best = g; }
  }
  return best;
}

// A deliberately different panel from showDetailPanel's. This aircraft was
// not heard here, so every field that describes THIS receiver's relationship
// to it -- sighting counts, signal, "within 2mi" -- would be a lie or a zero
// that reads like one. What is shown instead is what the network knows, and
// an explicit statement of where it came from.
function showGhostPanel(g) {
  hideSettingsPanel();
  detailPanelHex = g.hex;
  const alt = g.alt === 'ground' ? 'On the ground' : formatAltitude(g.alt);
  const spd = typeof g.gs === 'number' ? Math.round(g.gs) + ' kt' : '—';
  // The network reports `track` and nothing else heading-shaped, which is
  // exactly the field a local contact's "Heading" is read from too -- see
  // normalizeAircraft, where realHdg prefers a.track. Same quantity, so it
  // gets the same label rather than a second name for one number.
  const hdg = typeof g.track === 'number' ? Math.round(g.track) + '°' : '—';
  // How stale the underlying fix is NOW -- their reported age plus however
  // long ago we fetched it. The plain seen_pos would freeze at fetch time and
  // claim a 40-second-old position was fresh.
  const ageS = (g.seenPos || 0) + (performance.now() - g.fixAt) / 1000;
  const age = ageS.toFixed(0) + 's ago' + (ageS >= GHOST_DR_MAX_S ? ' (estimate held)' : '');
  // On GA traffic the callsign IS the registration, so listing both just
  // prints the same string twice under itself.
  const ghostCallsign = realCallsign(g.flight);
  const hasCallsign = !!ghostCallsign;
  const title = ghostCallsign || g.hex.toUpperCase();
  // Prefer the aircraft database's human-readable name over the network's
  // bare ICAO code: "Bombardier Regional Jet CRJ-900" beats "CRJ9".
  const typeTxt = g.typeLabel || g.type || null;
  const regRaw = g.registration || g.reg;
  const reg = (regRaw && regRaw.toUpperCase() !== title.toUpperCase()) ? regRaw : null;
  const subtitle = [typeTxt || 'Unknown type', reg].filter(Boolean).join(' · ');
  const route = hasCallsign ? routeCache.get(title) : null;
  const routeTxt = route ? (route.plausible ? route.text : `${route.text} (unconfirmed)`) : null;
  const src = (networkStats && networkStats.source) || 'the network';
  // Same badge a local contact gets. The source is named in the note below
  // and by the tag above, so spending the badge on it too would cost the one
  // line that says who is flying.
  const { label: airlineLabel, color: badgeColor } = airlineFor(title, hasCallsign, g.hex);
  const isPrivate = airlineLabel === PRIVATE_LABEL;
  // Sightings are this receiver's own history, keyed by hex. A ghost being
  // absent right now says nothing about whether we have logged it before,
  // and "Never seen here before" is a genuinely different statement from
  // "not hearing it at this moment" -- both are worth showing.
  const counts = sightingCounts.get(g.hex) || { total: 0, nearby: 0 };
  const rare = rarityOf({ hex: g.hex, typeCode: g.typeCode || g.type, priorTotal: counts.total });
  detailPanelEl.innerHTML = `
    <div class="dp-close">&times;</div>
    <div class="dp-ghost-tag">\u25cc NOT HEARD HERE</div>
    <div class="dp-photo" style="display:none"></div>
    <div class="dp-cs" style="color:${COLORS.ghost}">${esc(title)}</div>
    <div class="dp-badge" style="background:${badgeColor}">${esc(airlineLabel)}</div>
    <div class="dp-type">${esc(subtitle)}</div>
    ${isPrivate ? `<div class="dp-owner" style="display:none"></div>` : ''}
    ${routeTxt ? `<div class="dp-route${route.plausible ? '' : ' implausible'}">${esc(routeTxt)}</div>` : ''}
    <div class="dp-ghost-note">Your antenna is not receiving this aircraft. Everything below is what ${esc(src)} reports.</div>
    <div class="dp-grid">
      <div class="dp-field"><div class="dp-label">Altitude</div><div class="dp-value">${esc(alt)}</div></div>
      <div class="dp-field"><div class="dp-label">Speed</div><div class="dp-value">${esc(spd)}</div></div>
      <div class="dp-field"><div class="dp-label">Heading</div><div class="dp-value">${esc(hdg)}</div></div>
      <div class="dp-field"><div class="dp-label">Vert. rate</div><div class="dp-value">${esc(vrateLabel(g.vrate ?? null))}</div></div>
      <div class="dp-field"><div class="dp-label">Squawk</div><div class="dp-value">${esc(g.squawk ?? '—')}</div></div>
      <div class="dp-field"><div class="dp-label">Range / Brg</div><div class="dp-value">${g.range.toFixed(1)} nm · ${Math.round(g.bearing)}°</div></div>
      ${!rare ? '' : `<div class="dp-field dp-rare"><div class="dp-label">Notable</div><div class="dp-value">${esc(rare.label)}</div></div>`}
      <div class="dp-field"><div class="dp-label">Sightings</div><div class="dp-value">${counts.total}</div></div>
      <div class="dp-field"><div class="dp-label">Within 2mi</div><div class="dp-value">${counts.nearby}</div></div>
      <div class="dp-field"><div class="dp-label">Their fix</div><div class="dp-value">${esc(age)}</div></div>
    </div>
  `;
  detailPanelEl.classList.add('show');
  detailPanelEl.classList.remove('alert');   // not an alert; the tag says enough
  detailBackdropEl.classList.add('show');
  clearTimeout(detailDismissTimer);
  detailDismissTimer = setTimeout(hideDetailPanel, 18000);
  loadDetailPhoto(g.hex);   // same aircraft, same photo source as any other
  if (isPrivate) loadOwner(g.hex);   // and the same registry lookup
}


// ---- Connectivity status -------------------------------------------------
// Answers one question at a glance: is this thing working? Two independent
// halves, because they fail independently and the fix differs.
//
//   the receiver  -- is aircraft data still arriving? Known from lastGoodFetch,
//                    so this half works from any origin, laptop included.
//   the network   -- is the device on a network, and does that network
//                    actually reach the internet? Only the device itself can
//                    answer that, via the loopback-only setup listener, so a
//                    remote viewer falls back to the receiver half alone.
//
// NetworkManager already runs its own connectivity probe, so setupd reports
// what NM concluded rather than this page making an outbound request to some
// third party to test the line. "limited" is the interesting state: associated
// with an IP but reaching nothing -- exactly the case an address alone cannot
// distinguish, and exactly what a page full of blank map tiles looks like.
// Deliberately slow. Each poll costs the device 200-540ms of real work: the
// endpoint shells out to ~6 nmcli processes and a tailscale call, and on a
// Pi already running at its thermal limit that is not something to do twice
// a minute forever. Nothing here changes quickly -- an SSID or a gateway is
// stable for days -- and the half of the pill that DOES change quickly (is
// aircraft data still arriving?) is recomputed every frame from local state,
// costing nothing. The settings panel refreshes this on open regardless, so
// anyone actually looking at network settings sees current values.
const NET_STATUS_POLL_MS = 3 * 60 * 1000;
let netInfo = null;        // last /onboard payload, or null if unreachable
let netInfoReachable = false;

async function refreshNetStatus() {
  try {
    const res = await fetch(ONBOARD_URL, { cache: 'no-store' });
    if (res.ok) { netInfo = await res.json(); netInfoReachable = true; }
  } catch (e) {
    // Not on the device (a laptop, or the public URL). Not an error: the
    // receiver half below still works, and claiming the network is down
    // because we cannot ask would be worse than saying less.
    netInfoReachable = false;
  }
  renderNetStatus();
}

function netStatusState() {
  const dataAge = performance.now() - lastGoodFetch;
  const dataDead = !connected || dataAge > STALE_MS;

  if (netInfoReachable && netInfo) {
    const n = netInfo.network || {};
    const hotspot = n.hotspotActive || (netInfo.hotspot && netInfo.hotspot.active);
    if (hotspot) return { cls: 'warn', text: 'SETUP WIFI', detail: 'Broadcasting its own setup network — not connected to your WiFi' };
    if (!n.ipv4) return { cls: 'bad', text: 'NO NETWORK', detail: 'Not connected to any network' };
    if (n.connectivity === 'limited' || n.connectivity === 'portal') {
      return { cls: 'warn', text: 'NO INTERNET',
               detail: `On ${n.ssid || 'the network'} (${n.ipv4}) but it is not reaching the internet` };
    }
    if (dataDead) return { cls: 'bad', text: 'NO RECEIVER', detail: `Online via ${n.ssid || 'network'} (${n.ipv4}), but no aircraft data` };
    const pub = netInfo.remote && netInfo.remote.funnelUrl;
    return { cls: 'ok', text: 'ONLINE',
             detail: `${n.ssid ? n.ssid + ' · ' : ''}${n.ipv4}${pub ? ' · public page live' : ''}` };
  }

  // Remote viewer: the page loaded, so the device is plainly reachable --
  // all that is left to report is whether data is still flowing.
  if (dataDead) return { cls: 'bad', text: 'NO DATA', detail: 'The radar is reachable but is not sending aircraft data' };
  return { cls: 'ok', text: 'ONLINE', detail: 'Receiving aircraft data' };
}

function renderNetStatus() {
  const el = document.getElementById('netPill');
  if (!el) return;
  const st = netStatusState();
  el.classList.remove('ok', 'warn', 'bad');
  el.classList.add(st.cls);
  document.getElementById('netPillText').textContent = st.text;
  el.dataset.detail = st.detail;
}

document.getElementById('netPill').addEventListener('click', (e) => {
  e.stopPropagation();
  showToast(document.getElementById('netPill').dataset.detail || '', 6000);
});

// ---- Rare aircraft alert -------------------------------------------------
// The point of a receiver that has been running in one place for months is
// that it knows what NORMAL looks like here, so it can tell you when
// something is not. This is the "go outside and look up" alert.
//
// Three independent reasons, deliberately tuned so the combined rate stays
// low -- an alert that fires constantly is one you learn to ignore, which is
// worse than not having it.

// ICAO 24-bit addresses are allocated by country, and each country reserves
// blocks for military/government airframes. This is the commonly-published
// list, and it is deliberately a conservative subset: a missing range costs
// a missed alert, while a wrong range costs a false one, so erring toward
// omission is the safe direction. Measured against this receiver's own
// catalogue of 384 aircraft it matched exactly one (ae206d, a US military
// address) -- about 1 in 400, which is the rate a rarity alert wants.
const MILITARY_HEX_RANGES = [
  [0x33ff00, 0x33ffff, 'Italian military'],
  [0x350000, 0x37ffff, 'Spanish military'],
  [0x3aa000, 0x3affff, 'French military'],
  [0x3b7000, 0x3bffff, 'French military'],
  [0x3ea000, 0x3ebfff, 'German military'],
  [0x3f4000, 0x3fbfff, 'German military'],
  [0x400000, 0x40003f, 'UK military'],
  [0x43c000, 0x43cfff, 'UK military'],
  [0x480000, 0x480fff, 'Dutch military'],
  [0x4b7000, 0x4b7fff, 'Swiss military'],
  [0xadf7c8, 0xafffff, 'US military'],
  [0xc20000, 0xc3ffff, 'Canadian military'],
  [0xe40000, 0xe41fff, 'Brazilian military'],
];

function militaryOperator(hex) {
  const v = parseInt(hex, 16);
  if (!Number.isFinite(v)) return null;
  for (const [lo, hi, who] of MILITARY_HEX_RANGES) if (v >= lo && v <= hi) return who;
  return null;
}

// ICAO type designators worth walking outside for. Mostly aircraft the
// military hex check above cannot catch (civil heavies and vintage types)
// plus a few military ones that fly on civil-registered addresses.
const NOTABLE_TYPES = new Map([
  ['A388', 'Airbus A380'], ['A124', 'Antonov An-124'], ['A225', 'Antonov An-225'],
  ['B741', 'Boeing 747'], ['B742', 'Boeing 747'], ['B743', 'Boeing 747'],
  ['B744', 'Boeing 747'], ['B748', 'Boeing 747-8'], ['B74S', 'Boeing 747SP'],
  ['C17', 'C-17 Globemaster'], ['C5M', 'C-5 Galaxy'], ['C5', 'C-5 Galaxy'],
  ['B52', 'B-52 Stratofortress'], ['B1', 'B-1 Lancer'], ['B2', 'B-2 Spirit'],
  ['K35R', 'KC-135 Stratotanker'], ['KC46', 'KC-46 Pegasus'], ['KC10', 'KC-10 Extender'],
  ['E3TF', 'E-3 Sentry (AWACS)'], ['E3CF', 'E-3 Sentry (AWACS)'], ['P8', 'P-8 Poseidon'],
  ['V22', 'V-22 Osprey'], ['U2', 'U-2 Dragon Lady'], ['R135', 'RC-135'],
  ['VC25', 'VC-25 (Air Force One)'], ['C32', 'C-32 (Air Force Two)'],
  ['DC3', 'Douglas DC-3'], ['C47', 'Douglas C-47'], ['B17', 'B-17 Flying Fortress'],
  ['P51', 'P-51 Mustang'], ['B29', 'B-29 Superfortress'], ['SPIT', 'Supermarine Spitfire'],
]);

// "Never seen here before" is the most appealing reason and the least usable
// one early on: measured against the live store, 70% of all sighting events
// were still first-ever sightings, because the catalogue only held 384
// aircraft. Firing on 7 of every 10 planes is not a rarity alert. So this
// reason stays switched off until the receiver has met enough traffic for
// "new" to actually mean something; the settings row says so while it waits.
const RARE_FIRST_MIN_CATALOGUE = 2000;
// A floor between alerts regardless of reason. At the measured military rate
// (~1 in 400 aircraft) this should essentially never bind -- it exists so a
// bad type table or a corrupt store can never turn this into a firehose.
const RARE_ALERT_COOLDOWN_MS = 10 * 60 * 1000;
let lastRareAlertAt = -Infinity;

// Specific notable aircraft, from plane-alert-db (ODbL 1.0), fetched weekly by
// the unit (deploy/notable-db.py) into /data/notable.json. Its own category
// names are in-jokes ("Oxcart", "Joe Cool") that mean nothing on someone's
// wall, and a few pass judgement on people ("Dictator Alert", "Oligarch"), so
// every category is shown by a plain, neutral description instead.
// Operator names only ever appear where notable-db.py kept them: military,
// government and police -- never a private person's name.
const NOTABLE_LABELS = {
  'Aerial Firefighter': 'Firefighting aircraft', 'Aerobatic Teams': 'Aerobatic display team',

  'Da Comrade': 'Russian- or Soviet-built aircraft', 'Dictator Alert': 'VIP aircraft',
  'Distinctive': 'One-of-a-kind aircraft', 'Dogs with Jobs': 'Special-mission aircraft',
  "Don't you know who I am?": 'Aircraft of a well-known person', 'Flying Doctors': 'Air ambulance',
  'Football': 'Sports team aircraft', 'GAF': 'German Air Force', 'Gas Bags': 'Balloon or airship',
  'Governments': 'Government aircraft', 'Gunship': 'Attack aircraft', 'Head of State': 'Head of state aircraft',
  'Hired Gun': 'Military contractor', 'Historic': 'Historic aircraft',
  'Jesus he Knows me': 'Religious organisation aircraft', 'Joe Cool': 'Notable aircraft',
  'Jump Johnny Jump': 'de Havilland Chipmunk', 'Nuclear': 'Nuclear emergency support',
  'Oligarch': 'VIP private jet', 'Other Air Forces': 'Air force', 'Other Navies': 'Navy',
  'Oxcart': 'Surveillance aircraft', 'Perfectly Serviceable Aircraft': 'Skydiving aircraft',
  'Police Forces': 'Police aircraft', 'Ptolemy would be proud': 'Aerial survey aircraft',
  'Quango': 'International organisation (NATO, UN…)', 'Radiohead': 'Presidential or VIP transport',
  'RAF': 'Royal Air Force', 'Royal Aircraft': 'Royal Family aircraft', 'Royal Navy Fleet Air Arm': 'Royal Navy',
  'Special Forces': 'Special operations aircraft', 'Toy Soldiers': 'Army aircraft', 'UAV': 'Drone (UAV)',
  'UK National Police Air Service': 'Police aircraft (UK NPAS)', 'Ukraine': 'Ukrainian aircraft',
  'United States Marine Corps': 'US Marine Corps', 'United States Navy': 'US Navy', 'USAF': 'US Air Force',
  'Vanity Plate': 'Distinctive registration', 'Watch Me Fly': 'Flight school aircraft',
  'You came here in that thing?': 'Microlight or very small aircraft', 'Zoomies': 'Fast jet',
};
let notableDb = null;   // hex -> [category, kind, operator, type]
async function loadNotableDb() {
  try {
    const res = await fetch('/data/notable.json');
    if (res.ok) notableDb = (await res.json()).ac || null;
  } catch (e) { /* absent until the unit's first weekly fetch; the rest still works */ }
}
function notableFor(hex) {
  const e = notableDb && notableDb[hex];
  if (!e) return null;
  return { label: NOTABLE_LABELS[e[0]] || 'Notable aircraft', operator: e[2] || null };
}

// Returns {kind, label} for the strongest reason this aircraft is unusual,
// or null if it is just ordinary traffic.
function rarityOf(pl) {
  // A specific tail on the notable list says more than any class-level rule
  // below -- "Air ambulance", not just "never seen here before".
  const listed = notableFor(pl.hex);
  if (listed) return { kind: 'notable', label: listed.label, operator: listed.operator };

  const mil = militaryOperator(pl.hex);
  if (mil) return { kind: 'military', label: mil };

  const notable = pl.typeCode ? NOTABLE_TYPES.get(pl.typeCode.toUpperCase()) : null;
  if (notable) return { kind: 'type', label: notable };

  // pl.priorTotal is the count as it stood BEFORE this visit was recorded,
  // captured in applyUpdate -- reading sightingCounts here would always show
  // the increment this visit just made and never report anything as new.
  if (sightingCounts.size >= RARE_FIRST_MIN_CATALOGUE && pl.priorTotal === 0) {
    return { kind: 'first', label: 'Never seen here before' };
  }
  return null;
}

// Called once per poll like the other per-aircraft checks, and again when a
// type lookup resolves -- the type arrives asynchronously, so an aircraft
// can become recognisably notable a second or two after it first appears.
function checkRareAircraft(pl) {
  if (!pl || pl.rareAlerted) return;
  const why = rarityOf(pl);
  if (!why) return;

  // Marked before the settings check, like checkNearbyAlert and unlike the
  // emergency one: this is a standing property of the aircraft, not an
  // ongoing condition, so there is nothing to re-alert about later.
  pl.rareAlerted = true;
  pl.rareReason = why;
  if (!alertSettings.rareAircraft) return;
  if (performance.now() - lastRareAlertAt < RARE_ALERT_COOLDOWN_MS) return;
  lastRareAlertAt = performance.now();

  wakeScreenForAlert();
  showDetailPanel(pl, true, why.label.toUpperCase(), '\u2726');
  playRareSound();
  speak(announcementFor(pl, why.label));
  showToast(`\u2726 ${why.label.toUpperCase()} \u00b7 ${pl.cs}`, 8000);
}

// A rising three-note arpeggio -- the only ascending triad among the alert
// sounds, so it reads as "something good" rather than the nearby chime's
// two notes or the emergency alert's insistent alternation.
function playRareSound() {
  playTones([[660, 0, 0.16, 0.22], [880, 0.16, 0.16, 0.22], [1320, 0.32, 0.3, 0.24]]);
}

// ---- Emergency squawk alert ---------------------------------------------
// 7500 (hijack), 7600 (radio/comm failure), 7700 (general emergency) are the
// three ICAO-standard codes a pilot squawks to signal a real emergency to
// ATC. Toggleable like everything else in the settings panel, but
// deliberately defaults on and (unlike the other two toggleable alerts)
// pl.emergencyAlerted is only set once this actually fires -- so if it's
// off while a plane is mid-squawk and gets turned back on, it still alerts
// for that ongoing emergency rather than staying silent because the
// transition already "happened" while muted.
const EMERGENCY_SQUAWKS = {
  '7500': 'HIJACK — SQUAWK 7500',
  '7600': 'RADIO FAILURE — SQUAWK 7600',
  '7700': 'EMERGENCY — SQUAWK 7700',
};

// Called once per poll, same cadence as checkNearbyAlert. Gated on
// pl.emergencyAlerted (reset once the squawk clears) so this fires once per
// emergency, not once per second while it's still squawking.
function checkEmergencySquawk(pl) {
  if (!pl) return;
  const label = pl.squawk != null ? EMERGENCY_SQUAWKS[String(pl.squawk)] : null;
  if (label) {
    if (!pl.emergencyAlerted && alertSettings.emergency) {
      pl.emergencyAlerted = true;
      wakeScreenForAlert();
      playEmergencySound();
      showDetailPanel(pl, true, label);
      // "Emergency squawk 7700", in words a person reads aloud, not the banner's.
      speak(announcementFor(pl, `${label.split(' — ')[0].toLowerCase()}, squawk ${String(pl.squawk).split('').join(' ')}`), 2200);
    }
  } else {
    pl.emergencyAlerted = false;
  }
}

// ---- Live RDU ATC audio ---------------------------------------------------
// LiveATC.net's Terms of Use (https://www.liveatc.net/legal/) require
// consulting them before linking directly to a stream (3.15), and separately
// bar making their service "directly available" through another dedicated
// application "for profit or not" (3.4) -- so this deliberately does NOT
// hotlink or embed their raw audio in an <audio> element. Instead it opens
// their own KRDU tower player (the same page anyone gets from liveatc.net
// itself) in a normal browser tab -- completely ordinary use of their site
// through an interactive browser, same as bookmarking it yourself, and it
// still gives them the page view/ad impression their FAQ note about funding
// through advertising depends on.
//
// Confirmed on the real kiosk hardware: window.open() there opened LiveATC's
// page in a way that covered the screen with no touch-reachable way back to
// the radar -- recovered only by SSHing in and restarting the kiosk service.
// ensureAtcAudio refuses outright on IS_KIOSK (see its definition above);
// this is fine and reliable from any normal browser tab (laptop, phone, the
// Funnel URL), which is the only place the settings panel now offers it.
// krdu_twr2 (tower) was the first choice -- more directly matches "landing/
// takeoff" comms -- but that specific feeder was found offline (stuck
// "reconnecting..." indefinitely, confirmed directly on LiveATC's own page,
// not something wrong in our code) when this was tested against the real
// kiosk. krdu_app2 (approach/departure) was confirmed actually playing at
// the same time, so that's what's wired up now. If tower comes back later,
// swap the mount param -- both still show RDU arrival/departure traffic
// either way, just from a different controller position.
function liveAtcUrl() {
  return AIRPORT.atcMount ? `https://www.liveatc.net/hlisten.php?mount=${encodeURIComponent(AIRPORT.atcMount)}` : null;
}
let atcWindow = null; // named-window handle so repeated calls reuse one tab instead of spawning a new one per landing

function ensureAtcAudio() {
  if (IS_KIOSK) return;
  const url = liveAtcUrl();
  if (!url) return; // relocated unit with no configured feed -- see AIRPORT.atcMount
  if (atcWindow && !atcWindow.closed) return;
  atcWindow = window.open(url, 'stratoscan_atc');
}

function closeAtcAudio() {
  if (atcWindow && !atcWindow.closed) atcWindow.close();
  atcWindow = null;
}

// ---- RDU landing/takeoff chime -------------------------------------------
// Reuses airportPhaseOf's own classification (tight radius + real vertical rate
// right at field elevation -- see its comment above) so "sounds like a
// landing/takeoff" always matches "highlighted like one" on screen, rather
// than keeping a second, possibly-drifting definition of the same thing. No
// auto-popped panel here, unlike the other two alerts -- RDU traffic is
// frequent enough that interrupting the display for every one would be a lot
// more disruptive than a quiet chime.
function checkAirportPhaseAlert(pl) {
  if (!pl) return;
  const phase = airportPhaseOf(pl);
  if (phase) {
    if (pl.airportPhaseAlerted !== phase) {
      pl.airportPhaseAlerted = phase;
      if (alertSettings.airportPhase) playAirportPhaseSound(phase);
      if (alertSettings.atc) ensureAtcAudio();
    }
  } else {
    pl.airportPhaseAlerted = null;
  }
}

// ---- Route lookup --------------------------------------------------
// Batched/cached/throttled the same way tar1090 itself queries this API:
// collect callsigns as they're seen, flush a batch every ROUTE_BATCH_MS,
// cache results (including negative ones) for the rest of the session so
// we never look up the same callsign twice.
function queueRouteLookup(cs, lat, lng) {
  if (USE_CORE_FEED) return;        // the feed brings routes; never ask adsb.im from here
  if (routeCache.has(cs) || routePending.has(cs)) return;
  if (routeQueue.some(e => e.callsign === cs)) return;
  routeQueue.push({ callsign: cs, lat, lng });
  if (!routeTimer) routeTimer = setTimeout(flushRouteQueue, ROUTE_BATCH_MS);
}

async function flushRouteQueue() {
  routeTimer = null;
  if (routeQueue.length === 0) return;
  const batch = routeQueue.splice(0, ROUTE_BATCH_MAX);
  for (const e of batch) routePending.add(e.callsign);

  try {
    const res = await fetch(ROUTE_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ planes: batch.map(({ callsign, lat, lng }) => ({ callsign, lat, lng })) }),
      signal: AbortSignal.timeout(10000),
    });
    // A reply that isn't an array (an API change, an error object with a 200)
    // used to throw inside the loop below, landing in the catch that caches
    // nothing -- so the same callsigns were re-queried forever. Treat it as
    // "no routes": every callsign in the batch is cached as a miss.
    let routes = res.ok ? await res.json() : [];
    if (!Array.isArray(routes)) routes = [];
    const found = new Set();
    for (const route of routes) {
      if (!route || !route.callsign) continue;
      found.add(route.callsign);
      // Still shown when the API flags a route implausible for this
      // flight's current position (e.g. a reused flight number resolving to
      // a stale scheduled route) -- rather than silently hiding it, flag it
      // visibly (see the .route.implausible styling) so it reads as "here's
      // our best guess, don't trust it" instead of a wrong-but-confident
      // city pair.
      // Regional/commuter flight numbers commonly cover more than one leg
      // in a day's rotation (e.g. CLT-GSO-CLT, an out-and-back) -- _airports
      // lists every stop in order, not just an origin/destination pair, and
      // requiring exactly 2 silently dropped every one of these (common
      // enough on regional carriers to be the main reason their flights
      // often showed no route at all). Join every stop instead of just the
      // first/last, since first-to-last alone degenerates to "same city
      // both ends" for a round trip like this one.
      const airports = route._airports;
      routeCache.set(route.callsign, (airports && airports.length >= 2)
        ? { text: airports.map(ap => ap.location).join(' → '), plausible: route.plausible !== false }
        : null);
    }
    for (const e of batch) {
      if (!found.has(e.callsign)) routeCache.set(e.callsign, null);
    }
  } catch (e) {
    // network hiccup — don't cache anything, so these get retried later
  } finally {
    for (const e of batch) routePending.delete(e.callsign);
  }

  if (routeQueue.length > 0) routeTimer = setTimeout(flushRouteQueue, ROUTE_BATCH_MS);
}

// ---- Aircraft type lookup --------------------------------------------------
// ADS-B carries no aircraft type/model info directly. tar1090 (already
// installed alongside readsb on this same box) ships its own local hex ->
// [registration, icaoType, flags, typeLong] database, split into a prefix
// trie of small same-origin files so the browser only fetches what it needs.
// We read that same data ourselves (same-origin static files, not tar1090's
// code) rather than duplicating or fetching a multi-hundred-MB database.
//
// "CIRRUS SR-22" -> "Cirrus SR-22": only re-cases words that are ALL CAPS
// (manufacturer names), leaving model numbers like "SR-22"/"737-800" as-is.
function humanizeType(s) {
  return s.split(' ').map(w => /^[A-Z]+$/.test(w) ? w[0] + w.slice(1).toLowerCase() : w).join(' ');
}

async function discoverDatabaseFolder() {
  try {
    const res = await fetch('/tar1090/index.html', { cache: 'force-cache' });
    const html = await res.text();
    const m = /databaseFolder\s*=\s*"([^"]+)"/.exec(html);
    if (m) databaseFolder = m[1];
  } catch (e) {
    // type lookups just stay disabled; everything else still works
  }
}

// Each entry is [typeLong, typeDescription, wtc] -- typeDescription is the
// ICAO Doc 8643 3-char code (e.g. "L2J" = landplane/2 engines/jet, "H1T" =
// helicopter/1 engine/turbine) and wtc is wake-turbulence category (L/M/H/J).
// Both are used by classifyAircraft() below to pick a blip shape.
async function loadTypeCodeTable() {
  if (!databaseFolder) return;
  try {
    const res = await fetch(`/tar1090/${databaseFolder}/icao_aircraft_types2.js`, { cache: 'force-cache' });
    const data = await res.json();
    for (const code in data) {
      const entry = data[code];
      if (!entry) continue;
      const [typeLong, desc, wtc] = entry;
      typeCodeTable.set(code, { label: typeLong ? humanizeType(typeLong) : null, desc: desc || null, wtc: wtc || null });
    }
  } catch (e) {
    // fine — per-hex typeLong (below) still covers most aircraft on its own
  }
}

function fetchShard(bkey) {
  // cache the in-flight promise itself, not just the resolved value — several
  // aircraft sharing a hex prefix (e.g. all US-registered "A...") otherwise
  // race and each fire their own duplicate fetch for the same shard
  if (shardCache.has(bkey)) return shardCache.get(bkey);
  const promise = (async () => {
    try {
      const res = await fetch(`/tar1090/${databaseFolder}/${bkey}.js`, { cache: 'force-cache' });
      return res.ok ? await res.json() : null;
    } catch (e) {
      return null;
    }
  })();
  shardCache.set(bkey, promise);
  return promise;
}

// Walks the same prefix-trie structure tar1090 stores its hex database in:
// each shard either has the remaining hex suffix as a direct key, or a
// "children" list naming deeper shards to descend into.
async function lookupType(hex) {
  const empty = { type: null, reg: null, desc: null, wtc: null, typeCode: null };
  if (hexTypeCache.has(hex)) return hexTypeCache.get(hex);
  if (!databaseFolder || hexTypePending.has(hex)) return empty;
  hexTypePending.add(hex);

  const icao = hex.toUpperCase();
  let level = 1, entry = null;
  while (level <= icao.length) {
    const bkey = icao.substring(0, level);
    const data = await fetchShard(bkey);
    if (!data) break;
    const dkey = icao.substring(level);
    if (dkey in data) { entry = data[dkey]; break; }
    if (data.children && data.children.includes(bkey + dkey[0])) { level++; continue; }
    break;
  }

  let result = empty;
  if (entry) {
    const [reg, typeCode, , typeLong] = entry;
    const meta = typeCode ? typeCodeTable.get(typeCode.toUpperCase()) : null;
    let type = null;
    if (typeLong) type = humanizeType(typeLong);
    else if (meta) type = meta.label;
    result = { type, reg: reg || null, desc: meta ? meta.desc : null, wtc: meta ? meta.wtc : null,
               typeCode: typeCode ? typeCode.toUpperCase() : null };
  }

  hexTypeCache.set(hex, result);
  hexTypePending.delete(hex);
  return result;
}

// ---- Data loading --------------------------------------------------
// The receiver is the only source of the radar's location, so a receiver
// that dies (RDU 2026-09-28: the SDR hung and readsb could not start) used to
// leave the screen with no map at all -- just "LOCATING..." -- and the map
// then had to start from nothing when data came back. The last known
// location is remembered here (written only when it changes), so the map
// stays up through an outage and says NO SIGNAL instead.
const HOME_CACHE_KEY = 'stratoscan_home_v1';
let homeFromCache = false;

function cachedHome() {
  try {
    const h = JSON.parse(localStorage.getItem(HOME_CACHE_KEY) || 'null');
    return h && typeof h.lat === 'number' && typeof h.lon === 'number' ? h : null;
  } catch (e) { return null; }
}

function rememberHome(h) {
  const c = cachedHome();
  if (c && c.lat === h.lat && c.lon === h.lon) return;
  try { localStorage.setItem(HOME_CACHE_KEY, JSON.stringify({ lat: h.lat, lon: h.lon })); } catch (e) {}
}

function useCachedHome() {
  if (home || HOME_OVERRIDE) return;
  const c = cachedHome();
  if (!c) return;
  home = c;
  homeFromCache = true;
  locEl.textContent = formatLoc();
  initMap();
}

async function loadHome() {
  if (HOME_OVERRIDE) {
    home = HOME_OVERRIDE;
    locEl.textContent = formatLoc();
    initMap();
    return;
  }
  try {
    const res = await fetch(RECEIVER_URL, { cache: 'no-store' });
    const data = await res.json();
    if (typeof data.lat === 'number' && typeof data.lon === 'number') {
      const real = { lat: data.lat, lon: data.lon };
      rememberHome(real);
      if (homeFromCache && (Math.abs(home.lat - real.lat) > 0.001 || Math.abs(home.lon - real.lon) > 0.001)) {
        // The unit was moved while its receiver was down: start clean on
        // the new location rather than re-centring every layer in place.
        location.reload();
        return;
      }
      home = real;
      homeFromCache = false;
      locEl.textContent = formatLoc();
      initMap();
    }
  } catch (e) {
    // retried by caller
  }
}

function normalizeAircraft(a) {
  // range/bearing: prefer readsb's precomputed r_dst/r_dir, else derive from
  // lat/lon — but never trust r_dst/r_dir when HOME_OVERRIDE is active, since
  // those are computed by readsb relative to the real antenna position, not
  // whatever point we're displaying as home
  const fixLat = typeof a.lat === 'number' ? a.lat : null;
  const fixLon = typeof a.lon === 'number' ? a.lon : null;

  // Carry the last fix forward to now along the reported ground track (see
  // DR_MAX_S). Guarded on every input the projection needs, so anything
  // missing gs/track, sitting still, or carrying no position age at all
  // simply falls through to the raw fix rather than being flung somewhere.
  const posAge = Math.min(typeof a.seen_pos === 'number' ? Math.max(0, a.seen_pos) : 0, DR_MAX_S);
  const trackDeg = a.track ?? a.calc_track ?? null;
  let lat = fixLat, lon = fixLon;
  if (fixLat !== null && fixLon !== null && posAge > 0 &&
      typeof a.gs === 'number' && a.gs >= DR_MIN_GS_KT && typeof trackDeg === 'number') {
    const [drLon, drLat] = destinationPoint(fixLat, fixLon, trackDeg, a.gs * posAge / 3600);
    lat = drLat;
    lon = drLon;
  }

  let bearing, range;
  // readsb's precomputed r_dst/r_dir describe the raw fix, so they are only
  // usable when we did not move it -- otherwise they would undo the dead
  // reckoning above. Same reason HOME_OVERRIDE disqualifies them: they are
  // measured from the real antenna, not from whatever we display as home.
  if (!HOME_OVERRIDE && lat === fixLat && lon === fixLon &&
      typeof a.r_dst === 'number' && typeof a.r_dir === 'number') {
    range = a.r_dst;
    bearing = a.r_dir;
  } else if (home && lat !== null && lon !== null) {
    const hb = haversineBearingRange(home.lat, home.lon, lat, lon);
    bearing = hb.bearing;
    range = hb.range;
  } else {
    return null; // no usable position yet
  }

  const altRaw = a.alt_baro ?? a.alt_geom;
  const alt = altRaw === 'ground' ? 'ground' : (typeof altRaw === 'number' ? altRaw : null);
  const realHdg = a.track ?? a.true_heading ?? a.mag_heading ?? a.calc_track ?? null;
  const hdg = realHdg ?? bearing; // blip rotation falls back to bearing; detail panel shows realHdg only
  // readsb decodes a contact's identity (flight) squitter separately from
  // (and slower than) its position -- a freshly-acquired plane commonly has
  // real lat/lon for several polls before `flight` shows up at all. Falling
  // back to the hex as `cs` in that gap is fine as a display placeholder
  // (it's literally what tar1090 does too), but badging that gap "Private
  // Aircraft" is actively wrong, not just uninformative -- it's a real
  // confirmed-scheduled-carrier flight whose callsign we just haven't seen
  // yet (self-corrects to the real badge within a poll or two once it
  // arrives, no special handling needed there). Track hasCallsign so the two
  // "no airline" cases -- genuinely unknown yet vs. a real GA tail number
  // that will never match -- don't get conflated under one label.
  const callsign = realCallsign(a.flight);
  const hasCallsign = !!callsign;
  const cs = callsign || a.hex.toUpperCase();

  // The core feed's operator label when there is one -- the unit's copy of
  // these same rules (deploy/labels.py) -- else the page's own.
  const op = a._core && a._core.operator;
  const { icao: airlineIcao, label: airlineLabel, color: badgeColor } = op
    ? { icao: op.icao || null, label: op.label, color: op.color }
    : airlineFor(cs, hasCallsign, a.hex);

  return {
    hex: a.hex, cs, hasCallsign, bearing, range, alt, hdg, realHdg, speed: a.gs ?? null,
    // lat/lon are the dead-reckoned display position; fixLat/fixLon are the
    // raw observed fix, kept because the approach heatmap must be built from
    // positions that were actually reported -- extrapolated points would
    // smear the corridor with our own guesses.
    lat, lon, fixLat, fixLon, posAge,
    squawk: a.squawk ?? null,
    vrate: a.baro_rate ?? a.geom_rate ?? null,
    category: a.category ?? null,
    airlineIcao, airlineLabel, badgeColor,
  };
}

async function fetchAircraft() {
  try {
    const res = await fetch(USE_CORE_FEED ? CORE_URL : DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastGoodFetch = performance.now();
    connected = true;
    applyUpdate(USE_CORE_FEED ? (data.aircraft || []).map(fromCore) : (data.aircraft || []));
  } catch (e) {
    connected = false;
  }
}

function applyUpdate(list) {
  const now = performance.now();
  const seen = new Set();

  for (const raw of list) {
    const n = normalizeAircraft(raw);
    if (!n) continue;
    seen.add(n.hex);

    const existing = planes.get(n.hex);
    if (existing) {
      existing.targetBearing = n.bearing;
      existing.targetRange = n.range;
      existing.cs = n.cs;
      existing.alt = n.alt;
      existing.hdg = n.hdg;
      existing.speed = n.speed;
      existing.lat = n.lat;
      existing.lon = n.lon;
      existing.fixLat = n.fixLat;
      existing.fixLon = n.fixLon;
      existing.posAge = n.posAge;
      existing.airlineIcao = n.airlineIcao;
      existing.airlineLabel = n.airlineLabel;
      existing.badgeColor = n.badgeColor;
      existing.realHdg = n.realHdg;
      existing.squawk = n.squawk;
      existing.vrate = n.vrate;
      existing.category = n.category;
      existing.lastSeen = now;
    } else {
      // Read before recordSightingOnce below increments it -- rarityOf needs
      // to know whether this receiver had ever seen the aircraft before now.
      const priorTotal = (sightingCounts.get(n.hex) || {}).total || 0;
      planes.set(n.hex, {
        ...n,
        priorTotal,
        targetBearing: n.bearing,
        targetRange: n.range,
        typeCode: null,
        typeLabel: null,
        registration: null,
        typeDesc: null,
        wtc: null,
        lastSeen: now,
        trail: [{ bearing: n.bearing, range: n.range, t: now }],
        lastTrailAt: now,
      });
      recordSightingOnce(n.hex, 'total'); // a genuinely new visit, not just still-in-view -- see "Sighting counts" above
    }

    if (!hexTypeCache.has(n.hex)) {
      lookupType(n.hex).then(info => {
        const pl = planes.get(n.hex);
        if (pl) {
          pl.typeLabel = info.type; pl.registration = info.reg; pl.typeDesc = info.desc; pl.wtc = info.wtc;
          pl.typeCode = info.typeCode;
          checkRareAircraft(pl); // the type is what makes some aircraft notable, and it arrives late
          classifySighting(pl);  // and it is what tells a helicopter from a jet
        }
      });
    }

    // Fired proactively here (not just when the detail panel opens, see
    // loadOwner) so the label itself can show it too, not only the panel --
    // same "fire once per hex, cache the miss too via lookupOwner" shape as
    // the type lookup just above.
    if (raw._core) {
      // Route and owner come with the feed: nothing to look up from here.
      const c = raw._core, pl = planes.get(n.hex);
      if (c.route && n.hasCallsign) routeCache.set(n.cs, c.route);
      if (c.owner && pl) {
        pl.owner = c.owner.name;
        pl.ownerCountry = c.owner.country || null;
        ownerCache.set(n.hex, { owner: pl.owner, country: pl.ownerCountry });
      }
    } else if (n.airlineLabel === PRIVATE_LABEL && !ownerCache.has(n.hex)) {
      loadOwner(n.hex);
    }

    // Try for every real callsign, not just ones that look like a scheduled
    // airline flight number -- on-demand/charter GA traffic (badged "Private
    // Aircraft") occasionally does have a route adsb.im can resolve, and
    // there's no harm in asking; a miss just caches null same as today. Only
    // truly skipped when there's no real callsign yet at all (n.cs is the
    // hex fallback -- see hasCallsign in normalizeAircraft), since querying
    // a hex code as if it were a flight number can't return anything.
    if (n.hasCallsign && !raw._core) {
      queueRouteLookup(n.cs, n.lat ?? home?.lat ?? 0, n.lon ?? home?.lon ?? 0);
    }

    updateApproachTracking(planes.get(n.hex), n.fixLat, n.fixLon, n.alt);
    classifySighting(planes.get(n.hex));
    noteFlightRecords(planes.get(n.hex));
    checkNearbyAlert(planes.get(n.hex), n.range);
    checkEmergencySquawk(planes.get(n.hex));
    checkAirportPhaseAlert(planes.get(n.hex));
    checkRareAircraft(planes.get(n.hex));
  }

  // aircraft readsb no longer reports aren't dropped immediately -- they
  // coast (see COAST_TOTAL_MS) at their last known position/heading, fading
  // out in drawPlanes, and are only removed once that grace period elapses
  for (const hex of [...planes.keys()]) {
    if (seen.has(hex)) continue;
    const pl = planes.get(hex);
    if (now - pl.lastSeen > COAST_TOTAL_MS) {
      confirmApproachOnDrop(pl); // catches signal loss right at touchdown, before readsb ever reports 'ground'
      planes.delete(hex);
    }
  }
}

// ---- Drawing ---------------------------------------------------
// The static dial: rings, range labels, crosshair, compass letters, centre dot.
// Drawn onto its own layer by redrawStaticLayers(), not every frame.
function drawRings(ctx) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  for (let i = 1; i <= RINGS; i++) {
    const r = (R / RINGS) * i;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = i === RINGS ? COLORS.ringBright : COLORS.ring;
    ctx.lineWidth = 1;
    ctx.stroke();

    const nm = Math.round((RANGE_NM / RINGS) * i);
    ctx.fillStyle = COLORS.ringLabel;
    ctx.font = '15px JetBrains Mono, monospace';
    ctx.fillText(nm + 'nm', CX + 6, CY - r + 14);
  }

  ctx.strokeStyle = COLORS.crosshair;
  ctx.beginPath();
  ctx.moveTo(CX, CY - R); ctx.lineTo(CX, CY + R);
  ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY);
  ctx.stroke();

  ctx.fillStyle = COLORS.compass;
  ctx.font = '600 20px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', CX, CY - R + 26);
  ctx.fillText('S', CX, CY + R - 12);
  ctx.fillText('E', CX + R - 16, CY + 7);
  ctx.fillText('W', CX - R + 16, CY + 7);
  ctx.textAlign = 'left';

  ctx.beginPath();
  ctx.arc(CX, CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = COLORS.sweep;
  ctx.fill();

  ctx.restore();
}

// Drawn for every in-range aircraft, every frame, underneath that frame's
// fresh blips/labels. Reuses each poll's already-computed bearing/range
// (pushed onto p.trail in applyUpdate) rather than raw lat/lon, so a replayed
// point lands exactly where that plane's blip actually was at the time --
// consistent with HOME_OVERRIDE's effect on live positions too.
function drawTrails() {
  const now = performance.now();
  ctx.save();
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (const p of planes.values()) {
    if (p.range > RANGE_NM) continue; // matches drawPlanes' own in-range filter -- no point trailing a blip that isn't drawn
    if (!p.trail || p.trail.length < 2) continue;
    ctx.strokeStyle = p.color || COLORS.text;
    for (let i = 1; i < p.trail.length; i++) {
      const a = p.trail[i - 1], b = p.trail[i];
      const pa = polarToXY(a.bearing, a.range);
      const pb = polarToXY(b.bearing, b.range);
      ctx.globalAlpha = Math.max(TRAIL_FADE_FLOOR, 1 - (now - b.t) / TRAIL_FADE_MS) * 0.85;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Canvas gradient stops need a literal color string, not a CSS var() --
// this turns COLORS.sweep's hex (theme-aware, see refreshCanvasColors) into
// an rgba() string at whatever alpha the gradient needs.
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

// The sweep sprite, drawn once at angle 0; tick() turns it with a CSS
// transform. Rotating the drawn result about the centre is exactly what
// drawing it at sweepAngle used to do, since every part of it -- gradient
// start, line end -- was the angle-0 drawing turned by sweepAngle.
function drawSweep(ctx) {
  const sweepAngle = 0;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  const grad = ctx.createConicGradient(sweepAngle - Math.PI / 2, CX, CY);
  grad.addColorStop(0, hexToRgba(COLORS.sweep, 0.35));
  grad.addColorStop(0.06, hexToRgba(COLORS.sweep, 0));
  grad.addColorStop(1, hexToRgba(COLORS.sweep, 0));
  ctx.beginPath();
  ctx.arc(CX, CY, SWEEP_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  const lineX = CX + SWEEP_RADIUS * Math.cos(sweepAngle);
  const lineY = CY + SWEEP_RADIUS * Math.sin(sweepAngle);
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(lineX, lineY);
  ctx.strokeStyle = COLORS.sweep;
  ctx.lineWidth = 2;
  ctx.shadowColor = COLORS.sweep;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.restore();
}

// Shared by the on-screen tag and the detail panel, so "the label's altitude"
// and "the detail page's altitude" are always the exact same text -- was two
// separate formats (a flight-level shorthand on the tag, real feet in the
// panel) until the tag was asked to match the panel's wording.
function formatAltitude(alt) {
  if (alt === 'ground') return 'On ground';
  if (alt === null) return '—';
  return `${alt.toLocaleString()} ft`;
}

// Label writes that skip themselves when nothing changed. Setting text or a
// style, even to the value it already has, makes the browser lay the page out
// again -- and measuring the labels then forces that layout every frame, for
// every label (#35). A change that can alter a label's size marks it for
// measuring.
function setText(node, el, v) {
  if (el._text === v) return;
  el._text = v;
  el.textContent = v;
  node._changed = true;
}
function setAttr(el, name, v) {
  const cache = el._attr || (el._attr = {});
  if (cache[name] === v) return;
  cache[name] = v;
  el.setAttribute(name, v);
}
function setStyle(node, el, prop, v, resizes = true) {
  const cache = el._style || (el._style = {});
  if (cache[prop] === v) return;
  cache[prop] = v;
  el.style[prop] = v;
  if (resizes) node._changed = true;
}

function drawPlanes(dt) {
  const stageRect = stage.getBoundingClientRect();
  const scale = stageRect.width / W;
  const inRange = [];
  const now = performance.now();

  // exponential chase toward the latest fix — never fully "arrives," so motion
  // stays continuous instead of visibly settling then pausing between polls
  const alpha = 1 - Math.exp(-dt / SMOOTH_TAU);
  const springAlpha = 1 - Math.exp(-dt / LABEL_SPRING_TAU);

  // --- pass 1: advance motion, draw blips, update each tag's content -----
  // (content must be finalized before we measure box sizes in pass 2)
  for (const p of planes.values()) {
    p.bearing += bearingDelta(p.bearing, p.targetBearing) * alpha;
    p.bearing = ((p.bearing % 360) + 360) % 360; // keep in [0,360) -- pure accumulation would otherwise drift arbitrarily far past it over a long-lived contact (e.g. a tight holding pattern), same issue labelAngle already guards against below
    p.range += (p.targetRange - p.range) * alpha;

    // Record where the blip IS, not where the last fix said it should be.
    // The trail used to be pushed from applyUpdate straight off the incoming
    // fix, which meant the blip glided through each correction (it chases
    // the target with SMOOTH_TAU easing) while the trail took the correction
    // as a hard vertex. Position squitters are missed often on weak signals
    // -- a contact at -23dBFS was measured getting a fresh position on only
    // 7 of 20 polls, worst gap 18.7s -- so every one of those gaps ended in
    // a visible kink behind an aircraft that looked like it was flying
    // smoothly. Sampling the eased position instead makes the trail the
    // history of the drawn path, which is smooth by construction.
    if (now - (p.lastTrailAt || 0) >= TRAIL_SAMPLE_MS) {
      p.lastTrailAt = now;
      const last = p.trail[p.trail.length - 1];
      // Planar distance from the previous point: radial change, plus the arc
      // swept at this range. Cheaper than projecting both to canvas space and
      // exact enough for a threshold this small.
      const moved = !last ? Infinity : Math.hypot(
        p.range - last.range,
        p.range * bearingDelta(last.bearing, p.bearing) * Math.PI / 180);
      if (moved >= TRAIL_MIN_MOVE_NM) {
        p.trail.push({ bearing: p.bearing, range: p.range, t: now });
        pruneTrail(p.trail, now);
      }
    }

    if (p.range > RANGE_NM) continue;
    inRange.push(p);

    // signal lost this poll (or several) -> hold position and fade rather
    // than vanishing outright; see COAST_TOTAL_MS
    // Two different kinds of staleness, and the blip should show the worse of
    // them: readsb has stopped mentioning the aircraft at all (coastAge), or
    // it still reports it but has no fresh position, so what we are drawing
    // is dead reckoning (posAge). Without the second term a minute-old
    // extrapolated guess renders as solid as a one-second-old fix.
    const coastAge = now - p.lastSeen;
    const coastFade = coastAge <= COAST_FRESH_MS ? 1 : Math.max(0, 1 - (coastAge - COAST_FRESH_MS) / COAST_FADE_MS);
    const drFade = 1 - 0.45 * Math.min(1, (p.posAge || 0) / DR_MAX_S);
    p.opacity = Math.min(coastFade, drFade);

    const { x, y } = polarToXY(p.bearing, p.range);
    const color = altColor(p.alt); // no longer overridden for RDU landing/takeoff -- see airportPhaseOf's comment above
    const airportPhase = airportPhaseOf(p);
    p.anchorX = x * scale;
    p.anchorY = y * scale;
    p.color = color;

    const bscale = blipScale(p.alt);
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(x, y);
    ctx.rotate((p.hdg) * Math.PI / 180);
    const kind = classifyAircraft(p);
    const q = quantizeScale(bscale);
    const blip = glowSprite(`b|${kind}|${color}|${q}`, 15 * q, 10, c => {
      c.scale(q, q);
      c.fillStyle = color;
      c.shadowColor = color;
      // shadowBlur is NOT scaled by c.scale -- it is in device space. Left
      // at 10 deliberately so a low, small blip keeps the same glow and does
      // not fade out on the map exactly where traffic matters most.
      c.shadowBlur = 10;
      drawBlipShape(c, kind);
    });
    ctx.drawImage(blip, -blip.half, -blip.half);
    ctx.restore();

    if (airportPhase) {
      // A ring around the blip, drawn un-rotated (it's a circle -- rotating
      // it would be pointless) so it reads as "this plane" regardless of
      // heading, distinct from the blip's own altitude color.
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(x, y);
      // tracks the blip's own size, or it would stand off a shrunken
      // low-altitude blip -- and this ring only ever fires on aircraft that
      // are landing or departing, i.e. the smallest ones on screen
      const q = quantizeScale(bscale);
      const hi = COLORS.airportHighlight;
      const ring = glowSprite(`a|${hi}|${q}`, 13 * q + 1, 8, c => {
        c.strokeStyle = hi;
        c.lineWidth = 2;
        c.shadowColor = hi;
        c.shadowBlur = 8;
        c.beginPath();
        c.arc(0, 0, 13 * q, 0, Math.PI * 2);
        c.stroke();
      });
      ctx.drawImage(ring, -ring.half, -ring.half);
      ctx.restore();
    }

    let node = tagNodes.get(p.hex);
    if (!node) {
      node = document.createElement('div');
      node.className = 'tag';
      node.innerHTML = '<div class="cs"></div><div class="badge"></div><div class="seen"></div><div class="type"></div><div class="alt"></div><div class="route"></div><div class="owner"></div>';
      tagsEl.appendChild(node);
      tagNodes.set(p.hex, node);
    }
    node.classList.toggle('airport-phase', !!airportPhase);
    setStyle(node, node, 'borderLeft', `2px solid ${color}`);
    setText(node, node.querySelector('.cs'), p.cs);
    setStyle(node, node.querySelector('.cs'), 'color', color);
    const speedTxt = p.speed === null ? '--' : Math.round(p.speed);
    setText(node, node.querySelector('.alt'), `${formatAltitude(p.alt)} · ${speedTxt}kt`);

    const badgeEl = node.querySelector('.badge');
    setText(node, badgeEl, p.airlineLabel);
    setStyle(node, badgeEl, 'background', p.badgeColor);
    setStyle(node, badgeEl, 'display', 'inline-block');

    // Only shown once it's actually a signal worth noticing ("you've seen
    // this one before") -- every first-time sighting showing "×1" would
    // just be noise on every label, every time, which is exactly the kind
    // of label clutter this app has repeatedly tried to avoid elsewhere.
    const seenEl = node.querySelector('.seen');
    const counts = sightingCounts.get(p.hex);
    if (counts && counts.total > 1) {
      setText(node, seenEl, `SEEN ×${counts.total}`);
      setStyle(node, seenEl, 'display', 'block');
    } else {
      setStyle(node, seenEl, 'display', 'none');
    }

    const typeEl = node.querySelector('.type');
    if (p.typeLabel) {
      setText(node, typeEl, p.typeLabel);
      setStyle(node, typeEl, 'display', 'block');
    } else {
      setStyle(node, typeEl, 'display', 'none');
    }

    const routeEl = node.querySelector('.route');
    const route = routeCache.get(p.cs);
    if (route) {
      setText(node, routeEl, route.plausible ? route.text : `${route.text} (unconfirmed)`);
      routeEl.classList.toggle('implausible', !route.plausible);
      setStyle(node, routeEl, 'display', 'block');
    } else {
      setStyle(node, routeEl, 'display', 'none');
    }

    const ownerEl = node.querySelector('.owner');
    if (p.owner) {
      setText(node, ownerEl, p.ownerCountry ? `${p.owner} (${p.ownerCountry})` : p.owner);
      setStyle(node, ownerEl, 'display', 'block');
    } else {
      setStyle(node, ownerEl, 'display', 'none');
    }

    p.node = node;
  }

  // --- pass 2: measure boxes, ease each toward its natural ring angle ------
  for (const p of inRange) {
    // Measured only when its contents changed (or every couple of seconds,
    // for a late-loading font): measuring after a change forces a layout.
    if (p.node._changed || p.labelW === undefined || now - (p.measuredAt || 0) > 2000) {
      const rect = p.node.getBoundingClientRect();
      p.labelW = rect.width;
      p.labelH = rect.height;
      p.measuredAt = now;
      p.node._changed = false;
    }

    const desiredAngle = p.bearing; // natural ring position matches bearing exactly
    if (p.labelAngle === undefined) {
      p.labelAngle = desiredAngle;
    } else {
      p.labelAngle += bearingDelta(p.labelAngle, desiredAngle) * springAlpha;
      p.labelAngle = ((p.labelAngle % 360) + 360) % 360;
    }
  }

  // --- pass 3: push apart along the ring, preserving bearing order ---------
  // Only ever adjusting a label's ANGLE (never pulling it off the ring), and
  // only ever swapping pushes between bearing-adjacent neighbors, is what
  // guarantees leader lines never cross — see the comment on LABEL_RING_RADIUS.
  const sorted = inRange.slice().sort((a, b) => a.bearing - b.bearing);
  const n = sorted.length;
  for (let pass = 0; pass < LABEL_SEPARATION_PASSES; pass++) {
    for (let i = 0; i < n; i++) {
      const a = sorted[i];
      const b = sorted[(i + 1) % n];
      if (a === b) continue;

      const wrap = i === n - 1;
      const aAngle = a.labelAngle;
      const bAngle = wrap ? b.labelAngle + 360 : b.labelAngle;

      const aPt = ringPointForAngle(aAngle, scale);
      const bPt = ringPointForAngle(bAngle, scale);
      const aBox = { x: aPt.x - a.labelW / 2, y: aPt.y - a.labelH / 2, w: a.labelW, h: a.labelH };
      const bBox = { x: bPt.x - b.labelW / 2, y: bPt.y - b.labelH / 2, w: b.labelW, h: b.labelH };

      const overlapX = Math.min(aBox.x + aBox.w, bBox.x + bBox.w) - Math.max(aBox.x, bBox.x) + LABEL_MARGIN;
      const overlapY = Math.min(aBox.y + aBox.h, bBox.y + bBox.h) - Math.max(aBox.y, bBox.y) + LABEL_MARGIN;
      if (overlapX <= 0 || overlapY <= 0) continue;

      // push direction is never ambiguous here (a always precedes b in
      // sorted bearing order), so unlike a free-floating 2D layout there's
      // no need for a tie-break — just the measured overlap, which is
      // always genuinely positive at this point (the guard above already
      // filtered out non-overlapping pairs)
      const push = Math.min(overlapX, overlapY) / 2;
      const angleDelta = (push / (LABEL_RING_RADIUS * scale)) * 180 / Math.PI;

      a.labelAngle = ((a.labelAngle - angleDelta) % 360 + 360) % 360;
      b.labelAngle = ((b.labelAngle + angleDelta) % 360 + 360) % 360;
    }
  }

  // --- pass 4: place labels, draw a leader line back to each plane ---------
  // The HUD (location + aircraft count) sits centered near the top of the
  // stage -- close enough to a due-north label's natural ring position that
  // the two can overlap. Computed once per frame (the HUD doesn't move) and
  // used below to nudge any label that would land underneath it.
  const hudBox = hudEl.getBoundingClientRect();
  const hudLeft = hudBox.left - stageRect.left - LABEL_MARGIN;
  const hudRight = hudBox.right - stageRect.left + LABEL_MARGIN;
  const hudBottom = hudBox.bottom - stageRect.top + LABEL_MARGIN;

  const cxScaled = CX * scale, cyScaled = CY * scale, boundRadiusScaled = LABEL_BOUND_RADIUS * scale;
  for (const p of inRange) {
    const ringPt = ringPointForAngle(p.labelAngle, scale);
    let cxBox = ringPt.x, cyBox = ringPt.y; // box center
    const hw = p.labelW / 2, hh = p.labelH / 2;

    // Pull the box's center radially inward, if needed, so every corner
    // stays inside the visible circle -- a few iterations converge because
    // moving the center closer to CX,CY shrinks all four corner distances.
    for (let iter = 0; iter < 4; iter++) {
      let maxDist = 0;
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          const d = Math.hypot(cxBox + sx * hw - cxScaled, cyBox + sy * hh - cyScaled);
          if (d > maxDist) maxDist = d;
        }
      }
      if (maxDist <= boundRadiusScaled) break;
      const s = boundRadiusScaled / maxDist;
      cxBox = cxScaled + (cxBox - cxScaled) * s;
      cyBox = cyScaled + (cyBox - cyScaled) * s;
    }

    let lx = cxBox - hw;
    let ly = cyBox - hh;
    // final defensive clamp against the square stage bounds themselves
    lx = Math.max(2, Math.min(stageRect.width - p.labelW - 2, lx));
    ly = Math.max(2, Math.min(stageRect.height - p.labelH - 2, ly));

    // clear the HUD text block rather than sit underneath it -- only
    // triggers for labels whose ring position lands near due north
    if (ly < hudBottom && lx < hudRight && lx + p.labelW > hudLeft) {
      ly = Math.max(2, Math.min(stageRect.height - p.labelH - 2, hudBottom));
    }
    p.labelX = lx;
    p.labelY = ly;
    // whole pixels, so the text stays crisp on its own layer
    setStyle(p.node, p.node, 'transform', `translate(${Math.round(lx)}px, ${Math.round(ly)}px)`, false);
    setStyle(p.node, p.node, 'opacity', String(p.opacity), false);

    const attach = closestPointOnRect(p.anchorX, p.anchorY, lx, ly, p.labelW, p.labelH);
    const attachX = attach.x, attachY = attach.y;

    let line = leaderNodes.get(p.hex);
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      leadersEl.appendChild(line);
      leaderNodes.set(p.hex, line);
    }
    // only what changed, like the labels (#35)
    setAttr(line, 'x1', p.anchorX.toFixed(1));
    setAttr(line, 'y1', p.anchorY.toFixed(1));
    setAttr(line, 'x2', attachX.toFixed(1));
    setAttr(line, 'y2', attachY.toFixed(1));
    setAttr(line, 'stroke', p.color);
    setStyle(line, line, 'opacity', String(LEADER_BASE_OPACITY * p.opacity), false); // CSS base opacity, scaled by coast fade
  }

  // remove tag/leader nodes for aircraft no longer tracked or out of range
  for (const [hex, node] of tagNodes) {
    const pl = planes.get(hex);
    if (!pl || pl.range > RANGE_NM) {
      node.remove();
      tagNodes.delete(hex);
      const line = leaderNodes.get(hex);
      if (line) { line.remove(); leaderNodes.delete(hex); }
    }
  }

  // When the comparison is on, the interesting number is not just how many
  // this antenna heard but how many it did NOT -- that is the whole point of
  // the overlay, and it should be readable without hunting for faint rings.
  const missed = alertSettings.networkCompare ? ghosts.length : 0;
  emptySkyTick(inRange.length);
  setText(countEl, countEl, inRange.length + ' AIRCRAFT'
    + (missed ? ` · ${missed} NOT HEARD` : ''));
}

let lastNetPillState = null;
function updateStatus() {
  const now = performance.now();
  const stale = !connected || (now - lastGoodFetch) > STALE_MS;
  statusEl.classList.toggle('show', stale);
  // Cheap enough to evaluate per frame; only touch the DOM when the answer
  // actually changes, since this runs inside the render loop.
  const s = netStatusState().text;
  if (s !== lastNetPillState) { lastNetPillState = s; renderNetStatus(); }

  if ((now - lastGoodFetch) > DROP_MS && planes.size > 0) {
    planes.clear();
    for (const node of tagNodes.values()) node.remove();
    tagNodes.clear();
    // Leaders are only pruned alongside their tag, so clearing tags without
    // these left every leader line frozen on screen after a feed outage.
    for (const line of leaderNodes.values()) line.remove();
    leaderNodes.clear();
  }
}

// ---- Main loop -------------------------------------------------
let lastFrameTs = performance.now();
let lastCanvasTs = 0;
let canvasDirty = true;
// A tap should answer at once, not at the next slow redraw.
document.addEventListener('pointerdown', () => { canvasDirty = true; }, { capture: true, passive: true });
document.addEventListener('pointerup', () => { canvasDirty = true; }, { capture: true, passive: true });

// Reported from inside the loop, after a frame is genuinely drawn, so the
// device can tell "still painting" from "alive but frozen" -- a distinction
// nothing outside the browser can make. Chromium can lose its GPU context
// and never repaint while every other sign of life continues: timers fire,
// fetches succeed, the page looks healthy from the outside. See the watchdog
// in deploy/wake-listener.py, which is what listens for this.
//
// Deliberately at the end of a drawn frame rather than on a timer of its own:
// a timer would keep reporting health through exactly the failure it exists
// to catch.
const HEARTBEAT_MS = 20 * 1000;
let lastHeartbeatAt = 0;

function reportPainted(now) {
  if (now - lastHeartbeatAt < HEARTBEAT_MS) return;
  lastHeartbeatAt = now;
  // The heartbeat doubles as the reload channel. Chromium on this hardware
  // accumulates shared memory per document -- ~200MB/h, until allocations
  // fail and the panel freezes -- and tearing the document down releases
  // about half of it (151MB -> 72MB, measured). So the shm guard asks for a
  // reload here rather than restarting the browser: no black screen, and no
  // chance of Chromium coming back windowed instead of in kiosk mode.
  //
  // 204 is the normal answer; a 200 carries {"reload":1}. Nothing is lost by
  // reloading -- sightings, statistics and the approach heatmap all live in
  // the server-side stores -- beyond trails and ghost tracks, which rebuild
  // within a sweep.
  fetch('/wake/alive', { method: 'POST' })
    .then(r => (r.status === 200 ? r.json() : null))
    .then(d => { if (d && d.reload) location.reload(); })
    .catch(() => {});  // absent off-device; harmless
}

function tick(ts) {
  // re-arm first: an early return below must not kill the loop
  requestAnimationFrame(tick);

  const since = ts - lastFrameTs;
  if (since < frameMinMs) return; // frame budget not up yet -- skip the repaint
  // dt is measured from the last frame actually DRAWN, so interpolation and
  // the sweep stay correct across skipped frames
  const dt = Math.min(0.25, Math.max(0, since / 1000));
  lastFrameTs = ts;

  if (!sweepAnim) sweepEl.style.transform = `rotate(${sweepAngle}rad)`;   // perf flag sweepJs only

  // The aircraft canvas is redrawn less often than the sweep turns. Measured
  // on RDU (#35): repainting that full-screen canvas was ~3/4 of Chromium's
  // GPU load -- shrinking it to 1px took the GPU process from ~96% of a core
  // to ~21%, and neither the blips' glow nor anything else came close. At
  // 20 nm a jet at 450 kt crosses about 3 px a second, so 5 redraws a second
  // look the same as 15; the sweep, the one fast thing, is a compositor
  // layer and keeps the full rate. A touch redraws at once.
  const canvasSince = ts - lastCanvasTs;
  if (canvasDirty || canvasSince >= canvasMinMs) {
    const cdt = Math.min(0.25, Math.max(0, canvasSince / 1000));
    lastCanvasTs = ts;
    canvasDirty = false;
    ctx.clearRect(0, 0, W, H);
    drawTrails();
    drawRewindTrack();
    updateGhosts(ts);      // advance dead reckoning before anything reads `ghosts`
    drawGhostTrails();
    drawGhosts();          // under drawPlanes: a ghost must never hide a real contact
    drawPlanes(cdt);
    updateStatus();
  }

  sweepAngle += SWEEP_RAD_PER_SEC * dt;
  if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;

  reportPainted(ts);   // last, so it only ever follows a frame that was drawn
}

// Registered-owner lookup for confirmed-private aircraft (a real callsign
// that just doesn't match the airline flight-number pattern -- not the
// "Identifying..." case, which isn't confirmed as anything yet). adsbdb.com
// aggregates public aircraft registry data -- the FAA's releasable registry
// for US tails, plus other countries' equivalents -- behind a free, no-key
// API, same class of source as everything else this app already leans on
// (adsb.im, planespotters, Wikipedia, Overpass, RainViewer). Queried by hex
// rather than parsing a registration out of the callsign, since we always
// have the hex and it's exactly what readsb already identifies the plane by.
// Only a real answer (found, or a confirmed 404 -- not in the registry) gets
// cached; a network hiccup doesn't, so it just retries next time the panel
// opens, same reasoning as lookupStockPhoto above.
//
// Country of registration (registered_owner_country_name) is included too --
// that's as far as "location" goes here, deliberately: adsbdb doesn't expose
// anything more granular than country, and that's the right amount of detail
// anyway -- it's public aviation-registry metadata, same category as the
// registration number itself, not anything that narrows down a real person's
// location the way street-address-level lookup would (see HANDOFF.md for the
// earlier, explicitly declined request to go further than this).
// loadOwner is called on every 1 s poll for each private aircraft until the
// answer is cached. A slow or failing adsbdb used to mean a new fetch per
// aircraft per second, piling up behind Chromium's per-host connection limit
// with no timeout. One request in flight per hex, a hard timeout, and a
// short back-off after a failure keep that bounded.
const ownerPending = new Set();
const ownerFailedAt = new Map();   // hex -> Date.now() of the last failed attempt
const OWNER_RETRY_MS = 5 * 60 * 1000;
async function lookupOwner(hex) {
  if (ownerCache.has(hex)) return ownerCache.get(hex);
  if (USE_CORE_FEED) return null;   // the feed brings owners; never ask adsbdb from here
  if (ownerPending.has(hex)) return null;
  const failed = ownerFailedAt.get(hex);
  if (failed && Date.now() - failed < OWNER_RETRY_MS) return null;
  ownerPending.add(hex);
  try {
    const res = await fetch(`https://api.adsbdb.com/v0/aircraft/${hex}`,
                            { signal: AbortSignal.timeout(8000) });
    if (res.status === 404) { ownerCache.set(hex, null); return null; }
    if (!res.ok) { ownerFailedAt.set(hex, Date.now()); return null; }
    const data = await res.json();
    const owner = data?.response?.aircraft?.registered_owner || null;
    const country = data?.response?.aircraft?.registered_owner_country_name || null;
    const result = owner ? { owner, country } : null;
    ownerCache.set(hex, result);
    ownerFailedAt.delete(hex);
    return result;
  } catch (e) {
    ownerFailedAt.set(hex, Date.now());
    return null;
  } finally {
    ownerPending.delete(hex);
  }
}

async function loadOwner(hex) {
  const info = await lookupOwner(hex);
  if (!info) return;
  const pl = planes.get(hex);
  if (pl) { pl.owner = info.owner; pl.ownerCountry = info.country; } // so the tag can show it too, not just the detail panel
  if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
  const ownerEl = detailPanelEl.querySelector('.dp-owner');
  if (!ownerEl) return;
  ownerEl.textContent = info.country ? `Registered to ${info.owner} (${info.country})` : `Registered to ${info.owner}`;
  ownerEl.style.display = 'block';
}

// Photo comes from planespotters.net via our own same-origin /photo/<hex>
// proxy (see deploy/photo-proxy.py) -- their API requires a descriptive
// custom User-Agent that browser fetch() can never set itself. Shown as
// plain, non-clickable text credit rather than a real link: this same page
// also runs unattended in the kiosk's Chromium, and a tap-driven navigation
// away from the app with no way back isn't an acceptable risk there, even
// though a normal browser tab (e.g. via the Funnel URL) would handle it
// fine. Per planespotters.net's terms of use, attribution (photographer
// credit + naming the source) is still given either way.
// Generic silhouette (Google Material Icons "flight" glyph, Apache-2.0)
// shown in place of a real photo when planespotters.net has none on file --
// drawn inline so it needs no network fetch and matches the panel's theme.
const PLACEHOLDER_PHOTO_SVG = `

    </g>

`;

function showPlaceholderPhoto(photoEl) {
  photoEl.innerHTML = PLACEHOLDER_PHOTO_SVG + '<div class="dp-photo-credit">No photo available</div>';
  photoEl.style.display = 'block';
}

// Most tracked tails (private/GA especially) have no dedicated planespotters
// photo -- rather than always falling back to the generic silhouette, try a
// representative photo of the aircraft *type* instead (e.g. any Cessna 172,
// not necessarily this exact tail): the lead image of the type's Wikipedia
// article, if it is a freely licensed Wikimedia Commons file. The unit looks
// it up (deploy/photo-proxy.py, /photo/type) so visitors' browsers never ask
// Wikipedia themselves (#33). Cached per type string (typeLabel), not per
// hex, since many tails share a type. Clearly labeled "Representative photo"
// (a badge on the image itself, not just the credit line) so it's never
// mistaken for a real photo of that specific airframe, and credited with the
// author and licence that Commons' CC BY-SA files require.

// A credit line: a real link in a normal browser, plain text on the kiosk,
// where navigating away has no touch-reachable way back to the radar.
function creditHtml(text, href) {
  // https only: the href comes from external APIs, and a javascript: URL
  // survives HTML escaping intact.
  if (IS_KIOSK || !/^https:\/\//i.test(href || '')) return esc(text);
  return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
}

async function lookupStockPhoto(typeLabel) {
  if (stockPhotoCache.has(typeLabel)) return stockPhotoCache.get(typeLabel);
  if (stockPhotoPending.has(typeLabel)) return null;
  stockPhotoPending.add(typeLabel);
  let result = null;
  try {
    const res = await fetch(`/photo/type?q=${encodeURIComponent(typeLabel)}`);
    const data = await res.json();
    if (data.found && /^https:\/\//.test(data.thumb || '')) {
      result = { thumb: data.thumb, artist: data.artist, license: data.license, page: data.page };
    }
  } catch (e) {
    // offline or the unit's lookup unavailable -- caller falls back to the
    // placeholder; not cached, so a later reopen retries
  }
  // Only successful lookups are cached: one hiccup mustn't leave a whole
  // type on the placeholder for the session (the unit remembers misses).
  if (result) stockPhotoCache.set(typeLabel, result);
  stockPhotoPending.delete(typeLabel);
  return result;
}

// Photo comes from planespotters.net via our own same-origin /photo/<hex>
// proxy (see deploy/photo-proxy.py) -- their API requires a descriptive
// custom User-Agent that browser fetch() can never set itself. Shown as
// plain, non-clickable text credit rather than a real link: this same page
// also runs unattended in the kiosk's Chromium, and a tap-driven navigation
// away from the app with no way back isn't an acceptable risk there, even
// though a normal browser tab (e.g. via the Funnel URL) would handle it
// fine. Per planespotters.net's terms of use, attribution (photographer
// credit + naming the source) is still given either way.
async function tryStockPhoto(hex, photoEl) {
  // `planes` holds only what THIS antenna heard, so reading the type from it
  // alone meant every network ghost -- which by definition is not in that map
  // -- fell straight through to the placeholder, even when its type was known
  // and sitting right there in the panel above the empty photo frame. GA tails
  // feel this hardest: they rarely have a planespotters photo of the specific
  // airframe, so the representative-photo path is the only one they ever get.
  const typeLabel = planes.get(hex)?.typeLabel || ghostTracks.get(hex)?.typeLabel;
  if (!typeLabel) { showPlaceholderPhoto(photoEl); return; }
  const stock = await lookupStockPhoto(typeLabel);
  if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
  if (!stock) { showPlaceholderPhoto(photoEl); return; }
  photoEl.innerHTML = `
    <div class="dp-photo-badge">Representative photo</div>
    <img src="${esc(stock.thumb)}" alt="${esc(typeLabel)} (representative photo, not this specific aircraft)">
    <div class="dp-photo-credit">${creditHtml(`${typeLabel} · Photo: ${stock.artist} · ${stock.license} · Wikimedia Commons`, stock.page)}</div>
  `;
  photoEl.style.display = 'block';
}

async function loadDetailPhoto(hex) {
  const photoEl = detailPanelEl.querySelector('.dp-photo');
  if (!photoEl) return;
  try {
    const res = await fetch(`/photo/${hex}`, { cache: 'no-store' });
    const data = await res.json();
    if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return; // stale by the time this resolved
    if (!data.found) { await tryStockPhoto(hex, photoEl); return; }
    photoEl.innerHTML = `
      <img src="${esc(data.thumbLarge || data.thumb)}" alt="${esc(detailPanelEl.querySelector('.dp-cs')?.textContent || 'Aircraft')} photo">
      <div class="dp-photo-credit">${creditHtml(`© ${data.photographer || 'Unknown'} · planespotters.net`, data.link)}</div>
    `;
    photoEl.style.display = 'block';
  } catch (e) {
    if (detailPanelHex !== hex || !detailPanelEl.classList.contains('show')) return;
    await tryStockPhoto(hex, photoEl);
  }
}

function hideDetailPanel() {
  detailPanelHex = null;
  detailPanelEl.classList.remove('show');
  detailPanelEl.classList.remove('alert');
  detailBackdropEl.classList.remove('show');
  clearTimeout(detailDismissTimer);
}

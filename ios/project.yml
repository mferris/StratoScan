name: StratoScan
options:
  bundleIdPrefix: com.NelsonIndustries
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.28.0

targets:
  StratoScan:
    type: application
    # a shared scheme, so xcodebuild and Xcode always have one to build
    scheme: {}
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: StratoScan
      - path: Shared
    dependencies:
      - package: MapLibre
        product: MapLibre
      - target: StratoScanWidget
      # Attaches the airline's logo to an alert before it is shown (#60).
      - target: StratoScanNotificationService
      # The Watch app (roadmap 3.1) ships inside the iPhone app.
      - target: StratoScanWatch
    entitlements:
      path: StratoScan/App/StratoScan.entitlements
      properties:
        # Development builds; Xcode switches to "production" when exporting
        # for TestFlight or the App Store.
        aps-environment: development
        # Lets an emergency squawk break through Focus modes.
        com.apple.developer.usernotifications.time-sensitive: true
        # Shared settings with the widget (the radar's address, demo mode).
        com.apple.security.application-groups: [group.com.NelsonIndustries.radome]
        # Setting up a new radar (2.18): join its setup network from the app.
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: StratoScan/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Plain HTTP only to the local network (the radar at home: IP addresses,
          # .local names, Tailscale short names). Everything else must be HTTPS.
          NSAllowsLocalNetworking: true
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        # Only HTTPS and CryptoKit signing: exempt (App Store export compliance).
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.NelsonIndustries.radome.pair
            # stratoscan:// from units on 2026.10.01.2+; radome:// still accepted from older ones
            CFBundleURLSchemes: [stratoscan, radome]
        NSCameraUsageDescription: "To scan a StratoScan radar's pairing code, and to show aircraft over the camera image in Sky view. Nothing is recorded or sent."
        NSLocalNetworkUsageDescription: "To reach your radar on your home WiFi, and to set up a new one."
        NSLocationWhenInUseUsageDescription: "To show where you are on the radar, and to aim the compass and Sky view. It stays on this phone unless you turn on a feature that says otherwise."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Only if you turn on alerts for aircraft approaching you: when you move, your location is sent encrypted so only your own radar can read it, to warn you of aircraft about to pass over. Turn it off any time in Settings."
        CFBundleDisplayName: StratoScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NelsonIndustries.radome
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The maintainer's Apple team. A fork sets its own (Xcode › Signing).
        DEVELOPMENT_TEAM: 76VUC2AMZH
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true

  StratoScanWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: StratoScanWidget
      - path: Shared
    info:
      path: StratoScanWidget/Info.plist
      properties:
        CFBundleDisplayName: StratoScan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          # Plain HTTP only to the local network (the radar at home: IP addresses,
          # .local names, Tailscale short names). Everything else must be HTTPS.
          NSAllowsLocalNetworking: true
    entitlements:
      path: StratoScanWidget/StratoScanWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.NelsonIndustries.radome]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NelsonIndustries.radome.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 76VUC2AMZH
        CODE_SIGN_STYLE: Automatic

  # ---- Notification service extension (#60) ---------------------------------
  # Runs for each alert before it is shown and attaches the airline's logo,
  # fetched from the airline's own site. No app group, no entitlements: it
  # only needs the network and its own cache.
  StratoScanNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: StratoScanNotificationService
      - path: Shared
    info:
      path: StratoScanNotificationService/Info.plist
      properties:
        CFBundleDisplayName: StratoScan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NelsonIndustries.radome.notifications
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 76VUC2AMZH
        CODE_SIGN_STYLE: Automatic

  # ---- Apple Watch (roadmap 3.1) -------------------------------------------
  # A small radar and the nearest aircraft, read from the same radar as the
  # phone; the phone sends the radar's addresses over WatchConnectivity.
  StratoScanWatch:
    type: application
    # a shared scheme, so xcodebuild and Xcode always have one to build
    scheme: {}
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StratoScanWatch
      - path: Shared/APIConfig.swift
      - path: Shared/Aircraft.swift
      - path: Shared/AircraftFeedClient.swift
      - path: Shared/DemoFeed.swift
      - path: Shared/Geo.swift
      - path: Shared/BrandMark.swift
      - path: Shared/demo-traffic.json
    dependencies:
      - target: StratoScanWatchWidget
    info:
      path: StratoScanWatch/Info.plist
      properties:
        CFBundleDisplayName: StratoScan
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.NelsonIndustries.radome
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NelsonIndustries.radome.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 76VUC2AMZH
        CODE_SIGN_STYLE: Automatic

  StratoScanWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StratoScanWatchWidget
      - path: Shared/APIConfig.swift
      - path: Shared/Aircraft.swift
      - path: Shared/AircraftFeedClient.swift
      - path: Shared/DemoFeed.swift
      - path: Shared/Geo.swift
      - path: Shared/demo-traffic.json
    info:
      path: StratoScanWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: StratoScan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NelsonIndustries.radome.watchkitapp.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 76VUC2AMZH
        CODE_SIGN_STYLE: Automatic
